    if (UNIT_TYPES[c.type].big) box(c.x - 11, c.y + 5, 9, 2, '#d8cfb8');
  }
  ctx.globalAlpha = 1;
}

// Camp decorations, drawn on the ground under the creatures.
function drawCamp(c){
  const x = c.x, y = c.y;
  if (c.tier === 'small'){                                   // kobold camp: patched tent and candles
    ctx.fillStyle = 'rgba(22,16,38,.3)'; ctx.fillRect(x - 20, y + 4, 26, 4);
    poly([[x - 24, y + 6], [x - 12, y - 12], [x, y + 6]], '#8a6a45');
    poly([[x - 12, y - 12], [x, y + 6], [x - 12, y + 6]], '#6b4f33');
    box(x - 15, y - 2, 5, 8, '#2a1d12'); box(x - 20, y - 1, 3, 3, '#a4884f');
    for (const dx of [8, 13, 18]){
      box(x + dx, y + 2, 2, 5, '#efe6cf');
      const f = Math.sin(animT * 11 + dx) > 0 ? '#ffe28a' : '#ffb347';
      box(x + dx, y, 2, 2, f);
    }
  } else if (c.tier === 'wild'){                             // a rough den: rocks and bones
    for (const [dx, dy, r] of [[-14, -6, 5], [12, -8, 4], [-4, 10, 3]]){
      disc(ctx, x + dx + 1, y + dy + 2, r, 'rgba(22,16,38,.3)'); disc(ctx, x + dx, y + dy, r, '#77726a'); disc(ctx, x + dx - 1, y + dy - 1, r * .5, '#9a958d');
    }
    box(x + 4, y + 6, 8, 2, '#e7dfc6'); box(x + 3, y + 5, 2, 4, '#e7dfc6'); box(x + 11, y + 5, 2, 4, '#e7dfc6');
  } else if (c.tier === 'medium'){                           // lair: webs and old bones
    ctx.strokeStyle = 'rgba(236,236,246,.55)'; ctx.lineWidth = 1;
    const wx = x - 18, wy = y - 14;
    ctx.beginPath();
    for (let k = 0; k < 8; k++){ const a = k * Math.PI / 4; ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * 14, wy + Math.sin(a) * 14); }
    for (const r of [5, 10]){ for (let k = 0; k <= 8; k++){ const a = k * Math.PI / 4; const px = wx + Math.cos(a) * r, py = wy + Math.sin(a) * r; if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py); } }
    ctx.stroke();
    box(x + 8, y + 8, 10, 2, '#e7dfc6'); box(x + 7, y + 7, 2, 4, '#e7dfc6'); box(x + 17, y + 7, 2, 4, '#e7dfc6');
    box(x - 6, y + 12, 5, 4, '#e7dfc6'); box(x - 5, y + 13, 1, 1, '#1b120b'); box(x - 3, y + 13, 1, 1, '#1b120b');
  } else {                                                   // golem circle: standing stones
    for (let k = 0; k < 6; k++){
      const a = k * Math.PI / 3 + 0.3, sx = x + Math.cos(a) * 44, sy = y + Math.sin(a) * 30;
      ctx.fillStyle = 'rgba(22,16,38,.3)'; ctx.fillRect(sx - 1, sy + 1, 9, 3);
      box(sx - 3, sy - 14, 7, 16, '#77726a'); box(sx - 3, sy - 14, 2, 16, '#9a958d'); box(sx - 3, sy - 15, 7, 1, '#9a958d');
      box(sx - 1, sy - 9, 2, 3, `rgba(127,240,208,${(0.4 + 0.3 * Math.sin(animT * 2 + k)).toFixed(2)})`);
    }
  }
  if (c.tier !== 'small' && c.tier !== 'wild' && !c.cleared){                      // campfire
    box(x - 6, y + 2, 12, 3, '#5a3a22'); box(x - 4, y, 8, 2, '#6b4a2b');
    const f = 0.8 + 0.2 * Math.sin(animT * 12 + c.id);
    disc(ctx, x, y - 1, 9 * f, 'rgba(255,150,50,.18)');
    poly([[x - 4, y + 1], [x, y - 8 * f], [x + 4, y + 1]], '#ff9a3a'); poly([[x - 2, y + 1], [x, y - 5 * f], [x + 2, y + 1]], '#ffe08a');
  }
  if (c.cleared){                                            // an opened treasure chest
    box(x - 6, y + 8, 12, 7, '#7a5530'); box(x - 6, y + 8, 12, 1, '#9a7040'); box(x - 6, y + 11, 12, 1, '#c9a44c');
    box(x - 6, y + 3, 12, 4, '#8a6238'); box(x - 4, y + 7, 8, 2, '#f2cf4b'); box(x - 2, y + 6, 2, 1, '#fff1a6');
  }
}

// Item icons, drawn once in the Storybook style and reused on the ground and in buttons.
const iconCache = {}, iconURLs = {};
function itemIconCanvas(k){
  if (iconCache[k]) return iconCache[k];
  const I = ITEMS[k], ak = I.art || I.base || k;            // the shape to draw
  iconCache[k] = paintedCanvas(20, 20, () => {
    const c = I.icon;
    if (ak === 'potion'){ pRect(8, 2, 4, 4, 1, '#c9b89a', .8); pEll(10, 12, 6, 6, rad(10, 12, 6, c)); gloss(8, 10, 1.6, 1); }
    else if (ak === 'boots'){ pPoly([[5, 3], [11, 3], [11, 13], [17, 14], [17, 18], [4, 18]], lin(4, 3, 17, 18, c, .3)); pPoly([[11, 5], [18, 2], [15, 8]], '#efe8da', .7); }
    else if (ak === 'ring'){ ctx.beginPath(); ctx.arc(10, 12, 6, 0, Math.PI * 2); ctx.lineWidth = 4.2; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 2.4; ctx.strokeStyle = '#e8c547'; ctx.stroke(); pEll(10, 5, 3, 3, rad(10, 5, 3, c)); }
    else if (ak === 'claws'){ for (const dx of [-4, 0, 4]) pPoly([[10 + dx - 1.4, 17], [10 + dx + dx * .3, 2], [10 + dx + 1.4, 17]], lin(0, 2, 0, 17, c, .3), .8); pRect(4, 14, 12, 4, 1.5, '#5e4331'); }
    else if (ak === 'amulet'){ ctx.beginPath(); ctx.moveTo(4, 2); ctx.quadraticCurveTo(10, 12, 16, 2); ctx.lineWidth = 1.2; ctx.strokeStyle = '#e8c547'; ctx.stroke(); pPoly([[10, 7], [14, 12], [10, 18], [6, 12]], lin(6, 7, 14, 18, c, .35)); }
    else if (ak === 'fang'){ ctx.beginPath(); ctx.moveTo(6, 3); ctx.quadraticCurveTo(15, 3, 13, 18); ctx.quadraticCurveTo(9, 10, 6, 3); ctx.closePath(); pPath(lin(6, 3, 14, 18, c, .2)); pEll(12.6, 16.5, 1.3, 1.3, '#c0392b', 0, .5); }
    else if (ak === 'tome'){ pRect(3, 3, 14, 15, 1.5, lin(3, 3, 17, 18, c, .3)); ctx.fillStyle = '#efe8da'; ctx.fillRect(15, 4, 1.5, 13); pEll(10, 10, 2.6, 2.6, '#e8c547', 0, .6); }
    else { pPoly([[3, 16], [3, 6], [6.5, 10], [10, 3], [13.5, 10], [17, 6], [17, 16]], lin(3, 3, 17, 16, c, .3)); pEll(10, 12.5, 1.6, 1.6, '#c0392b', 0, .6); }
    if (I.tier){ ctx.fillStyle = I.tier === 2 ? '#b06af0' : '#5aa8ff'; ctx.fillRect(11, 0, 9, 7); ctx.fillStyle = '#fff'; ctx.font = 'bold 6px monospace'; ctx.fillText('+' + I.tier, 12, 6); }
  });
  return iconCache[k];
}
function itemIcon(k){
  if (!iconURLs[k]){ const c = itemIconCanvas(k); iconURLs[k] = typeof c.toDataURL === 'function' ? c.toDataURL() : ''; }
  return iconURLs[k];
}
function drawGroundItem(it){
  const bob = Math.sin(animT * 3 + it.id) * 1.5;
  const g = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, 14);
  g.addColorStop(0, 'rgba(255,230,140,.55)'); g.addColorStop(1, 'rgba(255,230,140,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.x, it.y, 14, 0, Math.PI * 2); ctx.fill();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(itemIconCanvas(it.key), it.x - 10, it.y - 16 + bob, 20, 20);
  ctx.imageSmoothingEnabled = false;
}

function drawProjectile(p){
  // Creep missiles: slung stones, venom globs and shaman bolts.
  if (p.style === 'kslinger'){ disc(ctx, p.x, p.y, 1.8, '#8f897d'); box(p.x - .5, p.y - .5, 1, 1, '#7fd04a'); return; }   // poisoned stone
  if (p.style === 'web'){ disc(ctx, p.x, p.y, 4, 'rgba(240,240,240,.35)'); pline(p.x - 3, p.y, p.x + 3, p.y, '#f4f4f4', 1); pline(p.x, p.y - 3, p.x, p.y + 3, '#f4f4f4', 1); return; }
  if (p.style === 'cannon'){ disc(ctx, p.x + 2, p.y + 6, 2.5, 'rgba(0,0,0,.25)'); disc(ctx, p.x, p.y, 3, '#2a2622'); box(p.x - 1.5, p.y - 1.5, 1, 1, '#8a8278'); return; }
  if (p.style === 'scorpion'){
    const c = Math.cos(p.angle), s = Math.sin(p.angle);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#6b4a2b'; ctx.beginPath(); ctx.moveTo(p.x - c * 16, p.y - s * 16); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.fillStyle = '#cfd6dc'; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); return;
  }
  if (p.style === 'boulder'){ disc(ctx, p.x, p.y, 5, '#77726a'); disc(ctx, p.x - 1.5, p.y - 1.5, 2, '#9a958c'); return; }
  if (p.style === 'spitter'){ disc(ctx, p.x, p.y, 3.2, 'rgba(160,230,60,.35)'); disc(ctx, p.x, p.y, 1.8, '#a6e04a'); return; }
  if (p.style === 'flask' || (p.style === 'healer' && p.attacker && isOrc(p.attacker.owner))){   // a spinning glass flask
    const big = p.style === 'flask' ? 1.6 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(animT * 14); ctx.scale(big, big);
    disc(ctx, 0, 1, 3, '#7fd04a'); disc(ctx, -1, 0, 1.2, '#d8ffb0'); box(-1, -4, 2, 3, '#cfe6ee'); box(-1, -5, 2, 1, '#8a5a33');
    ctx.restore(); return;
  }
  if (p.style === 'healer'){                                   // holy light
    disc(ctx, p.x, p.y, 5, 'rgba(255,230,140,.4)'); disc(ctx, p.x, p.y, 2.4, '#fff4c8'); return;
  }
  if (p.style === 'ogremage' || p.style === 'mage'){ disc(ctx, p.x, p.y, 4.5, 'rgba(180,110,255,.35)'); disc(ctx, p.x, p.y, 2.2, '#d9b8ff'); return; }
  const orc = p.attacker && FACTIONS[p.attacker.owner] && FACTIONS[p.attacker.owner].horns;
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  ctx.lineWidth = orc ? 2 : 1.5;
  ctx.strokeStyle = orc ? WOOD : '#e8dcb5';
  const len = orc ? 13 : 9;
  ctx.beginPath(); ctx.moveTo(p.x - c * len, p.y - s * len); ctx.lineTo(p.x, p.y); ctx.stroke();
  ctx.fillStyle = STEEL_LIGHT; ctx.fillRect(p.x - 1, p.y - 1, 2, 2);                     // tip
  if (!orc){ ctx.fillStyle = '#d8452e'; ctx.fillRect(p.x - c * len - 1, p.y - s * len - 1, 2, 2); }   // fletching
}

function drawEffect(fx){
  const a = fx.life / fx.max;
  if (fx.type === 'text'){
    ctx.globalAlpha = Math.min(1, a * 2);
    ctx.font = '600 12px "Pixelify Sans", monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(fx.text, fx.x + 1, fx.y - (1 - a) * 18 + 1);
    ctx.fillStyle = fx.color; ctx.fillText(fx.text, fx.x, fx.y - (1 - a) * 18);
  } else if (fx.type === 'ring'){
    ctx.globalAlpha = a; ctx.strokeStyle = fx.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.r * (1.2 - a * 0.4), 0, Math.PI * 2); ctx.stroke();
  } else if (fx.type === 'bolt'){                              // chain lightning: jagged bright lines
    ctx.globalAlpha = a; ctx.lineWidth = 2.5; ctx.strokeStyle = fx.plain ? '#d9c9a0' : '#bfe4ff';
    ctx.beginPath();
    for (let i = 0; i + 1 < fx.pts.length; i++){
      const [x0, y0] = fx.pts[i], [x1, y1] = fx.pts[i + 1];
      ctx.moveTo(x0, y0);
      for (let k = 1; k <= 5; k++){ const t = k / 5, j = k < 5 && !fx.plain ? (hash(fx.seed + i, k) - .5) * 10 : 0; ctx.lineTo(x0 + (x1 - x0) * t + j, y0 + (y1 - y0) * t + j * .6); }
    }
    ctx.stroke(); ctx.lineWidth = 1; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.globalAlpha = 1;
  } else if (fx.type === 'splat'){
    const k = 1 - a;                                            // 0 -> 1 over the effect's life
    for (let i = 0; i < 5; i++){
      const ang = fx.seed + i * 1.9, sp = 10 + (i * 7 % 6);
      box(fx.x + Math.cos(ang) * sp * k, fx.y + Math.sin(ang) * sp * k * .6 + 14 * k * k, i % 2 ? 2 : 1.5, i % 2 ? 2 : 1.5, fx.color);
    }
  } else if (fx.type === 'mark'){
    ctx.globalAlpha = a; ctx.strokeStyle = fx.color; ctx.lineWidth = 2;
    const r = 4 + (1 - a) * 8;
    ctx.beginPath(); ctx.moveTo(fx.x - r, fx.y - r); ctx.lineTo(fx.x + r, fx.y + r); ctx.moveTo(fx.x + r, fx.y - r); ctx.lineTo(fx.x - r, fx.y + r); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function addText(x, y, text, color){ G.effects.push({ type:'text', x, y, text, color, life:1.2, max:1.2 }); }
function addMark(x, y, color){ G.effects.push({ type:'mark', x, y, color, life:.6, max:.6 }); }

function render(){
  frameNo++;
  animT = performance.now() / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!G) return;

  const z = cam.zoom * DPR;
  ctx.setTransform(z, 0, 0, z, -cam.x * z, -cam.y * z);
  ctx.imageSmoothingEnabled = false;
  const vw = viewW / cam.zoom, vh = viewH / cam.zoom;

  // Terrain: draw the chunks that overlap the screen.
  const CP = CHUNK * TILE;
  const cx0 = Math.max(0, Math.floor(cam.x / CP)), cy0 = Math.max(0, Math.floor(cam.y / CP));
  const cx1 = Math.min(CHUNKS_X - 1, Math.floor((cam.x + vw) / CP)), cy1 = Math.min(MAP_H / CHUNK - 1, Math.floor((cam.y + vh) / CP));
  chunkCap = Math.max(48, (cx1 - cx0 + 3) * (cy1 - cy0 + 3) + 8);
  chunkBudget = 2;
  for (let cy = cy0; cy <= cy1; cy++)
    for (let cx = cx0; cx <= cx1; cx++){
      const img = getChunk(cx, cy);
      if (img) ctx.drawImage(img, cx * CP, cy * CP);
      else ctx.drawImage(minimapBase, cx * CHUNK, cy * CHUNK, CHUNK, CHUNK, cx * CP, cy * CP, CP, CP);
    }
  // Spare budget? Quietly prepare one chunk just outside the screen, so
  // scrolling there later is instant.
  if (chunkBudget > 0){
    outer: for (let cy = cy0 - 1; cy <= cy1 + 1; cy++)
      for (let cx = cx0 - 1; cx <= cx1 + 1; cx++)
        if (cx >= 0 && cy >= 0 && cx < CHUNKS_X && cy < MAP_H / CHUNK && !chunks.has(cy * CHUNKS_X + cx)){ getChunk(cx, cy); break outer; }
  }

  const x0 = Math.max(0, Math.floor(cam.x / TILE)), y0 = Math.max(0, Math.floor(cam.y / TILE));
  const x1 = Math.min(MAP_W - 1, Math.floor((cam.x + vw) / TILE)), y1 = Math.min(MAP_H - 1, Math.floor((cam.y + vh) / TILE));
  if (cam.zoom >= 0.7) drawWaterShimmer(x0, y0, x1, y1);   // glints are too small to see when zoomed far out

  // Ruins of destroyed buildings sit on the ground, under everything:
  // scorched earth, broken stones, charred beams, and smoke for a while.
  for (const fx of G.effects) if (fx.type === 'ruin'){
    const px = fx.tx * TILE, py = fx.ty * TILE, s = fx.size * TILE, age = fx.max - fx.life;
    ctx.globalAlpha = Math.min(1, fx.life / 6);
    const scorch = ctx.createRadialGradient(px + s / 2, py + s / 2 + 4, s * .1, px + s / 2, py + s / 2 + 4, s * .6);
    scorch.addColorStop(0, 'rgba(26,18,12,.8)'); scorch.addColorStop(.6, 'rgba(40,28,18,.45)'); scorch.addColorStop(1, 'rgba(40,28,18,0)');
    ctx.fillStyle = scorch; ctx.fillRect(px - s * .1, py - s * .1, s * 1.2, s * 1.2);     // soft-edged scorch mark
    for (let k = 0; k < 10; k++){
      const rx = px + 6 + hash(fx.tx + k, fx.ty) * (s - 16), ry = py + 8 + hash(fx.ty, fx.tx + k) * (s - 20);
      if (k % 3 === 0){ box(rx - 4, ry, 14, 3, '#2a1a10'); box(rx - 4, ry, 14, 1, '#4a2e1a'); }        // charred beam
      else { box(rx, ry, 7, 5, '#6a6158'); box(rx, ry, 7, 1, '#8f877c'); box(rx + 1, ry + 5, 6, 1, '#3a342e'); }   // stone
    }
    if (age < 15) for (let k = 0; k < 3; k++){                    // lingering smoke
      const ph = (animT * .35 + k / 3) % 1, sx = px + s * (.3 + k * .2);
      disc(ctx, sx + ph * 6, py + s * .4 - ph * 30, 4 + ph * 7, `rgba(70,66,64,${(.45 * (1 - ph) * (1 - age / 15)).toFixed(2)})`);
    }
    ctx.globalAlpha = 1;
  }
  for (const c of G.corpses)
    if (c.x > cam.x - 40 && c.x < cam.x + vw + 40 && c.y > cam.y - 40 && c.y < cam.y + vh + 40 && isVisibleTile(tileOf(c.x), tileOf(c.y)) || (c.owner === PLAYER && c.x > cam.x - 40 && c.x < cam.x + vw + 40 && c.y > cam.y - 40 && c.y < cam.y + vh + 40))
      drawCorpse(c);

  for (const c of G.camps)
    if (G.explored[idx(c.tx, c.ty)] && c.x > cam.x - 80 && c.x < cam.x + vw + 80 && c.y > cam.y - 80 && c.y < cam.y + vh + 80) drawCamp(c);
  if (G.editor && ED) drawEditorOverlay();
  if (G.mission && G.mission.shrines) for (const [i, sh] of G.mission.shrines.entries()){   // ancient shrines
    if (!G.explored[idx(tileOf(sh.x), tileOf(sh.y))]) continue;
    box(sh.x - 5, sh.y - 20, 10, 22, sh.found ? '#6a655d' : '#8f8a80'); box(sh.x - 5, sh.y - 20, 3, 22, '#aca69b'); box(sh.x - 7, sh.y + 1, 14, 3, '#6a655d');
    if (!sh.found){ const ph = (animT * 1.1 + i * .25) % 1; box(sh.x - 1, sh.y - 14, 3, 5, SHRINES[i].color);
      ctx.strokeStyle = SHRINES[i].color; ctx.globalAlpha = 1 - ph; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sh.x, sh.y + 4, 16 + ph * 16, 8 + ph * 8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  if (G.mission){                                                // mission: a pulsing ring on the objective's target
    const st = MISSIONS[G.mission.key].steps[G.mission.step], t = st && st.glow && st.glow();
    if (t){ const c = t.kind ? centerOf(t) : t, ph = (animT * 1.2) % 1;
      ctx.strokeStyle = `rgba(255,220,90,${(1 - ph).toFixed(2)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 8, 30 + ph * 18, 16 + ph * 9, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  for (const b of G.buildings)                                   // a soft healing glow around temples
    if (b.type === 'temple' && b.built >= 1 && (b.owner === PLAYER || isExploredEntity(b))){
      const c = centerOf(b), r = (G.players[b.owner].up.sanctuary ? 9 : TEMPLE_REGEN.radius) * TILE;
      if (c.x + r < cam.x || c.x - r > cam.x + vw || c.y + r < cam.y || c.y - r > cam.y + vh) continue;
      const g = ctx.createRadialGradient(c.x, c.y, r * .2, c.x, c.y, r);
      g.addColorStop(0, 'rgba(140,230,130,.14)'); g.addColorStop(1, 'rgba(140,230,130,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r * .8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.setLineDash([4, 6]); ctx.lineDashOffset = -animT * 10; ctx.strokeStyle = 'rgba(160,240,150,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, r, r * .8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
  for (const it of G.items)
    if (!it.taken && G.explored[idx(tileOf(it.x), tileOf(it.y))] && it.x > cam.x - 30 && it.x < cam.x + vw + 30 && it.y > cam.y - 30 && it.y < cam.y + vh + 30) drawGroundItem(it);

  // LESSON: "Painter's algorithm" — draw things further up the screen first,
  // so things lower down appear in front of them.
  const inView = (ax, ay, bx, by) => bx > cam.x - 40 && ax < cam.x + vw + 40 && by > cam.y - 60 && ay < cam.y + vh + 60;
  const list = [];
  for (const m of G.mines) if (isExploredEntity(m) && inView(m.tx * TILE, m.ty * TILE, (m.tx + 3) * TILE, (m.ty + 3) * TILE)) list.push(m);
  for (const m of G.mercs || []) if (isExploredEntity(m) && inView(m.tx * TILE, m.ty * TILE, (m.tx + 3) * TILE, (m.ty + 3) * TILE)) list.push(m);
  for (const b of G.buildings) if ((b.owner === PLAYER || isExploredEntity(b)) && inView(b.tx * TILE, b.ty * TILE, (b.tx + b.size) * TILE, (b.ty + b.size) * TILE)) list.push(b);
  for (const u of G.units) if (!u.hidden && (u.owner === PLAYER || isVisibleTile(tileOf(u.x), tileOf(u.y))) && inView(u.x, u.y, u.x, u.y)) list.push(u);
  const sortY = e => e.kind === 'unit' ? e.y : (e.ty + e.size) * TILE;
  list.sort((a, b) => sortY(a) - sortY(b));
  for (const e of list){
    if (e.kind === 'unit') drawUnit(e);
    else if (e.kind === 'building') drawBuilding(e);
    else if (e.kind === 'merc') drawMerc(e);
    else drawMine(e);
  }
  drawBuyerArrow();

  for (const p of G.projectiles) drawProjectile(p);
  for (const fx of G.effects) if (fx.type !== 'ruin') drawEffect(fx);

  if (GFX[gfx].clouds) drawCloudShadows(vw, vh);

  // Fog of war: the small fog texture stretched over the whole map, smoothed.
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fogCanvas, 0, 0, MAP_PX_W, MAP_PX_H);
  ctx.imageSmoothingEnabled = false;

  // Building placement preview ("ghost").
  if (G.place){
    const pl = G.place, s = BUILDING_TYPES[pl.type].size * TILE, px = pl.tx * TILE, py = pl.ty * TILE;
    ctx.globalAlpha = .6; blit(buildingSprite(pl.type, PLAYER, 1), px - BLD_PAD_X, py - BLD_PAD_TOP); ctx.globalAlpha = 1;
    ctx.fillStyle = pl.valid ? 'rgba(110,210,90,.3)' : 'rgba(220,70,50,.4)'; ctx.fillRect(px, py, s, s);
    ctx.strokeStyle = pl.valid ? '#7df06a' : '#ff6a4d'; ctx.lineWidth = 2; ctx.strokeRect(px, py, s, s);
  }

  // (The vignette is a CSS layer now; see #vignette.)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Box selection rectangle, drawn in screen space.
  if (gesture && gesture.box && gesture.moved){
    ctx.strokeStyle = '#7df06a'; ctx.lineWidth = 1.5; ctx.fillStyle = 'rgba(125,240,106,.12)';
    const bx = Math.min(gesture.sx, gesture.lx), by = Math.min(gesture.sy, gesture.ly);
    const bw = Math.abs(gesture.lx - gesture.sx), bh = Math.abs(gesture.ly - gesture.sy);
    ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh);
  }
}

function renderMinimap(){
  const S = mini.width / MAP_W;
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(minimapBase, 0, 0, mini.width, mini.height);
  mctx.imageSmoothingEnabled = true;
  mctx.drawImage(fogCanvas, 0, 0, mini.width, mini.height);
  for (const m of G.mines) if (isExploredEntity(m)){ mctx.fillStyle = '#f2cf4b'; mctx.fillRect(m.tx * S, m.ty * S, 3 * S, 3 * S); }
  for (const m of G.mercs || []) if (isExploredEntity(m)){ mctx.fillStyle = '#d06a3a'; mctx.fillRect(m.tx * S, m.ty * S, 3 * S, 3 * S); }
  // Explored creep camps: green = small, yellow = medium, red = big.
  for (const c of G.camps) if (!c.cleared && G.explored[idx(c.tx, c.ty)]){
    mctx.fillStyle = '#140d07'; mctx.fillRect(c.tx * S - 2 * S, c.ty * S - 2 * S, 4 * S, 4 * S);
    mctx.fillStyle = CAMP_TYPES[c.tier].color; mctx.fillRect(c.tx * S - 1.5 * S, c.ty * S - 1.5 * S, 3 * S, 3 * S);
  }
  for (const b of G.buildings) if (b.owner === PLAYER || isExploredEntity(b)){
    mctx.fillStyle = FACTIONS[b.owner].light; mctx.fillRect(b.tx * S, b.ty * S, b.size * S, b.size * S);
  }
  for (const u of G.units){
    if (u.hidden || (u.owner !== PLAYER && !isVisibleTile(tileOf(u.x), tileOf(u.y)))) continue;
    mctx.fillStyle = u.owner === CREEPS ? '#d6c4ff' : shade(FACTIONS[u.owner].light, .35);
    mctx.fillRect(u.x / TILE * S - S, u.y / TILE * S - S, S * 2, S * 2);
  }
  if (G.ping && G.time - G.ping.t < 5){                        // "under attack" ping
    const ph = ((G.time - G.ping.t) * 1.5) % 1;
    mctx.strokeStyle = `rgba(255,80,60,${(1 - ph).toFixed(2)})`; mctx.lineWidth = 2;
    mctx.beginPath(); mctx.arc(G.ping.x / TILE * S, G.ping.y / TILE * S, 3 + ph * 14, 0, Math.PI * 2); mctx.stroke();
  }
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 1;
  mctx.strokeRect(cam.x / TILE * S, cam.y / TILE * S, viewW / cam.zoom / TILE * S, viewH / cam.zoom / TILE * S);
}


/* =============================================================================
   13. INPUT
   LESSON: "Pointer events" handle mouse, touch and pen with ONE set of
   listeners. We track every finger on screen in a Map so we can tell a
   tap, a drag (scroll) and a two-finger pinch (zoom) apart.
   ========================================================================== */

const pointers = new Map();
let gesture = null, pinch = null, boxMode = false, lastTap = { t:0, id:0 };

function screenPos(e){ const r = canvas.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
function toWorld(sx, sy){ return { x:cam.x + sx / cam.zoom, y:cam.y + sy / cam.zoom }; }

// The camera may go past the map edge by up to 2/3 of the screen, so things at
// the edge can be brought into the open middle of the screen (away from the
// minimap, the objectives and the panel) to be built on or tapped.
function clampCam(){
  const vw = viewW / cam.zoom, vh = viewH / cam.zoom, padX = vw * 2 / 3, padY = vh * 2 / 3;
  cam.x = clamp(cam.x, -padX, MAP_PX_W - vw + padX);
  cam.y = clamp(cam.y, -padY, MAP_PX_H - vh + padY);
}
function centerOn(x, y){ cam.x = x - viewW / cam.zoom / 2; cam.y = y - viewH / cam.zoom / 2; clampCam(); }
// Zoom while keeping the world point under the finger in the same place.
function zoomAt(sx, sy, z){
  const w = toWorld(sx, sy);
  cam.zoom = clamp(z, 0.4, 2.4);
  cam.x = w.x - sx / cam.zoom; cam.y = w.y - sy / cam.zoom;
  clampCam();
}

canvas.addEventListener('pointerdown', e => {
  audioInit();                               // sound can only start after a touch
  if (!running || paused) return;
  canvas.setPointerCapture(e.pointerId);
  const p = screenPos(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 2){                     // second finger: start pinching
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom:cam.zoom };
    gesture = null; return;
  }
  if (pointers.size > 2) return;
  gesture = { sx:p.x, sy:p.y, lx:p.x, ly:p.y, moved:false, box:boxMode && !G.place, ghost:null };
  if (G.editor && ED){
    if (ED.tool !== 'pan'){ const w = toWorld(p.x, p.y);
      if (ED_PAINT[ED.tool] !== undefined || ED.tool === 'high' || ED.tool === 'low' || ED.tool === 'ramp'){ edPaintAt(w.x, w.y); gesture.paint = true; }
      else { edObjectAt(w.x, w.y); gesture.used = true; } }
    return;
  }
  // During placement: grabbing the outline drags it; anywhere else scrolls the map.
  if (G.place){
    const w = toWorld(p.x, p.y), s = BUILDING_TYPES[G.place.type].size;
    const tx = tileOf(w.x), ty = tileOf(w.y);
    if (tx >= G.place.tx - 1 && tx <= G.place.tx + s && ty >= G.place.ty - 1 && ty <= G.place.ty + s)
      gesture.ghost = { tx:G.place.tx, ty:G.place.ty };
  }
});

canvas.addEventListener('pointermove', e => {
  if (!G) return;
  if (!pointers.has(e.pointerId)) return;
  const p = screenPos(e);
  pointers.set(e.pointerId, p);
  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
    return;
  }
  if (!gesture) return;
  if (!gesture.moved && Math.hypot(p.x - gesture.sx, p.y - gesture.sy) > 8) gesture.moved = true;
  if (G.editor && gesture.paint){ const w = toWorld(p.x, p.y); edPaintAt(w.x, w.y); gesture.lx = p.x; gesture.ly = p.y; return; }
  if (G.editor && gesture.used) return;
  if (G.place && gesture.ghost){
    // Move the outline by how many whole tiles the finger has travelled.
    if (gesture.moved) setGhost(gesture.ghost.tx + Math.round((p.x - gesture.sx) / cam.zoom / TILE),
                                gesture.ghost.ty + Math.round((p.y - gesture.sy) / cam.zoom / TILE));
  }
  else if (gesture.moved && !gesture.box){                  // drag = scroll the map
    cam.x -= (p.x - gesture.lx) / cam.zoom;
    cam.y -= (p.y - gesture.ly) / cam.zoom;
    clampCam();
  }
  gesture.lx = p.x; gesture.ly = p.y;
});

function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pinch){ if (pointers.size < 2) pinch = null; gesture = null; return; }
  if (!gesture) return;
  const g = gesture; gesture = null;
  if (e.type === 'pointercancel' || G.editor) return;     // the editor has no taps to interpret
  const p = screenPos(e);
  if (G.place){ if (!g.moved) moveGhost(p); return; }   // a tap moves the outline there; Confirm places it
  if (g.box && g.moved){ finishBox(g); return; }
  if (!g.moved){ const w = toWorld(p.x, p.y); handleTap(w.x, w.y); }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = screenPos(e);
  zoomAt(p.x, p.y, cam.zoom * (e.deltaY < 0 ? 1.1 : 0.9));
}, { passive:false });

// Minimap: tap or drag to move the camera.
let miniDrag = false;
function miniJump(e){
  const r = mini.getBoundingClientRect();
  centerOn((e.clientX - r.left) / r.width * MAP_PX_W, (e.clientY - r.top) / r.height * MAP_PX_H);
}
mini.addEventListener('pointerdown', e => { if (!G) return; mini.setPointerCapture(e.pointerId); miniDrag = true; miniJump(e); });
mini.addEventListener('pointermove', e => { if (miniDrag) miniJump(e); });
mini.addEventListener('pointerup', () => { miniDrag = false; });
mini.addEventListener('pointercancel', () => { miniDrag = false; });

// What's under this world point? Units first, then buildings/mines, then trees.
function pickAt(wx, wy){
  let best = null, bd = 18;
  for (const u of G.units){
    if (u.hidden) continue;
    if (u.owner !== PLAYER && !isVisibleTile(tileOf(u.x), tileOf(u.y))) continue;
    const d = Math.hypot(u.x - wx, u.y - 4 - wy);
    if (d < bd){ bd = d; best = u; }
  }
  if (best) return best;
  for (const it of G.items)
    if (!it.taken && G.explored[idx(tileOf(it.x), tileOf(it.y))] && Math.hypot(it.x - wx, it.y - 8 - wy) < 14) return { kind:'item', item:it };
  const tx = tileOf(wx), ty = tileOf(wy);
  if (!inBounds(tx, ty) || !G.explored[idx(tx, ty)]) return null;
  const id = G.blocked[idx(tx, ty)];
  if (id) return G.buildings.find(b => b.id === id) || G.mines.find(m => m.id === id) || (G.mercs || []).find(m => m.id === id) || null;
  if (G.terrain[idx(tx, ty)] === T_TREE && !isBorderTile(tx, ty)) return { tree:true, x:tx, y:ty };
  // Pines are tall: their branches hang over the lower part of the tile above, so a tap there means that tree.
  if (inBounds(tx, ty + 1) && G.terrain[idx(tx, ty + 1)] === T_TREE && !isBorderTile(tx, ty + 1) && wy / TILE - ty > .3) return { tree:true, x:tx, y:ty + 1 };
  return null;
}

// The heart of RTS controls: what a tap means depends on what's selected
// and what you tapped on ("context-sensitive commands").
function handleTap(wx, wy){
  const hit = pickAt(wx, wy);

  // Tapping your own unit selects it. Double-tap selects all of that type on screen.
  if (hit && hit.kind === 'unit' && hit.owner === PLAYER){
    const now = performance.now();
    if (lastTap.id === hit.id && now - lastTap.t < 350){
      const vw = viewW / cam.zoom, vh = viewH / cam.zoom;
      selectList(G.units.filter(u => u.owner === PLAYER && u.type === hit.type && !u.hidden &&
        u.x > cam.x && u.x < cam.x + vw && u.y > cam.y && u.y < cam.y + vh));
    } else selectList([hit]);
    sfx('select');
    lastTap = { t:now, id:hit.id };
    return;
  }

  const mine = selection.filter(e => e.kind === 'unit' && e.owner === PLAYER);
  if (hit && hit.kind === 'item'){                          // an item on the ground
    const I = ITEMS[hit.item.key];
    if (mine.length){ orderMove(mine, hit.item.x, hit.item.y); addMark(hit.item.x, hit.item.y, '#f2cf4b'); }
    toast(I.name + ': ' + I.desc + (mine.some(u => UNIT_TYPES[u.type].hero) ? '' : '. Only heroes can pick it up.'));
    return;
  }
  if (mine.length){
    const workers = mine.filter(u => u.type === 'worker'), others = mine.filter(u => u.type !== 'worker');
    if (hit && hostile(PLAYER, hit.owner) && hit.kind !== 'mine'){   // attack (any enemy AI, or creatures)
      // After the target falls, keep fighting whatever is nearby (an attack-move there).
      const hc = centerOf(hit), htx = tileOf(hc.x), hty = tileOf(hc.y);
      mine.forEach(u => { orderAttack(u, hit); u.order.resume = { type:'attackMove', nav:{ rect:rectOfTile(htx, hty), adj:!isWalkable(htx, hty) } }; });
      sfx('ack');
      const c = centerOf(hit);
      G.effects.push({ type:'ring', x:c.x, y:c.y, color:'#ff6a4d', life:.4, max:.4, r:16 });
      return;
    }
    if (hit && (hit.kind === 'mine' || hit.tree)){          // gather
      if (workers.length){
        let target = hit;
        if (hit.tree && !hasOpenNeighbor(hit.x, hit.y)){ const t = nearestTree(hit.x, hit.y, 6); if (t) target = t; }
        workers.forEach(w => orderGather(w, target));
        addMark(wx, wy, '#f2cf4b');
      }
      if (others.length) orderMove(others, wx, wy);
      return;
    }
    if (hit && hit.kind === 'building' && hit.owner === PLAYER){
      if (hit.built < 1 && workers.length){ workers.forEach(w => orderBuild(w, hit)); return; }   // help build
      if (hit.hp < hit.maxHp && workers.length){                                                // repair
        workers.forEach(w => orderRepair(w, hit));
        if (others.length) orderMove(others, wx, wy);
        return;
      }
      selectList([hit]); return;
    }
    if (hit && hit.kind === 'building'){ selectList([hit]); return; }
    // A plain tap moves; with the Attack button armed, soldiers attack-move instead.
    const soldiers = mine.filter(u => u.type !== 'worker'), walkers = mine.filter(u => u.type === 'worker');
    if (walkers.length) orderMove(walkers, wx, wy);
    if (soldiers.length){
      orderMove(soldiers, wx, wy, attackMode);
      if (!attackMode) for (const u of soldiers) if (u.order) u.order.calm = true;   // calm for a moment after arriving
    }
    sfx('ack', .7);
    addMark(wx, wy, attackMode ? '#ff6a4d' : '#7df06a');
    if (attackMode){ attackMode = false; $('#amBtn').classList.remove('armed'); }
    return;
  }

  // A training building is selected and you tap empty ground: set a rally point.
  const sb = selection.length === 1 && selection[0].kind === 'building' && selection[0].owner === PLAYER ? selection[0] : null;
  if (sb && !hit && sb.built >= 1 && BUILDING_TYPES[sb.type].trains.length){
    sb.rally = { x:wx, y:wy }; addMark(wx, wy, '#d2ad55'); toast('Rally point set');
    return;
  }
  if (hit && !hit.tree){ selectList([hit]); return; }
  selectList([]);
}

function finishBox(g){
  const a = toWorld(Math.min(g.sx, g.lx), Math.min(g.sy, g.ly));
  const b = toWorld(Math.max(g.sx, g.lx), Math.max(g.sy, g.ly));
  const picked = G.units.filter(u => u.owner === PLAYER && !u.hidden && u.x >= a.x && u.x <= b.x && u.y >= a.y && u.y <= b.y);
  if (picked.length) selectList(picked);
}

// ----- Building placement -----
function startPlacement(type){
  if (!techAllows('building', type)) return;
  const BT = BUILDING_TYPES[type];
  if (BT.requires && !meetsReq(PLAYER, BT.requires)){ toast('Requires a ' + reqName(PLAYER, BT.requires)); return; }
  if (!canAfford(PLAYER, BT.cost)){ toast(G.players[PLAYER].gold < BT.cost.gold ? 'Not enough gold' : 'Not enough lumber'); return; }
  G.place = { type, tx:0, ty:0, valid:false };
  moveGhost({ x:viewW / 2, y:viewH / 2 });
  refreshUI();
}
// Centre the outline on a screen point.
function moveGhost(p){
  const w = toWorld(p.x, p.y), s = BUILDING_TYPES[G.place.type].size;
  setGhost(tileOf(w.x) - (s >> 1), tileOf(w.y) - (s >> 1));
}
function setGhost(tx, ty){
  G.place.tx = tx; G.place.ty = ty;
  G.place.valid = canPlace(G.place.type, tx, ty, PLAYER, 0);
  $('#placeOk').classList.toggle('off', !G.place.valid);
}
function tryPlaceBuilding(){
  const pl = G.place, BT = BUILDING_TYPES[pl.type];
  if (!pl.valid){ toast("Can't build there. Move the outline until it turns green."); return; }
  const workers = selection.filter(u => u.kind === 'unit' && u.type === 'worker' && u.owner === PLAYER);
  if (!workers.length || !canAfford(PLAYER, BT.cost)){ G.place = null; return; }
  pay(PLAYER, BT.cost);
  const b = placeBuilding(pl.type, PLAYER, pl.tx, pl.ty, false);
  workers.sort((a, c) => distTo(a, b) - distTo(c, b));
  orderBuild(workers[0], b);                 // the closest worker goes to build
  G.place = null;
  refreshUI();
}


/* =============================================================================
   14. INTERFACE PANEL (HTML)
   LESSON: The panel is rebuilt from the game state 5 times a second. We
   never "remember" what's on screen; we just redraw it from the truth.
   That makes UI bugs much rarer.
   ========================================================================== */

const infoEl = $('#info'), cmdsEl = $('#cmds'), toastEl = $('#toast');
let uiButtons = [];
let buildMenu = false;   // true while the worker's "Build…" sub-menu is open
let skillMenu = false;   // true while the hero's "Skills" sub-menu is open
let itemMenu = -1;       // which inventory slot's Use/Drop/Sell menu is open (-1 = none)
let invMenu = false;     // the hero's inventory (six slots) is open
let shopMenu = false;    // the Market's item list is open
let heroTrainMenu = false; // the Barracks' hero training is open

function selectList(list){ selection = list; buildMenu = false; skillMenu = false; itemMenu = -1; invMenu = false; shopMenu = false; heroTrainMenu = false; refreshUI(); }

let toastTimer = 0;
function toast(msg, ms = 1800){
  toastEl.textContent = msg; toastEl.classList.add('show'); toastEl.classList.remove('alert');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
// What a command button does, for long-press help.
const CMD_DESC = {
  'cmd:stop':'Stop what they are doing.', 'cmd:retreat':'Run back to base without stopping to fight.',
  'cmd:build':'Open the list of buildings.', 'cmd:repair':'Repair a damaged building (costs a little gold and lumber).',
  'cmd:deselect':'Clear the selection.', 'cmd:back':'Go back.', 'cmd:cancel':'Cancel the last item in the queue (refunded).',
  'cmd:upgrade':'Upgrade this building.', 'cmd:fortify':'Tower: +250 health, +1 armor, +4 damage, +2 range and sight.',
  'cmd:autocast':'Cast abilities automatically when useful.', 'cmd:skills':'Spend skill points on hero abilities.',
  'cmd:sell':'Sell 100 lumber for 70 gold.', 'cmd:drop':'Drop the item on the ground.', 'cmd:sellitem':'Sell the item for half its value.', 'cmd:buy':'Buy 100 lumber for 120 gold.', 'cmd:empty':'An empty item slot.',
};

function barHTML(frac){
  const c = frac > .6 ? '#6fcf5a' : frac > .3 ? '#e2b53a' : '#d8452e';
  return `<div class="bar"><i style="width:${Math.max(0, frac * 100)}%;background:${c}"></i></div>`;
}

function statusText(u){
  const o = u.order;
  if (!o) return 'Idle';
  if (o.type === 'move') return 'Moving';
  if (o.type === 'attackMove') return 'Marching to battle';
  if (o.type === 'attack') return 'Fighting';
  if (o.type === 'build') return 'Building';
  if (o.type === 'repair') return 'Repairing';
  if (o.type === 'gather') return o.phase === 'return' ? 'Bringing ' + o.res + ' home' : 'Gathering ' + (o.res === 'wood' ? 'lumber' : 'gold');
  return '';
}

function describe(e){
  if (e.kind === 'merc'){ const h = mercHero(e);
    return `<h2>Mercenary camp</h2><div class="hint">${h ? nameOf(h) + ' can hire here.' : 'Bring a hero within ' + MERC_REACH + ' tiles to hire.'} Stock refills over time.</div>`; }
  if (e.kind === 'mine') return `<img class="por" src="${portraitURL('mine', 'mine', NEUTRAL)}" alt=""><h2>Gold mine</h2><div>${e.endless ? 'Plenty of' : Math.floor(e.gold)} gold left</div>`;
  if (e.kind === 'unit' && UNIT_TYPES[e.type].hero && e.owner === PLAYER && itemMenu >= 0 && e.items[itemMenu]){
    const I = ITEMS[e.items[itemMenu]];
    return `<img class="por" src="${itemIcon(e.items[itemMenu])}" alt=""><h2>${I.name}</h2><div>${I.desc}</div><div class="hint">Sells for ${sellValue(e.items[itemMenu])} gold at a Market.</div>`;
  }
  // The hero's Skills menu replaces the usual stats with a short summary of each skill's next rank.
  if (e.kind === 'unit' && UNIT_TYPES[e.type].hero && e.owner === PLAYER && skillMenu){
    let t = `<h2>Skill points: ${e.skillPoints}</h2>`;
    for (const k of skillsOf(e)){
      const S = skillDef(PLAYER, k), r = e.skills[k], show = Math.min(S.max, r + 1) - 1;
      t += `<div style="font-size:11px;line-height:1.25">${skillName(PLAYER, k)}${r ? ' ' + r : ''}: <span class="hint">${S.short(S.val[show])}</span></div>`;
    }
    return t;
  }
  const por = e.kind === 'unit' ? portraitURL('unit', e.type, e.owner) : portraitURL('building', e.type, e.owner, e.level);
  let s = `<img class="por" src="${por}" alt=""><h2>${nameOf(e)}</h2>${barHTML(e.hp / e.maxHp)}<div>${Math.ceil(e.hp)} / ${e.maxHp} health</div>`;
  if (e.kind === 'unit'){
    const T = UNIT_TYPES[e.type];
    const dmg = effDamage(e) * (G.time < e.buffUntil ? e.buffMult : 1) * (G.time < e.innerUntil ? 1.2 : 1) * (G.time < e.curseUntil ? .7 : 1);
    s += statRow([['res:weapons', Math.round(dmg), 'damage'], ['res:armor', effArmor(e), 'armor'],
                  ['res:longbows', (T.ranged ? effRange(e) : 'melee') + ` <b class="rng" data-range>${showRange ? 'hide' : 'show'}</b>`, 'range'], ['cmd:clock', (T.cooldown * (G.time < e.slowUntil ? 1.5 : 1)).toFixed(1) + 's', 'attack every'],
                  ['cmd:speed', speedOf(e).toFixed(1), 'speed']]);
    const fx = [[e.buffUntil, 'War cry', '#ffa53a'], [e.innerUntil, 'Inner fire', '#ffb347'], [e.slowUntil, 'Slowed', '#8fc7ff'], [e.curseUntil, 'Cursed', '#c89aff'], [e.ultUntil, skillName(e.owner, 'ult'), '#ffe08a'],
                [e.poisonUntil, 'Poisoned', '#8fe34a'], [e.webUntil, 'Webbed', '#f0f0f0'], [e.stunUntil, 'Stunned', '#ffe45a'], [e.corrodeUntil, 'Corroded', '#b8c94a'], [e.lustUntil, 'Bloodlust', '#ff6a4a'], [e.sheepUntil, 'Polymorphed', '#ffffff']]
      .filter(([t]) => G.time < (t || 0)).map(([, n, c]) => `<span style="color:${c}">${n}</span>`);
    if (fx.length) s += `<div>${fx.join(', ')}</div>`;
    if (!T.hero && unitDesc(e.type, e.owner)) s += `<div class="hint" style="font-size:11px">${unitDesc(e.type, e.owner)}</div>`;
    if (T.hero){
      s += `<div>Level ${e.level} (${e.xp}/${xpNeeded(e.level)} xp)${e.items.length ? ', ' + e.items.length + ' item' + (e.items.length > 1 ? 's' : '') : ''}</div>`;
      if (e.owner === PLAYER && e.skillPoints) s += `<div style="color:#9fe3ff">${e.skillPoints} skill point${e.skillPoints > 1 ? 's' : ''} to spend</div>`;
    }
    if (e.carry) s += `<div>Carrying ${e.carry.amount} ${e.carry.res === 'wood' ? 'lumber' : 'gold'}</div>`;
    if (e.owner === PLAYER) s += `<div class="hint">${statusText(e)}</div>`;
  } else if (e.built < 1){
    s += `<div>Under construction: ${Math.floor(e.built * 100)}%</div>`;
  } else if (BUILDING_TYPES[e.type].attack){
    // Towers show their weapon stats: damage, range, how often they shoot, armor.
    const A = BUILDING_TYPES[e.type].attack, UP = BUILDING_TYPES[e.type].upgrade;
    const dmg = towerDamage(e);
    s += statRow([['res:weapons', dmg, 'damage'], ['res:longbows', towerRange(e), 'range'], ['cmd:clock', A.cooldown + 's', 'shoots every'], ['res:armor', e.armor, 'armor']]);
    s += `<div class="hint" style="font-size:11px">${BUILDING_DESC.tower(FACTIONS[e.owner].names)}</div>`;
  } else if (e.queue.length){
    const q = e.queue[0];
    const label = q.research ? 'Researching ' + RESEARCH[q.research].name + ' (' + RESEARCH[q.research].desc + ')'
                : q.upgrade ? 'Upgrading' : 'Training ' + FACTIONS[e.owner].names[q.type];
    s += `<div>${label}</div>${barHTML(q.t / queueTime(e, q))}`;
    if (e.queue.length > 1) s += `<div>${e.queue.length - 1} more in line</div>`;
  } else if (e.owner === PLAYER && BUILDING_TYPES[e.type].trains.length){
    s += statRow([['res:armor', e.armor, 'armor']]) + `<div class="hint" style="font-size:11px">${BUILDING_DESC[e.type](FACTIONS[e.owner].names)} Tap the ground to set a rally point.</div>`;
  } else if (BUILDING_TYPES[e.type].shop && e.owner === PLAYER){
    s += `<div class="hint">${playerHero(PLAYER) ? 'Items go straight to your hero.' : 'Train a hero to buy items.'}</div>`;
  } else if (BUILDING_TYPES[e.type].dropoff === 'wood'){
    s += `<div class="hint">Workers can drop lumber here.</div>`;
  }
  const UP = BUILDING_TYPES[e.type] && BUILDING_TYPES[e.type].upgrade;
  if (e.kind === 'building' && UP && e.built >= 1 && UP.income)
    s += e.level > 1 ? `<div>Makes ${UP.income} gold every ${UP.every}s</div>`
                     : `<div class="hint">Upgrade it to make gold over time.</div>`;
  if (e.kind === 'building' && e.type === 'townhall' && e.built >= 1 && nextUpgrade(e) && e.owner === PLAYER && !e.queue.length)
    s += `<div class="hint">Upgrade (${costText(nextUpgrade(e).cost)}) to unlock the ${e.level === 1 ? FACTIONS[PLAYER].names.stable : FACTIONS[PLAYER].names.temple} and more research.</div>`;
  if (e.type === 'lair' && e.camp){
    const m = campMembers(e.camp), full = m.length >= e.camp.size0 + LAIR_GROW.extra, left = Math.max(0, Math.ceil((full ? LAIR_GROW.promoteEvery : LAIR_GROW.spawnEvery) - (e.camp.growT || 0)));
    s += `<div>${m.length} creatures (grows to ${e.camp.size0 + LAIR_GROW.extra})</div><div class="hint" style="font-size:11px">${full ? 'Full: promotes a creature in ' + left + 's' : 'Breeds a new creature in ' + left + 's'}. ${BUILDING_DESC.lair()}</div>`;
  }
  if (isAI(e.owner)) s += `<div class="hint">${sideName(e.owner)}${allied(PLAYER, e.owner) ? ' · your ally' : ''}</div>`;
  if (e.kind === 'unit' && e.owner === CREEPS) s += `<div class="hint">Wild creature. Bounty ${UNIT_TYPES[e.type].bounty} gold${e.camp ? ', ' + e.camp.tier + ' camp' : ''}.</div>`;
  return s;
}

// A group shows a roster of small portraits with health bars (tap one to select it alone).
// A row of small icons with numbers: damage, armor, range, attack speed, move speed.
// The attack range ring, shown when the player taps "show" next to the range.
let showRange = false;
function rangeRing(x, y, tiles){
  ctx.save(); ctx.setLineDash([5, 5]); ctx.lineDashOffset = -animT * 10;
  ctx.strokeStyle = 'rgba(143,211,255,.75)'; ctx.lineWidth = 1.5; ctx.fillStyle = 'rgba(143,211,255,.06)';
  ctx.beginPath(); ctx.arc(x, y, (tiles + .5) * TILE, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
}
function statRow(items){
  return `<div class="stats">${items.map(([ic, v, t]) => `<span title="${t}"><img src="${iconURL(ic)}" alt="${t}">${v}</span>`).join('')}</div>`;
}

function describeGroup(sel){
  const shown = sel.slice(0, 12);
  return `<h2 style="margin-bottom:4px">${sel.length} units</h2><div class="roster">` + shown.map(u => {
    const f = u.hp / u.maxHp, col = f > .6 ? '#5fbf4a' : f > .3 ? '#e2b53a' : '#d8452e';
    return `<div class="ru" data-uid="${u.id}"><img src="${portraitURL('unit', u.type, u.owner)}" alt="${nameOf(u)}"><i style="width:${Math.round(f * 100)}%;background:${col}"></i></div>`;
  }).join('') + '</div>' + (sel.length > 12 ? `<div class="hint">+${sel.length - 12} more</div>` : '');
}

function commandsFor(sel){
  const e = sel[0], out = [];
  const deselect = { label:'Deselect', ic:'cmd:deselect', act:() => selectList([]) };
  if (e && e.kind === 'merc'){                              // hire mercenaries
    const h = mercHero(e), P = G.players[PLAYER];
    for (const o of MERC_OFFERS) out.push({ label:FACTIONS[CREEPS].names[o.type], ic:'unit:' + o.type,
      sub:o.gold + 'g' + (o.wood ? ' ' + o.wood + 'w' : '') + ' · ' + (e.stock[o.type] || 0) + ' left', desc:UNIT_DESC[o.type],
      off:!h || !(e.stock[o.type] > 0) || P.gold < o.gold || P.wood < o.wood, act:() => hireMerc(e, o) });
    out.push(deselect); return out;
  }
  if (e.owner !== PLAYER) return [deselect];
  if (e.kind === 'unit'){
    const hasWorker = sel.some(u => u.type === 'worker');
    // The build list is long, so it lives in its own sub-menu (3x3 grid).
    if (hasWorker && buildMenu){
      for (const t of BUILD_MENU){
        if (!techAllows('building', t)) continue;               // not unlocked yet in this mission
        const BT = BUILDING_TYPES[t];
        const locked = BT.requires && !meetsReq(PLAYER, BT.requires);
        out.push({ label:FACTIONS[PLAYER].names[t], ic:'bld:' + t, desc:BUILDING_DESC[t](FACTIONS[PLAYER].names), sub:locked ? 'Needs ' + FACTIONS[PLAYER].names[BT.requires] : costText(BT.cost),
                   off:locked || !canAfford(PLAYER, BT.cost), act:() => startPlacement(t) });
      }
      out.push({ label:'Back', ic:'cmd:back', act:() => { buildMenu = false; } });
      return out;
    }
    if (hasWorker) out.push({ label:'Build…', ic:'cmd:build', sub:'Buildings', act:() => { buildMenu = true; } });
    if (hasWorker) out.push({ label:'Repair', ic:'cmd:repair', sub:'Nearest damaged', act:() => {
      let sent = 0;
      for (const w of sel) if (w.type === 'worker'){ const b = nearestDamaged(w); if (b){ orderRepair(w, b); sent++; } }
      if (!sent) toast('No damaged buildings');
    } });

    // If a hero is anywhere in the selection, its abilities are available,
    // so you can use them while your whole army is selected.
    const hero = sel.find(u => UNIT_TYPES[u.type].hero);
    if (hero && invMenu && itemMenu < 0 && sel.length === 1){        // the inventory: six slots
      for (let i = 0; i < slotsOf(hero); i++){
        const k = hero.items[i];
        if (!k){ out.push({ label:'Empty', ic:'cmd:empty', sub:'slot ' + (i + 1), off:true, act:() => toast('Clear creep camps or visit a Market for items') }); continue; }
        const I = ITEMS[k];
        out.push({ label:I.name, sub:I.short, desc:I.desc, icon:itemIcon(k), act:() => { itemMenu = i; } });   // opens Use / Drop / Sell
      }
      out.push({ label:'Back', ic:'cmd:back', act:() => { invMenu = false; } });
      return out;
    }
    if (hero && itemMenu >= 0 && sel.length === 1 && hero.items[itemMenu]){
      // Item menu: use it, drop it on the ground, or sell it at a Market.
      const i = itemMenu, k = hero.items[i], I = ITEMS[k], market = hasBuilding(PLAYER, 'market');
      if (I.use) out.push({ label:'Use', icon:itemIcon(k), sub:I.short, desc:I.desc, act:() => { useItem(hero, i); itemMenu = -1; } });
      out.push({ label:'Drop', ic:'cmd:drop', sub:'on the ground', desc:'Drop it where the hero stands. Any hero can pick it up later.', act:() => { dropHeroItem(hero, i); itemMenu = -1; } });
      out.push({ label:'Sell', ic:'cmd:sellitem', sub:market ? '+' + sellValue(k) + 'g' : 'Needs Market', off:!market,
                 desc:'Sell it for half its value. You need a Market.', act:() => { if (sellHeroItem(hero, i)) itemMenu = -1; } });
      out.push({ label:'Back', ic:'cmd:back', act:() => { itemMenu = -1; } });
      return out;
    }
    if (hero && skillMenu && sel.length === 1){
      // Skills sub-menu: one button per skill, showing the next rank or why it's locked.
      for (const k of skillsOf(hero)){
        const S = skillDef(PLAYER, k), rank = hero.skills[k], next = rank + 1;
        const locked = next <= S.max && hero.level < skillReq(k, next);
        const sub = rank >= S.max ? 'Max rank' : locked ? 'Hero lv ' + skillReq(k, next) : (rank ? 'To rank ' + next : 'Learn');
        out.push({ label:skillName(PLAYER, k), ic:'abl:' + k, desc:S.desc(S.val[Math.min(S.max, rank + 1) - 1]), sub, off:rank >= S.max || locked || hero.skillPoints <= 0,
                   act:() => { if (learnSkill(hero, k) && hero.skillPoints <= 0) skillMenu = false; } });
      }
      out.push({ label:'Back', ic:'cmd:back', act:() => { skillMenu = false; } });
      return out;
    }
    if (hero){
      for (const key of activeOf(hero)){
        if (!hero.skills[key]) continue;                       // only learned skills get a button
        const wait = Math.ceil(hero.ready[key] - G.time);
        const cast = CAST[key];
        out.push({ label:skillName(PLAYER, key), ic:'abl:' + key, desc:skillDef(PLAYER, key).desc(skillDef(PLAYER, key).val[hero.skills[key] - 1]), sub:wait > 0 ? wait + 's' : 'Rank ' + hero.skills[key], off:wait > 0,
                   act:() => { if (!cast(hero)) toast(wait > 0 ? skillName(PLAYER, key) + ' is recharging' : hero.type === 'healer' && key !== 'concoction' ? 'Nobody nearby needs healing' : 'No enemies close enough'); } });
      }
      if (sel.length === 1)
        out.push({ label:'Skills', ic:'cmd:skills', sub:hero.skillPoints ? '+' + hero.skillPoints + ' to spend' : 'View', off:false, act:() => { skillMenu = true; } });
      out.push({ label:'Auto-cast', ic:'cmd:autocast', sub:hero.auto ? 'On' : 'Off', act:() => { hero.auto = !hero.auto; } });
      if (sel.length === 1){
        const first = hero.items[0];
        out.push({ label:hero.mounted ? 'Dismount' : 'Mount', ic:'unit:knight', sub:hero.mounted ? 'on foot' : '+60% speed',
                   desc:hero.mounted ? 'Get down: normal armor again (riders have -2 armor).' : 'Ride: +60% speed and +2 damage, but -2 armor.', act:() => { toggleMount(hero); } });
        out.push({ label:'Inventory', ...(first ? { icon:itemIcon(first) } : { ic:'cmd:empty' }), sub:hero.items.length + '/' + slotsOf(hero),
                   desc:'Open the hero\'s six item slots: use, drop or sell items.', act:() => { invMenu = true; } });
      }
    }
    const casters = sel.filter(u => UNIT_TYPES[u.type].healer || UNIT_TYPES[u.type].caster);
    if (casters.length){
      const on = casters.every(u => u.auto);
      out.push({ label:'Auto-cast', ic:casters.some(u => UNIT_TYPES[u.type].caster) ? 'cmd:autocast' : 'abl:heal', sub:on ? 'On' : 'Off',
                 desc:'Spellcasters cast automatically (heal, buff, slow, curse). Turn off to save them for later.', act:() => casters.forEach(u => { u.auto = !on; }) });
    }
    // Retreat: run back to base without stopping to fight.
    if (PROMOTE[e.type] && e.owner === PLAYER){                    // promote recruits and acolytes
      for (const to of PROMOTE[e.type]){
        const c = promoteCost(e.type, to), miss = promoteMissing(PLAYER, to);
        out.push({ label:FACTIONS[PLAYER].names[to], ic:'unit:' + to, sub:miss || costText(c), desc:UNIT_DESC[to] || '', off:!!miss || !canAfford(PLAYER, c),
          act:() => { for (const u of sel) if (u.type === e.type && !u.promoting && !promote(u, to)) break; } });
      }
    }
    if (sel.some(u => u.type !== 'worker')) out.push({ label:'Retreat', ic:'cmd:retreat', sub:G.buildings.some(b => b.owner === PLAYER) ? 'to base' : 'away', act:() => {
      const home = G.buildings.find(b => b.owner === PLAYER && b.type === 'townhall') || G.buildings.find(b => b.owner === PLAYER);
      let tx, ty;
      if (home){ const c = centerOf(home); tx = c.x; ty = c.y + home.size * TILE * .5 + TILE; }
      else {                                                   // no base: run away from the nearest enemy
        const mx = sel.reduce((a, u) => a + u.x, 0) / sel.length, my = sel.reduce((a, u) => a + u.y, 0) / sel.length;
        let foe = null, fd = 1e9; for (const e of G.units) if (hostile(PLAYER, e.owner) && !e.hidden){ const d = Math.hypot(e.x - mx, e.y - my); if (d < fd){ fd = d; foe = e; } }
        const dx = foe ? mx - foe.x : 0, dy = foe ? my - foe.y : 1, L = Math.hypot(dx, dy) || 1;
        tx = clamp(mx + dx / L * 10 * TILE, TILE, MAP_PX_W - TILE); ty = clamp(my + dy / L * 10 * TILE, TILE, MAP_PX_H - TILE);
      }
      orderMove(sel, tx, ty);
      for (const u of sel) if (u.order) u.order.calm = true;
      toast('Retreating!');
    } });
    out.push({ label:'Stop', ic:'cmd:stop', act:() => sel.forEach(u => setOrder(u, null)) });
  } else if (e.kind === 'building' && e.built >= 1){
    for (const t of trainsFor(PLAYER, e.type)){
      const T = UNIT_TYPES[t];
      const miss = T.needs && missingReq(PLAYER, T.needs);
      out.push({ label:FACTIONS[PLAYER].names[t], ic:'unit:' + t, desc:`${unitDesc(t, PLAYER)} ${T.hp} health, ${T.damage} damage, ${T.ranged ? 'range ' + T.range : 'melee'}.`,
                 sub:miss ? 'Needs ' + reqName(PLAYER, miss) : costText(T.cost), off:!!miss || !canAfford(PLAYER, T.cost), act:() => tryTrain(e, t) });
    }
    for (const k of researchFor(PLAYER, e.type)){
      const R = RESEARCH[k], done = G.players[PLAYER].up[k];
      const busy = G.buildings.some(x => x.owner === PLAYER && x.queue.some(q => q.research === k));
      const miss = missingReq(PLAYER, R.needs);
      out.push({ label:R.name, ic:'res:' + k, desc:R.desc, sub:done ? 'Done' : busy ? 'In progress' : miss ? 'Needs ' + reqName(PLAYER, miss) : costText(R.cost),
                 off:done || busy || !!miss || !canAfford(PLAYER, R.cost), act:() => tryResearch(e, k) });
    }
    const UP = nextUpgrade(e);
    if (UP && !e.queue.some(q => q.upgrade))
      out.push({ ic:e.type === 'tower' ? 'cmd:fortify' : 'cmd:upgrade', label:e.type === 'townhall' ? 'Upgrade to ' + FACTIONS[PLAYER].names['townhall' + (e.level + 1)] : e.type === 'tower' ? 'Fortify' : 'Upgrade',
                 sub:UP.recruit ? '1 Recruit' : costText(UP.cost), off:!canAfford(PLAYER, UP.cost) || (UP.recruit && !G.units.some(u => u.owner === PLAYER && u.type === 'recruit' && !u.dead)), act:() => tryUpgrade(e) });
    if (e.queue.length) out.push({ label:'Cancel', ic:'cmd:cancel', sub:'last in line', act:() => cancelTrain(e) });
  }
  if (e.kind === 'building' && e.built >= 1 && e.type === 'barracks' && e.owner === PLAYER && kingdomLarva()){
    const h = trainHero(e);
    if (heroTrainMenu){
      out.length = 0;                                        // only the training choices in this menu
      const lc = h && levelUpCost(h);
      out.push({ label:'Level up', ic:'cmd:skills', sub:!h ? 'bring a hero' : h.level >= 10 ? 'max level' : 'to ' + (h.level + 1) + ' · ' + costText(lc),
                 desc:'The hero gains a level: a skill point, more health and damage.', off:!h || h.level >= 10 || !canAfford(PLAYER, lc), act:() => heroTrain(h, 'level') });
      for (const T of HERO_TRAINING){
        if (T.ranged && h && !UNIT_TYPES[h.type].ranged) continue;
        const r = heroUpg(h, T.key);
        out.push({ label:T.label, ic:'cmd:skills', sub:!h ? 'bring a hero' : r >= T.max ? 'done (' + r + '/' + T.max + ')' : r + '/' + T.max + ' · ' + costText(T.cost),
                   desc:T.desc + (T.ranged ? ' (ranged heroes)' : '') + ', up to ' + T.max + ' times.', off:!h || r >= T.max || !canAfford(PLAYER, T.cost), act:() => heroTrain(h, T.key) });
      }
      out.push({ label:'Back', ic:'cmd:back', act:() => { heroTrainMenu = false; } });
      return out;
    }
    out.push({ label:'Hero training', ic:'cmd:skills', sub:h ? nameOf(h) : 'bring a hero',
               desc:'Train a hero standing near this Barracks: buy levels, health, damage, armor, range or a bigger pack.', act:() => { heroTrainMenu = true; } });
  }
  if (e.kind === 'building' && e.built >= 1 && BUILDING_TYPES[e.type].shop){
    const h = buyerHero(PLAYER), buyBtn = k => { const I = ITEMS[k];
      return { label:I.name, sub:I.cost + 'g', desc:I.desc, icon:itemIcon(k), off:!h || h.items.length >= slotsOf(h) || G.players[PLAYER].gold < I.cost, act:() => buyItem(PLAYER, k) }; };
    if (shopMenu){                                         // the item list
      for (const k in ITEMS) if (ITEMS[k].shop) out.push(buyBtn(k));
      if (G.shopSpecial){ const b = buyBtn(G.shopSpecial); b.sub = ITEMS[G.shopSpecial].cost + 'g · special'; out.push(b); }
      out.push({ label:'Back', ic:'cmd:back', act:() => { shopMenu = false; } });
      return out;
    }
    out.push({ label:'Items', ...(G.shopSpecial ? { icon:itemIcon(G.shopSpecial) } : { ic:'cmd:empty' }), sub:G.shopSpecial ? 'special: ' + ITEMS[G.shopSpecial].name.replace(/^.* (\+\d)$/, '$1') : 'for heroes',
               desc:'Buy items for your hero. A stronger special item is offered too, changing every few minutes.', act:() => { shopMenu = true; } });
    const mk = marketOf(PLAYER);
    out.push({ label:'Sell lumber', ic:'cmd:sell', sub:'100w→' + Math.round(mk.sell) + 'g', desc:'Sell 100 lumber. Each sale lowers the price a little; it recovers over time.', off:G.players[PLAYER].wood < 100, act:() => trade(PLAYER, true) });
    out.push({ label:'Buy lumber', ic:'cmd:buy', sub:Math.round(mk.buy) + 'g→100w', desc:'Buy 100 lumber. Each purchase raises the price a little; it recovers over time.', off:G.players[PLAYER].gold < mk.buy, act:() => trade(PLAYER, false) });
  }
  // Damaged buildings can call nearby workers over to fix them.
  if (e.kind === 'building' && e.built >= 1 && e.hp < e.maxHp){
    const busy = G.units.filter(u => u.order && u.order.type === 'repair' && u.order.building === e).length;
    out.push({ label:'Repair', ic:'cmd:repair', sub:busy ? busy + ' repairing' : 'Send 2 workers', act:() => {
      if (!sendRepairers(e, 2)) toast('No free workers nearby');
    } });
  }
  out.push(deselect);
  return out;
}

function refreshUI(){
  if (!G) return;
  if (G.editor) return;                                   // the editor draws its own panel
  const P = G.players[PLAYER], f = foodOf(PLAYER);
  $('#gold').textContent = Math.floor(P.gold);
  $('#wood').textContent = Math.floor(P.wood);
  const noBase = G.mission && !G.buildings.some(b => b.owner === PLAYER);    // a squad without a base: no food to count
  $('#food').textContent = noBase ? f.used : f.used + '/' + f.cap;
  { const up = upkeepOf(PLAYER), box = $('#foodBox');
    box.classList.toggle('upLow', up.rate === .7); box.classList.toggle('upHigh', up.rate === .4);
    box.title = up.label + (up.rate < 1 ? ': gold income ' + Math.round(up.rate * 100) + '%' : '');
    if (G.upkeepShown !== up.label){ if (G.upkeepShown) toast(up.label + (up.rate < 1 ? ': your workers bring in ' + Math.round(up.rate * 100) + '% gold' : ': full gold income again'), 3000); G.upkeepShown = up.label; } }
  const hasSoldiers = selection.some(u => u.kind === 'unit' && u.owner === PLAYER && u.type !== 'worker' && !u.dead);
  $('#amBtn').hidden = !hasSoldiers || !!(G && G.place);
  $('#stBtn').hidden = $('#amBtn').hidden;
  if ($('#stBtn').hidden) $('#stMenu').hidden = true;
  else {
    const sel0 = selection.find(u => u.kind === 'unit' && u.owner === PLAYER && u.type !== 'worker'), cur = (sel0 && sel0.stance) || 'aggr';
    $('#stBtn b').textContent = STANCES[cur].icon;
    $('#stMenu').querySelectorAll('[data-stance]').forEach(b => b.classList.toggle('on', b.dataset.stance === cur));
  }
  if (!hasSoldiers && attackMode){ attackMode = false; $('#amBtn').classList.remove('armed'); }
  const pts = heroesOf(PLAYER).reduce((a, h) => a + h.skillPoints, 0);
  $('#btnHero').textContent = pts ? 'Hero +' + pts : 'Hero';
  $('#foodBox').classList.toggle('full', !noBase && f.used >= f.cap);

  selection = selection.filter(e => !e.dead);
  let html, btns = [];
  if (G.place){
    html = `<h2>Place ${FACTIONS[PLAYER].names[G.place.type]}</h2><p class="hint">Drag the outline or tap a spot. When it's green, press Confirm.</p>`;
    btns = [{ label:'Cancel', ic:'cmd:cancel', act:() => { G.place = null; } }];
  } else if (!selection.length){
    html = `<p class="hint">Tap a unit or building to select it. Drag to scroll the map, pinch to zoom.</p>`;
  } else {
    html = selection.length === 1 ? describe(selection[0]) : describeGroup(selection);
    btns = commandsFor(selection);
  }
  infoEl.innerHTML = html;
  // Idle-worker button: shows how many workers have nothing to do.
  const idle = G.units.filter(u => u.owner === PLAYER && u.type === 'worker' && !u.order && !u.hidden);
  const ib = $('#idleBtn');
  ib.hidden = !idle.length || !!G.place || !running;
  if (idle.length){ ib.querySelector('b').textContent = idle.length; const src = portraitURL('unit', 'worker', PLAYER); if (ib.querySelector('img').getAttribute('src') !== src) ib.querySelector('img').src = src; }
  $('#placeBar').hidden = !G.place;
  if (G.place) $('#placeOk').classList.toggle('off', !G.place.valid);
  if (press) return;                                            // don't swap buttons under a finger
  cmdsEl.classList.toggle('four', btns.length > 9);              // long lists get a 4-column grid
  cmdsEl.innerHTML = btns.map((b, i) => {
    const icon = b.icon || (b.ic ? iconURL(b.ic) : '');
    return `<button data-i="${i}" class="${b.off ? 'off' : ''}" aria-label="${b.label}">${icon ? `<img class="ic" src="${icon}" alt="">` : ''}<span class="lb">${b.label}</span>${b.sub ? `<small>${b.sub}</small>` : ''}</button>`;
  }).join('');
  uiButtons = btns;
}

// We react on pointerdown (not click) because the panel is rebuilt often;
// a click could otherwise land on a button that was just replaced.
function runButton(target){
  const btn = target.closest('button'); if (!btn) return;
  const b = uiButtons[+btn.dataset.i];
  if (b && running && !paused){ sfx('click'); b.act(); refreshUI(); }
}
// LESSON: Touch screens have no mouse-over tooltips, so a long press shows
// a button's description instead. A quick tap still runs the command.
// While a finger is down, the panel isn't rebuilt (see refreshUI), so the
// button under the finger stays the same one.
let press = null;
cmdsEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  const btn = e.target.closest('button'); if (!btn) return;
  const b = uiButtons[+btn.dataset.i]; if (!b) return;
  press = { b, shown:false };
  press.timer = setTimeout(() => {
    if (!press || press.b !== b) return;
    press.shown = true;
    toast(b.label + ': ' + (b.desc || CMD_DESC[b.ic] || b.sub || ''), 3500);
  }, 450);
});
const endPress = run => { if (!press) return; clearTimeout(press.timer); const p = press; press = null;
  if (run && !p.shown && running && !paused){ sfx('click'); p.b.act(); refreshUI(); } };
cmdsEl.addEventListener('pointerup', () => endPress(true));
cmdsEl.addEventListener('pointercancel', () => endPress(false));
cmdsEl.addEventListener('pointerleave', () => endPress(false));
infoEl.addEventListener('pointerdown', e => {              // tap a portrait in the roster
  const r = e.target.closest('[data-uid]');
  if (!r || !G) return;
  const u = G.units.find(x => x.id === +r.dataset.uid);
  if (u){ sfx('select'); selectList([u]); }
});
cmdsEl.addEventListener('click', e => { if (e.detail === 0) runButton(e.target); });   // keyboard

$('#btnArmy').onclick = () => {
  if (!running) return;
  const army = G.units.filter(u => u.owner === PLAYER && u.type !== 'worker');
  if (army.length) selectList(army); else toast('You have no soldiers yet');
};
// LESSON: Move versus attack-move. A plain tap on the ground just MOVES
// (units walk there without stopping to fight, and stay calm for a moment
// after arriving), so you can pull a hero out of trouble. To fight your way
// somewhere, arm the Attack button first: the next ground tap is an
// attack-move. Tapping an enemy always attacks it.
let attackMode = false;
// LESSON: Stances. Each unit remembers how far it may go on its own:
// aggressive (chase, as before), defensive (chase a short way, then return)
// or hold position (never move on its own; only hit enemies within reach).
// Orders you give still work as usual; stances only change what units do by themselves.
const STANCES = { aggr:{ icon:'»', label:'Aggressive' }, def:{ icon:'🛡', label:'Defensive' }, hold:{ icon:'✋', label:'Hold position' } };
$('#stBtn').addEventListener('pointerdown', e => { e.stopPropagation(); sfx('click'); $('#stMenu').hidden = !$('#stMenu').hidden; });
$('#stMenu').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-stance]'); if (!b) return;
  e.stopPropagation(); sfx('click');
  const st = b.dataset.stance;
  for (const u of selection) if (u.kind === 'unit' && u.owner === PLAYER && u.type !== 'worker'){
    u.stance = st;
    if (st === 'hold' && u.order && u.order.leash) setOrder(u, null);     // stop chasing right away
  }
  $('#stMenu').hidden = true; toast(STANCES[st].label); refreshUI();
});
$('#amBtn').addEventListener('pointerdown', e => {
  e.stopPropagation(); attackMode = !attackMode; sfx('click');
  $('#amBtn').classList.toggle('armed', attackMode);
  if (attackMode) toast('Tap where to attack-move');
});
// Tap an "under attack" alert to jump the camera there.
toastEl.addEventListener('pointerdown', e => {
  if (!toastEl.classList.contains('alert') || !G || !G.lastAlert) return;
  e.stopPropagation(); centerOn(G.lastAlert.x, G.lastAlert.y); toastEl.classList.remove('show', 'alert'); sfx('click');
});
// "show"/"hide" next to a unit's range toggles the range rings.
$('#info').addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-range]')) return;
  e.stopPropagation(); showRange = !showRange; sfx('click'); refreshUI();
});
// Tap the objectives to fold them away (and tap again to unfold).
$('#objBox').addEventListener('pointerdown', e => { e.stopPropagation(); objCollapsed = !objCollapsed; sfx('click'); missionTick(true); });

// Each tap selects the next idle worker and moves the camera to it.
let idleIdx = -1;
$('#idleBtn').onclick = () => {
  if (!G || !running) return;
  const idle = G.units.filter(u => u.owner === PLAYER && u.type === 'worker' && !u.order && !u.hidden);
  if (!idle.length) return;

$('#placeOk').onclick = () => { if (G && G.place) tryPlaceBuilding(); refreshUI(); };
$('#placeCancel').onclick = () => { if (G) G.place = null; refreshUI(); };

// Heroes are small and hard to tap mid-battle, so there's a dedicated button.
$('#btnHero').onclick = () => {
  if (!running) return;
  const hs = heroesOf(PLAYER);
  if (!hs.length){ toast('Train a hero at the ' + FACTIONS[PLAYER].names.barracks); return; }
  const cur = hs.indexOf(selection.length === 1 ? selection[0] : null);
  const hero = hs[(cur + 1) % hs.length];                // each tap selects the next hero

};
$('#btnBox').onclick = e => {
  boxMode = !boxMode;
  e.currentTarget.setAttribute('aria-pressed', boxMode);
  if (boxMode) toast('Drag on the map to select a group');
};
$('#btnPause').onclick = () => { if (running && !G.over) showPause(); };


/* =============================================================================
   14b. SOUND AND MUSIC
   LESSON: Every sound here is synthesized with the Web Audio API, so there are
   no audio files at all. The building blocks:
     - an oscillator (a pure tone: sine, square, sawtooth or triangle wave)
     - white noise (random samples: the basis of hits, whooshes and rumbles)
     - a filter (keeps only the low, high or middle frequencies of a sound)
     - a gain "envelope" (volume that rises fast and fades out, like a pluck)
   A sword clang is noise through a high band-pass filter plus a high ringing
   tone; a thud is noise through a low-pass filter plus a falling low tone.
   LESSON: Browsers only allow sound after the player touches the page, so the
   audio system is started from the first tap (the Start button).
   ========================================================================== */

const Sound = { ctx:null, master:null, sfx:null, music:null, noise:null, voices:0, last:{},
                sfxOn:true, musicOn:true, step:0, nextNote:0, timer:0 };
try {
  Sound.sfxOn = localStorage.getItem('bov-sfx') !== 'off';
  Sound.musicOn = localStorage.getItem('bov-music') !== 'off';
} catch (e) { /* storage unavailable */ }

function audioInit(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (Sound.ctx){ if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); return; }
  const c = Sound.ctx = new AC();
  Sound.master = c.createGain(); Sound.master.gain.value = 0.8; Sound.master.connect(c.destination);
  Sound.sfx = c.createGain(); Sound.sfx.gain.value = Sound.sfxOn ? 0.6 : 0; Sound.sfx.connect(Sound.master);
  Sound.music = c.createGain(); Sound.music.gain.value = Sound.musicOn ? 0.22 : 0; Sound.music.connect(Sound.master);
  // One second of white noise, reused by every noisy sound.
  const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  Sound.noise = buf;
  Sound.nextNote = c.currentTime + 0.2;
  musicTick();
}
function setSfx(on){ Sound.sfxOn = on; if (Sound.sfx) Sound.sfx.gain.value = on ? 0.6 : 0; try { localStorage.setItem('bov-sfx', on ? 'on' : 'off'); } catch (e) {} }

// A tone that slides from f0 to f1 Hz with a quick attack and a fade-out.
function tone(type, f0, f1, dur, vol, when = 0, dest = Sound.sfx){
  const c = Sound.ctx, t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
// A burst of filtered noise.
function noise(dur, vol, filter, freq, q = 1, when = 0, dest = Sound.sfx, freqEnd){
  const c = Sound.ctx, t = c.currentTime + when;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = Sound.noise; s.playbackRate.value = 0.7 + Math.random() * 0.6;
  f.type = filter; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const rnd = (a, b) => a + Math.random() * (b - a);     // small random variation keeps repeats from sounding robotic

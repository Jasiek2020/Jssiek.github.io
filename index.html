<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Banners of the Vale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   STYLES
   The game world is drawn on a <canvas>. Everything around it (resource
   bar, command panel, menus) is normal HTML + CSS, which is much easier to
   lay out and make readable than drawing buttons by hand on the canvas.
   ========================================================================== */

/* Colour "tokens": named colours we reuse everywhere. Change one here and
   the whole interface follows. The palette is carved oak + brass + parchment. */
:root{
  --wood-deep:#23170d; --wood:#3d2a19; --wood-lit:#5a3f25;
  --brass:#d2ad55; --brass-dim:#8d7338;
  --parch:#f0e4c3; --parch-dim:#b9ab88;
  color-scheme: dark;
  /* Keep content clear of the phone's notch and home bar. */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The game is dark by nature, so dark mode only deepens the background. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood-deep:#1e140b; } }
:root[data-theme="dark"]{ --wood-deep:#1e140b; }

*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; background:var(--wood-deep); scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  height:100%; margin:0; overflow:hidden;
  background:var(--wood-deep); color:var(--parch);
  font-family:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  /* Stop the browser from selecting text or showing menus on long-press. */
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}

/* Layout: top bar, then the map, then the command panel. */
#app{ height:100%; display:flex; flex-direction:column; }
#topbar{
  display:flex; align-items:center; gap:12px; padding:6px 8px;
  background:var(--wood); border-bottom:2px solid var(--brass-dim);
}
.res{ display:flex; align-items:center; gap:5px; font-size:16px; font-weight:600; }
.res.full b{ color:#ff7b5c; }
.ico{ width:12px; height:12px; display:inline-block; }
.ico.gold{ background:#f2cf4b; border-radius:50%; box-shadow:inset -2px -2px 0 #b58a1f; }
.ico.wood{ background:#8a5a2b; border-radius:2px; box-shadow:inset 0 -4px 0 #5e3b1b; }
.ico.food{ background:#d9a066; clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%); }
.tb-btns{ margin-left:auto; display:flex; gap:5px; }
#topbar button{ padding:5px 8px; font-size:14px; }
@media (max-width:420px){ #topbar{ gap:8px; padding:6px; } .res{ font-size:14px; gap:4px; } #topbar button{ padding:5px 6px; font-size:13px; } }
.speed button[aria-pressed="true"]{ background:var(--brass); color:var(--wood-deep); }

button{
  font:inherit; color:var(--parch); background:var(--wood-lit);
  border:2px solid var(--brass-dim); border-radius:3px; padding:6px 10px;
  cursor:pointer; touch-action:manipulation;
}
button[aria-pressed="true"]{ background:var(--brass); color:var(--wood-deep); border-color:var(--parch); }
button:focus-visible{ outline:2px solid var(--parch); outline-offset:2px; }

#main{ flex:1; display:flex; flex-direction:column; min-height:0; }
#view{ position:relative; flex:1; min-height:0; overflow:hidden; background:#0d0a07; }
/* touch-action:none tells the browser "I handle all touches myself" (no page scroll/zoom). */
#world{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#minimap{
  position:absolute; top:8px; right:8px; width:104px; height:104px;
  border:2px solid var(--brass); background:#000; touch-action:none; image-rendering:pixelated;
}
#toast{
  position:absolute; left:50%; top:10px; transform:translateX(-50%); max-width:62%;
  background:rgba(20,13,7,.9); border:1px solid var(--brass-dim); padding:6px 12px;
  font-size:14px; text-align:center; pointer-events:none; opacity:0; transition:opacity .2s;
}
#toast.show{ opacity:1; }
/* Confirm / Cancel for building placement, bottom-left of the map where a thumb reaches easily. */
#placeBar{ position:absolute; left:10px; bottom:10px; display:flex; gap:8px; }
#placeBar[hidden]{ display:none; }
#placeBar button{ min-height:48px; padding:10px 18px; font-size:18px; }
#placeOk{ background:var(--brass); color:var(--wood-deep); border-color:var(--parch); font-weight:700; }
#placeOk.off{ opacity:.45; }

#panel{
  flex:0 0 auto; height:184px; display:flex; gap:8px; padding:8px;
  background:var(--wood); border-top:2px solid var(--brass-dim);
}
#info{ flex:1 1 40%; min-width:0; overflow:hidden; font-size:13px; line-height:1.35; }
#info h2{ margin:0 0 4px; font-size:17px; color:var(--brass); font-weight:700; }
#info .hint{ color:var(--parch-dim); }
.bar{ height:8px; background:#1b120b; border:1px solid #000; margin:3px 0; }
.bar > i{ display:block; height:100%; }
#cmds{ flex:1 1 60%; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:54px; gap:3px; align-content:start; }
#cmds button{ padding:2px 2px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; font-size:10.5px; overflow:hidden;
  background:linear-gradient(#4a3a2a, #2f241a); border:2px solid #150e08;
  box-shadow:inset 2px 2px 0 rgba(255,236,190,.14), inset -2px -2px 0 rgba(0,0,0,.5); }   /* bevelled, like carved stone */
#cmds button:active{ box-shadow:inset -2px -2px 0 rgba(255,236,190,.1), inset 2px 2px 0 rgba(0,0,0,.5); }
#cmds button img.ic{ width:22px; height:22px; image-rendering:pixelated; margin:0 0 2px; flex:none; }
#cmds button .lb{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; line-height:1.1; flex:none; }
/* The vignette (darker screen edges) is a CSS layer: the browser composites
   it almost for free, instead of the canvas re-painting a full-screen gradient every frame. */
#vignette{ position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(10,6,2,0) 45%, rgba(10,6,2,.4) 100%); }
/* Mission objectives, top-left of the map. */
#objBox{ position:absolute; left:8px; top:8px; max-width:calc(100% - 130px); padding:8px 10px; z-index:2;
  background:rgba(20,13,7,.88); border:2px solid var(--brass); box-shadow:0 0 0 1px #000; font-size:13px; line-height:1.3; }
#objBox[hidden]{ display:none; }

#objBox{ cursor:pointer; }
#objBox.small{ padding:5px 9px; max-width:none; }
#objBox.small b{ margin:0; }
#objBox small.bonus{ display:block; margin-top:4px; color:#e6c96a; font-size:11px; }
#objBox .fold{ float:right; color:var(--parch-dim); margin-left:6px; }
#objBox b{ display:block; color:var(--brass); margin-bottom:3px; }
#objBox small{ color:var(--parch-dim); font-size:12px; }
body.mission #toast{ top:auto; bottom:84px; }
#toast.alert{ pointer-events:auto; cursor:pointer; border-color:#ff8a6a; }          /* keep messages clear of the objectives */
body.tab-port #objBox{ max-width:calc(100% - 210px); font-size:15px; }
#info .stats{ display:flex; flex-wrap:wrap; gap:2px 8px; margin:2px 0; font-size:12px; }
#info .stats span{ display:inline-flex; align-items:center; gap:2px; }
#info .rng{ color:#8fd3ff; font-weight:normal; font-size:11px; text-decoration:underline; cursor:pointer; padding:0 2px; }
#info .stats img{ width:12px; height:12px; image-rendering:pixelated; }
#idleBtn{ position:absolute; left:10px; bottom:10px; width:54px; height:54px; padding:2px; border:2px solid var(--brass);
  background:#141009; box-shadow:0 0 0 1px #000; }
#idleBtn[hidden]{ display:none; }
/* Upkeep: the food counter turns amber (low) or red (high). */
#foodBox.upLow{ color:#f0b44a; } #foodBox.upHigh{ color:#ff6a4d; }
#foodBox.upLow::after{ content:' ▾70%'; font-size:10px; } #foodBox.upHigh::after{ content:' ▾40%'; font-size:10px; }
/* Attack-move: arm it, then tap the ground. It sits above the idle-worker button. */
#amBtn{ position:absolute; left:10px; bottom:74px; width:54px; height:54px; padding:0; border:2px solid var(--brass);
  background:#2a1b10; color:var(--parch); box-shadow:0 0 0 1px #000; font-size:22px; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#amBtn small{ font-size:10px; margin-top:2px; }
#amBtn[hidden]{ display:none; }
/* Stance: how far units go on their own (above the Attack button). */
#stBtn{ position:absolute; left:10px; bottom:136px; width:54px; height:54px; padding:0; border:2px solid var(--brass);
  background:#2a1b10; color:var(--parch); box-shadow:0 0 0 1px #000; font-size:20px; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#stBtn small{ font-size:10px; margin-top:2px; }
#stBtn[hidden], #stMenu[hidden]{ display:none; }
#stMenu{ position:absolute; left:72px; bottom:110px; display:flex; flex-direction:column; gap:4px; z-index:4; }
#stMenu button{ text-align:left; padding:6px 10px; font-size:13px; background:#2a1b10; border:2px solid var(--brass); color:var(--parch); min-width:170px; }
#stMenu button small{ display:block; font-size:10px; color:var(--parch-dim); }
#stMenu button.on{ border-color:#7df06a; }
body.tab-land #stBtn, body.tab-port #stBtn{ width:68px; height:68px; bottom:164px; }
body.tab-land #stMenu, body.tab-port #stMenu{ left:86px; bottom:140px; }
#amBtn.armed{ background:#8a2a1a; border-color:#ffb08a; box-shadow:0 0 0 1px #000, 0 0 10px #ff6a4a; }
body.tab-land #amBtn, body.tab-port #amBtn{ width:68px; height:68px; bottom:88px; }
#idleBtn img{ width:100%; height:100%; image-rendering:pixelated; display:block; }
#idleBtn b{ position:absolute; right:-4px; top:-6px; min-width:20px; padding:1px 4px; font-size:12px; border-radius:9px;
  background:#c0392b; color:#fff; border:1px solid #000; }
#info .por{ float:left; width:46px; height:46px; margin:0 8px 4px 0; border:2px solid var(--brass); outline:1px solid #000;
  box-shadow:inset 0 0 0 1px #000; image-rendering:pixelated; background:#141009; }
.roster{ display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; }
.ru{ position:relative; border:1px solid var(--brass-dim); background:#141009; aspect-ratio:1; cursor:pointer; }
.ru img{ width:100%; height:100%; image-rendering:pixelated; display:block; }
.ru i{ position:absolute; left:1px; bottom:1px; height:3px; }
#cmds button small{ font-size:9px; color:var(--parch-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; line-height:1.1; flex:none; }
#cmds.four{ grid-template-columns:repeat(4,1fr); }
#cmds.four button{ font-size:11px; }
#cmds button img{ width:14px; height:14px; vertical-align:-2px; margin-right:3px; }
#cmds button.item{ font-size:11px; line-height:1.05; }
#cmds button.off{ opacity:.45; }

/* Phones held sideways: move the panel to the right edge. */
@media (orientation:landscape) and (max-height:600px){
  #main{ flex-direction:row; }
  #panel{ height:auto; width:270px; flex-direction:column; border-top:none; border-left:2px solid var(--brass-dim); }
  #info{ flex:0 0 auto; max-height:42%; }
}

/* ----- Tablets -----
   LESSON: Responsive layout. The same page rearranges itself by screen
   shape: resize() sets a class on <body> ("tab-land" or "tab-port") and
   these rules take over. No separate tablet version of the game needed. */

/* Landscape tablet: a Warcraft-2-style sidebar on the left with a big
   minimap, the portrait and stats, and large square command buttons. */
body.tab-land #main{ flex-direction:row; }
body.tab-land #panel{ order:-1; width:312px; height:auto; flex-direction:column; gap:10px; padding:10px;
  border-top:none; border-right:3px solid var(--brass-dim);
  background:linear-gradient(90deg, var(--wood-deep), var(--wood) 12%, var(--wood) 88%, var(--wood-deep)); }
body.tab-land #minimap{ position:static; align-self:center; width:min(288px, 34vh); height:min(288px, 34vh); flex:none;
  border:3px solid var(--brass); box-shadow:0 0 0 2px #000, inset 0 0 0 1px #000; }
body.tab-land #info{ flex:0 0 auto; max-height:24vh; font-size:14px; }
body.tab-land #info h2{ font-size:19px; }
body.tab-land #info .por{ width:56px; height:56px; }
body.tab-land #cmds{ flex:1 1 auto; grid-template-columns:repeat(3, 1fr); grid-auto-rows:min(84px, 11vh); gap:5px; }
body.tab-land #cmds.four{ grid-template-columns:repeat(4, 1fr); }
body.tab-land #cmds button{ font-size:12.5px; }
body.tab-land #cmds button img.ic{ width:32px; height:32px; }
body.tab-land #cmds button small{ font-size:11px; }

/* Portrait tablet: the phone layout, scaled up for a bigger screen. */
body.tab-port #panel{ height:250px; gap:12px; padding:12px; }
body.tab-port #info{ font-size:15px; }
body.tab-port #info h2{ font-size:20px; }
body.tab-port #info .por{ width:60px; height:60px; }
body.tab-port #cmds{ grid-template-columns:repeat(4, 1fr); grid-auto-rows:72px; gap:5px; }
body.tab-port #cmds.four{ grid-template-columns:repeat(5, 1fr); }
body.tab-port #cmds button{ font-size:12.5px; }
body.tab-port #cmds button img.ic{ width:30px; height:30px; }
body.tab-port #cmds button small{ font-size:11px; }
body.tab-port #minimap{ width:176px; height:176px; }

/* Both: bigger top bar and idle-worker button. */
body.tab-land #topbar, body.tab-port #topbar{ font-size:17px; }
body.tab-land #idleBtn, body.tab-port #idleBtn{ width:68px; height:68px; }

/* Title / pause / end screens */
#overlay{
  position:fixed; inset:0; z-index:10; display:flex; overflow:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 35%, rgba(60,38,20,.78), rgba(12,8,4,.95) 70%);
}
#overlay.hidden{ display:none; }
#overlay.menu{ background:radial-gradient(ellipse at 50% 40%, rgba(40,26,14,.55), rgba(12,8,4,.85) 75%); }
/* On the main menu the game's own interface fades away, leaving just the map. */
body.in-menu #topbar, body.in-menu #panel, body.in-menu #minimap, body.in-menu #idleBtn{ opacity:0; pointer-events:none; }
body.in-menu.tab-land #panel{ display:none; }
body.in-menu #objBox{ display:none; }        /* the tablet sidebar collapses so the map fills the screen */
.slots button{ text-align:left; padding:10px 12px; line-height:1.35; }
.slots button small{ font-size:11px; color:var(--parch-dim); }
.teams{ display:flex; flex-direction:column; gap:6px; max-width:22rem; }
.team-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; }
.team-row button{ min-width:72px; padding:4px 8px; }
.team-btns{ display:flex; gap:6px; }
/* Mission briefings: a parchment scroll. */
.scroll{ background:linear-gradient(#efe3c2, #e2d2a8); color:#3a2715; border:2px solid #8a6a3a; box-shadow:0 0 0 2px #2a1a0c, 0 6px 18px rgba(0,0,0,.5);
  padding:14px 16px 6px; margin-bottom:16px; border-radius:3px; }
#overlay .scroll h1{ color:#5a3413; text-shadow:none; -webkit-text-stroke:0; margin:6px 0 10px; line-height:1.15; font-size:26px; }
.scroll .region{ margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#7a5a30; }
.scroll .story{ font-size:15px; line-height:1.5; margin:0 0 10px; font-style:italic; }
/* The map editor's panel and hidden game interface. */
body.editing #topbar *{ visibility:hidden; } body.editing #btnPause{ visibility:visible; }
body.editing #amBtn, body.editing #stBtn, body.editing #stMenu, body.editing #idleBtn, body.editing #objBox{ display:none !important; }
#cmds button.on, .edrow button.on{ border-color:#7df06a; box-shadow:0 0 0 1px #7df06a inset; }
.edrow{ display:flex; gap:4px; align-items:center; margin:3px 0; font-size:12px; flex-wrap:wrap; }
body.editing #cmds{ grid-auto-rows:auto; gap:3px; }
body.editing #cmds button{ min-height:0; height:auto; padding:5px 2px; font-size:11px; line-height:1.15; }
body.editing #info h2{ margin:0 0 2px; font-size:15px; }
body.editing #info .hint{ font-size:11px; }
.edrow button{ padding:3px 6px; font-size:11px; }
.menu-col{ display:flex; flex-direction:column; gap:10px; max-width:16rem; }
.menu-col button{ width:100%; }
.card{ max-width:26rem; width:100%; margin:auto; }
details.howto{ margin:0 0 20px; }
details.howto summary{ cursor:pointer; color:var(--brass); font-size:15px; margin-bottom:8px; }
details.howto .how{ margin-bottom:0; }
.banners{ display:flex; gap:10px; margin-bottom:14px; }
.bn{ width:24px; height:40px; clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%); }
.bn.k{ background:#4f7fc4; } .bn.o{ background:#c4492f; }
.card h1{
  font-size:clamp(42px,12vw,66px); line-height:.9; margin:0 0 16px; font-weight:700;
  color:var(--brass); text-shadow:3px 3px 0 #140c05, 0 0 28px rgba(230,140,50,.35);
}
.lede{ font-size:17px; line-height:1.4; margin:0 0 14px; }
.how{ margin:0 0 22px; padding-left:1.1em; color:var(--parch-dim); font-size:14px; line-height:1.45; }
.how li{ margin-bottom:4px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
button.big{ font-size:20px; padding:12px 22px; background:var(--brass); color:var(--wood-deep); border-color:var(--parch); font-weight:700; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="res"><span class="ico gold"></span><b id="gold">0</b></div>
    <div class="res"><span class="ico wood"></span><b id="wood">0</b></div>
    <div class="res" id="foodBox"><span class="ico food"></span><b id="food">0/0</b></div>
    <div class="tb-btns">
      <button id="btnArmy">Army</button>
      <button id="btnHero">Hero</button>
      <button id="btnBox" aria-pressed="false">Box</button>
      <button id="btnPause" aria-label="Pause">❚❚</button>
    </div>
  </header>
  <div id="main">
    <div id="view">
      <canvas id="world"></canvas>
      <div id="vignette"></div>
      <canvas id="minimap" width="256" height="256"></canvas>
      <div id="toast"></div>
      <div id="objBox" hidden></div>
      <button id="idleBtn" hidden aria-label="Select an idle worker"><img alt=""><b>0</b></button>
      <button id="amBtn" hidden aria-label="Attack-move: tap, then tap the ground">⚔<small>Attack</small></button>
      <button id="stBtn" hidden aria-label="Stance: aggressive, defensive or hold position"><b>»</b><small>Stance</small></button>
      <div id="stMenu" hidden><button data-stance="aggr">» Aggressive<small>chase enemies</small></button><button data-stance="def">🛡 Defensive<small>chase a little, then return</small></button><button data-stance="hold">✋ Hold position<small>never move on their own</small></button></div>
      <div id="placeBar" hidden><button id="placeOk">Confirm</button><button id="placeCancel">Cancel</button></div>
    </div>
    <section id="panel">
      <div id="info"></div>
      <div id="cmds"></div>
    </section>
  </div>
</div>
<div id="overlay"></div>

<script>
'use strict';
/* =============================================================================
   BANNERS OF THE VALE — a small real-time strategy (RTS) prototype
   -----------------------------------------------------------------------------
   HOW TO READ THIS FILE
   The code is split into numbered sections. Read them in order the first
   time; each builds on the previous one:

    1. Configuration & game data   – numbers that define units and buildings
    2. Small helpers               – maths and grid utilities
    3. Game state & map generation – the world and how it is created
    4. Entities                    – creating/removing units and buildings
    5. Pathfinding (A*)            – how units find their way around obstacles
    6. Orders                      – the commands a unit can be given
    7. Unit behaviour              – a "state machine" that runs every order
    8. Buildings & training
    9. Combat & heroes
   10. Fog of war
   11. Enemy AI
   12. Rendering                   – drawing everything on the canvas
   13. Input                       – touch, mouse, pinch zoom
   14. Interface panel             – the HTML buttons below the map
   15. Game loop & start-up

   Lines starting with "LESSON:" explain a general game-dev idea you can
   reuse in any game, not just this one.
   ========================================================================== */


/* =============================================================================
   1. CONFIGURATION & GAME DATA
   LESSON: Keep game balance in plain data tables, separate from logic.
   Want archers to hit harder? Change one number below. The rest of the code
   just reads these tables, so it never needs to change.
   ========================================================================== */

const TILE = 32;                    // size of one map tile, in pixels
// Map size, in tiles (a multiple of 16). It can change between games: see
// setMapSize(), which also rebuilds everything that depends on it.
let MAP_W = 128, MAP_H = 128;
let MAP_PX_W = MAP_W * TILE;        // map size, in pixels
let MAP_PX_H = MAP_H * TILE;

// Terrain types. Each tile of the map stores one of these numbers.
const T_GRASS = 0, T_WATER = 1, T_TREE = 2, T_DIRT = 3, T_ROCK = 4, T_CLIFF = 5, T_SAND = 6, T_SWAMP = 7, T_BOULDER = 8;   // sand and swamp are walkable (swamp is slow); boulders are not   // cliff: the edge of a plateau (not walkable)   // rock: arena walls and stands (not walkable)

// Player ids. Every unit and building has an "owner".
const PLAYER = 0, ENEMY = 1, CREEPS = 2, NEUTRAL = -1;   // CREEPS = wild creatures guarding camps
// LESSON: Up to three AI opponents. Owner numbers 1, 3 and 4 are AIs (2 stays
// the creatures, so nothing that already uses CREEPS has to change).
// G.opponents lists the AIs in this game, e.g. [1] or [1, 3, 4].
const AI_OWNERS = [1, 3, 4];
const isAI = o => !!(G && G.opponents && G.opponents.includes(o));
const isSide = o => o === PLAYER || isAI(o);              // a player or AI, not creatures or neutral
const COLOR_NAMES = { '#3f6fb5':'blue', '#b5452c':'red', '#7a4fb0':'purple', '#c9982a':'gold' };
const sideName = o => FACTIONS[o].name + (G && G.opponents.length > 1 ? ' (' + (COLOR_NAMES[FACTIONS[o].color] || 'red') + ')' : '');
const sidesOf = () => [PLAYER, ...G.opponents];
// LESSON: Teams. "Different owner" no longer means "enemy": two sides on the
// same team are allies. Every targeting rule asks hostile(a, b) instead of
// a !== b, so alliances work everywhere at once. Creatures are everyone's enemy.
const hostile = (a, b) => a !== b && a != null && b != null && a !== NEUTRAL && b !== NEUTRAL &&   // things with no owner (trees) are never enemies
  !(isSide(a) && isSide(b) && G.teams && G.teams[a] !== undefined && G.teams[a] === G.teams[b]);
const allied = (a, b) => a === b || (isSide(a) && isSide(b) && !hostile(a, b));

// LESSON: A 2D grid is usually stored as a flat 1D array. The tile at

const idx = (x, y) => y * MAP_W + x;

// LESSON: A "seeded" random generator gives the same sequence of numbers for
// the same seed. Great for maps: share the seed, get the same map.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = Math.random;

// A "hash" turns (x, y) into a stable pseudo-random number 0..1.
// Used to vary grass colour per tile without storing anything.
function hash(x, y){
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Rectangles in tile coordinates (inclusive), used for buildings and goals.
function rectOf(e){ return { x0:e.tx, y0:e.ty, x1:e.tx + e.size - 1, y1:e.ty + e.size - 1 }; }
function rectOfTile(x, y){ return { x0:x, y0:y, x1:x, y1:y }; }

// Centre of anything, in pixels.
function centerOf(e){
  if (e.kind === 'unit') return { x:e.x, y:e.y };
  return { x:(e.tx + e.size / 2) * TILE, y:(e.ty + e.size / 2) * TILE };
}

// Distance (in tiles) from a unit to the nearest edge of a rectangle.
function distToRect(u, r){
  const px = u.x / TILE, py = u.y / TILE;
  const dx = Math.max(r.x0 - px, 0, px - (r.x1 + 1));
  const dy = Math.max(r.y0 - py, 0, py - (r.y1 + 1));
  return Math.hypot(dx, dy);
}
// Distance from a unit to any target (unit, building, mine), in tiles.
function distTo(u, t){
  if (t.kind === 'unit') return Math.hypot(t.x - u.x, t.y - u.y) / TILE;
  return distToRect(u, rectOf(t));
}

function setMapSize(n){

function newGame(){
  // A custom map that can't be found (deleted, or not loaded yet) falls back to the Green Vale.
  if (settings.map === 'user' && !(USER_MAP && USER_MAP.id === settings.userMap) && !prepUserMap(settings.userMap)){ settings.map = 'vale'; settings.size = 'normal'; }
  if (settings.map !== 'user' && settings.size === 'user') settings.size = 'normal';
  if (settings.map === 'user' && USER_MAP) settings.opponents = Math.max(1, Math.min(settings.opponents, userStarts(USER_MAP) - 1));
  setMapSize((MAP_SIZES[settings.size] || MAP_SIZES.normal).n);
  seatFactions();
  const N = MAP_W * MAP_H;
  G = {
    time:0, over:false, nextId:1,
    players:[ { gold:500, wood:250, up:{} }, { gold:500, wood:250, up:{} }, { gold:0, wood:0, up:{} },
              { gold:500, wood:250, up:{} }, { gold:500, wood:250, up:{} } ],   // up = finished research; #2 = creeps, #3 and #4 = extra AIs
    opponents:AI_OWNERS.slice(0, settings.opponents),   // which AIs are in this game
    ai:{},                        // each AI's own plans (wave size, next attack), by owner
    out:[],                       // sides that have been eliminated
    teams:{},                     // team number of each side (same number = allies)
    aiDiff:{},                    // each AI's difficulty (easy / normal / hard)
    gathered:{},                  // gold each side has gathered (for Race for Gold)
    lumber:{},                    // lumber each side has gathered (for the lumber missions)
    mercs:[],                     // mercenary camps
    units:[], buildings:[], mines:[], projectiles:[], effects:[],
    terrain:new Uint8Array(N),    // T_GRASS / T_WATER / ...
    wood:new Uint16Array(N),      // lumber left in each tree tile
    stump:new Uint8Array(N),      // 1 where a tree was cut (just for looks)
    height:new Uint8Array(N),     // 0 = low ground, 1 = high ground (plateaus)
    blocked:new Int32Array(N),    // id of the building/mine on this tile, 0 if free
    explored:new Uint8Array(N),   // fog of war: has the player ever seen this tile?
    visible:new Uint8Array(N),    // fog of war: does the player see it right now?
    place:null,                   // building placement in progress
    regrow:[],                    // cut trees waiting to grow back: { x, y, at }
    fogAt:0, aiAt:0, endAt:0,     // timers for things that don't run every frame
    stats:{ killed:0, lost:0, creeps:0 },
    camps:[],                     // creep camps (section 7b)
    items:[],                     // items lying on the ground: { id, key, x, y }
    corpses:[],                   // fallen units: { x, y, type, owner, facing, t }
    map:settings.map,             // which map preset (see MAPS)
    size:settings.size,           // Small / Normal / Large
    difficulty:settings.difficulty,
  };
  for (const o of G.opponents){
    if (!G.mission) G.aiDiff[o] = settings.aiDiff[AI_OWNERS.indexOf(o)] || settings.difficulty;
    G.ai[o] = { waveSize:4, nextWave:diffOf(o).firstWave + (o === ENEMY ? 0 : 30 * AI_OWNERS.indexOf(o)) };   // staggered first attacks
    G.players[o].gold += diffOf(o).bonusGold;
  }
  AI = G.ai[ENEMY];                                        // the first AI's plans (kept under the old name)
  selection = [];

  seatTeams();
  generateMap((Math.random() * 1e9) | 0);
  addPlateaus();                                         // high ground
  // Every tree holds lumber, on every kind of map (the hand-made maps return early
  // from generateMap, so they never reached the line that used to do this).
  for (let i = 0; i < G.terrain.length; i++) G.wood[i] = G.terrain[i] === T_TREE ? TREE_WOOD : 0;
  // Generated skirmish maps get two mercenary camps, equally far from the bases.
  { const M = MAPS[G.map] || {};
    if (!M.layout && !M.arena && !M.prison && !M.chapel && !M.valley && !M.fords && !M.fortress && !M.blank && !M.user)
      for (const [fx, fy] of quadMap() ? [[.5, .36], [.5, .64]] : [[.18, .82], [.82, .18]]) placeMercNear(fx * MAP_W, fy * MAP_H); }

  // Each side starts with a finished town hall, workers and one soldier, in its corner.
  for (const o of sidesOf()){ const [bx, by] = baseCorner(o); setupBase(o, bx, by); }

  if (MAPS[G.map] && MAPS[G.map].user && USER_MAP){
    for (const c of USER_MAP.camps || []) makeCamp(c.tier, { x:c.x, y:c.y }, c.units);              // the camps you placed
    G.tech = (USER_MAP.rules && USER_MAP.rules.tech) || 0; G.banned = (USER_MAP.rules && USER_MAP.rules.off) || [];   // the map's rules
  }
  else spawnCamps();
  resetTerrainCache();
  updateFog();
  const hall = G.buildings[0];
  const c = centerOf(hall);
  centerOn(c.x, c.y);
}

// Which corner each side starts in: you top-left, the first AI opposite you,
// the others in the remaining corners.
function baseCorner(o){
  if (G.corners && G.corners[o]) return G.corners[o];
  return o === PLAYER ? [9, 9] : o === ENEMY ? [MAP_W - 12, MAP_H - 12] : o === 3 ? [MAP_W - 12, 9] : [9, MAP_H - 12];
}
// Teams and corners. Seat i (0 = you, then the opponents) takes settings.teams[i].
// On 4-corner maps teammates get neighbouring corners: your team along the top.
function seatTeams(){
  const seats = sidesOf();
  G.teams = {};
  seats.forEach((o, i) => { G.teams[o] = settings.teams[i] || i + 1; });
  G.corners = null;
  if (!quadMap()) return;
  const order = [...seats].sort((a, b) => (G.teams[a] === G.teams[PLAYER] ? 0 : 1) - (G.teams[b] === G.teams[PLAYER] ? 0 : 1) || G.teams[a] - G.teams[b]);
  const spots = [[9, 9], [MAP_W - 12, 9], [9, MAP_H - 12], [MAP_W - 12, MAP_H - 12]];
  G.corners = {};
  order.forEach((o, i) => { G.corners[o] = spots[i]; });
}
const quadMap = () => G.opponents.length > 1;             // 3-4 players: mirror the map both ways

function setupBase(owner, tx, ty){
  const hall = placeBuilding('townhall', owner, tx, ty, true);
  const larva = owner === PLAYER && kingdomLarvaStart();
  const types = larva ? Array(8).fill('recruit') : ['worker','worker','worker','footman'];
  if (larva) G.players[owner].gold += KINGDOM_START_GOLD;          // the orcs' first workers are free; yours are promoted
  for (const t of types){
    const spot = nearestFreeTile(hall.tx + 1, hall.ty + hall.size + (owner === PLAYER ? 1 : -5));
    if (spot) spawnUnit(t, owner, (spot.x + .5) * TILE, (spot.y + .5) * TILE);
  }
}

// LESSON: Procedural generation = random shapes + hard rules that guarantee
// a playable result. Here: random lakes and forests, then the top-left half
// is MIRRORED onto the bottom-right half, so both players get the same
// terrain. Bases, mines and roads are then placed as mirrored pairs too.
function generateMap(seed){
  rand = mulberry32(seed);
  const t = G.terrain;
  t.fill(T_GRASS);
  // LESSON: A hand-planned map. Instead of random blobs, the prison map is
  // solid forest with clearings carved out and joined by narrow paths. The
  // paths decide the order you visit things in: start, first cage, the
  // picket, second cage, and only then the Jailer's camp.
  if (MAPS[G.map] && MAPS[G.map].blank){           // the editor's blank canvas: a meadow with a forest edge
    t.fill(T_GRASS);
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) t[idx(x, y)] = T_TREE;
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].user && USER_MAP){ // a map made in the editor
    b64into(USER_MAP.terrain, t); b64into(USER_MAP.height, G.height);
    G.corners = {}; sidesOf().forEach((o, k) => { const st = USER_MAP.starts[k + 1]; if (st) G.corners[o] = st; });
    for (const [x, y] of USER_MAP.mines || []) placeMine(x, y);
    G.mercs = []; for (const [x, y] of USER_MAP.mercs || []) placeMerc(x, y);
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].layout){          // one of the hand-made layouts (MAP_LAYOUTS)
    const L = MAP_LAYOUTS[G.map];
    t.fill(L.fill === 'forest' ? T_TREE : T_GRASS);
    const disk = (cx, cy, r, type, j = 1) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) if (inBounds(x, y) && Math.hypot(x + .5 - cx, y + .5 - cy) <= r + (rand() - .5) * j) t[idx(x, y)] = type; };
    const line = (pts, r, type) => { for (let i = 0; i < pts.length - 1; i++){ const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
      for (let k = 0; k <= n; k++){ const f = k / n; disk(x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, r, type, .5); } } };
    const corners = Array.isArray(L.corners) ? { [PLAYER]:L.corners[0], [ENEMY]:L.corners[1] } : L.corners;
    const keepClear = [...(L.clearings || []), ...(L.lakes || []).map(([x, y, r]) => [x, y, r + 2]), ...(L.mines || []).map(([x, y]) => [x + 1.5, y + 1.5, 5]),
                       ...Object.values(corners).map(([x, y]) => [x + 1.5, y + 1.5, 9]), ...(L.gaps || []).map(([x, y, r]) => [x, y, r + 2])];
    const roadPts = (L.roads || []).flat();
    for (let k = 0; k < (L.woods || 0); k++){     // random woods, kept off everything that matters
      const x = 3 + rand() * (MAP_W - 6), y = 3 + rand() * (MAP_H - 6);
      if (keepClear.some(([cx, cy, r]) => Math.hypot(x - cx, y - cy) < r + 2) || roadPts.some(([rx, ry]) => Math.hypot(x - rx, y - ry) < 4)) continue;
      disk(x, y, 1 + rand() * 2.4, T_TREE);
    }
    for (const R of L.ridges || []) line(R.pts, R.r, T_TREE);          // forest ridges...
    for (const [x, y, r] of L.gaps || []) disk(x, y, r, T_GRASS);       // ...with gaps to pass through
    for (const [x, y, r] of L.clearings || []) disk(x, y, r, T_GRASS);
    for (const [x, y, r] of L.lakes || []) disk(x, y, r, T_WATER);
    for (const Rv of L.rivers || []){ line(Rv.pts, Rv.w, T_WATER); for (const [x, y] of Rv.fords || []) disk(x, y, 3, T_DIRT, .4); }
    for (const [x, y, r] of L.dirtPatches || []) disk(x, y, r, T_DIRT);
    for (const [x, y, r] of L.gaps || []) for (let yy = Math.floor(y - r); yy <= y + r; yy++) for (let xx = Math.floor(x - r); xx <= x + r; xx++)
      if (inBounds(xx, yy) && Math.hypot(xx + .5 - x, yy + .5 - y) <= r && t[idx(xx, yy)] === T_TREE) t[idx(xx, yy)] = T_GRASS;   // keep every pass open
    for (const road of L.roads || []) line(road, L.roadWidth || .9, T_DIRT);
    for (const W of L.walls || []){                // stone walls two tiles thick, with gates
      const [x0, y0, x1, y1] = W.rect;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
        if (x > x0 + 1 && x < x1 - 1 && y > y0 + 1 && y < y1 - 1){ if (t[idx(x, y)] === T_TREE || t[idx(x, y)] === T_WATER) t[idx(x, y)] = T_GRASS; continue; }
        t[idx(x, y)] = W.gates.some(([gx0, gy0, gx1, gy1]) => x >= gx0 && x <= gx1 && y >= gy0 && y <= gy1) ? T_DIRT : T_ROCK;
      }
    }
    if (L.edge !== false) for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) t[idx(x, y)] = T_TREE;
    G.corners = { ...(G.corners || {}), ...corners };
    for (const [x, y] of L.mines || []) placeMine(x, y);
    return;
  }
  // ----- More hand-made mission maps -----
  if (MAPS[G.map] && MAPS[G.map].valley){          // Escort: a winding valley between forested hills
    const V = VALLEY; t.fill(T_TREE);
    const disk = (cx, cy, r, type) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) if (inBounds(x, y) && x > 1 && y > 1 && x < MAP_W - 2 && y < MAP_H - 2 && Math.hypot(x + .5 - cx, y + .5 - cy) <= r + (rand() - .5) * .8) t[idx(x, y)] = type; };
    for (let x = 2; x < MAP_W - 2; x++){
      const cy = V.cy(x), half = V.half + Math.sin(x * .7) * .8;
      for (let y = 2; y < MAP_H - 2; y++){ const d = Math.abs(y + .5 - cy); if (d < half) t[idx(x, y)] = d < 1.2 ? T_DIRT : T_GRASS; }
    }
    V.ambush.forEach(([ax, side]) => {             // a side clearing in the hills, joined to the valley
      const cy = V.cy(ax), oy = cy + side * 9;
      disk(ax, oy, 3.5, T_GRASS); for (let k = 0; k <= 8; k++) disk(ax + (k % 2), cy + side * k, 1.6, T_GRASS);
    });
    disk(5, V.cy(5), 6, T_GRASS); disk(MAP_W - 7, V.cy(MAP_W - 7), 7, T_GRASS);          // start and outpost clearings
    for (let x = 3; x < MAP_W - 3; x++) t[idx(x, Math.round(V.cy(x)))] = T_DIRT;        // the road itself
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].fords){           // Hold the Ford: a river north-south, two fords, your base on the west bank
    t.fill(T_GRASS);
    const disk = (cx, cy, r, type) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) if (inBounds(x, y) && Math.hypot(x + .5 - cx, y + .5 - cy) <= r + (rand() - .5)) t[idx(x, y)] = type; };
    const R = FORDS_MAP, near = (x, y, p, r) => Math.hypot(x - p[0], y - p[1]) < r;
    for (let k = 0; k < 36; k++){                   // woods, kept off the base, the fords and the roads
      const x = 3 + rand() * (MAP_W - 6), y = 3 + rand() * (MAP_H - 6);
      if (near(x, y, R.base, 13) || near(x, y, R.stage, 8) || R.camps.some(c => near(x, y, c, 10)) || R.fords.some(f => near(x, y, [R.riverX(f), f], 7)) || Math.abs(x - R.riverX(y)) < 5) continue;
      disk(x, y, 1 + rand() * 2.2, T_TREE);
    }
    for (let y = 0; y < MAP_H; y++){
      const cx = R.riverX(y);
      for (let x = 0; x < MAP_W; x++){
        if (Math.abs(x + .5 - cx) < 2.7) t[idx(x, y)] = R.fords.some(f => Math.abs(y - f) < 2.5) ? T_DIRT : T_WATER;
        if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) t[idx(x, y)] = T_TREE;
      }
    }
    const road = (a, b) => { const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 2); for (let k = 0; k <= n; k++){ const f = k / n; disk(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, .9, T_DIRT); } };
    for (const f of R.fords){ road([R.base[0] + 3, R.base[1]], [R.riverX(f) - 3, f]); road([R.riverX(f) + 3, f], R.stage); }
    for (const c of R.camps){ disk(c[0], c[1], 7.5, T_GRASS); road(c, R.stage); }    // two enemy camps on the east bank
    road([R.riverX(R.fords[0]) + 3, R.fords[0]], R.camps[0]); road([R.riverX(R.fords[1]) + 3, R.fords[1]], R.camps[1]);
    G.corners = { [PLAYER]:[R.base[0] - 2, R.base[1] - 1], [ENEMY]:[R.stage[0], R.stage[1]] };
    placeMine(R.base[0] - 7, R.base[1] + 5); placeMine(6, 8);
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].fortress){        // Siege: the enemy base inside stone walls with one gate
    t.fill(T_GRASS);
    const F = FORTRESS_MAP, [x0, y0, x1, y1] = F.walls;
    const disk = (cx, cy, r, type) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) if (inBounds(x, y) && Math.hypot(x + .5 - cx, y + .5 - cy) <= r + (rand() - .5)) t[idx(x, y)] = type; };
    for (let k = 0; k < 40; k++){
      const x = 3 + rand() * (MAP_W - 6), y = 3 + rand() * (MAP_H - 6);
      if ((x > x0 - 6 && y < y1 + 6) || Math.hypot(x - F.base[0], y - F.base[1]) < 14 || Math.abs((x - F.base[0]) + (y - F.base[1])) < 6 && x < x0) continue;   // not by the fortress, base or approach
      disk(x, y, 1 + rand() * 2.4, T_TREE);
    }
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++){
      const onWall = x >= x0 && x <= x1 && y >= y0 && y <= y1 && (x <= x0 + 1 || x >= x1 - 1 || y <= y0 + 1 || y >= y1 - 1);
      const inGate = y >= y1 - 1 && y <= y1 && x >= F.gate[0] && x <= F.gate[1];   // only the wall rows
      if (x > x0 + 1 && x < x1 - 1 && y > y0 + 1 && y < y1 - 1) t[idx(x, y)] = T_GRASS;     // clear inside the walls
      if (onWall && !inGate) t[idx(x, y)] = T_ROCK;
      if (inGate) t[idx(x, y)] = T_DIRT;
      if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) t[idx(x, y)] = T_TREE;
    }
    for (let k = 0; k <= 40; k++){ const f = k / 40; disk(F.base[0] + 4 + ((F.gate[0] + 1.5) - F.base[0] - 4) * f, F.base[1] - 3 + ((y1 + 2) - F.base[1] + 3) * f, 1, T_DIRT); }   // the road to the gate
    G.corners = { [PLAYER]:F.base, [ENEMY]:F.keep };
    placeMine(F.base[0] - 6, F.base[1] - 7); placeMine(x1 - 6, y0 + 3); placeMine(36, 42);
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].chapel){          // meadows and woods, a road from the town past the patrols
    const C = CHAPEL_MAP, near = (x, y, p, r) => Math.hypot(x - p[0], y - p[1]) < r;
    const disk = (cx, cy, r, type) => { for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) if (inBounds(x, y) && Math.hypot(x + .5 - cx, y + .5 - cy) <= r + (rand() - .5)) t[idx(x, y)] = type; };
    for (let k = 0; k < 40; k++){                  // scattered woods, kept off the town, road and clearings
      const x = 3 + rand() * (MAP_W - 6), y = 3 + rand() * (MAP_H - 6);
      if (near(x, y, C.town, 13) || C.patrols.some(p => near(x, y, p, 6)) || C.camps.some(p => near(x, y, p, 4)) || C.road.some(p => near(x, y, p, 5))) continue;
      disk(x, y, 1 + rand() * 2.2, T_TREE);
    }
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) t[idx(x, y)] = T_TREE;   // a forest edge all round
    disk(...C.pond, 2.4, T_WATER);
    const pts = [C.town, ...C.road];
    for (let i = 0; i < pts.length - 1; i++){        // the road
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
      for (let k = 0; k <= n; k++){ const f = k / n; disk(x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, 1.1, T_DIRT); }
    }
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].prison){
    t.fill(T_TREE);
    const P = PRISON_MAP;
    const open = (cx, cy, r, dirtR) => {
      for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++) for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++){
        if (x < 2 || y < 2 || x > MAP_W - 3 || y > MAP_H - 3) continue;
        const d = Math.hypot(x + .5 - cx, y + .5 - cy);
        if (d <= r + (rand() - .5) * 1.4) t[idx(x, y)] = d <= dirtR ? T_DIRT : T_GRASS;
      }
    };
    const path = pts => {                          // a winding path about 3 tiles wide, with a dirt track down the middle
      for (let i = 0; i < pts.length - 1; i++){
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2);
        for (let k = 0; k <= n; k++){
          const f = k / n, wig = Math.sin(f * Math.PI * 3 + i) * 1.2;
          const x = x0 + (x1 - x0) * f + wig * (y1 - y0) / (Math.hypot(x1 - x0, y1 - y0) || 1), y = y0 + (y1 - y0) * f - wig * (x1 - x0) / (Math.hypot(x1 - x0, y1 - y0) || 1);
          open(x, y, 1.6, .7);
        }
      }
    };
    open(...P.start, 6, 0); open(...P.a, 6, 0); open(...P.mid, 5, 0); open(...P.b, 6, 0); open(...P.camp, 7.5, 3.5);   // grassy clearings; a dirt yard at the Jailer's camp
    path([P.start, [11, 26], P.a]); path([P.a, [24, 42], P.mid]); path([P.mid, [42, 22], P.b]); path([P.b, [57, 32], P.camp]);
    return;
  }
  if (MAPS[G.map] && MAPS[G.map].arena){           // the arena: a round sand floor, stone walls and stands all around
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) t[idx(x, y)] = arenaDist(x, y) < ARENA_R ? T_DIRT : T_ROCK;
    return;
  }
  const mirror = (x, y) => [MAP_W - 1 - x, MAP_H - 1 - y];
  const quad = quadMap();
  const set = (x, y, type) => {                    // set a tile AND its mirror twins (3 of them on 4-player maps)
    if (!inBounds(x, y)) return;
    const [mx, my] = mirror(x, y);
    t[idx(x, y)] = type; t[idx(mx, my)] = type;
    if (quad){ t[idx(mx, y)] = type; t[idx(x, my)] = type; }
  };

  // Paint a rough circle of one terrain type.
  const blob = (cx, cy, r, type, both) => {
    for (let y = cy - r; y <= cy + r; y++)
      for (let x = cx - r; x <= cx + r; x++)
        if (inBounds(x, y) && Math.hypot(x - cx, y - cy) <= r - rand() * 1.2){
          if (both) set(x, y, type); else t[idx(x, y)] = type;
        }
  };
  // A "random walk" of blobs makes natural-looking, irregular shapes.
  const walkBlobs = (type, count, minR, maxR) => {
    for (let i = 0; i < count; i++){
      let cx = Math.floor(rand() * MAP_W), cy = Math.floor(rand() * MAP_H);
      const steps = 3 + Math.floor(rand() * 6);
      for (let st = 0; st < steps; st++){
        blob(cx, cy, minR + Math.floor(rand() * (maxR - minR + 1)), type, false);
        cx += Math.floor(rand() * 7) - 3;
        cy += Math.floor(rand() * 7) - 3;
      }
    }
  };
  const clear = (cx, cy, r) => {
    for (let y = cy - r; y <= cy + r; y++)
      for (let x = cx - r; x <= cx + r; x++)
        if (inBounds(x, y) && Math.hypot(x - cx, y - cy) <= r) set(x, y, T_GRASS);
  };
  // A winding 3-tile-wide dirt road from A to B (mirrored as well).
  const road = (ax, ay, bx, by) => {
    let x = ax, y = ay;
    while (x !== bx || y !== by){
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) set(x + dx, y + dy, T_DIRT);
      const sx = Math.sign(bx - x), sy = Math.sign(by - y), r = rand();
      if (r < 0.5){ x += sx; y += sy; } else if (r < 0.75) x += sx; else y += sy;
    }
  };

  const M = MAPS[G.map] || MAPS.vale;
  walkBlobs(T_DIRT, M.dirt, 1, 3);
  walkBlobs(T_WATER, ...M.water);
  walkBlobs(T_TREE, ...M.trees);
  // Mirror the top-left half onto the bottom-right half (2 players), or the
  // top-left quarter onto the other three quarters (3-4 players).
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++){
      if (quad){ const sx = x < MAP_W / 2 ? x : MAP_W - 1 - x, sy = y < MAP_H / 2 ? y : MAP_H - 1 - y; t[idx(x, y)] = t[idx(sx, sy)]; }
      else if (x + y > MAP_W - 1 || (x + y === MAP_W - 1 && x > y)){ const [mx, my] = mirror(x, y); t[idx(x, y)] = t[idx(mx, my)]; }   // the diagonal too
    }

  // Player-side layout (each one is mirrored for the enemy automatically).
  // Positions were designed for a 128-tile map; k scales them to this size.
  const k = MAP_W / 128, S = v => Math.round(v * k), mid = MAP_W / 2;
  const homeMine = [17, 4];
  // On 4-player maps each corner only owns the expansions in its quarter.
  const expansions = quad ? [[8, S(40)], [S(40), 8], [S(30), S(30)]] : [[8, S(40)], [S(40), 8], [S(30), S(30)], [10, S(76)], [S(76), 10]];
  if (MAP_W >= 160) expansions.push([S(58), S(22)], [S(22), S(58)]);   // Large maps get two more
  clear(11, 11, 10);                                           // home base
  for (const [mx, my] of expansions) clear(mx + 1, my + 1, 5);
  clear(mid, mid, 6);                                          // middle of the map
  blob(4, 22, 3, T_TREE, true); blob(3, 17, 2, T_TREE, true); blob(22, 3, 2, T_TREE, true);   // lumber near home
  road(12, 12, mid - 1, mid - 1);                              // base to centre (mirror: centre to enemy)
  road(12, 12, 9, S(40)); road(12, 12, S(40), 9);              // base to the nearest expansions
  if (M.extraRoads){ road(12, 12, S(31), S(31)); road(9, S(40), 11, S(77)); road(S(40), 9, S(77), 11); }   // Deep Woods: paths through the forest
  if (M.river && quad){
    // 4 players: a cross-shaped river through the middle, fords on every arm and in the centre.
    for (let i = 0; i < MAP_W; i++){
      const w = Math.round(Math.sin(i * .09) * 2);
      for (let d = -2; d <= 1; d++){ set(mid + d + w, i, T_WATER); set(i, mid + d + w, T_WATER); }
    }
    for (const [fx, fy] of [[mid, S(30)], [S(30), mid]]) blob(fx, fy, 4, T_DIRT, true);
    clear(mid, mid, 4); road(12, 12, mid - 1, mid - 1);
  } else if (M.river){
    // A river along the diagonal between the two bases, with three fords.
    for (let x = 0; x < MAP_W; x++){
      const cy = MAP_W - 1 - x + Math.round(Math.sin(x * .09) * 2), w = 2;
      for (let d = -w; d <= w; d++) set(x, cy + d, T_WATER);
    }
    for (const [fx, fy] of [[mid - 1, mid], [S(30), MAP_W - 1 - S(30)]]) blob(fx, fy, 4, T_DIRT, true);   // fords (each has a mirror twin)
    clear(mid, mid, 4); road(12, 12, mid - 1, mid - 1);
  }

  for (let i = 0; i < t.length; i++) G.wood[i] = t[i] === T_TREE ? TREE_WOOD : 0;

  // Gold mines (3x3): mirror of a mine's top-left corner is MAP - 3 - x.
  for (const [mx, my] of [homeMine, ...expansions]){
    placeMine(mx, my);
    placeMine(MAP_W - 3 - mx, MAP_H - 3 - my);
    if (quad){ placeMine(MAP_W - 3 - mx, my); placeMine(mx, MAP_H - 3 - my); }   // the other two corners
  }
  placeMine(mid - 2, mid - 2);                                 // one rich mine in the very middle
}


/* =============================================================================
   4. ENTITIES
   "Entity" = anything that exists in the world: units, buildings, mines.
   They are plain JavaScript objects. The "kind" field says which one it is.
   ========================================================================== */

// A tile is walkable if it's grass or dirt AND nothing is built on it.
function isWalkable(x, y){
  if (!inBounds(x, y)) return false;
  const i = idx(x, y), t = G.terrain[i];
  return (t === T_GRASS || t === T_DIRT || t === T_SAND || t === T_SWAMP) && G.blocked[i] === 0;
}
function hasOpenNeighbor(x, y){
  return DIRS.some(([dx, dy]) => isWalkable(x + dx, y + dy));
}

function spawnUnit(type, owner, x, y){
  const T = UNIT_TYPES[type];
  const u = {
    id:G.nextId++, kind:'unit', type, owner, x, y,
    hp:T.hp, maxHp:T.hp, damage:T.damage, armor:T.armor,
    order:null,          // what the unit is currently doing (see section 6)
    path:[], pathFor:null,
    cd:0,                // attack cooldown timer
    carry:null,          // { res:'gold'|'wood', amount }
    facing: owner === PLAYER ? 1 : -1,
    anim:Math.random() * 5, moving:false, working:false,
    hidden:false,        // true while a worker is inside a gold mine
    dead:false, level:1, xp:0, buffUntil:0, scanAt:0,
    ready:{ warcry:0, slam:0, ult:0, heal:0, slow:0, curse:0, inner:0, holylight:0, shield:0, mass:0, concoction:0, volley:0, hound:0, pack:0 },
    slowUntil:0, curseUntil:0, innerUntil:0,     // spell effects on this unit
    skills:Object.fromEntries((SKILLS_OF[kitOf(type, owner)] || SKILL_ORDER).map(k => [k, 0])), skillPoints:UNIT_TYPES[type].hero ? 1 : 0,   // hero skills
    buffMult:1, auraArmor:0, ultUntil:0,
    items:[],                             // hero inventory (item keys)   // time when each ability can be used again
    auto:true, castAt:0,                  // autocast on/off, and when to check next
  };
  for (const k in G.players[owner].up){                 // health research counts for new units too
    const HP = RESEARCH[k] && RESEARCH[k].hp;
    if (HP && HP.type === type){ u.maxHp += HP.amount; u.hp += HP.amount; }
    const pct = RESEARCH[k] && RESEARCH[k].hpPct;             // Thick hides: a share of base health
    if (pct && owner !== CREEPS){ const add = Math.round(UNIT_TYPES[type].hp * pct); u.maxHp += add; u.hp += add; }
  }
  if (G.mission && owner === ENEMY && G.enemyMult && G.enemyMult !== 1){ u.maxHp = Math.round(u.maxHp * G.enemyMult); u.hp = u.maxHp; }   // campaign difficulty
  G.units.push(u);
  return u;
}

// Write an id into the "blocked" grid for every tile an entity covers.
function markBlocked(e, value){
  for (let y = e.ty; y < e.ty + e.size; y++)
    for (let x = e.tx; x < e.tx + e.size; x++) G.blocked[idx(x, y)] = value;
}

function placeMine(tx, ty){
  // Make sure the ground under and around the mine is clear.
  for (let y = ty - 1; y <= ty + 3; y++)
    for (let x = tx - 1; x <= tx + 3; x++)
      if (inBounds(x, y) && G.terrain[idx(x, y)] !== T_DIRT) G.terrain[idx(x, y)] = T_GRASS;
  const m = { id:G.nextId++, kind:'mine', owner:NEUTRAL, tx, ty, size:3, gold:MINE_GOLD, dead:false };
  markBlocked(m, m.id);
  G.mines.push(m);
  return m;
}

function placeBuilding(type, owner, tx, ty, complete){
  const BT = BUILDING_TYPES[type];
  const b = {
    id:G.nextId++, kind:'building', type, owner, tx, ty, size:BT.size,
    maxHp:BT.hp, hp: complete ? BT.hp : Math.round(BT.hp * 0.1), armor:BT.armor,
    built: complete ? 1 : 0,     // construction progress 0..1
    queue:[],                    // units being trained
    rally:null, dead:false,
    level:1, incomeT:0,          // farm upgrade level, and its gold timer
    placedAt:G.time,
  };
  // Masonry research makes every new building tougher too.
  for (const k in G.players[owner].up){
    const R = RESEARCH[k];
    if (!R || !R.bhp) continue;
    const add = Math.round(BT.hp * R.bhp);
    b.maxHp += add; b.hp = complete ? b.maxHp : Math.round(b.maxHp * 0.1); b.armor += R.barmor || 0;
  }
  markBlocked(b, b.id);
  G.buildings.push(b);
  // Anyone standing where the building goes gets moved out of the way.
  for (const u of G.units){
    if (u.hidden) continue;
    const ux = tileOf(u.x), uy = tileOf(u.y);
    if (ux >= tx && ux < tx + b.size && uy >= ty && uy < ty + b.size){
      const s = nearestFreeTile(ux, uy);
      if (s){ u.x = (s.x + .5) * TILE; u.y = (s.y + .5) * TILE; u.pathFor = null; }
    }
  }
  return b;
}

// Can a building of this type go at (tx, ty)? "margin" demands empty tiles
// around it too (the AI uses 1 so it never walls itself in).
function canPlace(type, tx, ty, owner, margin){
  const s = BUILDING_TYPES[type].size;
  for (let y = ty - margin; y < ty + s + margin; y++)
    for (let x = tx - margin; x < tx + s + margin; x++){
      // The free ring around a building keeps paths open; beyond the map edge
      // nobody walks anyway, so buildings may stand right against the edge.
      if (!inBounds(x, y)){ if (x >= tx && x < tx + s && y >= ty && y < ty + s) return false; continue; }
      if (!isWalkable(x, y)) return false;
      if (owner === PLAYER && !G.explored[idx(x, y)]) return false;
    }
  // Keep buildings away from gold mines so workers can get in and out.
  for (const m of G.mines){
    if (tx < m.tx + m.size + 1 && tx + s > m.tx - 1 && ty < m.ty + m.size + 1 && ty + s > m.ty - 1) return false;
  }
  return true;
}

// Breadth-first search outward from a tile until we hit a walkable one.
// LESSON: BFS explores in "rings" of growing distance, so the first match
// it finds is the closest one.
function nearestFreeTile(tx, ty){
  tx = clamp(tx, 0, MAP_W - 1); ty = clamp(ty, 0, MAP_H - 1);
  const seen = new Uint8Array(MAP_W * MAP_H);
  const q = [[tx, ty]]; seen[idx(tx, ty)] = 1;
  for (let h = 0; h < q.length; h++){
    const [x, y] = q[h];
    if (isWalkable(x, y)) return { x, y };
    for (let d = 0; d < 4; d++){
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (inBounds(nx, ny) && !seen[idx(nx, ny)]){ seen[idx(nx, ny)] = 1; q.push([nx, ny]); }
    }
  }
  return null;
}

function kill(e, attacker){
  if (e.dead) return;
  e.dead = true; e.hp = 0;
  if (e.type === 'cage' && e.prisoners) freePrisoners(e);            // mission 5: prisoners join you
  if (G.mission && e.kind === 'building' && e.type === 'farm' && hostile(PLAYER, e.owner)) G.mission.farmsBurned = (G.mission.farmsBurned || 0) + 1;
  { const c = centerOf(e); sfxAt(e.kind === 'building' ? 'collapse' : 'die', c.x, c.y, e.kind === 'building' ? 1 : .6); }
  if (e.kind === 'building'){
    markBlocked(e, 0);
    G.effects.push({ type:'ruin', tx:e.tx, ty:e.ty, size:e.size, life:60, max:60 });
  }
  // Fallen units leave a body that decays to bones (see drawCorpse).
  if (e.kind === 'unit' && !e.hidden){
    G.corpses.push({ x:e.x, y:e.y, type:e.type, owner:e.owner, facing:e.facing, t:G.time });
    if (G.corpses.length > 150) G.corpses.shift();
  }
  if (isAI(e.owner) && attacker && attacker.owner === PLAYER) G.stats.killed++;
  if (e.owner === PLAYER){
    if (e.kind === 'unit') G.stats.lost++; else G.stats.bldLost = (G.stats.bldLost || 0) + 1;
    if (e.kind === 'unit' && e.type === 'worker') G.stats.workersLost = (G.stats.workersLost || 0) + 1;
    if (e.kind === 'unit' && UNIT_TYPES[e.type].hero) G.stats.heroLost = (G.stats.heroLost || 0) + 1;
  }
  if (e.owner === CREEPS) creepKilled(e, attacker);
  if (e.items) e.items.forEach((k, i) => dropItem(k, e.x + (i - 1.5) * 10, e.y + 6));   // a fallen hero drops its items
  // Experience, Warcraft 3 style: when a unit dies, every enemy hero within
  // 10 tiles shares the experience, no matter who landed the killing blow.
  // (Buildings give none.)
  if (e.kind === 'unit') shareXP(e);
  const c = centerOf(e);
  G.effects.push({ type:'ring', x:c.x, y:c.y, color:'#8a7f70', life:.5, max:.5, r:e.kind === 'unit' ? 14 : 40 });
}

function removeMine(m){
  m.dead = true;
  markBlocked(m, 0);
  if (m.owner === NEUTRAL && isVisibleTile(m.tx + 1, m.ty + 1)) toast('A gold mine has collapsed');
}

function fellTree(x, y){
  const i = idx(x, y);
  G.terrain[i] = T_GRASS; G.stump[i] = 1; G.wood[i] = 0;
  terrainChanged(x, y);    // redraw just the part of the map this tile is in
  G.regrow.push({ x, y, at:G.time + TREE_REGROW });
}

// LESSON: For "something happens later", store WHEN it should happen and
// check the list now and then. No timers or callbacks needed.
function regrowTrees(){
  G.regrow = G.regrow.filter(r => {
    if (G.time < r.at) return true;                     // not yet: keep waiting
    const i = idx(r.x, r.y);
    if (G.blocked[i] || G.terrain[i] !== T_GRASS) return false;   // built over: forget it
    if (G.units.some(u => !u.hidden && tileOf(u.x) === r.x && tileOf(u.y) === r.y)){
      r.at = G.time + 10; return true;                  // someone is standing there: try later
    }
    G.terrain[i] = T_TREE; G.wood[i] = TREE_WOOD; G.stump[i] = 0;
    terrainChanged(r.x, r.y);
    return false;
  });
}

// The outer two tiles of every map are a border forest: like a wall, it can't be
// chopped, and workers never pick those trees when looking for lumber.
const isBorderTile = (x, y) => x < 2 || y < 2 || x >= MAP_W - 2 || y >= MAP_H - 2;
function nearestTree(cx, cy, maxR){
  for (let r = 0; r <= maxR; r++){
    let best = null, bd = 1e9;
    for (let y = cy - r; y <= cy + r; y++)
      for (let x = cx - r; x <= cx + r; x++){
        if (Math.max(Math.abs(x - cx), Math.abs(y - cy)) !== r) continue;   // ring only
        if (!inBounds(x, y) || isBorderTile(x, y) || G.terrain[idx(x, y)] !== T_TREE || !hasOpenNeighbor(x, y)) continue;
        const d = Math.hypot(x - cx, y - cy);
        if (d < bd){ bd = d; best = { x, y }; }
      }
    if (best) return best;
  }
  return null;
}
// Among reachable trees within 14 tiles of the old one, choose the one with
// the shortest walk to the drop-off building.
function treeNearDropoff(drop, ox, oy){
  const c = centerOf(drop), dx = c.x / TILE, dy = c.y / TILE;
  let best = null, bs = Infinity;
  for (let y = oy - 14; y <= oy + 14; y++)
    for (let x = ox - 14; x <= ox + 14; x++){
      if (!inBounds(x, y) || G.terrain[idx(x, y)] !== T_TREE || !hasOpenNeighbor(x, y)) continue;
      const sc = Math.hypot(x + .5 - dx, y + .5 - dy) + 0.25 * Math.hypot(x - ox, y - oy);
      if (sc < bs){ bs = sc; best = { x, y }; }
    }
  return best;
}
// Workers picking a mine on their own skip "unsafe" ones: mines with living
// creatures camped nearby (you can still send them there yourself).
function mineSafe(m){
  const cx = m.tx + 1.5, cy = m.ty + 1.5;
  return !G.camps.some(c => c.alive && Math.hypot(c.tx - cx, c.ty - cy) < 9);
}
function nearestMine(u, maxTiles){
  let best = null, bd = maxTiles;
  for (const m of G.mines){ if (m.dead || !mineSafe(m)) continue; const d = distTo(u, m); if (d < bd){ bd = d; best = m; } }
  return best;
}
function nearestDropoff(u, res){
  let best = null, bd = 1e9;
  for (const b of G.buildings){
    if (b.owner !== u.owner || b.built < 1) continue;
    const drop = BUILDING_TYPES[b.type].dropoff;    // true = everything, 'wood' = lumber only
    if (drop !== true && drop !== res) continue;
    const d = distTo(u, b); if (d < bd){ bd = d; best = b; }
  }
  return best;
}


/* =============================================================================
   5. PATHFINDING — the A* ("A-star") algorithm
   LESSON: A* finds the shortest route on a grid. It keeps a list of tiles to
   explore ("open list"), always picking the one with the lowest
       f = g + h
   where g = cost to get here so far, and h = a guess of the remaining
   distance (the "heuristic"). A good guess makes it search toward the goal
   instead of in every direction. A "priority queue" (min-heap) hands us the
   lowest-f tile quickly.
   ========================================================================== */

// The heap stores values and priorities in two typed arrays that are reused
// for every search. (An earlier version pushed a small [priority, value]
// array per step, which created lots of garbage and was ~10x slower.)
class MinHeap {
  constructor(cap = 8192){ this.p = new Float32Array(cap); this.v = new Int32Array(cap); this.n = 0; }
  get size(){ return this.n; }
  clear(){ this.n = 0; }
  push(value, priority){
    if (this.n === this.p.length){                       // out of room: double the arrays
      const p = new Float32Array(this.n * 2), v = new Int32Array(this.n * 2);
      p.set(this.p); v.set(this.v); this.p = p; this.v = v;
    }
    let i = this.n++;
    while (i > 0){                                       // bubble up while smaller than parent
      const par = (i - 1) >> 1;
      if (this.p[par] <= priority) break;
      this.p[i] = this.p[par]; this.v[i] = this.v[par]; i = par;
    }
    this.p[i] = priority; this.v[i] = value;
  }
  pop(){
    const top = this.v[0], n = --this.n;
    if (n > 0){
      const pr = this.p[n], va = this.v[n];
      let i = 0;
      for (;;){                                          // sink down while bigger than a child
        let c = 2 * i + 1;
        if (c >= n) break;
        if (c + 1 < n && this.p[c + 1] < this.p[c]) c++;
        if (this.p[c] >= pr) break;
        this.p[i] = this.p[c]; this.v[i] = this.v[c]; i = c;
      }
      this.p[i] = pr; this.v[i] = va;
    }
    return top;
  }
}
const PF_HEAP = new MinHeap();

// Find a path from tile (sx, sy) to a goal rectangle.
// adj = true means "stop next to the rectangle" (for buildings, trees, mines).
// Returns a list of tiles to walk through (not including the start).
// If the goal can't be reached, returns a path to the closest reachable tile.
let PF_G = new Float32Array(MAP_W * MAP_H), PF_FROM = new Int32Array(MAP_W * MAP_H), PF_CLOSED = new Uint8Array(MAP_W * MAP_H);
function findPath(sx, sy, rect, adj){
  // Reuse the same big arrays every call instead of allocating new ones.
  const g = PF_G.fill(Infinity), from = PF_FROM.fill(-1), closed = PF_CLOSED.fill(0);
  const stopAt = adj ? 1 : 0;

  const gap = (x, y) => [Math.max(rect.x0 - x, 0, x - rect.x1), Math.max(rect.y0 - y, 0, y - rect.y1)];
  // "Octile" distance: the true cost of moving on a grid with diagonals.
  const h = (x, y) => { const [dx, dy] = gap(x, y); return Math.max(dx, dy) + 0.4142 * Math.min(dx, dy); };
  const isGoal = (x, y) => { const [dx, dy] = gap(x, y); return Math.max(dx, dy) <= stopAt; };

  const start = idx(sx, sy);
  const heap = PF_HEAP; heap.clear();
  g[start] = 0; heap.push(start, h(sx, sy));
  let best = start, bestH = h(sx, sy), found = -1, iterations = 0;

  while (heap.size && iterations++ < 8000){        // cap the work so it can't freeze the game
    const cur = heap.pop();
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % MAP_W, cy = (cur / MAP_W) | 0;
    if (isGoal(cx, cy)){ found = cur; break; }
    const hh = h(cx, cy);
    if (hh < bestH){ bestH = hh; best = cur; }

    for (const [dx, dy] of DIRS){
      const nx = cx + dx, ny = cy + dy;
      if (!isWalkable(nx, ny)) continue;
      // No cutting corners diagonally past a wall or tree.
      if (dx && dy && (!isWalkable(cx + dx, cy) || !isWalkable(cx, cy + dy))) continue;
      const ni = idx(nx, ny);
      if (closed[ni]) continue;
      const ng = g[cur] + (dx && dy ? 1.4142 : 1);
      // LESSON: "Weighted A*": multiplying the guess h by a bit more than 1
      // makes the search charge toward the goal. Paths are at most slightly
      // longer than perfect, but far fewer tiles get explored on a big map.
      if (ng < g[ni]){ g[ni] = ng; from[ni] = cur; heap.push(ni, ng + h(nx, ny) * 1.3); }
    }
  }

  // Walk backwards from the end using "from" links, then reverse.
  let end = found >= 0 ? found : best;
  const path = [];
  while (end !== start && end >= 0){ path.push({ x:end % MAP_W, y:(end / MAP_W) | 0 }); end = from[end]; }
  return path.reverse();
}

// "nav" is a goal: { rect, adj }. We only recompute the path when the goal
// object changes. Returns true when the unit has reached the end of its path.
// LESSON: A path search on a big map can take a few milliseconds. If a whole
// army gets an order at once, doing every search in the same frame freezes
// the game. So each frame gets a small "path budget"; units that miss out
// just wait a frame or two before starting to walk.
let pathBudget = 6, pathMsUsed = 0;
// The nearest enemy building a unit can actually walk up to: search outward over
// walkable ground and return the first enemy building that borders it.
function reachableWall(u){
  const sx = clamp(tileOf(u.x), 0, MAP_W - 1), sy = clamp(tileOf(u.y), 0, MAP_H - 1), seen = new Uint8Array(MAP_W * MAP_H), q = [sx + sy * MAP_W];
  seen[q[0]] = 1;
  for (let qi = 0; qi < q.length && qi < 9000; qi++){
    const i = q[qi], x = i % MAP_W, y = (i / MAP_W) | 0;
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy; if (!inBounds(nx, ny)) continue;
      const j = nx + ny * MAP_W, id = G.blocked[j];
      if (id){ const b = G.buildings.find(b => b.id === id); if (b && isAlive(b) && isSide(b.owner) && hostile(u.owner, b.owner)) return b; }
      if (!seen[j] && isWalkable(nx, ny)){ seen[j] = 1; q.push(j); }
    }
  }
  return null;
}
function moveToward(u, nav, dt){
  if (u.pathFor !== nav){
    if (pathBudget <= 0 || pathMsUsed > 6) return false;   // at most 6 searches or ~6 ms per frame
    pathBudget--;
    const t0 = performance.now();
    u.pathFor = nav;
    u.path = findPath(tileOf(u.x), tileOf(u.y), nav.rect, nav.adj);
    pathMsUsed += performance.now() - t0;
  }
  return followPath(u, dt);
}

// Faction research that makes attacks faster (a multiplier on the cooldown).
function attackSpeedUp(u){
  const up = G.players[u.owner] && G.players[u.owner].up, T = UNIT_TYPES[u.type];
  if (!up) return 1;
  if (G.time < (u.ultUntil || 0) && isOrc(u.owner)) return 0.6;                 // Blood rage
  if (up.berserk && !T.ranged && u.type !== 'worker') return 0.9;
  if (up.marksman && isRangedInfantry(u.type)) return 0.75;
  return 1;
}

// Movement speed in tiles per second: base, plus items, minus Slow; zero while webbed.
function speedOf(u){
  if (G.time < (u.webUntil || 0)) return 0;
  if (u.mounted) return speedBase(u) * 1.6;                        // a mounted hero
  if (G.time < (u.sheepUntil || 0)) return 1.2;                           // a sheep wanders slowly
  return speedBase(u);
}
function speedBase(u){
  return UNIT_TYPES[u.type].speed * (1 + itemBonus(u, 'speed')) * (G.time < u.slowUntil ? 0.6 : 1)
       * (G.terrain[idx(clamp(tileOf(u.x), 0, MAP_W - 1), clamp(tileOf(u.y), 0, MAP_H - 1))] === T_SWAMP ? 0.6 : 1);   // wading through swamp
}

function followPath(u, dt){
  if (!u.path.length) return true;
  const n = u.path[0];
  if (!isWalkable(n.x, n.y)){ u.pathFor = null; u.path = []; return false; }  // something was built there: repath
  const tx = (n.x + .5) * TILE, ty = (n.y + .5) * TILE;
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  const step = speedOf(u) * TILE * dt;   // LESSON: speed * dt = frame-rate independent movement
  u.moving = true; u.anim += dt;
  if (Math.abs(dx) > 0.5) u.facing = dx < 0 ? -1 : 1;
  u.dir = dirOf(dx, dy);                       // 8-way direction for the Classic style
  if (d <= step){ u.x = tx; u.y = ty; u.path.shift(); return u.path.length === 0; }
  u.x += dx / d * step; u.y += dy / d * step;
  return false;
}


/* =============================================================================
   6. ORDERS
   An order is a small object that describes what a unit should do, e.g.
     { type:'move',   nav:{rect, adj} }
     { type:'attack', target }
     { type:'gather', res:'gold', mine, phase:'go'|'work'|'return' }
     { type:'build',  building }
   The functions below create orders. Section 7 carries them out.
   ========================================================================== */

function setOrder(u, order){
  u.order = order; u.path = []; u.pathFor = null; u.hidden = false;
}

// Spread a group over nearby free tiles so they don't all pile onto one spot.
function formationTiles(tx, ty, n){
  const start = isWalkable(tx, ty) ? { x:tx, y:ty } : nearestFreeTile(tx, ty);
  if (!start) return [];
  const out = [], seen = new Set([idx(start.x, start.y)]), q = [start];
  for (let h = 0; h < q.length && out.length < n; h++){
    const c = q[h]; out.push(c);
    for (const [dx, dy] of DIRS){
      const nx = c.x + dx, ny = c.y + dy;
      if (isWalkable(nx, ny) && !seen.has(idx(nx, ny))){ seen.add(idx(nx, ny)); q.push({ x:nx, y:ny }); }
    }
  }
  return out;
}

// attack = true makes it an attack-move: walk there, but fight anything on the way.
// LESSON: Groups keep their width. Each unit gets its own nearby tile, so an
// army arrives as a front line. If they all aimed at one tile they'd squeeze
// into single file and fight one at a time, and tiny quirks in the order of
// events would then decide battles.
function orderMove(units, wx, wy, attack = false){
  const tiles = formationTiles(tileOf(wx), tileOf(wy), units.length);
  if (!tiles.length) return;
  // Which way is the group heading? "fwd" measures how far toward the front
  // a spot is, "lat" how far left or right.
  let gx = 0, gy = 0;
  for (const u of units){ gx += u.x / units.length; gy += u.y / units.length; }
  let vx = wx - gx, vy = wy - gy; const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
  const fwd = (x, y) => (x - wx) * vx + (y - wy) * vy, lat = (x, y) => (x - wx) * -vy + (y - wy) * vx;
  // Melee fighters pick first and take front spots, then ranged units take
  // the rear, then workers. Each picks the spot nearest its own left-right
  // position, so paths don't cross.
  const rank = u => u.type === 'worker' ? 2 : UNIT_TYPES[u.type].ranged ? 1 : 0;
  const left = tiles.map(t => ({ t, x:(t.x + .5) * TILE, y:(t.y + .5) * TILE }));
  for (const u of units.slice().sort((a, b) => rank(a) - rank(b))){
    let best = 0, bc = Infinity;
    const ul = lat(u.x, u.y);
    left.forEach((c, i) => {
      const cost = (rank(u) === 0 ? -2 : 2) * fwd(c.x, c.y) / TILE + Math.abs(lat(c.x, c.y) - ul) / TILE;
      if (cost < bc){ bc = cost; best = i; }
    });
    const c = left.length ? left.splice(best, 1)[0] : { t:tiles[0] };
    setOrder(u, { type:attack ? 'attackMove' : 'move', nav:{ rect:rectOfTile(c.t.x, c.t.y), adj:false } });
  }
}
// Attack-move: walk somewhere, but fight anything met on the way.
function orderAttackMove(u, wx, wy){
  // If the spot is blocked (e.g. the middle of a building), aim for the tiles
  // next to it; otherwise the path search wastes ages on an unreachable goal.
  const tx = tileOf(wx), ty = tileOf(wy);
  setOrder(u, { type:'attackMove', nav:{ rect:rectOfTile(tx, ty), adj:!isWalkable(tx, ty) } });
}
function orderAttack(u, target){
  if (UNIT_TYPES[u.type].noAttack){ const c = target.kind === 'unit' ? target : centerOf(target); return orderMove([u], c.x, c.y); }   // recruits can't fight: they just walk there
  setOrder(u, { type:'attack', target, nav:null, fails:0 });
}
function orderBuild(u, b){
  const prev = u.order, resume = prev && prev.type === 'gather' ? prev : prev && prev.resume ? prev.resume : null;   // remember the old job
  setOrder(u, { type:'build', building:b, nav:{ rect:rectOf(b), adj:true }, resume });
}
// LESSON: Workers that find their own work. After finishing a building, a
// worker looks for something useful nearby: a new town hall sends it to the
// nearest safe gold mine (or trees if there is none), a lumber mill to the
// nearest trees, anything else back to the job it had before. Newly trained
// workers without a rally point do the same, so fewer workers stand idle.
function findWork(near, want){
  const c = centerOf(near), tx = tileOf(c.x), ty = tileOf(c.y);
  if (want !== 'wood'){
    let best = null, bd = 14 * TILE;
    for (const m of G.mines){ if (m.dead || !mineSafe(m)) continue; const mc = centerOf(m), d = Math.hypot(mc.x - c.x, mc.y - c.y); if (d < bd){ bd = d; best = m; } }
    if (best) return best;
  }
  return nearestTree(tx, ty, 10);
}
function afterBuild(u, b, o){
  let target = null;
  if (b.type === 'townhall') target = findWork(b, 'gold');
  else if (b.type === 'lumbermill') target = findWork(b, 'wood');
  else if (o && o.resume){                              // back to the old job, if it still exists
    const r = o.resume;
    target = r.res === 'gold' ? (r.mine && !r.mine.dead ? r.mine : null)
           : G.terrain[idx(r.tx, r.ty)] === T_TREE ? { tree:true, x:r.tx, y:r.ty } : nearestTree(r.tx, r.ty, 6);
  }
  if (target) orderGather(u, target); else u.order = null;
}

function orderGather(u, target){
  let o;
  if (target.kind === 'mine')
    o = { type:'gather', res:'gold', mine:target, nav:{ rect:rectOf(target), adj:true } };
  else
    o = { type:'gather', res:'wood', tx:target.x, ty:target.y, nav:{ rect:rectOfTile(target.x, target.y), adj:true } };
  o.phase = 'go'; o.fails = 0;
  setOrder(u, o);
  if (u.carry) startReturn(u, o);     // drop off what we're holding first
}


/* =============================================================================
   7. UNIT BEHAVIOUR — a STATE MACHINE
   LESSON: A state machine means "a unit is always in exactly one state, and
   each state has its own small piece of logic". Here the state is the order
   type. Gathering even has sub-states (phases): go -> work -> return -> go...
   This keeps complex behaviour readable: each piece is short and separate.
   ========================================================================== */

function updateUnit(u, dt){
  if (u.dead) return;                  // killed earlier this frame; removed at the end of update()
  if (u.promoting){ promoteTick(u); return; }   // being promoted: stands still until done
  const T = UNIT_TYPES[u.type];
  u.cd = Math.max(0, u.cd - dt);
  u.moving = false; u.working = false;
  // Poison: 3 damage every second while it lasts (armor doesn't help).
  if (G.time < (u.poisonUntil || 0) && G.time >= (u.poisonTick || 0)){
    u.poisonTick = G.time + 1; u.hp -= 3;
    if (u.hp <= 0){ kill(u, u.poisonBy); return; }
  }
  if (G.time < (u.stunUntil || 0)) return;               // stunned: can't move, attack or cast
  if (u.auraRegen && u.hp < u.maxHp) u.hp = Math.min(u.maxHp, u.hp + u.auraRegen * dt);          // healing aura
  if (u.items && u.items.length && u.hp < u.maxHp){ const ir = itemBonus(u, 'regen'); if (ir) u.hp = Math.min(u.maxHp, u.hp + ir * dt); }   // Pendant of renewal
  if (u.owner !== CREEPS && G.players[u.owner].up.trollblood && u.hp < u.maxHp) u.hp = Math.min(u.maxHp, u.hp + 0.5 * dt);   // Troll blood
  if (T.hero){
    u.hp = Math.min(u.maxHp, u.hp + 0.5 * dt);                // heroes slowly heal
    if (G.items.length) heroPickup(u);
  }
  if ((u.auto || isAI(u.owner)) && !(G.time < (u.sheepUntil || 0))) autocast(u);   // the AI always autocasts; sheep can't

  if (u.owner === CREEPS){
    creepBehaviour(u, dt);                                  // creeps follow their own rules first
    if (u.order && u.order.type === 'attack' && !u.order.returning && !(G.time < (u.sheepUntil || 0))) creepAbilities(u);
  }
  const o = u.order;
  if (!o){ if (u.owner !== CREEPS) idleBehaviour(u); return; }

  switch (o.type){
    case 'move':
      if (moveToward(u, o.nav, dt)){ if (o.calm) u.calmUntil = G.time + 3; u.order = null; }   // calm: don't turn straight back to fight
      break;

    case 'attackMove': {
      if (G.time >= u.scanAt){
        u.scanAt = G.time + 0.35;
        const foe = T.noAttack ? null : scanForEnemy(u, T.sight);
        // Fight, then "resume" the attack-move afterwards.
        if (foe){ setOrder(u, { type:'attack', target:foe, resume:o, fails:0 }); break; }
      }
      if (moveToward(u, o.nav, dt)){
        // LESSON: Breaking through walls. If the march ends short of its goal, the
        // way is blocked (for example towers standing on a ford). As in Warcraft,
        // attackers then go for the nearest enemy building and, once it falls,
        // carry on marching with a freshly searched path.
        if (distToRect(u, o.nav.rect) > 2 && (o.wallTries || 0) < 6){      // (distToRect measures in tiles)
          const wall = reachableWall(u);
          if (wall){ setOrder(u, { type:'attack', target:wall, fails:0, resume:{ ...o, nav:{ ...o.nav }, wallTries:(o.wallTries || 0) + 1 } }); break; }
        }
        u.order = null;
      }
      break;
    }
    case 'attack': doAttack(u, o, dt); break;
    case 'gather': doGather(u, o, dt); break;
    case 'build':  doBuild(u, o, dt);  break;
    case 'repair': doRepair(u, o, dt); break;
  }
}

// Soldiers standing around look for enemies within sight.
function idleBehaviour(u){
  if (u.type === 'worker' || UNIT_TYPES[u.type].noAttack) return;
  if (G.time < (u.calmUntil || 0)) return;          // just escaped: don't look for a fight yet
  if (G.time < u.scanAt) return;
  u.scanAt = G.time + 0.4 + Math.random() * 0.2;   // LESSON: don't do expensive checks every frame
  const T = UNIT_TYPES[u.type], reach = T.ranged ? effRange(u) + .5 : 1.5;
  const foe = scanForEnemy(u, u.stance === 'hold' ? reach : T.sight);   // holding units only look as far as they can hit
  // "leash": remember where we were so we don't chase forever (a short leash when defensive).
  if (foe) setOrder(u, { type:'attack', target:foe, leash:{ x:u.x, y:u.y }, leashR:u.stance === 'def' ? 5 : 9, hold:u.stance === 'hold', fails:0 });
}

// LESSON: "Smart" targeting built into the units, so nobody needs fast
// fingers. Each candidate gets a score (lower is better): distance, plus a
// penalty for workers, so fighters are preferred. Buildings only count when
// no enemy unit is around.
const targetScore = (u, e) => Math.hypot(e.x - u.x, e.y - u.y) / TILE + (e.type === 'worker' ? 3 : 0);
function scanForEnemy(u, radius){
  if (UNIT_TYPES[u.type].cart) return null;                 // wagons never pick fights
  let best = null, bd = radius + 3;
  for (const e of G.units){
    if (!hostile(u.owner, e.owner) || e.hidden || e.dead || !isHostile(e)) continue;
    if (Math.hypot(e.x - u.x, e.y - u.y) / TILE > radius) continue;
    const sc = targetScore(u, e);
    if (sc < bd){ bd = sc; best = e; }
  }
  if (best && !UNIT_TYPES[u.type].siege) return best;   // prefer units over buildings (siege engines prefer buildings)
  const unitFound = best;
  bd = radius;
  for (const b of G.buildings){
    if (!hostile(u.owner, b.owner) || b.dead) continue;
    if (b.type === 'lair' && !lairOpen(b)) continue;
    const d = distToRect(u, rectOf(b));
    if (d < bd){ bd = d; best = b; }
  }
  return best || unitFound;
}

// Is the straight line between two points walkable all the way? (Checked in
// quarter-tile steps, plus the tiles beside diagonal steps so we don't clip corners.)
function clearLine(x0, y0, x1, y1){
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (TILE / 4));
  for (let i = 1; i <= n; i++){
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;

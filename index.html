    if (!isWalkable(tileOf(x), tileOf(y))) return false;
  }
  return true;
}

function doAttack(u, o, dt){
  const t = o.target;
  if (!isAlive(t) || t.hidden){                 // target gone: resume or stop
    // Defensive units look for the next foe near them; if there is none, they walk back to their spot.
    if (!o.resume && o.leash && u.stance === 'def'){
      const next = scanForEnemy(u, 4);
      if (next && Math.hypot(next.x - o.leash.x, next.y - o.leash.y) / TILE < 6){ o.target = next; o.nav = null; return; }
      if (Math.hypot(u.x - o.leash.x, u.y - o.leash.y) / TILE > 1){ setOrder(u, { type:'move', nav:{ rect:rectOfTile(tileOf(o.leash.x), tileOf(o.leash.y)), adj:false } }); return; }
    }
    setOrder(u, o.resume || null);
    return;
  }
  // Switch targets sensibly: if we're hitting a building or a worker while an
  // enemy soldier is right next to us, turn and fight the soldier instead.
  if (u.owner !== CREEPS && G.time >= (o.retargetAt || 0)){
    o.retargetAt = G.time + 0.8;
    if (t.kind !== 'unit' || t.type === 'worker'){
      const threat = scanForEnemy(u, UNIT_TYPES[u.type].ranged ? effRange(u) : 3);
      if (threat && threat.kind === 'unit' && threat.type !== 'worker'){ o.target = threat; o.nav = null; return; }
    }
  }
  // Auto-acquired fights stop if we wander too far from where we started.
  if (o.hold && Math.hypot(t.x - u.x, t.y - u.y) / TILE > (UNIT_TYPES[u.type].ranged ? effRange(u) + 1 : 2)){ u.order = null; return; }   // hold: never chase
  if (o.leash && Math.hypot(u.x - o.leash.x, u.y - o.leash.y) / TILE > (o.leashR || 9)){
    setOrder(u, { type:'move', nav:{ rect:rectOfTile(tileOf(o.leash.x), tileOf(o.leash.y)), adj:false } });
    return;
  }
  const T = UNIT_TYPES[u.type];
  const reach = T.ranged ? effRange(u) : MELEE_REACH;
  if (distTo(u, t) <= reach){
    u.path = []; u.pathFor = null;
    const c = centerOf(t);
    if (Math.abs(c.x - u.x) > 1) u.facing = c.x < u.x ? -1 : 1;
    u.dir = dirOf(c.x - u.x, c.y - u.y);
    if (G.time < (u.sheepUntil || 0)) return;                            // sheep can't fight
    if (u.cd <= 0){ u.cd = T.cooldown * (G.time < u.slowUntil ? 1.5 : 1) * (G.time < (u.lustUntil || 0) ? 0.8 : 1) * attackSpeedUp(u) * (1 - itemBonus(u, 'haste')); strike(u, t); }   // Slow / Bloodlust / research
    return;
  }
  // Close and nothing in the way? Charge straight at it. (Following grid
  // waypoints here zigzags, and ties between equal routes are broken in a
  // fixed order, which quietly favoured armies moving in some directions.)
  if (t.kind === 'unit' && distTo(u, t) < 4 && clearLine(u.x, u.y, t.x, t.y)){
    const dx = t.x - u.x, dy = t.y - u.y, d = Math.hypot(dx, dy), step = speedOf(u) * TILE * dt;
    u.path = []; u.pathFor = null; u.moving = true; u.anim += dt;
    if (Math.abs(dx) > .5) u.facing = dx < 0 ? -1 : 1;
    u.dir = dirOf(dx, dy);
    u.x += dx / d * Math.min(step, d); u.y += dy / d * Math.min(step, d);
    return;
  }
  // Out of range: chase. Moving targets need a fresh path now and then.
  if (!o.nav || (t.kind === 'unit' && G.time >= o.repathAt)){
    o.nav = t.kind === 'unit'
      ? { rect:rectOfTile(tileOf(t.x), tileOf(t.y)), adj:false }
      : { rect:rectOf(t), adj:true };
    o.repathAt = G.time + 0.5;
  }
  if (moveToward(u, o.nav, dt)){
    // Reached the end of the path but still can't hit it (e.g. across water).
    if (++o.fails > 20) setOrder(u, o.resume || null);
    else if (t.kind !== 'unit') o.nav = null;
  }
}

function startReturn(u, o){
  const drop = nearestDropoff(u, u.carry ? u.carry.res : o.res);
  if (!drop) return false;
  o.phase = 'return'; o.drop = drop;
  o.nav = { rect:rectOf(drop), adj:true };
  u.pathFor = null;
  return true;
}

function doGather(u, o, dt){
  if (o.phase === 'go'){
    // Make sure the resource still exists; otherwise find a new one.
    if (o.res === 'gold' && !isAlive(o.mine)){
      const m = nearestMine(u, 40);
      if (!m){ u.order = null; return; }
      o.mine = m; o.nav = { rect:rectOf(m), adj:true };
    }
    if (o.res === 'wood' && G.terrain[idx(o.tx, o.ty)] !== T_TREE){
      // Pick the next tree close to where lumber is dropped off, not just the
      // one next to the old tree (which walks workers deeper into the forest).
      const drop = nearestDropoff(u, 'wood');
      const t = drop ? treeNearDropoff(drop, o.tx, o.ty) : nearestTree(o.tx, o.ty, 10);
      if (!t){ u.order = null; return; }
      o.tx = t.x; o.ty = t.y; o.nav = { rect:rectOfTile(t.x, t.y), adj:true };
    }
    if (distToRect(u, o.nav.rect) <= WORK_REACH){
      o.phase = 'work';
      o.timer = o.res === 'gold' ? 1.8 : 3.0;
      if (o.res === 'gold') u.hidden = true;        // disappear into the mine
      else { u.facing = (o.tx + .5) * TILE < u.x ? -1 : 1; u.dir = dirOf((o.tx + .5) * TILE - u.x, (o.ty + .5) * TILE - u.y); }
      return;
    }
    if (moveToward(u, o.nav, dt)){
      if (++o.fails > 3) u.order = null;             // unreachable, give up
      else o.nav = { ...o.nav };                     // new object = force a new path
    }
    return;
  }

  if (o.phase === 'work'){
    u.working = o.res === 'wood'; u.anim += dt;
    // A chop sound every 0.8 seconds while cutting wood.
    if (u.working && Math.floor(o.timer / 0.8) !== Math.floor((o.timer - dt) / 0.8)) sfxAt('chop', u.x, u.y, .5);
    o.timer -= dt;
    if (o.timer > 0) return;
    let amount = 0;
    if (o.res === 'gold'){
      u.hidden = false;
      if (isAlive(o.mine)){
        amount = Math.min(carryCap(u), o.mine.gold);
        o.mine.gold -= amount;
        if (o.mine.gold <= 0) removeMine(o.mine);
      }
    } else {
      const i = idx(o.tx, o.ty);
      if (G.terrain[i] === T_TREE){
        amount = Math.min(carryCap(u), G.wood[i]);
        G.wood[i] -= amount;
        if (G.wood[i] <= 0) fellTree(o.tx, o.ty);
      }
    }
    if (amount <= 0){ o.phase = 'go'; return; }
    u.carry = { res:o.res, amount };
    if (!startReturn(u, o)) u.order = null;
    return;
  }

  if (o.phase === 'return'){
    if (!isAlive(o.drop)){ if (!startReturn(u, o)) u.order = null; return; }
    if (distToRect(u, rectOf(o.drop)) <= WORK_REACH){
      let got = isAI(u.owner) ? Math.round(u.carry.amount * diffOf(u.owner).income) : u.carry.amount;
      if (u.carry.res === 'gold') got = Math.max(1, Math.round(got * upkeepOf(u.owner).rate));   // upkeep: big armies bring in less gold
      G.players[u.owner][u.carry.res] += got;
      if (u.carry.res === 'wood'){ G.lumber = G.lumber || {}; G.lumber[u.owner] = (G.lumber[u.owner] || 0) + got; }   // for the lumber missions
      if (u.carry.res === 'gold'){ G.gathered = G.gathered || {}; G.gathered[u.owner] = (G.gathered[u.owner] || 0) + got; }   // for Race for Gold
      if (u.owner === PLAYER) sfxAt(u.carry.res === 'gold' ? 'coin' : 'wood', u.x, u.y, .5);
      if (u.owner === PLAYER) addText(u.x, u.y - 20, '+' + (u.carry.res === 'gold' ? got : u.carry.amount), u.carry.res === 'gold' ? '#f2cf4b' : '#d3a066');
      u.carry = null; o.phase = 'go'; o.fails = 0;
      o.nav = o.res === 'gold' && isAlive(o.mine)
        ? { rect:rectOf(o.mine), adj:true }
        : { rect:rectOfTile(o.tx ?? 0, o.ty ?? 0), adj:true };
      return;
    }
    if (moveToward(u, o.nav, dt)){
      if (++o.fails > 3) u.order = null; else o.nav = { ...o.nav };
    }
  }
}

function doBuild(u, o, dt){
  const b = o.building;
  if (!isAlive(b)){ u.order = null; return; }
  if (b.built >= 1){ afterBuild(u, b, o); return; }          // another builder finished it: find work too
  if (distToRect(u, rectOf(b)) > WORK_REACH){
    // Walk back to the site. Another unit may have nudged us away, so if the
    // path ends too far away, try a fresh path a few times before giving up.
    if (moveToward(u, o.nav, dt) && distToRect(u, rectOf(b)) > WORK_REACH){
      o.fails = (o.fails || 0) + 1;
      if (o.fails > 5) u.order = null; else o.nav = { ...o.nav };
    }
    return;
  }
  u.working = true; u.anim += dt;
  { const bc = centerOf(b); u.dir = dirOf(bc.x - u.x, bc.y - u.y); u.facing = bc.x < u.x ? -1 : 1; }
  if (Math.floor(u.anim / 0.7) !== Math.floor((u.anim - dt) / 0.7)) sfxAt('hammer', u.x, u.y, .5);   // hammering
  const BT = BUILDING_TYPES[b.type];
  const step = dt / BT.time;                 // several builders = faster
  b.built = Math.min(1, b.built + step);
  b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.9 * step);
  if (b.built >= 1){
    if (b.maxHp - b.hp < 2) b.hp = b.maxHp;   // fix tiny rounding leftovers so it shows as fully healthy
    afterBuild(u, b, o);                        // go and gather something nearby
    if (b.owner === PLAYER){ toast(nameOf(b) + ' complete'); sfx('complete'); }
  }
}

// ----- Repairing -----
// A repairing worker remembers what it was doing ("resume") and goes back
// to gathering afterwards, so repairs don't wreck your economy.
function orderRepair(u, b){
  const prev = u.order;
  const resume = prev && prev.type === 'gather' ? prev : prev && prev.type === 'repair' ? prev.resume : null;
  setOrder(u, { type:'repair', building:b, nav:{ rect:rectOf(b), adj:true }, fails:0, resume });
}

// Send the n closest available workers to repair a building.
function sendRepairers(b, n){
  // Workers inside a gold mine can be called out too, but only if needed.
  const score = u => distTo(u, b) + (u.hidden ? 5 : 0);
  const ws = G.units.filter(u => u.owner === b.owner && u.type === 'worker' &&
                                 !(u.order && (u.order.type === 'build' || u.order.type === 'repair')))
                    .sort((a, c) => score(a) - score(c))
                    .slice(0, n);
  ws.forEach(w => orderRepair(w, b));
  return ws.length;
}

function nearestDamaged(u){
  let best = null, bd = 1e9;
  for (const b of G.buildings){
    if (b.owner !== u.owner || b.built < 1 || b.hp >= b.maxHp) continue;
    const d = distTo(u, b);
    if (d < bd){ bd = d; best = b; }
  }
  return best;
}

// LESSON: Paying "per tick" instead of up front. Each frame we work out a tiny
// slice of the cost and charge it. A full repair from almost nothing costs
// about half of the building's price, and stops if you run out.
function doRepair(u, o, dt){
  const b = o.building;
  if (!isAlive(b) || b.built < 1 || b.hp >= b.maxHp){ finishRepair(u, o); return; }
  if (distToRect(u, rectOf(b)) > WORK_REACH){
    if (moveToward(u, o.nav, dt) && distToRect(u, rectOf(b)) > WORK_REACH){
      if (++o.fails > 5) finishRepair(u, o); else o.nav = { ...o.nav };
    }
    return;
  }
  u.working = true; u.anim += dt;
  if (Math.floor(u.anim / 0.7) !== Math.floor((u.anim - dt) / 0.7)) sfxAt('hammer', u.x, u.y, .5);   // repairing
  const c = centerOf(b);
  u.facing = c.x < u.x ? -1 : 1;
  u.dir = dirOf(c.x - u.x, c.y - u.y);
  const BT = BUILDING_TYPES[b.type];
  const gain = Math.min(b.maxHp - b.hp, b.maxHp * dt / BT.time);   // same speed as constructing
  const share = gain / b.maxHp * 0.5;
  const cost = { gold:BT.cost.gold * share, wood:BT.cost.wood * share };
  if (!canAfford(u.owner, cost)){
    if (u.owner === PLAYER) toast('Not enough gold or lumber to keep repairing');
    finishRepair(u, o);
    return;
  }
  pay(u.owner, cost);
  b.hp += gain;
  if (b.hp >= b.maxHp){
    b.hp = b.maxHp;
    finishRepair(u, o);
  }
}

function finishRepair(u, o){
  const r = o.resume;
  if (r && r.type === 'gather') orderGather(u, r.res === 'gold' ? r.mine : { x:r.tx, y:r.ty });
  else setOrder(u, null);
}

// LESSON: Without this, units would stack on top of each other. Each pair
// that's too close gets pushed apart a little every frame ("soft collision").
// LESSON: Spatial hashing. Comparing every unit with every other unit costs
// n x n checks, which explodes as armies and creep camps grow (170 units =
// 14,000 pairs, every frame). Instead we drop units into tile-sized buckets
// and only compare each unit with the 3x3 buckets around it.
const SEP_GRID = new Map();
function separate(dt){
  const us = G.units, MIN = 16;
  for (const arr of SEP_GRID.values()) arr.length = 0;
  for (let i = 0; i < us.length; i++){
    const u = us[i]; if (u.hidden) continue;
    u.sepIdx = i;
    const k = tileOf(u.y) * MAP_W + tileOf(u.x);
    let arr = SEP_GRID.get(k); if (!arr) SEP_GRID.set(k, arr = []);
    arr.push(u);
  }
  for (let i = 0; i < us.length; i++){
    const a = us[i]; if (a.hidden) continue;
    const cx = tileOf(a.x), cy = tileOf(a.y);
    for (let gy = cy - 1; gy <= cy + 1; gy++) for (let gx = cx - 1; gx <= cx + 1; gx++){
    const arr = SEP_GRID.get(gy * MAP_W + gx); if (!arr) continue;
    for (const b of arr){
      if (b.sepIdx <= i) continue;                     // each pair once
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= MIN * MIN) continue;
      const d = Math.sqrt(d2) || 0.01;
      const nx = d2 ? dx / d : 1, ny = d2 ? dy / d : 0;
      const push = (MIN - d) * 0.5 * Math.min(1, dt * 8);
      const wa = a.path.length ? 0.3 : 1, wb = b.path.length ? 0.3 : 1;   // walkers push less
      nudge(a, -nx * push * wa, -ny * push * wa);
      nudge(b,  nx * push * wb,  ny * push * wb);
    }
    }
  }
}
function nudge(u, dx, dy){
  const nx = u.x + dx, ny = u.y + dy;
  if (isWalkable(tileOf(nx), tileOf(ny))){ u.x = nx; u.y = ny; }
}


/* =============================================================================
   7b. CREEP CAMPS
   LESSON: Neutral "creeps" are a small AI of their own with three states:
     asleep  – standing at the camp, healing, watching for intruders
     fighting – attacking whoever came too close
     returning – walking home, ignoring everything until they get there
   The "leash" (maximum chase distance) is what makes them feel territorial
   instead of chasing you across the whole map.
   ========================================================================== */

// Sleeping creeps are not "hostile": units walking past won't pick a fight
// with them automatically. Once creeps attack, everyone fights back.
function isHostile(e){
  return e.owner !== CREEPS || (e.order && e.order.type === 'attack');
}

function makeCamp(tier, spot, units){
  if (!spot) return null;
  const def = CAMP_TYPES[tier];
  units = units || def.units;
  const camp = { id:G.nextId++, tier, tx:spot.x, ty:spot.y, x:(spot.x + .5) * TILE, y:(spot.y + .5) * TILE,
                 reward:def.reward, cleared:false };
  // Spread the creatures around the centre, leaving a gap between each one.
  const tiles = formationTiles(spot.x, spot.y, units.length * 2 + 3).slice(1);
  units.forEach((type, i) => {
    const t = tiles[i * 2] || tiles[i] || spot;
    const u = spawnUnit(type, CREEPS, (t.x + .5) * TILE, (t.y + .5) * TILE);
    u.camp = camp; u.home = { x:u.x, y:u.y };
    u.facing = t.x <= spot.x ? 1 : -1;                 // face the campfire
  });
  camp.size0 = units.length; camp.types = units.slice();
  placeLair(camp, units, tiles);
  G.camps.push(camp);
  return camp;
}

// LESSON: Lairs make ignored camps a growing threat. Each camp gets a
// building matching its creatures; every so often it breeds a new creature
// (up to 2 more than the camp started with), and a full camp promotes its
// members to Elder and then Ancient. Only destroying the lair stops it.
const LAIR_GROW = { spawnEvery:100, promoteEvery:180, extra:2, reward:{ small:60, medium:100, big:150, wild:40 } };
function lairKind(units){
  if (units.includes('golem')) return 4;
  if (units.includes('ogre') || units.includes('ogremage')) return 3;
  if (units.includes('spider') || units.includes('spitter')) return 2;
  if (units.includes('wolf')) return 5;
  return 1;
}
function placeLair(camp, units, homes){
  const taken = new Set(homes.slice(0, units.length * 2).map(t => t.x + ',' + t.y));
  const free = (x, y) => inBounds(x, y) && isWalkable(x, y) && !taken.has(x + ',' + y) && !G.blocked[idx(x, y)];
  for (let r = 2; r <= 6; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = camp.tx + dx, y = camp.ty + dy;
        if (!(free(x, y) && free(x + 1, y) && free(x, y + 1) && free(x + 1, y + 1))) continue;
        const b = placeBuilding('lair', CREEPS, x, y, true);
        b.level = lairKind(units); b.camp = camp; camp.lair = b;
        return;
      }
}
// Called once a second: lairs breed and promote while their camp is at rest.
function campGrowth(dt){
  for (const camp of G.camps){
    const lair = camp.lair;
    if (!lair || lair.dead) continue;
    const members = campMembers(camp);
    if (members.some(m => m.order && (m.order.type === 'attack' || m.order.returning))) continue;   // busy fighting
    camp.growT = (camp.growT || 0) + dt * (G.lairSpeed || 1);
    if (members.length < camp.size0 + LAIR_GROW.extra){
      if (camp.growT < LAIR_GROW.spawnEvery) continue;
      camp.growT = 0;
      const type = camp.types[Math.floor(Math.random() * camp.types.length)];
      const c = centerOf(lair), t = nearestFreeTile(tileOf(c.x), tileOf(c.y) + 2);
      if (!t) continue;
      const u = spawnUnit(type, CREEPS, (t.x + .5) * TILE, (t.y + .5) * TILE);
      u.camp = camp; u.home = { x:u.x, y:u.y };
      camp.cleared = false;                                  // an emptied camp comes back to life
      G.effects.push({ type:'ring', x:u.x, y:u.y, color:'#c9b6ef', life:.6, max:.6, r:14 });
    } else if (camp.growT >= LAIR_GROW.promoteEvery){
      camp.growT = 0;
      const cand = members.filter(m => (m.rank || 0) < 2).sort((a, b) => (a.rank || 0) - (b.rank || 0))[0];
      if (cand) promoteCreep(cand);
    }
  }
}
function promoteCreep(u){
  const T = UNIT_TYPES[u.type];
  u.rank = (u.rank || 0) + 1;
  if (u.rank >= 2) G.ancientSeen = true;
  u.maxHp += Math.round(T.hp * .4); u.hp = u.maxHp;
  u.damage += Math.max(1, Math.round(T.damage * .3));
  G.effects.push({ type:'ring', x:u.x, y:u.y - 6, color:u.rank > 1 ? '#c070ff' : '#ffb347', life:.8, max:.8, r:18 });
}
// A lair can be attacked once its camp is awake or has no creatures left
// (so units passing by don't wander off to poke sleeping camps).
// LESSON: This check runs for every unit scanning for targets, many times a
// second, so it must be cheap: it reads counts that countCamps() works out
// once per frame, instead of searching all units each time.
function lairOpen(b){ return !b.camp.alive || b.camp.awake; }
function countCamps(){
  for (const c of G.camps){ c.alive = 0; c.awake = false; }
  for (const u of G.units) if (u.camp && !u.dead){ u.camp.alive++; if (u.order && u.order.type === 'attack') u.camp.awake = true; }
}

// LESSON: Place things in mirrored pairs to keep a map fair: whatever
// we put at (x, y) for one player also goes at the mirror point for the other.
function spawnCamps(){
  const bases = G.corners ? Object.values(G.corners).map(([x, y]) => ({ x:x + 1.5, y:y + 1.5 }))
              : quadMap() ? [[10.5, 10.5], [MAP_W - 10.5, MAP_H - 10.5], [MAP_W - 10.5, 10.5], [10.5, MAP_H - 10.5]].map(([x, y]) => ({ x, y }))
                           : [{ x:10.5, y:10.5 }, { x:MAP_W - 10.5, y:MAP_H - 10.5 }];
  const farFromCamps = (x, y, d) => G.camps.every(c => Math.hypot(c.tx - x, c.ty - y) >= d);
  // 1) Every mine away from the bases: a main camp on the side facing the
  //    nearest base, and a second, smaller camp on the far side.
  for (const m of G.mines){
    const mx = m.tx + 1.5, my = m.ty + 1.5;
    const base = bases.reduce((a, b) => Math.hypot(a.x - mx, a.y - my) < Math.hypot(b.x - mx, b.y - my) ? a : b);
    const dBase = Math.hypot(base.x - mx, base.y - my);
    if (dBase < 20) continue;                          // home mines stay unguarded
    const tier = Math.hypot(mx - MAP_W / 2, my - MAP_H / 2) < 6 ? 'big' : dBase < 36 * MAP_W / 128 ? 'small' : 'medium';   // "near" scales with the map
    const dx = (base.x - mx) / dBase, dy = (base.y - my) / dBase;
    makeCamp(tier, nearestFreeTile(Math.round(mx + dx * 4.5), Math.round(my + dy * 4.5)));
    const group = WILD_GROUPS[(m.tx + m.ty) % WILD_GROUPS.length];            // same pick for the mirrored mine
    makeCamp(tier === 'big' ? 'medium' : 'wild', nearestFreeTile(Math.round(mx - dx * 5), Math.round(my - dy * 5)), tier === 'big' ? null : group);
  }
  // 2) Wild camps scattered over the open map, placed as mirrored pairs.
  let pairs = 0;
  const wantPairs = Math.round(8 * (MAP_W * MAP_H) / (128 * 128));
  for (let tries = 0; tries < 600 && pairs < wantPairs; tries++){
    const x = 8 + Math.floor(Math.random() * (MAP_W - 16)), y = 8 + Math.floor(Math.random() * (MAP_H - 16));
    const quad = quadMap();
    if (quad ? (x >= MAP_W / 2 - 3 || y >= MAP_H / 2 - 3) : x + y >= MAP_W - 12) continue;   // our part only; mirrors cover the rest
    if (bases.some(b => Math.hypot(b.x - x, b.y - y) < 28)) continue;
    if (G.mines.some(m => Math.hypot(m.tx + 1.5 - x, m.ty + 1.5 - y) < 8)) continue;
    const spots = quad ? [[x, y], [MAP_W - 1 - x, MAP_H - 1 - y], [MAP_W - 1 - x, y], [x, MAP_H - 1 - y]] : [[x, y], [MAP_W - 1 - x, MAP_H - 1 - y]];
    if (!spots.every(([sx, sy]) => isWalkable(sx, sy) && farFromCamps(sx, sy, 11))) continue;
    const group = WILD_GROUPS[Math.floor(Math.random() * WILD_GROUPS.length)];
    for (const [sx, sy] of spots) makeCamp('wild', { x:sx, y:sy }, group);
    pairs += quad ? 2 : 1;
  }
}

const campMembers = camp => G.units.filter(u => u.camp === camp && !u.dead);

// The closest non-creep unit inside the camp's territory.
function campIntruder(camp){
  let best = null, bd = CAMP_RADIUS;
  for (const e of G.units){
    if (e.owner === CREEPS || e.hidden || e.dead) continue;
    const d = Math.hypot(e.x - camp.x, e.y - camp.y) / TILE;
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

function alertCamp(camp, target){
  if (!camp) return;
  if (campMembers(camp).every(c => !c.order)) sfxAt('growl', camp.x, camp.y, .8);   // the camp wakes up
  // Creeps already walking home only turn back if the attacker is close to the camp.
  const close = Math.hypot(centerOf(target).x - camp.x, centerOf(target).y - camp.y) / TILE <= CAMP_RADIUS + 3;
  for (const c of campMembers(camp)){
    if (c.order && (c.order.type === 'attack' || (c.order.returning && !close))) continue;
    orderAttack(c, target);
    c.order.leash = { ...c.home };
  }
}

function goHome(u){
  setOrder(u, { type:'move', returning:true, nav:{ rect:rectOfTile(tileOf(u.home.x), tileOf(u.home.y)), adj:false } });
}

// ----- Siege specials -----
// LESSON: Area damage. The cannon's shell hurts every enemy within a radius
// of the impact (half damage around the target), so clumped armies suffer.
// The scorpion's bolt keeps flying through its target and hits enemies lined
// up behind it: a different shape of area damage.
const enemyOf = (a, e) => hostile(a.owner, e.owner) && !e.dead && !e.hidden && (e.owner !== CREEPS || isHostile(e) || e.kind === 'unit');
function cannonBlast(p){
  const a = p.attacker, c = centerOf(p.target), R = UNIT_TYPES.cannon.splash * TILE;
  if (!a) return;
  for (const e of [...G.units, ...G.buildings]){
    if (e === p.target || !enemyOf(a, e)) continue;
    const ec = centerOf(e);
    if (Math.hypot(ec.x - c.x, ec.y - c.y) <= R + (e.kind === 'building' ? e.size * TILE / 2 : 0)) applyDamage(e, p.dmg * .5, a);
  }
  G.effects.push({ type:'ring', x:c.x, y:c.y, color:'#ff9a3a', life:.45, max:.45, r:R });
  G.effects.push({ type:'ring', x:c.x, y:c.y, color:'#5a5048', life:.8, max:.8, r:R * .6 });
}
function boltPierce(p){
  const a = p.attacker; if (!a) return;
  const c = centerOf(p.target), dx = c.x - a.x, dy = c.y - a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const behind = G.units.filter(e => e !== p.target && enemyOf(a, e)).map(e => {
    const t = (e.x - c.x) * ux + (e.y - c.y) * uy, side = Math.abs((e.x - c.x) * -uy + (e.y - c.y) * ux);
    return { e, t, side };
  }).filter(o => o.t > 0 && o.t < 3 * TILE && o.side < .6 * TILE).sort((x, y) => x.t - y.t).slice(0, UNIT_TYPES.scorpion.pierceLine);
  for (const o of behind) applyDamage(o.e, p.dmg * .6, a);
  if (behind.length){ const last = behind[behind.length - 1].e; G.effects.push({ type:'bolt', plain:true, pts:[[c.x, c.y - 6], [last.x, last.y - 6]], seed:0, life:.2, max:.2 }); }
}

// LESSON: Creature abilities reuse the same "until" timestamps as spells:
// hitFx() just stamps poisonUntil, webUntil, stunUntil... on the target, and
// the movement, armor and attack rules already check them. Buildings are immune.
function hitFx(t, fx, src){
  if (!t || t.kind !== 'unit' || t.dead) return;
  if (fx.poison){ t.poisonUntil = G.time + fx.poison; t.poisonBy = src; }
  if (fx.corrode) t.corrodeUntil = G.time + fx.corrode;
  if (fx.web)     t.webUntil = G.time + fx.web;
  if (fx.stun)    t.stunUntil = Math.max(t.stunUntil || 0, G.time + fx.stun);
  if (fx.slow)    t.slowUntil = Math.max(t.slowUntil || 0, G.time + fx.slow);
}
// Targets worth disabling first: heroes, spellcasters and ranged units.
function priorityFoe(u, range, key){
  let best = null, bs = -1;
  for (const e of G.units){
    if (e.owner === u.owner || e.dead || e.hidden || e.owner === CREEPS) continue;
    if (Math.hypot(e.x - u.x, e.y - u.y) / TILE > range || G.time < (e[key] || 0)) continue;
    const T = UNIT_TYPES[e.type], sc = (T.hero ? 100 : 0) + (T.healer || T.caster ? 60 : 0) + (T.ranged ? 40 : 0) + Math.random() * 5;
    if (sc > bs){ bs = sc; best = e; }
  }
  return best;
}
// Special moves creatures use while fighting.
function creepAbilities(u){
  if (u.type === 'spider' && G.time >= (u.ready.web || 0)){
    const t = priorityFoe(u, 4, 'webUntil');
    if (t){ u.ready.web = G.time + 10;
      G.projectiles.push({ x:u.x, y:u.y - 6, target:t, dmg:1, attacker:u, angle:0, style:'web', fx:{ web:3 } }); sfxAt('spit', u.x, u.y, .6); }
  }
  if (u.type === 'golem' && G.time >= (u.ready.boulder || 0)){
    const t = priorityFoe(u, 5, 'stunUntil');
    if (t){ u.ready.boulder = G.time + 15;
      G.projectiles.push({ x:u.x, y:u.y - 20, target:t, dmg:25, attacker:u, angle:0, style:'boulder', fx:{ stun:1.5 } }); sfxAt('club', u.x, u.y, .7); }
  }
  if (u.type === 'ogremage' && G.time >= (u.ready.lust || 0)){
    let best = null;
    for (const a of G.units) if (a.owner === CREEPS && !a.dead && a.camp === u.camp && a !== u && G.time >= (a.lustUntil || 0) - 1
                                  && a.order && a.order.type === 'attack' && (!best || a.maxHp > best.maxHp)) best = a;
    if (best){ u.ready.lust = G.time + 20; best.lustUntil = G.time + 15;
      G.effects.push({ type:'ring', x:best.x, y:best.y - 6, color:'#ff5a3a', life:.5, max:.5, r:16 }); sfxAt('warcry', best.x, best.y, .5); }
  }
}

function creepBehaviour(u, dt){
  const o = u.order;
  if (o && o.returning) return;                                   // walking home: ignore everything
  const dHome = Math.hypot(u.x - u.home.x, u.y - u.home.y) / TILE;
  if (dHome > CAMP_LEASH){ goHome(u); return; }                   // chased too far
  if (o && o.type === 'attack'){
    // If the target has fled the camp, switch to another intruder or go home.
    const t = o.target;
    if (isAlive(t) && Math.hypot(centerOf(t).x - u.camp.x, centerOf(t).y - u.camp.y) / TILE > CAMP_RADIUS + 3){
      const other = campIntruder(u.camp);
      if (other){ orderAttack(u, other); u.order.leash = { ...u.home }; } else goHome(u);
    }
    return;
  }
  if (o) return;
  if (dHome > 1){                                                 // idle away from home (e.g. just won a fight):
    const intruder = campIntruder(u.camp);                        // keep fighting if enemies are still in the camp,
    if (intruder) alertCamp(u.camp, intruder); else goHome(u);    // otherwise walk home
    return;
  }
  u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.08 * dt);           // resting creeps heal quickly
  if (G.time >= u.scanAt){
    u.scanAt = G.time + 0.4 + Math.random() * 0.2;
    const intruder = campIntruder(u.camp);
    if (intruder) alertCamp(u.camp, intruder);
  }
}

// Bounty for each creep, and a bonus when the last one in a camp falls.
function creepKilled(e, attacker){
  const owner = attacker ? attacker.owner : null;
  if (e.type === 'lair'){                                   // a lair destroyed: the camp stops growing
    if (e.camp) e.camp.lair = null;
    if (!isSide(owner)) return;
    const r = LAIR_GROW.reward[e.camp ? e.camp.tier : 'wild'] || 50, c = centerOf(e);
    G.players[owner].gold += r;
    if (owner === PLAYER){ addText(c.x, c.y - 30, 'Lair destroyed! +' + r, '#f2cf4b'); toast(nameOf(e) + ' destroyed: +' + r + ' gold. This camp will not grow back.'); }
    return;
  }
  if (!isSide(owner)) return;
  const T = UNIT_TYPES[e.type], bounty = Math.round(T.bounty * (1 + .5 * (e.rank || 0)));   // promoted creatures pay more
  G.players[owner].gold += bounty;
  if (owner === PLAYER){ G.stats.creeps++; addText(e.x, e.y - 30, '+' + bounty, '#f2cf4b'); }
  const camp = e.camp;
  if (camp && !camp.cleared && campMembers(camp).length === 0){
    camp.cleared = true;
    if (camp.rewarded){                                      // re-cleared a regrown camp: bounties only
      if (owner === PLAYER && camp.lair) toast('Camp emptied, but its lair is still standing and will breed more.');
      return;
    }
    camp.rewarded = true;
    G.players[owner].gold += camp.reward;
    G.effects.push({ type:'ring', x:camp.x, y:camp.y, color:'#f2cf4b', life:.9, max:.9, r:3 * TILE });
    const loot = lootTier(CAMP_DROPS[camp.tier][Math.floor(Math.random() * CAMP_DROPS[camp.tier].length)], camp.tier);
    dropItem(loot, camp.x, camp.y + 10);                            // treasure for a hero to pick up
    if (owner === PLAYER){ addText(camp.x, camp.y - 20, 'Camp cleared! +' + camp.reward, '#f2cf4b');
      toast('Camp cleared: +' + camp.reward + ' gold, and it dropped ' + ITEMS[loot].name + '!' + (camp.lair ? ' Destroy the lair too, or it will breed more.' : '')); }
  }
}


/* =============================================================================
   8. BUILDINGS & TRAINING
   ========================================================================== */

// Food ("supply") limits army size, like farms in classic RTS games.
// LESSON: Upkeep, as in Warcraft 3. The more food an army uses, the less gold
// the workers bring home: a huge army is affordable, but it costs the economy.
// Only mined gold is affected; lumber, pillage and Market trades are not.
const UPKEEP = [ { from:0, rate:1, label:'No upkeep' }, { from:41, rate:.7, label:'Low upkeep' }, { from:71, rate:.4, label:'High upkeep' } ];
function upkeepOf(owner){ const used = foodOf(owner).used; let u = UPKEEP[0]; for (const t of UPKEEP) if (used >= t.from) u = t; return u; }
function foodOf(owner){
  let cap = 0, used = 0;
  for (const b of G.buildings){
    if (b.owner !== owner) continue;
    if (b.built >= 1) cap += owner === PLAYER && kingdomLarva() && b.type === 'farm' ? (b.level > 1 ? 4 : 2)
                         : owner === PLAYER && kingdomLarva() && b.type === 'townhall' ? 8 : BUILDING_TYPES[b.type].food;   // your Kingdom: small farms, a roomier hall
    for (const q of b.queue) if (q.type) used += UNIT_TYPES[q.type].food;   // research uses no food
  }
  for (const u of G.units) if (u.owner === owner) used += u.food != null ? u.food : UNIT_TYPES[u.type].food;   // hired mercenaries carry their own food cost
  return { cap:Math.min(cap, 100), used };
}

const hasBuilding = (owner, type) => G.buildings.some(b => b.owner === owner && b.type === type && b.built >= 1);
// One check for every kind of requirement: a research key, a building type,
// or a building type ending in a number: at least that upgrade level
// ('townhall2' = Castle or better, 'townhall3' = Citadel).
function meetsReq(owner, req){
  if (RESEARCH[req]) return !!G.players[owner].up[req];
  const m = /^([a-z]+)(\d)$/.exec(req);
  if (m) return G.buildings.some(b => b.owner === owner && b.type === m[1] && b.built >= 1 && b.level >= +m[2]);
  return hasBuilding(owner, req);
}
const reqName = (owner, req) => RESEARCH[req] ? RESEARCH[req].name : FACTIONS[owner].names[req];
const missingReq = (owner, list) => (list || []).find(r => !meetsReq(owner, r));
const canAfford = (owner, c) => G.players[owner].gold >= c.gold && G.players[owner].wood >= c.wood;
function pay(owner, c, sign = 1){ G.players[owner].gold -= c.gold * sign; G.players[owner].wood -= c.wood * sign; }

// One of each hero type per side.
function hasHero(owner, type = 'hero'){
  return G.units.some(u => u.owner === owner && u.type === type) ||
         G.buildings.some(b => b.owner === owner && b.queue.some(q => q.type === type));
}

function fail(owner, msg){ if (owner === PLAYER){ toast(msg); sfx('error'); } return false; }

function tryTrain(b, type){
  const T = UNIT_TYPES[type], owner = b.owner;
  if (b.queue.length >= 5) return fail(owner, 'The queue is full');
  if (G.players[owner].gold < T.cost.gold) return fail(owner, 'Not enough gold');
  if (G.players[owner].wood < T.cost.wood) return fail(owner, 'Not enough lumber');
  const f = foodOf(owner);
  if (f.used + T.food > f.cap) return fail(owner, 'Build more farms');
  if (T.hero && hasHero(owner, type)) return fail(owner, 'You already have a ' + FACTIONS[owner].names[type]);
  if (!techAllows('unit', type)) return false;
  const miss = T.needs && missingReq(owner, T.needs);
  if (miss) return fail(owner, 'Needs ' + reqName(owner, miss));
  pay(owner, T.cost);
  b.queue.push({ type, t:0 });
  return true;
}
function tryResearch(b, key){
  const R = RESEARCH[key], owner = b.owner;
  if (G.players[owner].up[key]) return fail(owner, 'Already researched');
  if (G.buildings.some(x => x.owner === owner && x.queue.some(q => q.research === key))) return fail(owner, 'Already in progress');
  const miss = missingReq(owner, R.needs);
  if (miss) return fail(owner, 'Requires ' + reqName(owner, miss));
  if (b.queue.length >= 5) return fail(owner, 'The queue is full');
  if (!canAfford(owner, R.cost)) return fail(owner, G.players[owner].gold < R.cost.gold ? 'Not enough gold' : 'Not enough lumber');
  pay(owner, R.cost);
  b.queue.push({ research:key, t:0 });
  if (owner === PLAYER) toast('Researching ' + R.name + ': ' + R.desc);
  return true;
}
// A building's queue can hold three kinds of items: units, research, upgrades.
function queueTime(b, q){
  if (q.research) return RESEARCH[q.research].time;
  if (q.upgrade) return b.type === 'farm' && b.owner === PLAYER && kingdomLarva() ? KFARM_UP.time : upgradeData(b.type, q.to || 2, b.owner).time;
  return UNIT_TYPES[q.type].time;
}
function queueCost(b, q){
  if (q.research) return RESEARCH[q.research].cost;
  if (q.upgrade) return upgradeData(b.type, q.to || 2, b.owner).cost;
  return UNIT_TYPES[q.type].cost;
}
function tryUpgrade(b){
  const UP = nextUpgrade(b), owner = b.owner;
  if (!UP || b.queue.some(q => q.upgrade)) return fail(owner, 'Already upgraded');
  if (!canAfford(owner, UP.cost)) return fail(owner, G.players[owner].gold < UP.cost.gold ? 'Not enough gold' : 'Not enough lumber');
  if (UP.recruit){                                          // a Recruit goes to work the farm
    const c = centerOf(b), r = G.units.filter(u => u.owner === owner && u.type === 'recruit' && !u.dead && !u.promoting)
      .sort((p, q) => Math.hypot(p.x - c.x, p.y - c.y) - Math.hypot(q.x - c.x, q.y - c.y))[0];
    if (!r) return fail(owner, 'Needs a Recruit');
    r.dead = true; G.effects.push({ type:'ring', x:r.x, y:r.y, color:'#e8c547', life:.4, max:.4, r:12 });
  }
  pay(owner, UP.cost);
  b.queue.push({ upgrade:true, to:b.level + 1, t:0 });
  return true;
}
function cancelTrain(b){
  const q = b.queue.pop();
  if (q) pay(b.owner, queueCost(b, q), -1);   // refund
}

function updateBuilding(b, dt){
  if (b.built < 1) return;
  const BT = BUILDING_TYPES[b.type];
  if (BT.attack) towerAttack(b, dt);
  // Upgraded farms produce a small trickle of gold.
  if (b.level > 1 && BT.upgrade){
    b.incomeT += dt;
    if (b.incomeT >= BT.upgrade.every){
      b.incomeT -= BT.upgrade.every;
      G.players[b.owner].gold += BT.upgrade.income;
      if (b.owner === PLAYER){ const c = centerOf(b); addText(c.x, c.y - 24, '+' + BT.upgrade.income, '#f2cf4b'); }
    }
  }
  if (!b.queue.length) return;
  const q = b.queue[0];
  q.t += dt;                                       // only the first item in line progresses
  if (q.t < queueTime(b, q)) return;
  b.queue.shift();
  if (q.upgrade){
    const lvl = q.to || 2, UP = upgradeData(b.type, lvl, b.owner), N = FACTIONS[b.owner].names;
    b.level = lvl; b.maxHp += UP.hp || 150; b.hp += UP.hp || 150; b.armor += UP.armor || 0;
    if (b.owner === PLAYER) sfx('complete');
    if (b.owner === PLAYER) toast(UP.income ? nameOf(b) + ' ready: +' + UP.income + ' gold every ' + UP.every + 's'
                                : b.type === 'townhall' ? nameOf(b) + ' complete! ' + (lvl === 2 ? N.stable : N.temple) + ' and new research unlocked.'
                                : b.type === 'tower' && towerTier(b) === 1 && !isOrc(b.owner) ? nameOf(b) + ' complete: it now shoots enemies.'
                                : nameOf(b) + ' complete: more health, damage and range.');
    return;
  }
  if (q.research){
    G.players[b.owner].up[q.research] = true;
    const R = RESEARCH[q.research];
    if (R.bhp) for (const x of G.buildings) if (x.owner === b.owner){      // masonry: existing buildings too
      const add = Math.round(BUILDING_TYPES[x.type].hp * R.bhp);
      x.maxHp += add; x.hp += add; x.armor += R.barmor || 0;
    }
    const HP = R.hp;                                   // health upgrades apply to existing units too
    if (HP) for (const u of G.units) if (u.owner === b.owner && u.type === HP.type){ u.maxHp += HP.amount; u.hp += HP.amount; }
    if (R.hpPct) for (const u of G.units) if (u.owner === b.owner){ const add = Math.round(UNIT_TYPES[u.type].hp * R.hpPct); u.maxHp += add; u.hp += add; }
    if (b.owner === PLAYER){ toast(RESEARCH[q.research].name + ' complete'); sfx('complete'); }
    return;
  }
  const spot = nearestFreeTile(b.tx + (b.size >> 1), b.ty + b.size);
  if (!spot) return;
  const u = spawnUnit(q.type, b.owner, (spot.x + .5) * TILE, (spot.y + .5) * TILE);
  if (b.rally) orderMove([u], b.rally.x, b.rally.y);
  else if (q.type === 'worker'){ const t = findWork(b, 'gold'); if (t) orderGather(u, t); }   // new workers go straight to work
  if (b.owner === PLAYER){ toast(nameOf(u) + ' ready'); sfx('ready', .8); }
}


function towerDamage(b){
  const up = G.players[b.owner].up, BT = BUILDING_TYPES[b.type];
  return BT.attack.damage + (up.fletching ? 2 : 0) + (up.fletching2 ? 2 : 0) + (up.ballistics ? 4 : 0) + (towerTier(b) >= 2 ? BT.upgrade.damage : 0);
}
function towerRange(b){
  const BT = BUILDING_TYPES[b.type];
  return BT.attack.range + (towerTier(b) >= 2 && BT.upgrade ? BT.upgrade.range || 0 : 0) + (G.players[b.owner].up.eagleeye ? 2 : 0);
}

// A tower is a building that behaves a bit like a unit: it has a cooldown
// and shoots the nearest enemy in range.
function towerAttack(b, dt){
  if (towerTier(b) === 0) return;                             // a watch tower only watches
  b.cd = (b.cd || 0) - dt;
  if (b.cd > 0) return;
  const A = BUILDING_TYPES[b.type].attack, r = rectOf(b);
  let best = null, bd = towerRange(b);
  for (const u of G.units){
    if (!hostile(b.owner, u.owner) || u.hidden || !isHostile(u)) continue;
    const d = distToRect(u, r);
    if (d < bd){ bd = d; best = u; }
  }
  if (!best) return;
  b.cd = A.cooldown;
  const dmg = towerDamage(b);
  G.projectiles.push({ x:(b.tx + 1) * TILE, y:b.ty * TILE + 8, target:best, dmg, attacker:b, angle:0 });
  sfxAt('bow', (b.tx + 1) * TILE, b.ty * TILE, .6);
}


/* =============================================================================
   9. COMBAT & HEROES
   ========================================================================== */

// Base stats + finished upgrades. Keeping upgrades separate means research
// instantly applies to units that already exist.
function effDamage(u){
  const up = G.players[u.owner].up, T = UNIT_TYPES[u.type];
  let d = u.damage;
  if (up.weapons && !T.ranged && u.type !== 'worker' && !T.creep) d += 2;
  if (up.weapons2 && !T.ranged && u.type !== 'worker' && !T.creep) d += 2;
  if (up.weapons3 && !T.ranged && u.type !== 'worker' && !T.creep) d += 2;
  if (up.fletching && isRangedInfantry(u.type)) d += 2;
  if (up.fletching2 && isRangedInfantry(u.type)) d += 2;
  if (up.lances && u.type === 'knight') d += 4;
  return d + itemBonus(u, 'damage') + (G.time < u.ultUntil && !isOrc(u.owner) ? 10 : 0) + (u.mounted ? 2 : 0) + 2 * heroUpg(u, 'dmg');   // Avatar; mounted charge
}
function effArmor(e){
  return effArmorBase(e) - (e.mounted ? 2 : 0) + heroUpg(e, 'armor');                    // a rider is an easier target
}
function effArmorBase(e){
  if (e.kind !== 'unit') return e.armor || 0;
  const up = G.players[e.owner].up, soldier = e.type !== 'worker' && !UNIT_TYPES[e.type].creep;
  return e.armor + (up.discipline && !UNIT_TYPES[e.type].creep ? 2 : 0) + (soldier && up.armor ? 1 : 0) + (soldier && up.armor2 ? 1 : 0) + (soldier && up.armor3 ? 1 : 0) + (e.type === 'knight' && up.barding ? 1 : 0)
       + (e.type === 'footman' && up.shields ? 2 : 0) + itemBonus(e, 'armor')
       + (e.auraArmor || 0) + (G.time < e.ultUntil && !isOrc(e.owner) ? 4 : 0) + (G.time < (e.innerUntil || 0) ? 2 : 0)
       - (G.time < (e.corrodeUntil || 0) ? 3 : 0);            // acid spit
}
function effRange(u){
  const T = UNIT_TYPES[u.type];
  const up = G.players[u.owner].up;
  return T.range + (isRangedInfantry(u.type) ? (up.longbows ? 1.5 : 0) + (up.eagleeye ? 1 : 0) : 0) + (u.skills && u.skills.keen ? u.skills.keen : 0) + (UNIT_TYPES[u.type].ranged ? itemBonus(u, 'range') + heroUpg(u, 'range') : 0);
}
const carryCap = u => { const up = G.players[u.owner].up; return up.tools2 ? 20 : up.tools ? 15 : 10; };

function strike(u, t){
  const T = UNIT_TYPES[u.type];
  const dmg = effDamage(u) * (G.time < u.buffUntil ? u.buffMult : 1)
            * (G.time < u.innerUntil ? 1.2 : 1) * (G.time < u.curseUntil ? 0.7 : 1)    // Inner fire and Curse
            * (G.time < (u.lustUntil || 0) ? 1.2 : 1)                                  // Bloodlust
            * (1 + (u.auraDmg || 0) / 100)                                             // Warlord aura
            * (T.pierce && effArmor(t) >= 4 ? 1.5 : 1)                                   // Longbowman: piercing shots
            * (T.heavy && (t.kind === 'building' || UNIT_TYPES[t.type].big) ? 1.5 : 1)   // Javelin thrower: heavy javelins
            * (T.siege && t.kind === 'building' ? 1.5 : 1)                                // siege engines vs buildings
            * (T.beast && CREEP_TYPES.has(t.type) ? 1.5 : 1)                             // Hunter: beast hunter
            * (u.skills && u.skills.keen && CREEP_TYPES.has(t.type) ? 1 + .15 * u.skills.keen : 1);   // Huntmaster: keen eye
  // Some creature attacks carry an extra effect when they land.
  const fx = u.type === 'kslinger' ? { poison:5 } : u.type === 'spitter' ? { corrode:8 } : null;
  if (T.ranged){ G.projectiles.push({ x:u.x, y:u.y - 8, target:t, dmg, attacker:u, angle:0, style:u.type, fx }); sfxAt(shootSound(u), u.x, u.y, .7); }
  else {
    sfxAt(hitSound(u), u.x, u.y, .8);
    splat(t);
    if (u.type === 'wolf' && Math.random() < .3) hitFx(t, { slow:3 }, u);                       // crippling bite
    if (u.type === 'ogre' && G.time >= (u.ready.smash || 0)){                                  // smash: stun
      u.ready.smash = G.time + 12; hitFx(t, { stun:1.5 }, u);
      G.effects.push({ type:'ring', x:t.x, y:t.y + 4, color:'#c8a26a', life:.4, max:.4, r:16 }); sfxAt('club', t.x, t.y);
    }
    if (t.kind === 'building' && t.owner !== CREEPS && G.players[u.owner].up.pillage && u.type !== 'worker'){   // Pillage
      G.players[u.owner].gold += 2;
      G.pillaged = G.pillaged || {}; G.pillaged[u.owner] = (G.pillaged[u.owner] || 0) + 2;
      if (u.owner === PLAYER && Math.random() < .3) addText(t.x !== undefined ? t.x : u.x, u.y - 24, '+2', '#f2cf4b');
    }
    const dealt = applyDamage(t, dmg, u);
    if (T.cleave && t.kind === 'unit'){                              // Axeman: cleave into an enemy beside the target
      const o = G.units.find(e => e !== t && hostile(u.owner, e.owner) && !e.dead && !e.hidden && Math.hypot(e.x - t.x, e.y - t.y) < 1.3 * TILE);
      if (o) applyDamage(o, dmg * .5, u);
    }
    const steal = itemBonus(u, 'lifesteal') + (G.time < (u.ultUntil || 0) && isOrc(u.owner) ? .25 : 0);   // Blood rage
    if (steal && dealt) u.hp = Math.min(u.maxHp, u.hp + dealt * steal);
  }
}

// A little spray of droplets on a hit: blood for creatures, green ichor for
// spiders, stone chips for golems and buildings.
function splat(t){
  if (G.effects.length > 400) return;                          // keep huge battles cheap
  const c = centerOf(t);
  const color = t.kind !== 'unit' || t.type === 'golem' ? '#8a8378' : t.type === 'spider' || t.type === 'spitter' ? '#8fbf3a' : '#9b1c1c';
  G.effects.push({ type:'splat', x:c.x, y:c.y - (t.kind === 'unit' ? 8 : 20), color, seed:Math.random() * 100, life:.4, max:.4 });
}

const armorFactor = a => a >= 0 ? 1 - 0.06 * a / (1 + 0.06 * a) : 1;   // share of damage that gets through

function applyDamage(t, dmg, attacker){
  if (G.time < (t.shieldUntil || 0)) return 0;                       // Divine shield: no damage at all
  if (attacker && G.ai && G.ai[t.owner] && isSide(attacker.owner) && hostile(attacker.owner, t.owner)){ G.ai[t.owner].grudge = attacker.owner; G.ai[t.owner].grudgeAt = G.time; }
  if (t.dead) return 0;
  // A little randomness (80%–120%) makes fights feel less mechanical.
  // LESSON: Percentage armor, as in Warcraft 3. Each armor point blocks about
  // 6% of damage, with diminishing returns (10 armor blocks 37.5%, not 60%).
  // With the old "damage minus armor" rule, a hero with 7 armor took just 2
  // damage from a 9-damage footman, which made heroes nearly immune to troops.
  const real = Math.max(1, Math.round(dmg * (0.8 + Math.random() * 0.4) * armorFactor(effArmor(t))));
  t.hp -= real;
  if (t.owner === PLAYER && attacker && hostile(PLAYER, attacker.owner)) underAttack(t);
  else if (attacker && attacker.owner === PLAYER) G.combatT = G.time;     // drums when your troops fight
  // Idle soldiers hit back when attacked.
  if (t.kind === 'unit' && t.type !== 'worker' && !UNIT_TYPES[t.type].cart && !UNIT_TYPES[t.type].noAttack && !t.order && !(G.time < (t.calmUntil || 0)) && isAlive(attacker) && attacker.kind === 'unit'){
    const reachT = UNIT_TYPES[t.type].ranged ? effRange(t) + 1 : 2;
    if (t.stance !== 'hold' || Math.hypot(attacker.x - t.x, attacker.y - t.y) / TILE <= reachT)        // holding units only hit back within reach
      setOrder(t, { type:'attack', target:attacker, leash:{ x:t.x, y:t.y }, leashR:t.stance === 'def' ? 5 : 9, hold:t.stance === 'hold', fails:0 });
  }
  // Hurting one creep wakes up its whole camp.
  if (t.owner === CREEPS && isAlive(attacker) && attacker.kind === 'unit') alertCamp(t.camp, attacker);
  if (t.hp <= 0) kill(t, attacker);
  return real;
}

function updateProjectiles(dt){
  for (const p of G.projectiles){
    if (p.done) continue;                                   // already landed (or missed) this frame
    if (!isAlive(p.target)){ p.done = true; continue; }
    const c = centerOf(p.target);
    const dx = c.x - p.x, dy = (c.y - 6) - p.y, d = Math.hypot(dx, dy), step = 300 * dt;
    p.angle = Math.atan2(dy, dx);
    if (d <= step){
      if (p.attacker && heightOf(p.attacker) < heightOf(p.target) && Math.random() < .25){   // fired uphill: a miss
        p.done = true; addText(p.x, p.y - 14, 'miss', '#d8d8d8'); continue;   // next projectile (not 'return', which would skip the rest)
      }
      applyDamage(p.target, p.dmg, p.attacker); if (p.fx) hitFx(p.target, p.fx, p.attacker); p.done = true;
      if (p.style === 'cannon') cannonBlast(p); else if (p.style === 'scorpion') boltPierce(p); else if (p.concoction) concoctionLands(p);
      sfxAt(p.style === 'boulder' ? 'punch' : p.style === 'cannon' ? 'slam' : 'arrowHit', p.x, p.y, .6); splat(p.target);
    }
    else { p.x += dx / d * step; p.y += dy / d * step; }
  }
}

const xpNeeded = level => 80 + level * 80;          // heroes share kill experience, so levels cost more
const XP_RADIUS = 10;                       // tiles
function shareXP(dead){
  const heroes = G.units.filter(h => UNIT_TYPES[h.type].hero && !h.dead && hostile(h.owner, dead.owner) && h.owner !== CREEPS
                                  && Math.hypot(h.x - dead.x, h.y - dead.y) / TILE <= XP_RADIUS);
  if (!heroes.length) return;
  const each = Math.max(1, Math.round(dead.maxHp / 3 / heroes.length));   // split between heroes in range
  for (const h of heroes){
    addXP(h, each);
    if (h.owner === PLAYER) G.effects.push({ type:'text', x:h.x + 8, y:h.y - 24, text:'+' + each + ' xp', color:'#c9a0ff', life:1, max:1 });
  }
}
function addXP(h, amount){
  h.xp += amount;
  while (h.level < 10 && h.xp >= xpNeeded(h.level)){
    h.xp -= xpNeeded(h.level);
    h.level++;
    h.maxHp += Math.round(20 * HP_SCALE); h.damage += 1;          // max health grows, but current health is NOT refilled
    if (h.level % 3 === 0) h.armor++;
    h.skillPoints++;
    addText(h.x, h.y - 30, 'Level ' + h.level + '!', '#f2cf4b');
    if (h.owner === PLAYER) sfx('levelup');
    if (h.owner === PLAYER) toast(nameOf(h) + ' reached level ' + h.level + ': 1 skill point to spend');
  }
}

// ----- Abilities -----
// Each cast function returns true if it worked, false if it's on cooldown
// or had nothing to do. The same functions are used by buttons and autocast.

function enemiesNear(u, radius){
  return G.units.filter(e => hostile(u.owner, e.owner) && !e.hidden && !e.dead &&
    Math.hypot(e.x - u.x, e.y - u.y) / TILE <= radius);
}

// LESSON: "Autocast" is just a rule checked a few times a second:
// "is the ability ready AND is this a good moment?" Good moments are simple
// conditions (enough enemies close by, an ally is hurt). Small rules like
// these feel surprisingly smart in play.
function autocast(u){
  if (G.time < u.castAt) return;
  u.castAt = G.time + 0.25;
  const T = UNIT_TYPES[u.type];
  if (u.type === 'huntmaster'){                                       // the Huntmaster's skills
    const inFight = (u.order && u.order.type === 'attack') || enemiesNear(u, 6).length > 0;
    if (inFight) castVolley(u);
    if (!G.units.some(d => d.id === u.dogId && !d.dead)) castHound(u);   // no dog: call one
    if (inFight && (u.hp < u.maxHp * .6 || enemiesNear(u, 6).length >= 4)) castPack(u);
  }
  if (u.type === 'healer'){
    castHolyLight(u);                                                 // heal whoever is hurt most
    const inFight = (u.order && u.order.type === 'attack') || enemiesNear(u, 5).length > 0;
    if (inFight && u.hp < u.maxHp * .4) castShield(u);                // in danger: become invulnerable
    if (inFight) castConcoction(u);                                   // the alchemist's random flask
    if (woundedAllies(u, 6).filter(a => a.hp < a.maxHp * .5).length >= 3 || u.hp < u.maxHp * .3) castMassHeal(u);
  }
  if (T.hero){
    if (u.type === 'hero' && enemiesNear(u, 2).length >= 2) castSlam(u);   // surrounded: slam
    const inFight = (u.order && u.order.type === 'attack') || enemiesNear(u, 4).length > 0;
    if (u.type === 'hero' && inFight && enemiesNear(u, 7).length >= 2) warCry(u);          // real battle: rally
    if (u.type === 'hero' && inFight && (u.hp < u.maxHp * 0.5 || enemiesNear(u, 6).length >= 5)) castUlt(u);   // big fight or in trouble
    const potion = u.items.indexOf('potion');
    if (potion >= 0 && u.hp < u.maxHp * 0.3) useItem(u, potion);     // drink a potion when badly hurt
    const tome = u.items.indexOf('tome');
    if (tome >= 0 && isAI(u.owner)) useItem(u, tome);
  }
  // LESSON: Same unit slot, different spellbook: each side's casters get
  // their own spells, chosen by faction.
  const up = G.players[u.owner].up;
  if (T.healer){ castHeal(u); if (up.innerfire) castInner(u); if (up.bloodlust) castBloodlust(u); }
  if (T.caster){
    if (isOrc(u.owner)){ castCurse(u); if (up.chainlightning) castChain(u); }   // Hexer
    else { castSlow(u); if (up.polymorph) castPoly(u); }                        // Sorceress
  }
}

// Hero ability: nearby allies deal +50% damage for 10 seconds.
function warCry(h){
  const rank = h.skills.warcry;
  if (!rank || G.time < h.ready.warcry) return false;
  h.ready.warcry = G.time + ABILITIES.warcry.cooldown;
  const mult = 1 + HERO_SKILLS.warcry.val[rank - 1] / 100;
  for (const a of G.units)
    if (a.owner === h.owner && Math.hypot(a.x - h.x, a.y - h.y) <= 5 * TILE){ a.buffUntil = G.time + 10; a.buffMult = mult; }
  G.effects.push({ type:'ring', x:h.x, y:h.y, color:'#ffa53a', life:.7, max:.7, r:5 * TILE });
  sfxAt('warcry', h.x, h.y);
  if (h.owner === PLAYER) addText(h.x, h.y - 32, skillName(h.owner, 'warcry') + '!', '#ffa53a');
  return true;
}

// ----- The healer hero's spells -----
function woundedAllies(h, r){ return G.units.filter(a => a.owner === h.owner && !a.dead && !a.hidden && a.hp < a.maxHp && Math.hypot(a.x - h.x, a.y - h.y) / TILE <= r); }
function castHolyLight(h){
  const r = h.skills.holylight;
  if (!r || G.time < h.ready.holylight) return false;
  let best = null, bf = .8;
  for (const a of woundedAllies(h, 6)){ const f = a.hp / a.maxHp; if (f < bf){ bf = f; best = a; } }
  if (!best) return false;
  const v = skillDef(h.owner, 'holylight').val[r - 1];
  h.ready.holylight = G.time + ABILITIES.holylight.cooldown;
  best.hp = Math.min(best.maxHp, best.hp + v);
  G.effects.push({ type:'ring', x:best.x, y:best.y - 6, color:isOrc(h.owner) ? '#8fe38a' : '#ffe9a0', life:.6, max:.6, r:18 });
  addText(best.x, best.y - 26, '+' + v, '#8fe38a'); sfxAt('heal', best.x, best.y);
  return true;
}
function castShield(h){
  const r = h.skills.shield;
  if (!r || G.time < h.ready.shield) return false;
  h.ready.shield = G.time + ABILITIES.shield.cooldown;
  h.shieldUntil = G.time + skillDef(h.owner, 'shield').val[r - 1];
  G.effects.push({ type:'ring', x:h.x, y:h.y - 8, color:'#ffe08a', life:.6, max:.6, r:20 }); sfxAt('ult', h.x, h.y, .6);
  return true;
}
function castMassHeal(h){
  if (!h.skills.mass || G.time < h.ready.mass) return false;
  const hurt = woundedAllies(h, 6);
  if (!hurt.length) return false;
  h.ready.mass = G.time + ABILITIES.mass.cooldown;
  for (const a of hurt){ a.hp = Math.min(a.maxHp, a.hp + 200); G.effects.push({ type:'ring', x:a.x, y:a.y - 6, color:'#8fe38a', life:.6, max:.6, r:14 }); }
  G.effects.push({ type:'ring', x:h.x, y:h.y, color:'#ffe9a0', life:.9, max:.9, r:6 * TILE }); sfxAt('levelup', h.x, h.y);
  return true;
}
// LESSON: A random ability. The alchemist throws a big flask at the thickest
// group of enemies; when it lands, one of four effects is drawn at random.
// Harmful effects only touch enemies, helpful ones only your own units, so
// every throw helps somehow: you just don't know how.
const CONCOCTIONS = [
  { name:'Healing brew',  color:'#8fe38a', apply:(h, r, foes, friends) => friends.forEach(a => { a.hp = Math.min(a.maxHp, a.hp + [60, 100, 140][r - 1]); }) },
  { name:'Acid splash',   color:'#c8e04a', apply:(h, r, foes) => foes.forEach(e => { applyDamage(e, [50, 80, 110][r - 1], h); hitFx(e, { corrode:8 }, h); }) },
  { name:'Sleeping gas',  color:'#c89aff', apply:(h, r, foes) => foes.forEach(e => hitFx(e, { stun:[2, 3, 4][r - 1] }, h)) },
  { name:'Berserk tonic', color:'#ff6a4a', apply:(h, r, foes, friends) => friends.forEach(a => { a.lustUntil = Math.max(a.lustUntil || 0, G.time + 12); }) },
];
function castConcoction(h){
  const r = h.skills.concoction;
  if (!r || G.time < h.ready.concoction) return false;
  // Aim at the enemy with the most other enemies around it.
  let best = null, bn = 0;
  const foes = G.units.filter(e => hostile(h.owner, e.owner) && !e.dead && !e.hidden && isHostile(e) && Math.hypot(e.x - h.x, e.y - h.y) / TILE <= 6);
  for (const e of foes){ const n = foes.filter(o => Math.hypot(o.x - e.x, o.y - e.y) < 2.5 * TILE).length; if (n > bn){ bn = n; best = e; } }
  if (!best) return false;
  h.ready.concoction = G.time + ABILITIES.concoction.cooldown;
  G.projectiles.push({ x:h.x, y:h.y - 12, target:best, dmg:1, attacker:h, angle:0, style:'flask', concoction:r });
  sfxAt('sling', h.x, h.y);
  return true;
}
function concoctionLands(p){
  const h = p.attacker, c = centerOf(p.target), R = 2.5 * TILE;
  if (!h) return;
  const fx = CONCOCTIONS[Math.floor(Math.random() * CONCOCTIONS.length)];
  const near = G.units.filter(u => !u.dead && !u.hidden && Math.hypot(u.x - c.x, u.y - c.y) <= R);
  fx.apply(h, p.concoction, near.filter(u => hostile(h.owner, u.owner) && isHostile(u)), near.filter(u => allied(h.owner, u.owner)));
  G.effects.push({ type:'ring', x:c.x, y:c.y, color:fx.color, life:.8, max:.8, r:R });
  G.effects.push({ type:'ring', x:c.x, y:c.y, color:fx.color, life:.5, max:.5, r:R * .5 });
  addText(c.x, c.y - 30, fx.name + '!', fx.color);
  sfxAt(fx.name === 'Acid splash' ? 'spit' : fx.name === 'Healing brew' ? 'heal' : 'magic', c.x, c.y);
}
// ----- The woodland roster (the lumber missions) -----
// LESSON: Units that belong to one mission. They are ordinary units, but no
// building trains them by default; a mission can hand a building its own
// roster (setup.roster), which replaces that building's usual list.
const CREEP_TYPES = new Set(['kobold', 'kslinger', 'wolf', 'spider', 'spitter', 'ogre', 'ogremage', 'golem', 'bandit', 'brigand', 'skeleton', 'skelarcher']);
function castVolley(h){
  const r = h.skills.volley; if (!r || G.time < h.ready.volley) return false;
  const foes = G.units.filter(e => hostile(h.owner, e.owner) && !e.dead && !e.hidden && Math.hypot(e.x - h.x, e.y - h.y) / TILE <= effRange(h) + 1);
  let best = null, bn = 0;
  for (const e of foes){ const n = foes.filter(o => Math.hypot(o.x - e.x, o.y - e.y) < 2 * TILE).length; if (n > bn){ bn = n; best = e; } }
  if (!best) return false;
  h.ready.volley = G.time + ABILITIES.volley.cooldown;
  const v = HERO_SKILLS.volley.val[r - 1];
  for (const e of foes) if (Math.hypot(e.x - best.x, e.y - best.y) <= 2 * TILE) applyDamage(e, v, h);
  for (let k = 0; k < 6; k++) G.effects.push({ type:'ring', x:best.x + (Math.random() - .5) * 50, y:best.y + (Math.random() - .5) * 40, color:'#e8dcb5', life:.35 + k * .05, max:.35 + k * .05, r:6 });
  sfxAt('bow', h.x, h.y); return true;
}
// The Huntmaster keeps one hunting dog. It stays until it falls; casting again replaces it,
// and each rank of the skill makes the new dog stronger.
const HOUND_RANKS = [ { hp:120, damage:8, armor:1 }, { hp:180, damage:12, armor:2 }, { hp:240, damage:16, armor:3 } ];
function castHound(h){
  const r = h.skills.hound; if (!r || G.time < h.ready.hound) return false;
  h.ready.hound = G.time + ABILITIES.hound.cooldown;
  const old = G.units.find(d => d.id === h.dogId && !d.dead);
  if (old){ old.dead = true; G.effects.push({ type:'ring', x:old.x, y:old.y, color:'#c8b89a', life:.4, max:.4, r:14 }); }   // only one dog at a time
  const R = HOUND_RANKS[r - 1], sp = nearestFreeTile(tileOf(h.x) + 1, tileOf(h.y) + 1);
  const d = spawnUnit('hound', h.owner, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
  d.maxHp = d.hp = Math.round(R.hp * HP_SCALE); d.damage = R.damage; d.armor = R.armor; d.master = h.id; h.dogId = d.id;
  G.effects.push({ type:'ring', x:d.x, y:d.y, color:'#c8b89a', life:.6, max:.6, r:18 }); sfxAt('growl', d.x, d.y, .7);
  return true;
}
function castPack(h){
  if (!h.skills.pack || G.time < h.ready.pack) return false;
  h.ready.pack = G.time + ABILITIES.pack.cooldown;
  for (let k = 0; k < 3; k++){ const sp = nearestFreeTile(tileOf(h.x) + k - 1, tileOf(h.y) + 1), w = spawnUnit('wolf', h.owner, (sp.x + .5) * TILE, (sp.y + .5) * TILE); w.expires = G.time + 30; w.summon = true; }
  G.effects.push({ type:'ring', x:h.x, y:h.y, color:'#c8b89a', life:.8, max:.8, r:3 * TILE }); sfxAt('growl', h.x, h.y); return true;
}
const CAST = { warcry:u => warCry(u), slam:u => castSlam(u), ult:u => castUlt(u), holylight:castHolyLight, shield:castShield, mass:castMassHeal, concoction:castConcoction, volley:u => castVolley(u), hound:u => castHound(u), pack:u => castPack(u) };

// Hero ultimate: for 20 seconds the hero hits much harder and is much tougher.
function castUlt(h){
  if (!h.skills.ult || G.time < h.ready.ult) return false;
  h.ready.ult = G.time + ABILITIES.ult.cooldown;
  h.ultUntil = G.time + 20;
  G.effects.push({ type:'ring', x:h.x, y:h.y - 6, color:'#ffe08a', life:.9, max:.9, r:3 * TILE });
  sfxAt('ult', h.x, h.y);
  addText(h.x, h.y - 34, skillName(h.owner, 'ult') + '!', '#ffe08a');
  return true;
}

// Spend a skill point. Returns false (with a message for the player) if not allowed.
function learnSkill(h, k){
  const S = skillDef(h.owner, k), next = h.skills[k] + 1;
  if (h.skillPoints <= 0) return fail(h.owner, 'No skill points left: gain a level first');
  if (next > S.max) return fail(h.owner, skillName(h.owner, k) + ' is already at its highest rank');
  if (h.level < skillReq(k, next)) return fail(h.owner, 'Needs hero level ' + skillReq(k, next));
  h.skills[k] = next; h.skillPoints--;
  if (h.owner === PLAYER) toast(skillName(h.owner, k) + ' rank ' + next + ': ' + S.desc(S.val[next - 1]));
  G.effects.push({ type:'ring', x:h.x, y:h.y - 6, color:'#9fe3ff', life:.6, max:.6, r:18 });
  if (h.owner === PLAYER) sfx('learn');
  return true;
}

// Temples heal nearby friendly units, like a healing fountain.
const TEMPLE_REGEN = { radius:6, perSecond:2 };
function templeRegen(dt){
  for (const b of G.buildings){
    if (b.type !== 'temple' || b.built < 1) continue;
    const c = centerOf(b);
    for (const u of G.units){
      if (u.owner !== b.owner || u.dead || u.hidden || u.hp >= u.maxHp) continue;
      const sanct = G.players[b.owner].up.sanctuary;               // Kingdom: Sanctuary
      if (Math.hypot(u.x - c.x, u.y - c.y) / TILE > (sanct ? 9 : TEMPLE_REGEN.radius)) continue;
      u.hp = Math.min(u.maxHp, u.hp + TEMPLE_REGEN.perSecond * (sanct ? 2 : 1) * dt);
      u.regenAt = G.time;                                   // for the little green sparkle
    }
  }
}

// Auras are recalculated a couple of times a second instead of on every hit.
function updateAuras(){
  for (const u of G.units){ u.auraArmor = 0; u.auraDmg = 0; u.auraRegen = 0; }
  for (const h of G.units){                                          // the healer's regeneration aura
    if (h.type !== 'healer' || h.dead || !h.skills.regen) continue;
    const v = HERO_SKILLS.regen.val[h.skills.regen - 1];
    for (const u of G.units) if (u.owner === h.owner && Math.hypot(u.x - h.x, u.y - h.y) <= 5 * TILE) u.auraRegen = Math.max(u.auraRegen, v);
  }
  for (const h of G.units){
    if (h.type !== 'hero' || h.dead || !h.skills.aura) continue;
    const v = skillDef(h.owner, 'aura').val[h.skills.aura - 1], key = isOrc(h.owner) ? 'auraDmg' : 'auraArmor';
    for (const u of G.units)
      if (u.owner === h.owner && Math.hypot(u.x - h.x, u.y - h.y) <= 5 * TILE) u[key] = Math.max(u[key], v);
  }
}

// Hero ability: damage all enemies within 2 tiles. Grows with hero level.
function castSlam(h){
  const rank = h.skills.slam;
  if (!rank || G.time < h.ready.slam) return false;
  const foes = enemiesNear(h, 2);
  if (!foes.length) return false;
  h.ready.slam = G.time + ABILITIES.slam.cooldown;
  const dmg = HERO_SKILLS.slam.val[rank - 1];
  for (const e of foes) applyDamage(e, dmg, h);
  G.effects.push({ type:'ring', x:h.x, y:h.y + 6, color:'#c8a26a', life:.5, max:.5, r:2 * TILE });
  sfxAt('slam', h.x, h.y);
  return true;
}

// ----- Spellcaster abilities -----
// LESSON: Debuffs are just "until" timestamps on the target (slowUntil,
// curseUntil). Every rule that cares checks G.time < u.slowUntil, so a
// spell needs no timer of its own and wears off by itself.
// Debuffers pick heroes first, then the hardest hitters: exactly the
// units that make a "one-man army".
function pickDebuffTarget(m, key){
  let best = null, bs = -1;
  for (const e of G.units){
    if (!hostile(m.owner, e.owner) || e.dead || e.hidden || !isHostile(e)) continue;
    if (Math.hypot(e.x - m.x, e.y - m.y) / TILE > 5 || G.time < (e[key] || 0) - 1) continue;
    const sc = (UNIT_TYPES[e.type].hero ? 1000 : 0) + effDamage(e) * (UNIT_TYPES[e.type].big ? 1.5 : 1);
    if (sc > bs){ bs = sc; best = e; }
  }
  return best;
}
function castSlow(m){
  if (G.time < m.ready.slow) return false;
  const t = pickDebuffTarget(m, 'slowUntil');
  if (!t) return false;
  m.ready.slow = G.time + 6; t.slowUntil = G.time + 10;
  G.effects.push({ type:'ring', x:t.x, y:t.y - 6, color:'#8fc7ff', life:.5, max:.5, r:14 });
  sfxAt('magic', t.x, t.y, .6);
  return true;
}
function castCurse(m){
  if (G.time < m.ready.curse) return false;
  const t = pickDebuffTarget(m, 'curseUntil');
  if (!t) return false;
  m.ready.curse = G.time + 8; t.curseUntil = G.time + 12;
  G.effects.push({ type:'ring', x:t.x, y:t.y - 6, color:'#c89aff', life:.5, max:.5, r:14 });
  sfxAt('magic', t.x, t.y, .6);
  return true;
}
// Kingdom Sorceress: Polymorph turns a (non-hero) enemy into a sheep.
function castPoly(m){
  if (G.time < (m.ready.poly || 0)) return false;
  let best = null, bs = -1;
  for (const e of G.units){
    if (!hostile(m.owner, e.owner) || e.dead || e.hidden || !isHostile(e) || UNIT_TYPES[e.type].hero || G.time < (e.sheepUntil || 0)) continue;
    if (Math.hypot(e.x - m.x, e.y - m.y) / TILE > 5) continue;
    const sc = effDamage(e) * (UNIT_TYPES[e.type].big ? 2 : 1) + e.hp / 20;      // the most dangerous non-hero
    if (sc > bs){ bs = sc; best = e; }
  }
  if (!best) return false;
  m.ready.poly = G.time + 10; best.sheepUntil = G.time + 8;
  G.effects.push({ type:'ring', x:best.x, y:best.y - 4, color:'#ffffff', life:.5, max:.5, r:16 });
  sfxAt('magic', best.x, best.y, .7);
  return true;
}
// Orc Hexer: Chain lightning hits one enemy and jumps to two more nearby.
function castChain(m){
  if (G.time < (m.ready.chain || 0)) return false;
  const first = pickDebuffTarget(m, 'noSuchKey');
  if (!first) return false;
  m.ready.chain = G.time + 12;
  const hit = [first], pts = [[m.x, m.y - 14], [first.x, first.y - 8]];
  let cur = first, dmg = 26;
  applyDamage(first, dmg, m);
  for (let j = 0; j < 2; j++){
    let nxt = null, nd = 3 * TILE;
    for (const e of G.units){
      if (!hostile(m.owner, e.owner) || e.dead || e.hidden || !isHostile(e) || hit.includes(e)) continue;
      const d = Math.hypot(e.x - cur.x, e.y - cur.y);
      if (d < nd){ nd = d; nxt = e; }
    }
    if (!nxt) break;
    dmg *= .8; hit.push(nxt); pts.push([nxt.x, nxt.y - 8]); applyDamage(nxt, dmg, m); cur = nxt;
  }
  G.effects.push({ type:'bolt', pts, seed:Math.random() * 100, life:.35, max:.35 });
  sfxAt('zap', m.x, m.y);
  return true;
}
// Orc Shaman with Bloodlust: enrage a fighting ally (heroes first).
function castBloodlust(p){
  if (G.time < (p.ready.lust || 0)) return false;
  let best = null, bs = -1;
  for (const a of G.units){
    if (a.owner !== p.owner || a.dead || a.hidden || a.type === 'worker' || G.time < (a.lustUntil || 0) - 1) continue;
    if (Math.hypot(a.x - p.x, a.y - p.y) / TILE > 5 || !(a.order && a.order.type === 'attack')) continue;
    const sc = (UNIT_TYPES[a.type].hero ? 1000 : 0) + effDamage(a);
    if (sc > bs){ bs = sc; best = a; }
  }
  if (!best) return false;
  p.ready.lust = G.time + 8; best.lustUntil = G.time + 20;
  G.effects.push({ type:'ring', x:best.x, y:best.y - 6, color:'#ff5a3a', life:.5, max:.5, r:14 });
  sfxAt('warcry', best.x, best.y, .4);
  return true;
}

// Priest with Inner fire: buff an ally that is fighting (heroes first).
function castInner(p){
  if (G.time < p.ready.inner) return false;
  let best = null, bs = -1;
  for (const a of G.units){
    if (a.owner !== p.owner || a.dead || a.hidden || a.type === 'worker' || G.time < a.innerUntil - 1) continue;
    if (Math.hypot(a.x - p.x, a.y - p.y) / TILE > 5 || !(a.order && a.order.type === 'attack')) continue;
    const sc = (UNIT_TYPES[a.type].hero ? 1000 : 0) + effDamage(a);
    if (sc > bs){ bs = sc; best = a; }
  }
  if (!best) return false;
  p.ready.inner = G.time + 8; best.innerUntil = G.time + 20;
  G.effects.push({ type:'ring', x:best.x, y:best.y - 6, color:'#ffb347', life:.5, max:.5, r:14 });
  sfxAt('heal', best.x, best.y, .5);
  return true;
}

// Priest ability: heal the most wounded ally within 5 tiles.
function castHeal(p){
  if (G.time < p.ready.heal) return false;
  let best = null, worst = 1;
  for (const a of G.units){
    if (a.owner !== p.owner || a.hidden || a.dead || a.hp >= a.maxHp - 5) continue;
    if (Math.hypot(a.x - p.x, a.y - p.y) / TILE > 5) continue;
    const frac = a.hp / a.maxHp;
    if (frac < worst){ worst = frac; best = a; }
  }
  if (!best) return false;
  const prayers = G.players[p.owner].up.prayers;
  p.ready.heal = G.time + (prayers ? 2.5 : ABILITIES.heal.cooldown);
  const amount = Math.min(prayers ? 40 : 25, best.maxHp - best.hp);
  best.hp += amount;
  G.effects.push({ type:'ring', x:best.x, y:best.y - 4, color:'#8fe38a', life:.5, max:.5, r:12 });
  sfxAt('heal', best.x, best.y, .5);
  if (best.owner === PLAYER) addText(best.x, best.y - 22, '+' + Math.round(amount), '#8fe38a');
  return true;
}


// ----- Hero items -----
// LESSON: Items are just data (see ITEMS). The hero's stats are always
// "base + upgrades + items", computed when needed, so equipping or losing an
// item never needs special code to undo its effect, except max health,
// which is stored, so it's added and removed explicitly.
function itemBonus(u, stat){
  let sum = 0;
  if (u.items) for (const k of u.items) sum += ITEMS[k][stat] || 0;
  return sum;
}
function giveItem(h, key){
  if (!h || h.dead || h.items.length >= slotsOf(h)) return false;
  h.items.push(key);
  const I = ITEMS[key];
  if (I.hp){ h.maxHp += I.hp; h.hp += I.hp; }
  return true;
}
function useItem(h, i){
  const key = h.items[i], I = ITEMS[key];
  if (!I || !I.use) return false;
  if (I.use === 'heal'){
    if (h.hp >= h.maxHp - 1) return fail(h.owner, 'Already at full health');
    h.hp = Math.min(h.maxHp, h.hp + (I.heal || 120));
    G.effects.push({ type:'ring', x:h.x, y:h.y - 6, color:'#8fe38a', life:.6, max:.6, r:16 });
  } else if (I.use === 'level') addXP(h, xpNeeded(h.level) - h.xp);
  h.items.splice(i, 1);
  if (h.owner === PLAYER) toast('Used ' + I.name);
  return true;
}
function dropItem(key, x, y, by){ G.items.push({ id:G.nextId++, key, x, y, t:G.time, ignoreBy:by }); }
// Take an item out of a hero's inventory, undoing its max-health bonus.
function removeItem(h, i){
  const key = h.items.splice(i, 1)[0], I = ITEMS[key];
  if (I.hp){ h.maxHp -= I.hp; h.hp = Math.min(h.hp, h.maxHp); }
  return key;
}
function dropHeroItem(h, i){
  const key = removeItem(h, i);
  dropItem(key, h.x + 10, h.y + 8, h.id);        // this hero won't grab it again until it walks away
  if (h.owner === PLAYER) toast('Dropped ' + ITEMS[key].name);
}
const sellValue = key => Math.round((ITEMS[key].cost || ITEMS[key].value || 50) / 2);
function sellHeroItem(h, i){
  if (!hasBuilding(h.owner, 'market')) return fail(h.owner, 'You need a Market to sell items');
  const key = removeItem(h, i), v = sellValue(key);
  G.players[h.owner].gold += v;
  if (h.owner === PLAYER){ toast('Sold ' + ITEMS[key].name + ' for ' + v + ' gold'); sfx('coin'); }
  return true;
}
// Heroes pick up items they walk over.
function heroPickup(h){
  for (const it of G.items){
    if (it.taken) continue;
    const d = Math.hypot(it.x - h.x, it.y - h.y);
    if (it.ignoreBy === h.id){ if (d > TILE * 1.8) it.ignoreBy = null; continue; }   // just dropped by this hero
    if (d > TILE * 1.1) continue;
    if (h.items.length >= slotsOf(h)){
      if (h.owner === PLAYER && G.time - (h.fullWarned || -99) > 6){ h.fullWarned = G.time; toast('Inventory full: use an item first'); }
      continue;
    }
    if (!giveItem(h, it.key)) continue;
    it.taken = true;
    if (h.owner === PLAYER) toast('Found ' + ITEMS[it.key].name + ': ' + ITEMS[it.key].desc);
  }
}
function playerHero(owner){ return G.units.find(u => u.owner === owner && UNIT_TYPES[u.type].hero && !u.dead); }
const heroesOf = owner => G.units.filter(u => u.owner === owner && UNIT_TYPES[u.type].hero && !u.dead);
// ----- Mercenary camps -----
// LESSON: A neutral shop on the map. Like a gold mine it belongs to nobody;
// select it to see who is for hire. Mercenaries are not from either faction,
// a hero of yours must stand nearby to hire them, and each camp's stock is
// limited and refills slowly, so it can top up an army but never replace one.
const MERC_OFFERS = [
  { type:'bandit',  gold:80,  wood:0,   food:1, stock:3 },
  { type:'brigand', gold:85,  wood:0,   food:1, stock:3 },
  { type:'spider',  gold:110, wood:0,   food:1, stock:2 },
  { type:'ogre',    gold:200, wood:40,  food:2, stock:2 },
  { type:'golem',   gold:350, wood:100, food:3, stock:1 },
];
const MERC_REACH = 7, MERC_REFILL = 45;            // a hero must be this close (tiles); one more of each every 45s
function placeMerc(tx, ty){
  for (let y = ty; y < ty + 3; y++) for (let x = tx; x < tx + 3; x++) if (inBounds(x, y)){ G.terrain[idx(x, y)] = T_GRASS; G.wood[idx(x, y)] = 0; }
  const m = { id:G.nextId++, kind:'merc', tx, ty, size:3, stock:Object.fromEntries(MERC_OFFERS.map(o => [o.type, o.stock])), refillAt:G.time + MERC_REFILL };
  (G.mercs = G.mercs || []).push(m); markBlocked(m, m.id);
  return m;
}
// Find a clear 3x3 spot (with room around it) near a point, and put a camp there.
function placeMercNear(fx, fy){
  for (let r = 0; r < 14; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++){
    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
    const tx = Math.round(fx) + dx, ty = Math.round(fy) + dy; let ok = true;
    for (let y = ty - 1; y <= ty + 3 && ok; y++) for (let x = tx - 1; x <= tx + 3 && ok; x++) ok = inBounds(x, y) && !isBorderTile(x, y) && isWalkable(x, y) && !G.height[idx(x, y)];
    if (ok) return placeMerc(tx, ty);
  }
  return null;
}
function mercTick(){                                  // once a second: stock slowly refills
  for (const m of G.mercs || []) if (G.time >= m.refillAt){
    m.refillAt = G.time + MERC_REFILL;
    for (const o of MERC_OFFERS) m.stock[o.type] = Math.min(o.stock, (m.stock[o.type] || 0) + 1);
  }
}
// Which hero receives a purchase: the selected hero, else the first with room in its pack.
function buyerHero(owner){
  const sel = owner === PLAYER && selection.find(u => u.kind === 'unit' && u.owner === owner && UNIT_TYPES[u.type].hero && !u.dead);
  return sel || heroesOf(owner).find(x => x.items.length < slotsOf(x)) || playerHero(owner);
}
// The hero who can hire at a camp: the buyer if close enough, else any hero close enough.
function mercHero(m, owner = PLAYER){
  const c = centerOf(m), near = h => h && !h.dead && Math.hypot(h.x - c.x, h.y - c.y) / TILE <= MERC_REACH;
  const b = buyerHero(owner); return near(b) ? b : heroesOf(owner).find(near) || null;
}
function hireMerc(m, offer, owner = PLAYER){
  const P = G.players[owner], h = mercHero(m, owner), f = foodOf(owner);
  if (!h) return fail(owner, 'Bring a hero to the camp to hire');
  if (!(m.stock[offer.type] > 0)) return fail(owner, 'None left; more arrive soon');
  if (P.gold < offer.gold || P.wood < offer.wood) return fail(owner, 'Not enough resources');
  if (f.used + offer.food > f.cap) return fail(owner, 'Build more farms');
  P.gold -= offer.gold; P.wood -= offer.wood; m.stock[offer.type]--;
  const c = centerOf(m), sp = nearestFreeTile(tileOf(c.x), tileOf(c.y) + 2);
  const u = spawnUnit(offer.type, owner, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
  u.merc = true; u.food = offer.food;
  orderMove([u], h.x + TILE, h.y + TILE);
  if (owner === PLAYER){ toast(nameOf(u) + ' hired'); sfx('ack'); }
  return true;
}
function drawMerc(m){

// A bobbing arrow over the hero who will receive a purchase (Market or mercenary camp selected).
function drawBuyerArrow(){
  const e = selection[0]; if (!e || selection.length !== 1) return;
  let h = null;
  if (e.kind === 'merc') h = mercHero(e) || buyerHero(PLAYER);
  else if (e.kind === 'building' && e.owner === PLAYER && e.built >= 1 && BUILDING_TYPES[e.type].shop) h = buyerHero(PLAYER);
  else if (e.kind === 'building' && e.owner === PLAYER && e.built >= 1 && e.type === 'barracks' && kingdomLarva()) h = trainHero(e);
  if (!h || h.dead) return;
  const y = h.y - 46 - Math.abs(Math.sin(animT * 4)) * 6, x = h.x;
  ctx.fillStyle = '#0b1a2e'; ctx.beginPath(); ctx.moveTo(x - 9, y - 2); ctx.lineTo(x + 9, y - 2); ctx.lineTo(x, y + 11); ctx.closePath(); ctx.fill();
  box(x - 3, y - 11, 6, 10, '#0b1a2e');
  ctx.fillStyle = '#5aa8ff'; ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.lineTo(x, y + 8); ctx.closePath(); ctx.fill();
  box(x - 2, y - 9, 4, 8, '#5aa8ff');

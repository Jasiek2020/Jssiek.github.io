// ============================================================================
// STORYBOOK ART STYLE
// LESSON: An art style is mostly a set of rules applied everywhere:
//  - Pixel style: hard square pixels, 1-pixel outlines, flat colours, dithering.
//  - Storybook style: smooth curves, soft gradients for volume, thick ink
//    outlines, big heads and round cartoon eyes ("chibi" proportions).
//    It's drawn at 3x resolution so edges stay smooth when you zoom in.
// Both styles fill the same sprite cache, so the game can switch between them
// at any time: the cache is just emptied and refilled in the other style.
// ============================================================================
let artStyle = 'classic';
try { artStyle = localStorage.getItem('bov-art') || 'classic'; } catch (e) { /* storage unavailable */ }
const RES = 3;                                   // painted sprites are drawn at 3x resolution
function paintedCanvas(w, h, draw){
  const c = makeCanvas(w * RES, h * RES), cx = c.getContext('2d');
  cx.scale(RES, RES);
  withCtx(cx, draw);
  return c;
}

const INK = '#2a1b12';                           // the outline colour
function pPath(fill, lw = 1.1){                  // fill the current path, then ink it
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
function rrPath(x, y, w, h, r){                  // rounded-rectangle path
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function pEll(x, y, rx, ry, fill, rot = 0, lw){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); pPath(fill, lw); }
function pRect(x, y, w, h, r, fill, lw){ ctx.beginPath(); rrPath(x, y, w, h, r); pPath(fill, lw); }
function pPoly(pts, fill, lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); pPath(fill, lw);
}
// A thick coloured line with an ink border: handles, poles, legs, bow limbs.
function pLine(x0, y0, x1, y1, color, w){
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = INK; ctx.lineWidth = w + 1.6; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
// Gradients give shapes volume: light from the top-left, shadow to the bottom-right.
function lin(x0, y0, x1, y1, c, amt = .3){
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, shade(c, amt)); g.addColorStop(1, shade(c, -amt)); return g;
}
function rad(x, y, r, c){
  const g = ctx.createRadialGradient(x - r * .35, y - r * .45, r * .1, x, y, r * 1.05);
  g.addColorStop(0, shade(c, .4)); g.addColorStop(.6, c); g.addColorStop(1, shade(c, -.3)); return g;
}
function gloss(x, y, rx, ry){ ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, -.6, 0, Math.PI * 2); ctx.fill(); }

function pFeet(x, y, u, c){
  const s = u.moving && Math.sin(u.anim * 14) > 0 ? 1 : 0;
  pEll(x - 2.8, y + 6.6 - s, 2.4, 1.7, c); pEll(x + 2.8, y + 6.6 - (u.moving ? 1 - s : 0), 2.4, 1.7, c);
}
function pHead(x, y, F, r = 6){ pEll(x, y, r, r * .95, rad(x, y, r, F.skin)); }
function pTusks(x, y, fc){
  ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = INK; ctx.lineWidth = .55;
  for (const tx of [x + fc * 1.4, x + fc * 4]){ ctx.beginPath(); ctx.moveTo(tx - .8, y); ctx.lineTo(tx, y - 2.2); ctx.lineTo(tx + .8, y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
}
function pMouth(x, y, fc){ ctx.strokeStyle = INK; ctx.lineWidth = .7; ctx.beginPath(); ctx.arc(x + fc * 3, y, 1.2, .2, Math.PI - .2); ctx.stroke(); }

// Weapons are drawn upright in their own little coordinate system, then
// rotated into place: upright when idle, swung forward when attacking.
function weapon(kind, gx, gy, ang, fc, k = 1){
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(ang); ctx.scale(fc * k, k);
  const steel = '#dfe5ea';
  if (kind === 'sword' || kind === 'bigsword'){
    const L = kind === 'bigsword' ? 17 : 13;
    ctx.beginPath(); ctx.moveTo(-1.2, 0); ctx.lineTo(-1.2, -L + 2); ctx.lineTo(0, -L); ctx.lineTo(1.2, -L + 2); ctx.lineTo(1.2, 0); ctx.closePath();
    pPath(lin(-1, -L, 1, 0, steel, .25), .9);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(-.35, -L + 2.5, .6, L - 4);
    pRect(-3, -.6, 6, 1.6, .8, '#e8c547', .8); pLine(0, 1, 0, 3.5, '#7a4f2a', 1.1);
  } else if (kind === 'axe' || kind === 'greataxe'){
    const L = kind === 'greataxe' ? 16 : 13;
    pLine(0, 3, 0, -L, '#8a5a33', 1.4);
    const blade = (dir) => { ctx.beginPath(); ctx.moveTo(0, -L + 1); ctx.quadraticCurveTo(dir * 6.5, -L - 2, dir * 6, -L + 7); ctx.quadraticCurveTo(dir * 3, -L + 5, 0, -L + 5.5); ctx.closePath(); pPath(lin(0, -L - 2, dir * 6, -L + 7, '#c5cbd1', .3), .9); };
    blade(1); if (kind === 'greataxe') blade(-1);
  } else if (kind === 'pick'){
    pLine(0, 3, 0, -10, '#8a5a33', 1.3);
    ctx.beginPath(); ctx.moveTo(-5, -7.5); ctx.quadraticCurveTo(0, -13, 5, -7.5); ctx.quadraticCurveTo(0, -10.2, -5, -7.5); ctx.closePath();
    pPath(lin(-5, -12, 5, -8, '#c5cbd1', .3), .9);
  } else if (kind === 'spear' || kind === 'lance'){
    const L = kind === 'lance' ? 24 : 20;
    pLine(0, 5, 0, -L + 3, '#8a5a33', kind === 'lance' ? 1.6 : 1.2);
    pPoly([[-1.8, -L + 4], [0, -L - 1.5], [1.8, -L + 4]], lin(0, -L, 0, -L + 4, steel, .25), .8);
  } else if (kind === 'club'){
    pLine(0, 3, 0, -9, '#7a5530', 2.4);
    pEll(0, -12, 3.4, 5, rad(0, -12, 4, '#7a5530'));
    for (const [sx, sy] of [[-3, -13], [3, -11], [0, -16.5], [-2, -9], [2.5, -15]]) pEll(sx, sy, .7, .7, '#d9dde1', 0, .5);
  } else if (kind === 'sling'){
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(1.5, -3, 0, -7); ctx.stroke();
    ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = .7; ctx.stroke();
    pEll(0, -7.6, 1.8, 1.3, '#5e4331', 0, .7); pEll(0, -8.2, .9, .9, '#a09a90', 0, .5);
  } else if (kind === 'darkstaff'){
    pLine(0, 7, 0, -13, '#5a3d22', 1.4);
    const g = ctx.createRadialGradient(0, -15, 0, 0, -15, 6.5); g.addColorStop(0, 'rgba(220,180,255,.95)'); g.addColorStop(1, 'rgba(160,90,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -15, 6.5, 0, Math.PI * 2); ctx.fill();
    pEll(0, -15, 2.4, 2.4, rad(0, -15, 2.4, '#b98aff'), 0, .8);
  } else if (kind === 'staff' || kind === 'totem'){
    pLine(0, 7, 0, -13, '#8a5a33', 1.3);
    if (kind === 'staff'){
      const g = ctx.createRadialGradient(0, -15, 0, 0, -15, 6); g.addColorStop(0, 'rgba(180,240,255,.9)'); g.addColorStop(1, 'rgba(160,230,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -15, 6, 0, Math.PI * 2); ctx.fill();
      pPoly([[0, -19], [2.2, -15], [0, -11.5], [-2.2, -15]], lin(-2, -19, 2, -12, '#9fe3ff', .35), .8);
    } else {
      pEll(0, -15, 3, 2.8, rad(0, -15, 3, '#efe6cf'), 0, .8);
      ctx.fillStyle = INK; ctx.fillRect(-1.5, -15.6, 1, 1); ctx.fillRect(.5, -15.6, 1, 1);
      pLine(-2.5, -13, -4, -9, '#d8452e', .8); pLine(2.5, -13, 4, -9, '#f2cf4b', .8);   // feathers
    }
  }
  ctx.restore();
}
const swingAngle = (fc, sw) => sw ? fc * 1.35 : fc * .15;
// Draw a character bigger (heroes, ogres) by scaling around its feet.
function scaled(x, y, k, fn){ ctx.save(); ctx.translate(x, y + 8); ctx.scale(k, k); ctx.translate(-x, -(y + 8)); fn(); ctx.restore(); }

const PAINTED = {
  worker(x, y, fc, F, u, sw){

      else { pRect(bx - 4, y - 6, 8, 3.2, 1.6, lin(bx, y - 6, bx, y - 3, '#9a6634')); pRect(bx - 4, y - 2.8, 8, 3.2, 1.6, lin(bx, y - 3, bx, y, '#8a5a2b')); }

    weapon('pick', x + fc * 5, y + 1, swingAngle(fc, sw), fc);

  footman(x, y, fc, F, u, sw){

  archer(x, y, fc, F, u, sw){

      if (orc){
        pTusks(x + fc * .4, y - 4, fc);
        ctx.beginPath(); ctx.arc(x, y - 9.2, 6.6, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); pPath(rad(x, y - 12, 6.6, F.helm));
        for (const s of [-1, 1]){ ctx.beginPath(); ctx.moveTo(x + s * 5, y - 12.5); ctx.quadraticCurveTo(x + s * 11, y - 14, x + s * 10, y - 21.5); ctx.quadraticCurveTo(x + s * 8.4, y - 15.5, x + s * 3, y - 14.2); ctx.closePath(); pPath(lin(x, y - 21, x, y - 12, '#efe6cf', .2), .9); }
      } else {
        pMouth(x, y - 5.4, fc);
        pPoly([[x - 5, y - 12.5], [x - 5, y - 16.5], [x - 2.5, y - 14.2], [x, y - 17.5], [x + 2.5, y - 14.2], [x + 5, y - 16.5], [x + 5, y - 12.5]], lin(x, y - 17, x, y - 12, '#f2cf4b', .3), .9);   // crown
        pEll(x, y - 13.6, .9, .9, '#d8452e', 0, .5);
      }
      weapon(orc ? 'greataxe' : 'bigsword', x + fc * 6, y + 1, swingAngle(fc, sw), fc);
      pEll(x + fc * 6, y + 1.2, 1.8, 1.8, F.skin, 0, .8);
    });
  },

  knight(x, y, fc, F, u, sw){
    const wolf = F.horns, mount = wolf ? '#8a837c' : '#9a6434';
    const st = u.moving && Math.sin(u.anim * 16) > 0 ? 1.2 : 0;
    for (const [lx, ph] of [[-7, 0], [-3, 1], [4, 0], [8, 1]]) pRect(x + lx - 1.3, y + 1 - (ph ? st : 1.2 - st), 2.6, 7, 1.2, shade(mount, -.2), .9);   // legs
    if (wolf) pEll(x - fc * 11, y - 2.5, 4, 2, rad(x - fc * 11, y - 2.5, 4, shade(mount, .2)), -fc * .4);   // bushy tail
    else pLine(x - fc * 10, y - 3, x - fc * 12.5, y + 3, '#3a2a1a', 1.8);                                    // horse tail
    pEll(x, y - 1.5, 10, 5.2, rad(x, y - 1.5, 10, mount));                                                   // body
    pEll(x + fc * 8, y - 6, 3, 4.4, rad(x + fc * 8, y - 6, 4, mount), fc * .5);                             // neck
    pEll(x + fc * 11.5, y - 8.5, 4.2, 2.8, rad(x + fc * 11.5, y - 8.5, 4, mount), fc * .25);                 // head
    pEyes(x + fc * 9.5, y - 9.5, fc, wolf);
    if (wolf){ for (const k of [0, 2.2]) pPoly([[x + fc * (9 + k), y - 10.5], [x + fc * (9.5 + k), y - 14.5], [x + fc * (11 + k), y - 10.8]], shade(mount, -.1), .8); pPoly([[x + fc * 14.2, y - 7.3], [x + fc * 14.8, y - 5.3], [x + fc * 15.3, y - 7.3]], '#fffaf0', .5); }
    else { pLine(x + fc * 6.5, y - 11, x + fc * 9.5, y - 5, '#3a2a1a', 1.5); }                             // mane
    pRect(x - 6.5, y - 5, 13, 6, 2.5, lin(x - 6, y - 5, x + 6, y + 1, F.color));                             // barding
    ctx.fillStyle = '#e8c547'; ctx.fillRect(x - 6, y - 1.2, 12, 1);
    // Rider
    pEll(x, y - 8.5, 4.4, 4, rad(x, y - 8.5, 4.4, wolf ? '#7a5a3c' : '#b8c0c7'));
    pHead(x, y - 15, F, 5); pEyes(x, y - 15.3, fc, wolf);
    if (wolf){ pTusks(x + fc * .3, y - 11.8, fc); ctx.beginPath(); ctx.arc(x, y - 16, 5.4, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); pPath(rad(x, y - 18, 5, F.helm)); }
    else { ctx.beginPath(); ctx.arc(x, y - 15.8, 5.6, Math.PI, 0); ctx.lineTo(x + 5.6, y - 15); ctx.lineTo(x - 5.6, y - 15); ctx.closePath(); pPath(rad(x, y - 18, 5.6, '#c9d0d6')); pEll(x - fc * 2, y - 22.5, 1.6, 2.8, rad(x, y - 22, 2, F.color), -fc * .4); }
    weapon('lance', x + fc * 4, y - 7, sw ? fc * 1.45 : fc * .12, fc);
  },

  priest(x, y, fc, F, u, sw){
    const orc = F.horns, robe = orc ? '#6b5640' : '#f1ebdd';
    ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.quadraticCurveTo(x - 7.5, y + 4, x - 6.5, y + 8); ctx.quadraticCurveTo(x, y + 9.5, x + 6.5, y + 8); ctx.quadraticCurveTo(x + 7.5, y + 4, x + 4, y - 4); ctx.closePath();
    pPath(lin(x - 6, y - 4, x + 6, y + 8, robe, .25));
    ctx.fillStyle = F.color; ctx.fillRect(x - .9, y - 3.5, 1.8, 11.5);
    if (orc) pEll(x, y - 3.6, 5.6, 2, rad(x, y - 3.6, 5.6, '#9a8a70'));
    pHead(x, y - 8, F, 5.8); pEyes(x, y - 8.3, fc, false);
    if (orc){
      pTusks(x + fc * .4, y - 4.3, fc);
      for (const [dx, c] of [[-3, '#d8452e'], [0, '#f2cf4b'], [3, '#4f8a3c']]) pEll(x + dx, y - 15, 1.1, 3.4, c, dx * .08, .7);   // feathers
      pRect(x - 5, y - 13.4, 10, 2, 1, '#8a5a33', .8);
    } else {
      pMouth(x, y - 5.6, fc);
      ctx.beginPath(); ctx.ellipse(x, y - 9.6, 6.6, 5.4, 0, Math.PI * .98, Math.PI * 2.02); ctx.quadraticCurveTo(x - fc * 8.5, y - 8, x - fc * 7, y - 2); ctx.closePath();
      pPath(rad(x, y - 12, 6.6, robe));
      ctx.fillStyle = F.color; ctx.fillRect(x - 5.8, y - 11.2, 11.6, 1.1);
    }
    weapon(orc ? 'totem' : 'staff', x + fc * 6.5, y + 1, fc * .08, fc);
    pEll(x + fc * 6.5, y + 1, 1.6, 1.6, F.skin, 0, .8);
  },

  // ----- Creeps -----
  kslinger(x, y, fc, F, u, sw){ PAINTED.kobold(x, y, fc, F, u, sw, true); },
  wolf(x, y, fc, F, u, sw){
    const fur = '#6e645a', st = u.moving && Math.sin(u.anim * 16) > 0 ? 1.2 : 0;
    for (const [lx, ph] of [[-7, 0], [-3, 1], [3.5, 0], [7, 1]]) pRect(x + lx - 1.4, y + .5 - (ph ? st : 1.2 - st), 2.8, 7.4, 1.2, shade(fur, -.25), 1);
    pEll(x - fc * 10, y - 4, 4.6, 2.2, rad(x - fc * 10, y - 4, 4.6, shade(fur, .15)), -fc * .5);          // bushy tail
    pEll(x, y - 2.5, 9, 5, rad(x, y - 2.5, 9, fur), 0, 1.2);                                            // body
    pEll(x - fc * 1, y - 5.6, 6, 2.4, rad(x, y - 6, 6, shade(fur, -.15)), 0, .9);                       // dark back
    pEll(x + fc * 8, y - 7, 4.4, 3.8, rad(x + fc * 8, y - 7, 4.4, fur), 0, 1.1);                        // head
    pEll(x + fc * 11.4, y - 5.8, 2.8, 1.9, rad(x + fc * 11.4, y - 6, 2.8, shade(fur, .1)), 0, 1);       // snout
    for (const k of [0, 2.4]) pPoly([[x + fc * (5.8 + k), y - 9.6], [x + fc * (6.6 + k), y - 13.6], [x + fc * (8.2 + k), y - 9.9]], shade(fur, -.2), .9);
    pEyes(x + fc * 6.4, y - 8, fc, true, '#ffcf3a');
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + fc * 13.8, y - 6.2, .8, 0, Math.PI * 2); ctx.fill();   // nose
    if (sw) for (const k of [10.2, 11.4, 12.6]) pPoly([[x + fc * k - .4, y - 4.6], [x + fc * k, y - 2.8], [x + fc * k + .4, y - 4.6]], '#fffaf0', .4);
  },
  spitter(x, y, fc, F, u, sw){ PAINTED.spider(x, y, fc, F, u, sw, '#3f5a30', '#b8e04a'); },
  ogremage(x, y, fc, F, u, sw){ PAINTED.ogre(x, y, fc, F, u, sw, '#7f8fb8', true); },
  kobold(x, y, fc, F, u, sw, sling){
    scaled(x, y, .92, () => {
      const skin = '#c7743f';
      ctx.beginPath(); ctx.moveTo(x - fc * 3, y + 3); ctx.quadraticCurveTo(x - fc * 10, y + 4, x - fc * 10, y - 2); ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.stroke(); ctx.strokeStyle = skin; ctx.lineWidth = 1.8; ctx.stroke();
      pFeet(x, y, u, shade(skin, -.2));
      pEll(x, y + 1.5, 4.6, 4.3, rad(x, y + 1.5, 4.6, '#7d6a45'));
      pEll(x + fc * 1, y - 6.5, 5.2, 4.6, rad(x, y - 6.5, 5.2, skin));
      pEll(x + fc * 5, y - 5.2, 3, 2.2, rad(x + fc * 5, y - 5.2, 3, skin));                        // snout
      for (const s of [-1, 1]) pPoly([[x + s * 3.5, y - 9], [x + s * 8.5, y - 11.5], [x + s * 4.8, y - 6.5]], shade(skin, .1), .8);   // ears
      pEyes(x + fc * .5, y - 7.4, fc, false, '#ffd23a');
      ctx.beginPath(); ctx.arc(x + fc * .8, y - 9.2, 4.6, Math.PI, 0); ctx.closePath(); pPath(rad(x, y - 11, 4.6, '#6a625a'));   // helmet
      pRect(x + fc * .8 - .9, y - 16, 1.8, 3.6, .6, '#f4efe2', .7);                                 // candle
      const fl = ctx.createRadialGradient(x + fc * .8, y - 17, 0, x + fc * .8, y - 17, 4); fl.addColorStop(0, 'rgba(255,220,120,.9)'); fl.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(x + fc * .8, y - 17, 4, 0, Math.PI * 2); ctx.fill();
      pEll(x + fc * .8, y - 17.2, .9, 1.5, '#ffd23a', 0, .5);
      weapon(sling ? 'sling' : 'pick', x + fc * 5, y + 1, sling ? (sw ? fc * -1.2 : fc * .3) : swingAngle(fc, sw), fc);
    });
  },
  spider(x, y, fc, F, u, sw, body = '#4a3656', mark = '#e0404e'){
    const st = u.moving && Math.sin(u.anim * 14) > 0 ? 1 : 0;
    for (const side of [-1, 1]) for (let k = 0; k < 4; k++){
      const lift = (k + st) % 2 ? 1.5 : 0, ax = x + side * 3, ay = y - 2 + k * 1.2;
      const kx = x + side * (9 + k * 1.5), ky = y - 8 + k * 2 - lift, fx = x + side * (12.5 + k * 1.3), fy = y + 4 + k * .6 - lift;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(kx - side, ky - 2, kx, ky); ctx.lineTo(fx, fy);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ctx.stroke(); ctx.strokeStyle = shade(body, -.1); ctx.lineWidth = 1.2; ctx.stroke();
    }
    pEll(x - fc * 4, y - 3, 7.4, 6.4, rad(x - fc * 4, y - 3, 7.4, body));                          // abdomen
    pPoly([[x - fc * 4 - 1.8, y - 6], [x - fc * 4 + 1.8, y - 6], [x - fc * 4, y - 3], [x - fc * 4 + 1.8, y], [x - fc * 4 - 1.8, y], [x - fc * 4, y - 3]], mark, .5);   // hourglass
    const hx = x + fc * (sw ? 6.5 : 5);
    pEll(hx, y - 3, 4.2, 3.8, rad(hx, y - 3, 4.2, body));
    for (const [ex, ey, r] of [[1.2, -4.6, .9], [3, -4.3, .9], [2.1, -3, .6], [.2, -3.2, .5]]){ ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(hx + fc * ex, y + ey, r, 0, Math.PI * 2); ctx.fill(); }
    for (const fx of [1.8, 3.2]) pPoly([[hx + fc * fx - .6, y - .6], [hx + fc * fx, y + 2.2], [hx + fc * fx + .6, y - .6]], '#fffaf0', .5);
  },
  ogre(x, y, fc, F, u, sw, skin = '#a497bb', mage = false){
    scaled(x, y, 1.38, () => {
      pFeet(x, y, u, shade(skin, -.3));
      pEll(x, y, 6.6, 6.2, rad(x, y, 6.6, skin));                                                      // belly
      pEll(x + fc * .5, y + 1.5, 4, 3.4, rad(x, y + 1.5, 4, shade(skin, .12)), 0, .7);
      pRect(x - 6.4, y + 3, 12.8, 3.2, 1.2, lin(x, y + 3, x, y + 6, '#7a5530'), .9);                  // loincloth
      pEll(x + fc * .5, y - 9, 5, 4.6, rad(x, y - 9, 5, skin));                                        // head
      pEll(x + fc * 4.2, y - 8.2, 1.9, 1.6, rad(x + fc * 4, y - 8, 2, shade(skin, -.08)), 0, .8);      // big nose
      pEyes(x + fc * .2, y - 10.2, fc, true);
      ctx.strokeStyle = INK; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(x + fc * 1, y - 5.6); ctx.lineTo(x + fc * 4.2, y - 5.6); ctx.stroke();
      pPoly([[x + fc * 1.6, y - 5.6], [x + fc * 2.1, y - 7.2], [x + fc * 2.6, y - 5.6]], '#fffaf0', .45);
      pEll(x - fc * 1, y - 14, 1.2, 1.6, '#3a2a1a', 0, .6);                                            // topknot
      if (mage){                                                                            // shaman's hood and staff
        ctx.beginPath(); ctx.arc(x + fc * .5, y - 10, 5.4, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); pPath(rad(x, y - 13, 5.4, '#4a3a6a'), 1);
        weapon('darkstaff', x + fc * 6.5, y + .5, fc * .1, fc);
      } else weapon('club', x + fc * 6.5, y + .5, swingAngle(fc, sw), fc);
      pEll(x + fc * 6.5, y + .8, 2.2, 2.2, skin, 0, .8);
    });
  },
  golem(x, y, fc, F, u, sw){
    scaled(x, y, 1.32, () => {
      const rock = '#8f8a80', rune = '#7ff0d0';
      pFeet(x, y, u, '#6a655d');
      pRect(x - 7, y - 8, 14, 13, 4.5, rad(x, y - 2, 9, rock));                                        // torso
      ctx.strokeStyle = 'rgba(42,27,18,.55)'; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(x - 4, y - 6); ctx.lineTo(x - 2, y - 2); ctx.lineTo(x - 3.5, y + 2); ctx.moveTo(x + 3, y - 1); ctx.lineTo(x + 5, y + 3); ctx.stroke();
      const g = ctx.createRadialGradient(x, y - 3, 0, x, y - 3, 5); g.addColorStop(0, 'rgba(127,240,208,.9)'); g.addColorStop(1, 'rgba(127,240,208,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 3, 5, 0, Math.PI * 2); ctx.fill();
      pPoly([[x, y - 5.5], [x + 1.8, y - 3], [x, y - .5], [x - 1.8, y - 3]], rune, .6);                 // rune
      pEll(x - 4, y - 8, 2.8, 1.2, '#5f9a44', 0, .6);                                                   // moss
      pRect(x - 4, y - 15, 8, 7, 2.5, rad(x, y - 12, 5, rock));                                        // head
      pEyes(x - fc * .8, y - 11.8, fc, false, rune);
      for (const s of [-1, 1]) pEll(x + s * 8.5, y - 6, 3.6, 3.4, rad(x + s * 8.5, y - 6, 3.6, rock));  // shoulders
      if (sw) pEll(x + fc * 11, y - 1, 3.6, 3.2, rad(x + fc * 11, y - 1, 3.6, shade(rock, .05)));       // punch
      else for (const s of [-1, 1]) pEll(x + s * 9.5, y + 1, 3.2, 3.3, rad(x + s * 9.5, y + 1, 3.3, shade(rock, -.05)));
    });
  },
};



// ----------------------------------------------------------------------------
// GRIM, HEROIC PROPORTIONS (Warcraft-like)
// LESSON: Proportions carry a style more than detail does. Cute = big head,
// round eyes, small body. Heroic/grim = SMALL head, HUGE shoulders, big fists,
// oversized weapons, heavy boots, a narrow hard stare and a darker palette.
// The same drawing tools, different proportions, and it's a different game.
// ----------------------------------------------------------------------------
const G_STEEL = '#8e979f', G_DARK = '#4e565e', G_GOLD = '#c9a24a', G_LEATHER = '#5e4331';

// Narrow, shadowed eyes under a heavy brow (replaces the big cartoon eyes).
function pEyes(x, y, fc, angry, glow){
  for (const ex of [x + fc * 1.2, x + fc * 3.6]){
    ctx.fillStyle = 'rgba(20,10,5,.55)'; ctx.beginPath(); ctx.ellipse(ex, y, 1.35, .95, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = glow || (angry ? '#ffcf3a' : '#efe8da'); ctx.beginPath(); ctx.ellipse(ex + fc * .2, y + .1, .78, .52, 0, 0, Math.PI * 2); ctx.fill();
    if (!glow){ ctx.fillStyle = INK; ctx.fillRect(ex + fc * .3 - .25, y - .22, .5, .6); }
  }
  ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(x - fc * .4, y - (angry ? 2 : 1.4)); ctx.lineTo(x + fc * 2.3, y - 1.05);
  ctx.moveTo(x + fc * 2.6, y - 1.05); ctx.lineTo(x + fc * 5, y - (angry ? 2.1 : 1.5)); ctx.stroke();
}
function gLegs(x, y, u, pants, boots){
  const st = u.moving && Math.sin(u.anim * 14) > 0 ? 1 : 0, st2 = u.moving ? 1 - st : 0;
  pRect(x - 4.6, y + 1, 3.8, 5.6 - st, 1, pants, 1); pRect(x + .8, y + 1, 3.8, 5.6 - st2, 1, pants, 1);
  pRect(x - 5.9, y + 5.3 - st, 5.3, 3.1, 1.3, lin(0, y + 5, 0, y + 8.5, boots, .25), 1.1);
  pRect(x + .6, y + 5.3 - st2, 5.3, 3.1, 1.3, lin(0, y + 5, 0, y + 8.5, boots, .25), 1.1);
}
// A torso that is broad at the shoulders and narrow at the waist.
function gTorso(x, y, c, w = 6.8){
  ctx.beginPath(); ctx.moveTo(x - w, y - 6.5); ctx.quadraticCurveTo(x, y - 8, x + w, y - 6.5);
  ctx.lineTo(x + w - 1.7, y + 3.2); ctx.quadraticCurveTo(x, y + 4.2, x - w + 1.7, y + 3.2); ctx.closePath();
  pPath(lin(x - w, y - 7, x + w, y + 3, c, .32), 1.3);
}
function gTabard(x, y, c, trim){
  ctx.beginPath(); ctx.moveTo(x - 3, y - 6.4); ctx.lineTo(x + 3, y - 6.4); ctx.lineTo(x + 2.6, y + 5.2); ctx.lineTo(x, y + 6.8); ctx.lineTo(x - 2.6, y + 5.2); ctx.closePath();
  ctx.fillStyle = lin(x - 3, y - 6, x + 3, y + 6, c, .3); ctx.fill(); ctx.lineWidth = .9; ctx.strokeStyle = trim || INK; ctx.stroke();
}
function gBelt(x, y){ pRect(x - 5.3, y + 1.2, 10.6, 2.1, .8, '#2e2118', .8); pRect(x - 1.1, y + 1, 2.2, 2.5, .4, G_GOLD, .6); }
function gPauldrons(x, y, c, spikes, k = 1){
  for (const s of [-1, 1]){
    pEll(x + s * 6.8 * k, y - 5.8, 3.9 * k, 3.2 * k, rad(x + s * 6.8 * k, y - 6.2, 3.9 * k, c), 0, 1.2);
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + s * 6.8 * k - 1.5, y - 7.6, 1.2, .8);
    if (spikes) pPoly([[x + s * 5.3 * k, y - 8.2], [x + s * 7.5 * k, y - 13.2], [x + s * 8.6 * k, y - 7.9]], lin(0, y - 13, 0, y - 8, '#d9d0bd', .2), .8);
  }
}
const gFist = (x, y, c) => pEll(x, y, 2.3, 2.2, rad(x, y, 2.3, c), 0, 1);
function gHead(x, y, F, fc, orc){
  if (orc){
    pEll(x + fc * .3, y, 4.6, 4.2, rad(x, y, 4.6, F.skin), 0, 1.2);
    pEll(x + fc * 1.8, y + 2.6, 3.4, 2.2, rad(x + fc * 1.8, y + 2.6, 3.4, shade(F.skin, -.12)), 0, 1.1);   // heavy jaw
    pEyes(x, y - .7, fc, true);
    pTusks(x + fc * .7, y + 2.3, fc);
  } else {
    pEll(x + fc * .3, y, 4.2, 4.2, rad(x, y, 4.2, F.skin), 0, 1.2);
    pEyes(x, y - .3, fc, false);
  }
}
function beard(x, y, fc, c){
  ctx.beginPath(); ctx.moveTo(x - fc * 1.4, y); ctx.quadraticCurveTo(x + fc * .8, y + 4.6, x + fc * 4.2, y + .3);
  ctx.quadraticCurveTo(x + fc * 2, y + 1.3, x - fc * 1.4, y); ctx.closePath(); pPath(lin(0, y, 0, y + 4, c, .2), .9);
}
function orcHorns(x, y, k = 1){
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(x + s * 3.6 * k, y); ctx.quadraticCurveTo(x + s * 8.5 * k, y - 1.5 * k, x + s * 7.6 * k, y - 7 * k);
    ctx.quadraticCurveTo(x + s * 6.6 * k, y - 2.8 * k, x + s * 2 * k, y - 1.4 * k); ctx.closePath();
    pPath(lin(0, y - 7 * k, 0, y, '#e6dcc4', .22), .9);
  }
}
function carrySack(x, y, fc, carry){
  const bx = x - fc * 7;
  if (carry.res === 'gold'){ pEll(bx, y - .5, 4.2, 4.8, rad(bx, y, 4.4, '#8a6a3e'), 0, 1.1); pEll(bx, y - 4.8, 2.6, 1.4, rad(bx, y - 5, 2.6, '#f2cf4b'), 0, .8); gloss(bx - 1, y - 5.2, 1, .5); }

// Storybook buildings
// Kingdom: white plaster with dark timber beams, stone footings, curved
// scalloped roofs. Orcs: log palisades, stitched hide domes, bone tusks.
// ----------------------------------------------------------------------------
function pWall(x, y, w, h, F){
  if (F.horns){
    const n = Math.max(3, Math.round(w / 6)), lw = w / n;
    for (let i = 0; i < n; i++){
      const lx = x + i * lw, top = y + (i % 2) * 1.6;
      pRect(lx, top, lw, h - (i % 2) * 1.6, lw / 2, lin(lx, 0, lx + lw, 0, '#8e5c34', .28), .9);
    }
    ctx.fillStyle = '#4a3322'; ctx.fillRect(x, y + h * .3, w, 1.4); ctx.fillRect(x, y + h * .72, w, 1.4);
  } else {
    pRect(x, y, w, h, 1.5, lin(x, y, x + w, y + h, F.plaster || '#f1e6cc', .12));
    ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x + .5, y + .5, w - 1, 1.8);
    for (let bx = x + 10; bx < x + w - 4; bx += 12) ctx.fillRect(bx, y, 1.8, h - 5);
    ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 1.3; ctx.beginPath();
    for (let bx = x + 10; bx < x + w - 14; bx += 24){ ctx.moveTo(bx + 1, y + h - 6); ctx.lineTo(bx + 12, y + 3); }
    ctx.stroke();

function pRoof(x, y, w, h, F){

    ctx.beginPath();

    ctx.closePath();
  };
  path(); ctx.fillStyle = lin(x, y, x + w, y + h, F.color, .28); ctx.fill();
  ctx.save(); path(); ctx.clip();
  if (F.horns){
    ctx.fillStyle = shade(F.color, -.18); ctx.beginPath(); ctx.ellipse(x + w * .3, y + h * .6, w * .11, h * .16, .3, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = shade(F.color, .38); ctx.lineWidth = .7; ctx.setLineDash([1.5, 1.5]); ctx.beginPath();
    for (let k = 1; k < 4; k++){ const sx = x + w * k / 4; ctx.moveTo(sx, y); ctx.quadraticCurveTo(sx + (k - 2) * 4, y + h * .5, sx + (k - 2) * 7, y + h + 2); }

    ctx.fillStyle = shade(F.color, -.22);

  path(); ctx.lineWidth = 1.2; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.stroke();

}
function pWin(x, y, r){
  pEll(x, y, r + 1, r + 1, '#6b4a2b', 0, .9);

  pLine(cx - 16, py + s - 31, cx + 16, py + s - 31, '#9a6634', 3);
  for (const [dx, dy] of [[18, 40], [72, 36], [30, 70], [78, 60], [42, 16], [62, 20], [86, 46]]){ pEll(px + dx, py + dy, 2.6, 2, rad(px + dx, py + dy, 2.6, '#f2cf4b'), 0, .7); gloss(px + dx - .8, py + dy - .6, .8, .4); }

// ============================================================================
// CLASSIC ART STYLE: 8 directions and real animation (Warcraft 2 style)
// LESSON: Instead of one fixed picture per unit, a "rig" builds the character
// from parts (legs, body, arms, head, headgear, weapon, shield) and poses them
// for a direction and an animation frame. We draw 5 directions
// (S, SE, E, NE, N) and mirror three of them for SW, W and NW, which is
// exactly what classic 2D RTS artists did to save work.
// Frames: idle; walk 0-3 (legs step, body bobs, arms swing);
// attack 0-2 (wind up, raise, strike). Work (chopping, building) reuses attack.
// ============================================================================

// Screen direction of a movement: 0=E 1=SE 2=S 3=SW 4=W 5=NW 6=N 7=NE.
const dirOf = (dx, dy) => (Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8;
// Which of our 5 drawn views a direction uses, and whether to mirror it.
const DIR_VIEW = [[2, false], [1, false], [0, false], [1, true], [2, true], [3, true], [4, false], [3, false]];
//                  E          SE          S          SW         W         NW         N          NE

// Per view (0=S front, 1=SE, 2=E side, 3=NE, 4=N back): body width, where the
// weapon hand and shield sit, whether each is in front of the body, and which
// way "forward" points on screen (the direction of a strike).
const CVIEW = [
  { tw:10, hand:-6, shield:6,  handFront:true,  shieldFront:true,  fwd:[0, 1],        face:2, stride:false },   // S
  { tw:9,  hand:-4, shield:5,  handFront:true,  shieldFront:false, fwd:[.7, .7],      face:1, stride:true  },   // SE
  { tw:7,  hand:1,  shield:-3, handFront:true,  shieldFront:false, fwd:[1, 0],        face:1, stride:true  },   // E
  { tw:9,  hand:5,  shield:-4, handFront:true,  shieldFront:false, fwd:[.7, -.7],     face:0, stride:true  },   // NE
  { tw:10, hand:6,  shield:-6, handFront:false, shieldFront:false, fwd:[0, -1],       face:0, stride:false },   // N
];

// A crisp pixel line (thickness w), for weapons, bows and legs.
function pline(x0, y0, x1, y1, c, w = 1){
  const n = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for (let i = 0; i <= n; i++){ const t = i / n; box(x0 + (x1 - x0) * t - (w >> 1), y0 + (y1 - y0) * t - (w >> 1), w, w, c); }
}
const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };

// Where the weapon points for this frame: upright at rest, back for the
// wind-up, straight up, then forward and down for the strike.
function weaponDir(V, act, fr){
  const [fx, fy] = V.fwd;
  if (act !== 'attack') return norm(fx * .25, -1);
  if (fr === 0) return norm(-fx * .7, -1 - fy * .3);
  if (fr === 1) return [0, -1];
  return norm(fx, fy + .45);
}

// Pixel-art weapons, drawn from the hand (hx, hy) along direction (dx, dy).
function cWeapon(kind, hx, hy, dx, dy, act, fr, F){
  const px = -dy, py = dx;                                          // perpendicular
  const at = (L) => [hx + dx * L, hy + dy * L];
  const STEEL = '#cfd6dc', DARKSTEEL = '#7d868e', WOODC = '#7a5530';
  if (kind === 'sword' || kind === 'bigsword'){
    const L = kind === 'bigsword' ? 15 : 11, [tx, ty] = at(L), [gx, gy] = at(1.5);
    pline(hx - dx * 2, hy - dy * 2, hx, hy, '#6b4a2b', 2);
    pline(gx, gy, tx, ty, STEEL, 2); pline(gx, gy, tx, ty, '#ffffff', 1);
    pline(gx - px * 3, gy - py * 3, gx + px * 3, gy + py * 3, '#e0b84a', 1);
  } else if (kind === 'axe' || kind === 'greataxe'){
    const L = kind === 'greataxe' ? 14 : 11, [tx, ty] = at(L), [bx, by] = at(L - 3);
    pline(hx - dx * 2, hy - dy * 2, tx, ty, WOODC, 2);
    const side = kind === 'greataxe' ? [1, -1] : [1];
    for (const s of side){
      for (let k = 0; k < 5; k++) pline(bx + dx * k * .8, by + dy * k * .8, bx + dx * k * .8 + px * s * (3 + (k === 2 ? 2 : k === 1 || k === 3 ? 1 : 0)),
                                        by + dy * k * .8 + py * s * (3 + (k === 2 ? 2 : k === 1 || k === 3 ? 1 : 0)), k === 2 ? '#ffffff' : STEEL, 1);
    }
  } else if (kind === 'pick'){
    const [tx, ty] = at(9);
    pline(hx - dx * 2, hy - dy * 2, tx, ty, WOODC, 2);
    pline(tx - px * 4 + dx, ty - py * 4 + dy, tx + px * 4 + dx, ty + py * 4 + dy, DARKSTEEL, 2);
    box(tx + px * 4 + dx, ty + py * 4 + dy, 1, 1, STEEL);
  } else if (kind === 'spear' || kind === 'lance'){
    const L = kind === 'lance' ? 20 : 17, [tx, ty] = at(L);
    pline(hx - dx * 4, hy - dy * 4, tx, ty, WOODC, kind === 'lance' ? 2 : 1);
    pline(tx, ty, tx + dx * 3, ty + dy * 3, STEEL, 2);
    if (kind === 'lance' && !F.horns) box(tx - dx * 4 + px * 1, ty - dy * 4 + py * 1, 3, 2, F.color);
  } else if (kind === 'club'){
    const [tx, ty] = at(10);
    pline(hx - dx * 2, hy - dy * 2, tx, ty, WOODC, 3);
    disc(ctx, tx + dx * 2, ty + dy * 2, 3.5, '#6b4a2b');
    box(tx + dx * 2 - 3, ty + dy * 2 - 1, 1, 1, '#d9dde1'); box(tx + dx * 2 + 2, ty + dy * 2, 1, 1, '#d9dde1');
  } else if (kind === 'staff' || kind === 'darkstaff' || kind === 'totem'){
    const [tx, ty] = at(12);
    pline(hx - dx * 6, hy - dy * 6, tx, ty, WOODC, 1);
    if (kind === 'totem'){ box(tx - 2, ty - 3, 4, 4, '#efe6cf'); box(tx - 1, ty - 2, 1, 1, '#2a1d12'); box(tx + 1, ty - 2, 1, 1, '#2a1d12'); box(tx - 3, ty + 1, 1, 3, '#c0392b'); }
    else {
      const glow = kind === 'staff' ? '#9fe3ff' : '#c9a0ff';
      disc(ctx, tx, ty - 1, act === 'attack' ? 4 : 3, kind === 'staff' ? 'rgba(160,230,255,.45)' : 'rgba(190,140,255,.45)');
      box(tx - 1, ty - 3, 3, 3, glow); box(tx, ty - 3, 1, 1, '#ffffff');
    }
  } else if (kind === 'flask'){                                     // a bubbling flask in the hand
    const [tx, ty] = at(3);
    disc(ctx, tx, ty - 1, 2.6, '#7fd04a'); box(tx - .5, ty - 5, 1.5, 3, '#cfe6ee'); box(tx - 1, ty - 2.5, 1, 1, '#d8ffb0');
  } else if (kind === 'bow' || kind === 'longbow'){
    // A bow held upright, curving toward the facing side; the string is
    // pulled back until the release frame, with an arrow nocked.
    const sg = Math.sign(dx) || 1, pull = act === 'attack' && fr < 2 ? 3 : 0;
    const L = kind === 'longbow' ? 10 : 7;                            // a longbow is taller than the bowman's head
    for (let k = -L; k <= L; k++){ const bend = 2.5 - (k * k) / (L * L / 2.5); box(hx + sg * (1 + bend), hy + k, 1, 1, Math.abs(k) > L - 2 ? '#6b4a2b' : '#8a5a2e'); }
    pline(hx + sg * .5, hy - L, hx - sg * pull, hy, '#efe8da', 1); pline(hx - sg * pull, hy, hx + sg * .5, hy + L, '#efe8da', 1);
    if (pull || act !== 'attack') pline(hx - sg * pull, hy, hx + sg * 7, hy, '#d9c9a0', 1), box(hx + sg * 7, hy - 1, 1, 3, '#cfd6dc');
  } else if (kind === 'sling'){
    const r = act === 'attack' ? 5 : 3, a = act === 'attack' ? fr * 2.1 : 0;
    pline(hx, hy, hx + Math.cos(a) * r, hy - 3 + Math.sin(a) * r, '#7a5530', 1);
    box(hx + Math.cos(a) * r - 1, hy - 3 + Math.sin(a) * r - 1, 2, 2, '#8f897d');
  }
}

function cShield(kind, x, y, F){
  if (kind === 'kite'){ box(x - 3, y - 4, 7, 7, '#d9dde1'); box(x - 2, y - 3, 5, 6, shade(F.color, -.1)); box(x - 1, y + 3, 3, 2, shade(F.color, -.1)); box(x, y + 5, 1, 1, shade(F.color, -.1)); box(x, y - 2, 1, 6, '#e8c547'); box(x - 1, y, 3, 1, '#e8c547'); }
  else { disc(ctx, x, y, 4.5, '#6e4a2c'); disc(ctx, x, y, 2.8, shade(F.color, -.15)); box(x, y - 1, 1, 1, '#cfd6dc'); box(x - 5, y - 1, 1, 1, '#e6dcc4'); box(x + 5, y - 1, 1, 1, '#e6dcc4'); box(x, y - 6, 1, 1, '#e6dcc4'); }
}

// ----- The humanoid rig -----
function cHuman(x, y, view, act, fr, P, F){
  const V = CVIEW[view], B = P.big || 0;
  const tw = V.tw + B * 2, th = 8 + B * 2, hs = 6 + Math.max(0, B) + (B > 1 ? 1 : 0) + (P.bigHead ? 2 : 0), legH = 5 + (B > 1 ? 1 : 0);
  const walk = act === 'walk' ? fr : -1;
  const stride = walk >= 0 ? [1, 0, -1, 0][walk] : 0, bob = walk === 1 || walk === 3 ? -1 : 0;
  const feet = y + 8, hip = feet - legH + bob, top = hip - th, headTop = top - hs + 1;
  const back = view >= 3, side = view === 2;
  const dark = c => shade(c, -.3), lite = c => shade(c, .25);
  // Hand position: moves up for the wind-up and forward for the strike.
  let hx = x + V.hand * (1 + B * .15), hy = top + th - 3;
  if (act === 'attack'){ hy -= fr === 0 ? 3 : fr === 1 ? 5 : 1; hx += V.fwd[0] * (fr === 2 ? 3 : 0); }
  else if (walk >= 0 && side) hx += stride;                          // arm swings while walking
  const [wdx, wdy] = weaponDir(V, act, fr);

  const drawCape = () => {
    if (!P.cape) return;
    if (back) box(x - tw / 2 - 1, top + 1, tw + 2, th + legH - 2, P.cape), box(x - tw / 2 - 1, top + 1, 2, th + legH - 2, dark(P.cape));
    else if (side) box(x - tw / 2 - 3, top + 1, 4, th + legH - 1, P.cape);
    else { box(x - tw / 2 - 1, top + 1, 2, th + 2, dark(P.cape)); box(x + tw / 2 - 1, top + 1, 2, th + 2, dark(P.cape)); }
  };
  const drawCarry = (front) => {
    if (!P.carry || front !== back) return;
    if (P.carry === 'bottles'){                                     // the alchemist's satchel of flasks
      const bx = back ? x - 3 : side ? x - tw / 2 - 4 : x + 2, by = top + 1;
      box(bx, by, 6, 6, '#6b4a2b'); box(bx + 1, by - 2, 1, 2, '#7fd04a'); box(bx + 3, by - 3, 1, 3, '#c89aff'); box(bx + 5, by - 2, 1, 2, '#ff6a4a');
      return;
    }
    const bx = back ? x - 3 : side ? x - tw / 2 - 5 : x + (view === 1 ? -tw / 2 - 3 : 2), by = top - (back ? -1 : 2);
    if (P.carry === 'gold'){ box(bx, by, 6, 6, '#8a6a3e'); box(bx, by, 2, 6, '#a88450'); box(bx + 1, by - 2, 4, 2, '#f2cf4b'); box(bx + 2, by - 2, 1, 1, '#fff1a6'); }
    else { box(bx - 1, by, 8, 2, '#8a5a2b'); box(bx - 1, by + 3, 8, 2, '#74481f'); box(bx + 6, by, 1, 2, '#c89a5a'); box(bx + 6, by + 3, 1, 2, '#c89a5a'); }
  };
  const drawLegs = () => {
    if (P.robe){                                                    // a robe hides the legs and sways
      box(x - tw / 2 - 1, hip - 1, tw + 2, legH + 1 - bob, P.cloth); box(x - tw / 2 - 1, feet - 2, tw + 2, 2, dark(P.cloth));
      box(x - tw / 2 - 1, hip - 1, 1, legH, lite(P.cloth));
      return;
    }
    const lw = 3 + (B > 1 ? 1 : 0), gap = side ? 0 : Math.max(1, (tw >> 1) - lw - 1);
    if (V.stride && walk >= 0){                                     // profile: legs stride front and back
      const s = stride * (side ? 2 : 1);
      box(x - lw + 1 - s, hip, lw, legH - 1, dark(P.pants)); box(x - lw + 1 - s, feet - 2, lw + 1, 2, P.boots);
      box(x - 1 + s, hip, lw, legH - 1, P.pants); box(x - 1 + s, feet - 2, lw + 1, 2, P.boots);
    } else {                                                        // facing us or away: legs step up and down
      const lu = Math.max(0, stride), ru = Math.max(0, -stride);
      box(x - gap - lw, hip, lw, legH - lu, P.pants); box(x - gap - lw, feet - 2 - lu, lw, 2, P.boots);
      box(x + gap, hip, lw, legH - ru, P.pants); box(x + gap, feet - 2 - ru, lw, 2, P.boots);
    }
  };
  const drawTorso = () => {
    // Torso with its corners knocked off by one pixel: a classic trick that
    // makes a box read as a rounded body.
    box(x - tw / 2 + 1, top, tw - 2, th, P.cloth); box(x - tw / 2, top + 1, tw, th - 2, P.cloth);
    box(x - tw / 2, top + 1, 2, th - 2, lite(P.cloth)); box(x + tw / 2 - 2, top + 1, 2, th - 2, dark(P.cloth));   // light from the top-left
    if (P.belly) box(x - tw / 2 + 3, top + th / 2 - 1, tw - 6, th / 2, lite(P.cloth));
    if (P.tabard && !side){ box(x - 2, top + 1, 4, th + 1, P.tabard); box(x - 2, top + 1, 1, th + 1, lite(P.tabard)); if (P.trim) box(x - 1, top + 3, 2, 3, P.trim); }
    if (P.tabard && side) box(x + 1, top + 1, 2, th, P.tabard);
    if (P.kilt) box(x - tw / 2, hip - 2, tw, 4, P.kilt), box(x - tw / 2, hip + 1, tw, 1, dark(P.kilt));
    if (!P.robe){ box(x - tw / 2, hip - 2, tw, 1, '#2e2118'); if (!back) box(x - 1, hip - 2, 2, 1, '#e0b84a'); }
    if (P.straps){ pline(x - tw / 2 + 1, top + 1, x + tw / 2 - 2, hip - 3, '#2e2118', 1); if (!side) pline(x + tw / 2 - 2, top + 1, x - tw / 2 + 1, hip - 3, '#2e2118', 1); }
    if (P.rune){ box(x - 1, top + 3, 3, 3, '#7ff0d0'); box(x, top + 4, 1, 1, '#ffffff'); }
    if (P.moss) box(x - tw / 2 + 1, top, 4, 1, '#5f9a44');
    if (P.pauldron){
      const pw = 3 + B;
      if (!side){ box(x - tw / 2 - 2, top - 1, pw, 3, P.pauldron); box(x + tw / 2 - pw + 2, top - 1, pw, 3, P.pauldron); box(x - tw / 2 - 2, top - 1, pw, 1, lite(P.pauldron)); box(x + tw / 2 - pw + 2, top - 1, pw, 1, lite(P.pauldron)); }
      else { box(x - 2, top - 1, pw + 1, 3, P.pauldron); box(x - 2, top - 1, pw + 1, 1, lite(P.pauldron)); }
      if (P.spikes){ box(x - tw / 2 - 1, top - 3, 1, 2, '#e6dcc4'); if (!side) box(x + tw / 2, top - 3, 1, 2, '#e6dcc4'); }
    }
  };
  const drawArms = () => {
    const aw = 2 + (B > 0 ? 1 : 0);
    if (!side){ box(x - tw / 2 - aw, top + 1, aw, th - 2, P.sleeve || P.cloth); box(x + tw / 2, top + 1, aw, th - 2, dark(P.sleeve || P.cloth)); }
    else box(x - 1 + (walk >= 0 ? -stride : 0), top + 2, aw, th - 3, dark(P.sleeve || P.cloth));
  };
  const drawHead = () => {
    const hd = side ? 1 : view === 1 || view === 3 ? 1 : 0, l = x - (hs >> 1) + hd;
    box(l, headTop + hs - 1, hs, 2, shade(P.cloth, -.45));                     // chin shadow separates head from body
    box(l, headTop, hs, hs - 1, P.skin); box(l, headTop, 1, hs - 1, lite(P.skin)); box(l + hs - 1, headTop, 1, hs - 1, dark(P.skin));
    if (P.snout && !back) box(side ? l + hs - 1 : l + 1, headTop + hs - 3, side ? 3 : hs - 2, 2, P.skin);
    if (P.ears) { box(l - 2, headTop + 1, 2, 2, P.skin); box(l + hs, headTop + 1, 2, 2, P.skin); }
    if (P.longEars){                                                // long pointed goblin ears
      box(l - 3, headTop + 2, 3, 2, P.skin); box(l - 5, headTop + 1, 2, 2, P.skin); box(l - 6, headTop, 1, 1, P.skin);
      if (!side){ box(l + hs, headTop + 2, 3, 2, dark(P.skin)); box(l + hs + 3, headTop + 1, 2, 2, dark(P.skin)); box(l + hs + 5, headTop, 1, 1, dark(P.skin)); }
    }
    if (P.nose && !back) box(side ? l + hs : l + (hs >> 1) - 1, headTop + (hs >> 1), side ? 3 : 2, 2, dark(P.skin));   // a long nose
    if (V.face && !P.faceHidden){                                   // eyes, looking the way the unit faces
      const ey = headTop + 2 + (P.helm === 'plume' || P.helm === 'horns' ? 1 : 0), eye = P.glowEyes || (P.orcEyes ? '#ffcf3a' : '#1a0f07');
      if (V.face === 2){ box(l + 1, ey, 1, 1, eye); box(l + hs - 2, ey, 1, 1, eye); }
      else box(l + hs - 2, ey, 1, 1, eye);
      if (P.tusks){ box(V.face === 2 ? l + 1 : l + hs - 2, headTop + hs - 1, 1, 1, '#fffaf0'); if (V.face === 2) box(l + hs - 2, headTop + hs - 1, 1, 1, '#fffaf0'); }
      if (P.beard) box(l + (V.face === 2 ? 1 : hs - 3), headTop + hs - 1, V.face === 2 ? hs - 2 : 3, 2, P.beard);
    }
    cHelm(P.helm, l, headTop, hs, view, P, F);
  };

  drawCape();
  drawCarry(false);
  if (P.shield && !V.shieldFront) cShield(P.shield, x + V.shield, top + 4, F);
  if (P.weapon && !V.handFront) cWeapon(P.weapon, hx, hy, wdx, wdy, act, fr, F);
  if (P.tail){ const tx = side ? x - tw / 2 - 1 : x + 3; pline(tx, hip, tx - (side ? 5 : 2), hip + 2, P.skin, 2); }
  drawLegs();
  drawTorso();
  drawArms();
  drawHead();
  if (P.shield && V.shieldFront) cShield(P.shield, x + V.shield, top + 4, F);
  if (P.weapon && V.handFront) cWeapon(P.weapon, hx, hy, wdx, wdy, act, fr, F);
  if (P.weapon === 'fist' && act === 'attack' && fr === 2) box(x + V.fwd[0] * 9 - 3, top + 2 + V.fwd[1] * 4, 6, 6, P.cloth);   // golem punch
  if (P.weapon && P.weapon !== 'fist') box(hx - 1, hy - 1, 3, 3, P.glove || P.skin);   // the hand gripping the weapon
  drawCarry(true);
}

// Headgear, drawn over the head for the current view.
function cHelm(kind, l, t, hs, view, P, F){
  const back = view >= 3, side = view === 2, c = (hs >> 1) + l;
  switch (kind){
    case 'straw': box(l - 2, t + 1, hs + 4, 2, '#c9a45a'); box(l, t - 2, hs, 3, '#e2c270'); box(l, t, hs, 1, F.color); break;
    case 'topknot': box(c - 1 - (side ? 1 : 0), t - 2, 2, 2, '#2a1d12'); break;
    case 'mohawk': box(c - 1, t - 4, 2, 5, '#2a1d12'); break;
    case 'plume':
      box(l - 1, t - 1, hs + 2, hs - 1, '#aeb6bd'); box(l - 1, t - 1, hs + 2, 1, '#e3e8ec');
      if (!back){ box(side ? l + hs - 3 : l + 1, t + 2, side ? 3 : hs - 2, 1, '#1a0f07'); if (!side) box(c - 1, t + 2, 1, 3, '#1a0f07'); }
      box(c - 1, t - 4, 2, 3, P.plume || F.color); break;
    case 'horns':
      box(l - 1, t - 1, hs + 2, 3, '#3f3833'); box(l - 1, t - 1, hs + 2, 1, '#5a524a');
      if (side){ pline(l + hs, t, l + hs + 3, t - 3, '#e6dcc4', 1); pline(l - 1, t, l - 3, t - 3, '#e6dcc4', 1); }
      else { pline(l - 1, t, l - 3, t - 4, '#e6dcc4', 2); pline(l + hs, t, l + hs + 2, t - 4, '#e6dcc4', 2); }
      break;
    case 'hood':
      box(l - 1, t - 1, hs + 2, 3, P.hood); box(l - 1, t - 1, hs + 2, 1, shade(P.hood, .2));
      if (back) box(l - 1, t + 1, hs + 2, hs - 1, P.hood); else if (side) box(l - 1, t + 1, 2, hs, P.hood); else { box(l - 1, t + 1, 1, hs, P.hood); box(l + hs, t + 1, 1, hs, P.hood); }
      if (P.feather) box(side ? l : l + hs, t - 3, 1, 3, '#c0392b');
      break;
    case 'crown': box(l, t - 1, hs, 2, '#e0b84a'); box(l, t - 3, 1, 2, '#e0b84a'); box(c, t - 3, 1, 2, '#e0b84a'); box(l + hs - 1, t - 3, 1, 2, '#e0b84a'); if (!back) box(c, t - 1, 1, 1, '#c0392b'); break;
    case 'bighorns':
      box(l - 1, t - 1, hs + 2, 4, '#2c2622');
      if (side){ pline(l + hs, t, l + hs + 4, t - 5, '#e6dcc4', 2); pline(l - 1, t + 1, l - 4, t - 4, '#e6dcc4', 2); }
      else { pline(l - 1, t, l - 5, t - 5, '#e6dcc4', 2); pline(l + hs, t, l + hs + 4, t - 5, '#e6dcc4', 2); }
      break;
    case 'candle': box(l - 1, t - 1, hs + 2, 2, '#6a625a'); box(c, t - 4, 1, 3, '#f4efe2'); box(c, t - 6, 1, 2, '#ffd23a'); disc(ctx, c + .5, t - 5, 2.5, 'rgba(255,210,90,.35)'); break;
    case 'bald': box(c - 1, t - 2, 2, 2, '#3a2a1a'); break;
    case 'magehood': box(l - 1, t - 2, hs + 2, 3, '#4a3a6a'); if (back) box(l - 1, t, hs + 2, hs, '#4a3a6a'); break;
    case 'goggles':                                              // brass goggles pushed up on the forehead
      box(l - 1, t, hs + 2, 1, '#3a2a1a');
      if (!back){ box(side ? l + hs - 3 : l, t - 1, 3, 3, '#c9a24a'); if (!side) box(l + hs - 3, t - 1, 3, 3, '#c9a24a'); box(side ? l + hs - 2 : l + 1, t, 1, 1, '#9fe3ff'); }
      break;
    case 'wizard':                                               // tall pointed hat with a gold star
      box(l - 2, t, hs + 4, 2, '#26325f');
      for (let i = 0; i < 6; i++){ const w = Math.max(1, hs - i); box(c - (w >> 1) + (i > 3 ? 1 : 0), t - 1 - i, w, 1, '#2f3f7a'); }
      box(c, t - 3, 1, 1, '#e0b84a'); break;
    case 'skull': box(l, t - 2, hs, 3, '#e6dcc4'); if (!back){ box(l + 1, t - 1, 1, 1, '#1a0f07'); box(l + hs - 2, t - 1, 1, 1, '#1a0f07'); } box(l - 1, t - 5, 1, 4, '#c0392b'); box(l + hs, t - 4, 1, 3, '#e0b84a'); break;
    case 'rock': box(l - 1, t - 1, hs + 2, 2, '#b0aaa0'); break;
  }
}

// What each unit looks like, as a list of parts and colours.
function classicParts(type, F, u){
  const orc = F.horns, carry = u.carry ? u.carry.res : null;
  const P = { skin:F.skin, pants:'#4a3a2a', boots:'#2e2118', orcEyes:orc, tusks:orc };
  switch (type){
    case 'worker': return { ...P, cloth:orc ? '#6a4a34' : F.color, helm:orc ? 'topknot' : 'straw', weapon:'pick', carry, sleeve:orc ? F.skin : undefined };
    case 'footman': return orc
      ? { ...P, cloth:F.skin, kilt:shade(F.color, -.15), straps:true, pauldron:'#54463a', spikes:true, helm:'horns', weapon:'axe', shield:u.shield ? 'round' : null }
      : { ...P, cloth:'#9aa3ab', tabard:F.color, trim:'#e8c547', pauldron:'#b9c1c8', helm:'plume', weapon:'sword', shield:u.shield ? 'kite' : null, pants:'#4e565e', boots:'#3a4047', glove:'#7d868e', faceHidden:true };
    case 'javelin': return { ...P, cloth:F.skin, kilt:'#6b4a2b', helm:'mohawk', weapon:'spear', straps:true };
    case 'archer': return orc
      ? { ...P, cloth:F.skin, kilt:'#6b4a2b', helm:'topknot', weapon:'spear', straps:true }
      : { ...P, cloth:'#6a4a34', tabard:F.color, helm:'hood', hood:'#3a6230', feather:true, weapon:'longbow', cape:'#3a6230' };
    case 'hero': return orc
      ? { ...P, big:1, cloth:'#3a3230', kilt:'#5a1f16', pauldron:'#3a3230', spikes:true, helm:'bighorns', weapon:'greataxe', cape:'#7a2418', glove:'#3a3230' }
      : { ...P, big:1, cloth:'#aeb6bd', tabard:F.color, trim:'#e8c547', pauldron:'#e0b84a', helm:'crown', beard:'#cfc6b2', weapon:'bigsword', cape:shade(F.color, -.3), pants:'#4e565e', boots:'#3a4047', glove:'#e0b84a' };
    case 'priest': return orc
      ? { ...P, robe:true, cloth:'#5a4632', tabard:F.color, helm:'skull', weapon:'totem' }
      : { ...P, robe:true, cloth:'#e6dfcc', tabard:F.color, helm:'hood', hood:'#e6dfcc', weapon:'staff' };
    case 'recruit': return { ...classicParts('footman', F, u), helm:'none', shield:null, armor:false, cloth:'#8a6a44', tabard:F.color, weapon:'sword' };
    case 'acolyte': return { ...classicParts('priest', F, u), cloth:'#d8d0c0', tabard:'#b8b0a0' };
    case 'axeman': return { ...classicParts('footman', F, u), weapon:'axe', shield:null, helm:orc ? 'topknot' : 'hood', hood:'#6b5232', cloth:orc ? F.skin : '#5a7a3a' };
    case 'hunter': return { ...classicParts('archer', F, u), weapon:'bow', helm:'hood', hood:orc ? '#5a4632' : '#6b5232', cape:'#4a3a24', feather:false };
    case 'huntmaster': return { ...classicParts('archer', F, u), big:1, weapon:'longbow', helm:'hood', hood:'#3a5a2a', cape:'#3a5a2a', feather:true };
    case 'scout': return { ...P, skin:'#86b84e', cloth:'#5a4632', tabard:'#8a6a44', kilt:'#4a3a2a', pants:'#4a3a2a', longEars:true, nose:true, bigHead:true, tusks:false, helm:'goggles', weapon:'sword' };
    case 'healer': return orc
      ? { ...P, skin:'#86b84e', cloth:'#7a5536', tabard:'#e2cf9a', kilt:'#4a3a2a', pants:'#4a3a2a', longEars:true, nose:true, bigHead:true, tusks:false, helm:'goggles', weapon:'flask', carry:'bottles' }
      : { ...P, big:1, robe:true, cloth:'#efe8d6', tabard:'#e0b84a', helm:'crown', weapon:'staff', cape:shade(F.color, -.2) };
    case 'mage': return orc
      ? { ...P, robe:true, cloth:'#3f3148', tabard:F.color, helm:'magehood', weapon:'darkstaff' }
      : { ...P, robe:true, cloth:'#34448a', tabard:'#c9a24a', helm:'wizard', weapon:'darkstaff' };
    case 'kobold': case 'kslinger':
      return { skin:'#c7743f', cloth:'#6b5a3a', pants:'#8a4a26', boots:'#5e3218', big:-1, helm:'candle', snout:true, ears:true, tail:true, glowEyes:'#ffd23a', weapon:type === 'kobold' ? 'pick' : 'sling' };
    case 'ogre': case 'ogremage': {
      const skin = type === 'ogre' ? '#a497bb' : '#7f8fb8';
      return { skin, cloth:skin, belly:true, kilt:'#6b4a2b', pants:shade(skin, -.2), boots:'#3a2a1a', big:2, helm:type === 'ogre' ? 'bald' : 'magehood', orcEyes:true, tusks:true, weapon:type === 'ogre' ? 'club' : 'darkstaff' };
    }
    case 'bandit': case 'brigand':
      return { ...P, skin:'#e0b089', cloth:'#6b2a2a', tabard:'#6b2a2a', pants:'#3a3028', boots:'#2a2018', helm:'hood', hood:'#3a2a20', weapon:type === 'bandit' ? 'sword' : 'bow', shield:null };
    case 'skeleton': case 'skelarcher':
      return { ...P, skin:'#e8e2d0', cloth:'#b9b2a0', tabard:'#5a5650', pants:'#e8e2d0', boots:'#cfc8b4', helm:'none', glowEyes:'#6af0ff', weapon:type === 'skeleton' ? 'sword' : 'bow', shield:type === 'skeleton' ? '#6b5a3a' : null };
    case 'golem': return { skin:'#8f8a80', cloth:'#8f8a80', pants:'#6a655d', boots:'#5e5a53', big:2, helm:'rock', rune:true, moss:true, glowEyes:'#7ff0d0', weapon:'fist' };
  }
  return { ...P, cloth:F.color, helm:'none' };
}

// ----- Four-legged rig: horses (with a rider) and wolves -----
function cQuad(x, y, view, act, fr, F, wolf, rider){
  const fur = wolf ? '#6e645a' : '#6b4631', dk = shade(fur, -.3), lt = shade(fur, .25);
  const walk = act === 'walk' ? fr : -1, g = walk >= 0 ? [1, 0, -1, 0][walk] : 0, bob = walk === 1 || walk === 3 ? -1 : 0;
  const side = view === 1 || view === 2 || view === 3, front = view === 0, back = view === 4;
  const by = y - 3 + bob;
  if (side){
    // Wolves: short legs, low thick body, head thrust forward. Horses: taller.
    const legL = wolf ? 4 : 6, bodyH = wolf ? 6 : 7, bodyY = y + 9 - legL - bodyH + bob, legY = bodyY + bodyH - 1;
    if (wolf){ pline(x - 8, bodyY + 1, x - 12, bodyY - 2, lt, 3); box(x - 13, bodyY - 3, 2, 2, shade(fur, .4)); }
    else box(x - 13, bodyY, 4, 5, '#241810');
    for (const [lx, ph] of [[-7, 1], [-4, -1], [4, 1], [7, -1]]) box(x + lx + g * ph, legY, 2, legL - (ph * g > 0 ? 1 : 0), dk);
    box(x - 9, bodyY, 18, bodyH, fur); box(x - 9, bodyY, 18, 2, lt); box(x - 9, bodyY + bodyH - 1, 18, 1, dk);
    box(x - 10, bodyY + 1, 1, bodyH - 2, fur); box(x + 9, bodyY + 1, 1, bodyH - 2, fur);              // rounded ends
    if (wolf){
      const hx = x + 7, hy = bodyY - 3 - (view === 3 ? 1 : 0);
      box(hx, hy, 5, 5, fur); box(hx, hy, 5, 1, lt); box(hx + 4, hy + 2, 3, 2, fur); box(hx + 6, hy + 2, 1, 1, '#1a0f07');
      box(hx + 1, hy - 2, 1, 2, dk); box(hx + 3, hy - 2, 1, 2, dk);                                    // pointed ears
      box(hx + 3, hy + 1, 1, 1, '#ffcf3a');
      if (act === 'attack' && fr === 2) box(hx + 4, hy + 4, 3, 1, '#fffaf0');                            // bite
    } else {
      const hx = x + 8 + (view === 3 ? -1 : 0), hy = bodyY - (view === 3 ? 6 : 4);
      box(hx, hy, 4, 6, fur); box(hx + 2, hy - 1, 5, 4, fur); box(hx + 6, hy, 1, 2, dk);
      box(hx + 3, hy - 1, 3, 3, '#aeb6bd'); pline(hx, hy - 1, hx - 3, bodyY + 2, '#241810', 2); box(hx + 4, hy, 1, 1, '#1a0f07');
    }
    if (rider) box(x - 6, bodyY + 1, 11, 5, F.color), box(x - 6, bodyY + 5, 11, 1, '#e8c547');
  } else {
    // Facing us or away: a narrow, foreshortened body.
    for (const [lx, ph] of [[-5, 1], [-2, -1], [1, 1], [4, -1]]) box(x + lx, by + 5 - (ph * g > 0 ? 1 : 0), 2, 6, dk);
    box(x - 7, by - 1, 14, 8, fur); box(x - 7, by - 1, 2, 8, lt); box(x + 5, by - 1, 2, 8, dk);          // broad chest or rump
    if (rider) box(x - 7, by + 1, 14, 5, F.color), box(x - 7, by + 5, 14, 1, '#e8c547');
    if (front){
      const hy = by - 1;
      box(x - 3, hy + 3, 6, 6, fur); box(x - 2, hy + 7, 4, 3, lt);
      if (wolf){ box(x - 4, hy + 2, 8, 6, fur); box(x - 4, hy, 2, 3, dk); box(x + 2, hy, 2, 3, dk); box(x - 2, hy + 4, 1, 1, '#ffcf3a'); box(x + 1, hy + 4, 1, 1, '#ffcf3a'); box(x - 1, hy + 7, 2, 1, '#1a0f07'); box(x - 1, hy + 9, 2, 1, '#fffaf0'); }
      else { box(x - 2, hy + 3, 4, 3, '#aeb6bd'); box(x - 2, hy + 7, 1, 1, '#1a0f07'); box(x + 1, hy + 7, 1, 1, '#1a0f07'); }
    } else box(x - 1, by + 5, 2, wolf ? 4 : 6, wolf ? lt : '#241810');                                       // tail from behind
  }
  if (rider){                                                    // the rider sits on top, as a small humanoid torso
    const P = classicParts(F.horns ? 'footman' : 'footman', F, { shield:false });
    const V = CVIEW[view], top = by - (side ? 11 : 8), tw = 7;          // seated lower when seen head-on
    box(x - tw / 2, top, tw, 8, F.horns ? F.skin : '#9aa3ab'); box(x - tw / 2, top, 1, 8, shade(F.horns ? F.skin : '#9aa3ab', .25));
    if (!F.horns) box(x - 1, top + 1, 3, 7, F.color);
    const l = x - 2 + (side ? 1 : 0), ht = top - 5;
    box(l, ht, 5, 5, F.skin);
    cHelm(F.horns ? 'horns' : 'plume', l, ht, 5, view, { plume:F.color }, F);
    const [dx, dy] = weaponDir(V, act, fr);
    const hx = x + V.hand * .7, hy = top + 4 - (act === 'attack' ? fr : 0);
    cWeapon(F.horns ? 'spear' : 'lance', hx, hy, dx, dy, act, fr, F);
    box(hx - 1, hy - 1, 2, 2, F.horns ? F.skin : '#7d868e');
  }
}

// ----- Spider rig: eight legs around a body, head toward the facing -----
function cSpider(x, y, dir, act, fr, green){
  const body = green ? '#3f5a30' : '#4a3656', dk = shade(body, -.35), lt = shade(body, .3), mark = green ? '#b8e04a' : '#e0404e';
  const ang = dir * Math.PI / 4, fx = Math.cos(ang), fy = Math.sin(ang), step = act === 'walk' ? fr % 2 : 0;
  for (let k = 0; k < 8; k++){                                    // legs, alternating as it walks
    const a = ang + Math.PI / 2 * (k < 4 ? 1 : -1) + (k % 4 - 1.5) * .45, lift = (k + step) % 2 ? 1 : 0;
    const kx = x + Math.cos(a) * 7, ky = y - 3 + Math.sin(a) * 5 - 2 - lift, ex = x + Math.cos(a) * 11, ey = y - 3 + Math.sin(a) * 7 + 2 - lift;
    pline(x, y - 3, kx, ky, dk, 1); pline(kx, ky, ex, ey, dk, 1);
  }
  disc(ctx, x - fx * 3, y - 3 - fy * 2, 5.5, body); disc(ctx, x - fx * 4, y - 5 - fy * 2, 2.5, lt);
  box(x - fx * 3 - 1, y - 4 - fy * 2, 3, 2, mark);
  const lunge = act === 'attack' && fr === 2 ? 2 : 0, hx = x + fx * (4 + lunge), hy = y - 3 + fy * (3 + lunge);
  disc(ctx, hx, hy, 3.2, body);
  if (fy > -.5){ box(hx - 1 + fx, hy - 1, 1, 1, '#ff5a5a'); box(hx + 1 + fx, hy - 1, 1, 1, '#ff5a5a'); box(hx + fx * 3, hy + 1 + fy, 1, 2, '#fffaf0'); }
}

// LESSON: Siege engines are machines, not creatures, so one drawing serves
// every art style. Views: 0 = facing us, 1-3 = side, 4 = from behind.
// Wheels turn while moving (the spokes rotate with the frame), and the
// attack frames show the recoil (cannon) or the released string (scorpion).
function drawSiege(type, x, y, view, act, fr, F){
  const WOODD = '#5a3f29', WOODL = '#8a6a48', IRON = '#3a3632', IRONL = '#6f6860';
  const spin = (act === 'walk' ? fr : 0) * Math.PI / 4;
  const wheel = (cx, cy, r) => {
    disc(ctx, cx, cy, r, WOODD); disc(ctx, cx, cy, r - 1.5, WOODL); disc(ctx, cx, cy, 1.4, IRON);
    for (let k = 0; k < 4; k++){ const a = spin + k * Math.PI / 4; pline(cx - Math.cos(a) * (r - 1.5), cy - Math.sin(a) * (r - 1.5), cx + Math.cos(a) * (r - 1.5), cy + Math.sin(a) * (r - 1.5), WOODD, 1); }
  };
  if (type === 'wagon'){                                         // a covered supply wagon
    if (view >= 1 && view <= 3){
      wheel(x - 8, y + 4, 4.5); wheel(x + 7, y + 4, 4.5);
      box(x - 13, y - 3, 26, 6, WOODL); box(x - 13, y + 2, 26, 1, WOODD); box(x + 13, y - 1, 6, 2, WOODD);
      box(x - 12, y - 12, 24, 9, '#e8e0c8'); box(x - 12, y - 12, 24, 1, '#fff8e0');
      for (const k of [-8, 0, 8]) box(x + k, y - 12, 1, 9, '#b8a888');
      box(x - 12, y - 19, 1, 8, WOODD); box(x - 11, y - 19, 5, 3, F.color);
    } else {
      wheel(x - 9, y + 3, 5); wheel(x + 9, y + 3, 5);
      box(x - 8, y - 9, 16, 11, '#e8e0c8'); box(x - 8, y - 9, 16, 1, '#fff8e0'); box(x - 8, y + 1, 16, 3, WOODL);
      if (view === 0) box(x - 3, y - 6, 6, 6, '#6b4a2b');
    }
    return;
  }
  const orc = type === 'cannon';
  if (view >= 1 && view <= 3){                                   // side view, facing right
    if (orc){
      pline(x - 13, y + 7, x + 2, y + 1, WOODD, 3); pline(x - 13, y + 6, x + 2, y, WOODL, 1);        // trail
      const rec = act === 'attack' && fr === 1 ? -2 : 0, lift = view === 3 ? -1 : view === 1 ? 1 : 0;
      pline(x - 5 + rec, y - 3 + lift, x + 11 + rec, y - 5 + lift, IRON, 6);                           // barrel
      pline(x - 5 + rec, y - 5 + lift, x + 11 + rec, y - 7 + lift, IRONL, 1);
      box(x + 10 + rec, y - 9 + lift, 3, 8, IRON);                                                     // muzzle ring
      box(x - 7 + rec, y - 5 + lift, 3, 4, IRON);                                                      // breech knob
      for (const k of [-9, -3]) pline(x + k, y + 4, x + k - 2, y, '#e6dcc4', 1);                       // bone spikes
      wheel(x - 1, y + 3, 6);
      box(x - 12, y - 8, 1, 10, WOODD); box(x - 11, y - 8, 5, 4, F.color);                             // war banner
      if (act === 'attack' && fr === 1){ disc(ctx, x + 15, y - 6 + lift, 5, 'rgba(255,190,70,.8)'); disc(ctx, x + 15, y - 6 + lift, 2.5, '#fff1a6'); }
      if (act === 'attack' && fr === 2) for (let k = 0; k < 3; k++) disc(ctx, x + 15 + k * 3, y - 8 - k * 2, 3 + k, 'rgba(120,114,108,.6)');
    } else {
      wheel(x - 8, y + 4, 4.5); wheel(x + 6, y + 4, 4.5);
      box(x - 12, y - 2, 22, 4, WOODL); box(x - 12, y + 1, 22, 1, WOODD);                            // chassis
      pline(x - 11, y - 4, x + 11, y - 6, WOODD, 3);                                                   // stock
      box(x - 6, y - 1, 8, 3, F.color); box(x - 6, y + 1, 8, 1, '#e8c547');                           // team cloth
      const armX = x + 7;                                                                               // the bow arms, seen edge-on
      for (let k = -8; k <= 8; k++) box(armX + Math.abs(k) * .25, y - 6 + k * .9, 2, 1, Math.abs(k) > 6 ? IRON : IRONL);
      const loaded = !(act === 'attack' && fr >= 1), sx = loaded ? x - 3 : armX;
      pline(armX + 2, y - 13, sx, y - 5, '#efe8da', 1); pline(sx, y - 5, armX + 2, y + 1, '#efe8da', 1);
      if (loaded){ pline(x - 4, y - 5, x + 12, y - 6.5, '#6b4a2b', 2); box(x + 12, y - 8, 3, 3, '#cfd6dc'); }
    }
    return;
  }
  // Facing us (view 0) or away (view 4): wheels at the sides, the machine in the middle.
  wheel(x - 9, y + 3, 5); wheel(x + 9, y + 3, 5);
  box(x - 8, y - 1, 16, 5, WOODL); box(x - 8, y + 3, 16, 1, WOODD);
  if (orc){
    disc(ctx, x, y - 4, 5.5, IRON); disc(ctx, x - 1.5, y - 5.5, 1.6, IRONL);
    if (view === 0){ disc(ctx, x, y - 4, 2.5, '#0e0c0a'); if (act === 'attack' && fr === 1) disc(ctx, x, y - 4, 6, 'rgba(255,190,70,.8)'); }
    else { box(x - 1, y + 2, 2, 7, WOODD); box(x - 5, y - 12, 1, 10, WOODD); box(x - 4, y - 12, 5, 4, F.color); }
  } else {
    const spread = act === 'attack' && fr >= 1 ? 13 : 11;
    pline(x - spread, y - 9, x, y - 6, IRONL, 2); pline(x + spread, y - 9, x, y - 6, IRONL, 2);        // bow arms, seen front-on
    pline(x - spread, y - 9, x, act === 'attack' && fr >= 1 ? y - 8 : y - 3, '#efe8da', 1); pline(x + spread, y - 9, x, act === 'attack' && fr >= 1 ? y - 8 : y - 3, '#efe8da', 1);
    box(x - 2, y - 2, 4, 4, F.color);
    if (view === 0 && !(act === 'attack' && fr >= 1)) box(x - 1, y - 7, 3, 3, '#cfd6dc');                  // bolt tip pointing at us
  }
}

// Draw a rig character (Classic-style parts) side-on for the Pixel and Storybook styles.
function rigSide(type, x, y, fc, F, u, sw){
  ctx.save();
  if (fc < 0){ ctx.translate(x * 2, 0); ctx.scale(-1, 1); }
  cHuman(x, y, 2, sw ? 'attack' : u && u.moving ? 'walk' : 'idle', sw ? 2 : u && u.moving ? 1 : 0, classicParts(type, F, u || {}), F);
  ctx.restore();
}
// Pixel and Storybook styles only face left or right: draw the side view, mirrored if needed.
function siegeSide(type, x, y, fc, F, u, sw){
  ctx.save();
  if (fc < 0){ ctx.translate(x * 2, 0); ctx.scale(-1, 1); }
  drawSiege(type, x, y, 2, sw ? 'attack' : u && u.moving ? 'walk' : 'idle', sw ? 1 : u && u.moving ? 1 : 0, F);
  ctx.restore();
}

// Draw one classic-style unit, facing screen direction dir8, in a pose.
function drawClassic(type, x, y, dir8, act, fr, F, u){
  const [view] = DIR_VIEW[dir8];
  if (type === 'spider' || type === 'spitter') return cSpider(x, y, dir8 === 3 ? 1 : dir8 === 4 ? 0 : dir8 === 5 ? 7 : dir8, act, fr, type === 'spitter');
  if (UNIT_TYPES[type].siege || UNIT_TYPES[type].cart) return drawSiege(type, x, y, view, act, fr, F);
  if (type === 'wolf' || type === 'hound') return cQuad(x, y, view, act, fr, F, true, false);
  if (type === 'knight') return cQuad(x, y, view, act, fr, F, !!F.horns, true);
  cHuman(x, y, view, act, fr, classicParts(type, F, u), F);
}


// ----------------------------------------------------------------------------
// INTERFACE ART: portraits and icon buttons (Warcraft 2 style)
// LESSON: Interface pictures are drawn with the same tools as the game world,
// once, into small canvases, then turned into image URLs (toDataURL) that
// HTML <img> tags can show. Units and buildings reuse their game sprites,
// so a portrait always matches the chosen art style.
// ----------------------------------------------------------------------------
const uiURLs = new Map();
function canvasURL(key, w, h, draw){
  const k = key + '|' + artStyle;
  if (uiURLs.has(k)) return uiURLs.get(k);
  const c = outlined(w, h, draw);
  const url = typeof c.toDataURL === 'function' ? c.toDataURL() : '';
  uiURLs.set(k, url);
  return url;
}

// A portrait: the upper body of a unit (facing us), or a whole building, on a dark backdrop.
function portraitCanvas(kind, type, owner, level, w){
  const c = makeCanvas(w, w), x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  const g = x.createRadialGradient(w / 2, w * .4, 2, w / 2, w / 2, w * .75);
  g.addColorStop(0, '#3a4a2e'); g.addColorStop(1, '#141009');
  x.fillStyle = g; x.fillRect(0, 0, w, w);
  if (kind === 'unit'){
    const fake = { type, owner, facing:1, dir:2, moving:false, anim:0, carry:null };
    const spr = artStyle === 'classic' ? classicSprite(fake, 'idle', 0) : unitSprite(fake, false);
    const big = UNIT_TYPES[type].big || UNIT_TYPES[type].hero || type === 'knight' || UNIT_TYPES[type].siege || UNIT_TYPES[type].cart;
    const cw = big ? 36 : 26, sx = SPR_OX - cw / 2, sy = SPR_OY - (big ? 36 : 28);
    const k = spr.width / SPR_W;                                   // 3 for painted sprites, 1 otherwise
    x.imageSmoothingEnabled = k > 1;
    x.drawImage(spr, sx * k, sy * k, cw * k, cw * k, 0, 0, w, w);
  } else {
    const spr = kind === 'mine' ? mineSprite(false) : buildingSprite(type, owner, level);
    const k = spr.width > 200 ? RES : 1, sw = spr.width / k, sh = spr.height / k, sc = Math.min(w / sw, w / sh) * .95;
    x.imageSmoothingEnabled = k > 1 || sc < 1;
    x.drawImage(spr, (w - sw * sc) / 2, (w - sh * sc) / 2 + 2, sw * sc, sh * sc);
  }
  return c;
}
function portraitURL(kind, type, owner, level = 1){
  const k = 'por' + kind + type + owner + level + '|' + artStyle;
  if (uiURLs.has(k)) return uiURLs.get(k);
  const c = portraitCanvas(kind, type, owner, level, 40);
  const url = typeof c.toDataURL === 'function' ? c.toDataURL() : '';
  uiURLs.set(k, url);
  return url;
}

function iconURL(ic){

function hpBar(x, y, w, frac){
  box(x - 1, y - 1, w + 2, 5, '#1b120b');
  box(x, y, Math.max(1, Math.round(w * frac)), 3, frac > .6 ? '#5fbf4a' : frac > .3 ? '#e2b53a' : '#d8452e');
}

// Buildings cast a shadow to the lower right, matching the top-left light.
function groundShadow(px, py, s){
  ctx.fillStyle = 'rgba(22,16,38,.3)';
  ctx.beginPath();
  ctx.moveTo(px + 4, py + s - 3); ctx.lineTo(px + s - 3, py + s * 0.35);
  ctx.lineTo(px + s + 12, py + s * 0.35 + 9); ctx.lineTo(px + s + 12, py + s + 6);
  ctx.lineTo(px + 14, py + s + 6); ctx.closePath(); ctx.fill();
}

// Flickering torches (orcs) and lanterns (kingdom), as [x, y] inside each building.
const BUILDING_LIGHTS = {
  townhall:[[39, 70], [57, 70]], barracks:[[34, 66], [62, 66]], tower:[[23, 46]], lumbermill:[[14, 44]],
  blacksmith:[[20, 44]], stable:[[10, 42]], temple:[[23, 44], [41, 44]], farm:[[40, 42]],
};
function drawLights(b, px, py){
  const lights = BUILDING_LIGHTS[b.type];
  if (!lights) return;
  lights.forEach(([lx, ly], k) => {
    const f = 0.75 + 0.25 * Math.sin(animT * 9 + b.id + k) * Math.sin(animT * 13.7 + b.id * 2);   // flicker
    const x = px + lx, y = py + ly;
    disc(ctx, x, y, 10, `rgba(255,160,60,${(0.13 * f).toFixed(3)})`);
    disc(ctx, x, y, 4.5, `rgba(255,200,110,${(0.35 * f).toFixed(3)})`);
    box(x - 1, y + 1, 2, 3, '#2a1d12');
    box(x - 1, y - 1, 2, 2, f > 0.8 ? '#fff0b8' : '#ffd27a');
  });
}

// Slow-moving cloud shadows drift across the land for atmosphere.
function drawCloudShadows(vw, vh){
  for (let k = 0; k < 8; k++){
    const span = MAP_PX_W + 1400;
    const cx = ((k * 1733 + animT * 10) % span) - 700;
    const cy = (k * 2711) % MAP_PX_H + Math.sin(animT * 0.05 + k) * 80;
    const rx = 280 + (k % 3) * 90, ry = 150 + (k % 2) * 60;
    if (cx + rx < cam.x || cx - rx > cam.x + vw || cy + ry < cam.y || cy - ry > cam.y + vh) continue;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, 'rgba(16,24,48,.16)'); g.addColorStop(0.6, 'rgba(16,24,48,.09)'); g.addColorStop(1, 'rgba(16,24,48,0)');
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, ry / rx); ctx.translate(-cx, -cy);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawMine(m){
  const s = m.size * TILE, px = m.tx * TILE, py = m.ty * TILE;
  groundShadow(px, py, s);
  if (selection.includes(m)){ ctx.strokeStyle = '#f2cf4b'; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, s - 2, s - 2); }
  const busy = G.units.some(u => u.hidden && u.order && u.order.mine === m);
  blit(mineSprite(busy), px - BLD_PAD_X, py - BLD_PAD_TOP);
}

// LESSON: Damage you can see. Below two-thirds health a building smokes;
// below 40% it catches fire, and the lower it gets the more fires break out.
// Fire positions come from a hash of the building's id, so they stay put.
function drawDamage(b, px, py, s){
  const frac = b.hp / b.maxHp;
  if (frac >= .66) return;
  const fires = frac < .2 ? 3 : frac < .3 ? 2 : frac < .4 ? 1 : 0;
  const spots = [0, 1, 2].map(k => [px + s * (.25 + .5 * hash(b.id, k)), py + s * (.3 + .35 * hash(k, b.id))]);
  for (let k = 0; k < Math.max(1, fires); k++){                  // smoke plumes
    const [fx, fy] = spots[k];
    for (let i = 0; i < 3; i++){
      const ph = (animT * .45 + i / 3 + k * .2) % 1;
      disc(ctx, fx + ph * 8, fy - 6 - ph * 34, 4 + ph * 8, `rgba(${fires ? 50 : 80},${fires ? 46 : 76},${fires ? 44 : 74},${(.5 * (1 - ph)).toFixed(2)})`);
    }
  }
  for (let k = 0; k < fires; k++){                               // flickering flames
    const [fx, fy] = spots[k];
    const f = .75 + .25 * Math.sin(animT * 13 + k * 2) * Math.sin(animT * 7.3 + b.id);
    disc(ctx, fx, fy, 12 * f, 'rgba(255,140,40,.22)');
    for (const [dx, h, c] of [[-4, 11, '#c0391f'], [3, 13, '#e8641f'], [0, 16, '#f29a2a'], [-1, 9, '#ffd45a'], [2, 6, '#fff2b0']]){
      const hh = h * f * (.85 + .15 * Math.sin(animT * 17 + dx));
      poly([[fx + dx - 3.5, fy], [fx + dx + Math.sin(animT * 9 + dx) * 1.5, fy - hh], [fx + dx + 3.5, fy]], c);
    }
  }
}

function drawBuilding(b){
  const s = b.size * TILE, px = b.tx * TILE, py = b.ty * TILE;
  groundShadow(px, py, s);
  if (selection.includes(b)){
    ctx.strokeStyle = b.owner === PLAYER ? '#7df06a' : allied(PLAYER, b.owner) ? '#f2d34a' : '#ff6a4d'; ctx.lineWidth = 2;
    ctx.strokeRect(px + 1, py + 1, s - 2, s - 2);
    if (showRange && BUILDING_TYPES[b.type].attack && towerTier(b) >= 1) rangeRing(px + s / 2, py + s / 2, towerRange(b));
  }
  const spr = buildingSprite(b.type, b.owner, b.level);
  if (b.built < 1){
    box(px + 2, py + 2, s - 4, s - 4, '#6b5234'); box(px + 5, py + 5, s - 10, s - 10, '#7a6040');
    // Clip the building so it "rises" as construction progresses.
    ctx.save(); ctx.beginPath();
    ctx.rect(px - BLD_PAD_X, py + s * (1 - b.built) - 22, s + BLD_PAD_X * 2, s * b.built + 26); ctx.clip();
    blit(spr, px - BLD_PAD_X, py - BLD_PAD_TOP);
    ctx.restore();
    ctx.strokeStyle = '#c8a26a'; ctx.lineWidth = 2;
    for (let x = px + 6; x < px + s; x += 22){ ctx.beginPath(); ctx.moveTo(x, py + 4); ctx.lineTo(x, py + s - 4); ctx.stroke(); }
    for (let y = py + 12; y < py + s; y += 18){ ctx.beginPath(); ctx.moveTo(px + 4, y); ctx.lineTo(px + s - 4, y); ctx.stroke(); }
  } else {
    blit(spr, px - BLD_PAD_X, py - BLD_PAD_TOP);
    drawLights(b, px, py);
    if (b.level > 1 && b.type === 'farm'){                    // windmill blades turn
      const mx = px + 16, my = py + 11;
      ctx.strokeStyle = '#f4efe2'; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k < 4; k++){ const a = animT * 1.5 + k * Math.PI / 2; ctx.moveTo(mx, my); ctx.lineTo(mx + Math.cos(a) * 10, my + Math.sin(a) * 10); }
      ctx.stroke(); box(mx - 1, my - 1, 2, 2, '#6b4a2b');
    }
    drawDamage(b, px, py, s);
    const chimney = b.type === 'blacksmith' ? [s - 14, -2] : b.type === 'townhall' ? [s - 26, 21] : null;
    if (chimney){                                             // chimney smoke
      for (let k = 0; k < 3; k++){
        const ph = (animT * 0.5 + k / 3 + b.id * 0.13) % 1;
        disc(ctx, px + chimney[0] + ph * 5, py + chimney[1] - ph * 18, 3 + ph * 3, `rgba(205,205,215,${(.5 * (1 - ph)).toFixed(2)})`);
      }
    }
  }
  if (selection.includes(b) || b.hp < b.maxHp) hpBar(px + 8, py - 8, s - 16, b.hp / b.maxHp);
}

function drawUnit(u){
  const F = FACTIONS[u.owner], T = UNIT_TYPES[u.type], big = T.hero || u.type === 'knight' || T.big;
  const x = Math.round(u.x), baseY = Math.round(u.y);
  const bob = artStyle !== 'classic' && u.moving && Math.sin(u.anim * 14) > 0 ? -1 : 0;   // classic frames bob by themselves
  ctx.fillStyle = 'rgba(22,16,38,.34)'; ctx.beginPath(); ctx.ellipse(x + 3, baseY + 8, big ? 12 : 8, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  // A thin team-coloured ring under every unit makes the sides easy to tell apart.
  ctx.strokeStyle = F.color + 'aa'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x, baseY + 8, big ? 13 : 9, 4, 0, 0, Math.PI * 2); ctx.stroke();
  if (selection.includes(u) && showRange && UNIT_TYPES[u.type].damage > 0) rangeRing(u.x, u.y, UNIT_TYPES[u.type].ranged ? effRange(u) : 1);
  if (selection.includes(u)){
    ctx.strokeStyle = u.owner === PLAYER ? '#7df06a' : allied(PLAYER, u.owner) ? '#f2d34a' : '#ff6a4d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, baseY + 8, big ? 15 : 11, 5, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (G.time < u.buffUntil) disc(ctx, x, baseY - 3, big ? 17 : 13, 'rgba(255,150,40,.25)');
  if (G.time < u.innerUntil) disc(ctx, x, baseY - 6, big ? 15 : 11, `rgba(255,170,60,${(.22 + .08 * Math.sin(animT * 9)).toFixed(2)})`);
  if (G.time < u.slowUntil){                                   // Slow: icy swirl at the feet
    ctx.save(); ctx.setLineDash([2, 3]); ctx.lineDashOffset = animT * 6; ctx.strokeStyle = 'rgba(140,200,255,.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, baseY + 7, big ? 13 : 10, 4, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (G.time < u.ultUntil){                                    // ultimate: pulsing golden glow
    const g = 0.25 + 0.12 * Math.sin(animT * 8);
    disc(ctx, x, baseY - 8, 22, `rgba(255,224,138,${g.toFixed(2)})`);
  }
  if (G.time < (u.shieldUntil || 0)){                          // Divine shield: a golden bubble
    disc(ctx, x, baseY - 8, big ? 20 : 16, `rgba(255,225,120,${(.22 + .1 * Math.sin(animT * 8)).toFixed(2)})`);
    ctx.strokeStyle = 'rgba(255,235,150,.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, baseY - 8, big ? 20 : 16, 0, Math.PI * 2); ctx.stroke();
  }
  if (u.skills && u.skills.regen){                             // healing aura: a green dashed ring
    ctx.save(); ctx.setLineDash([3, 4]); ctx.lineDashOffset = -animT * 8;
    ctx.strokeStyle = 'rgba(140,230,130,.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, baseY + 8, 20, 7, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  if (u.skills && u.skills.aura){                              // aura: a slowly turning dashed ring
    ctx.save(); ctx.setLineDash([3, 4]); ctx.lineDashOffset = -animT * 8;
    ctx.strokeStyle = u.owner === PLAYER ? 'rgba(160,210,255,.55)' : 'rgba(255,170,140,.55)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, baseY + 8, 20, 7, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  const swing = u.cd > T.cooldown - 0.18 || (u.working && Math.sin(u.anim * 10) > 0);
  let spr;
  if (G.time < (u.sheepUntil || 0)){                         // Polymorph: draw a sheep instead
    const f = u.facing || 1, bob2 = u.moving && Math.sin(u.anim * 14) > 0 ? -1 : 0, sy = baseY + bob2;
    box(x - 5, sy + 4, 2, 4, '#3a2e26'); box(x + 3, sy + 4, 2, 4, '#3a2e26');
    disc(ctx, x, sy, 7, '#f4f1ea'); disc(ctx, x - 3, sy - 3, 4, '#ffffff'); disc(ctx, x + 3, sy - 2, 4, '#e8e4da');
    box(x + f * 6 - 2, sy - 4, 5, 5, '#3a2e26'); box(x + f * 7, sy - 3, 1, 1, '#ffffff');
    return;
  }
  if (artStyle === 'classic'){
    // Pick the animation and frame: attacking, working, walking or standing.
    const since = T.cooldown - u.cd;
    if (u.cd > 0 && since < .36) spr = classicSprite(u, 'attack', Math.min(2, Math.floor(since / .12)));
    else if (u.working) spr = classicSprite(u, 'attack', Math.floor(u.anim * 5) % 3);
    else if (u.moving) spr = classicSprite(u, 'walk', Math.floor(u.anim * 8) % 4);
    else spr = classicSprite(u, 'idle', 0);
  } else spr = unitSprite(u, swing);
  blit(spr, x - SPR_OX, baseY + bob - SPR_OY);
  if (T.healer && G.time < u.ready.heal - 2.6) disc(ctx, x + u.facing * 8, baseY + bob - 16, 5, 'rgba(255,251,208,.85)');
  if (u.rank){                                                // Elder / Ancient: glowing ring and pips over the head
    ctx.strokeStyle = u.rank > 1 ? 'rgba(200,120,255,.8)' : 'rgba(255,180,70,.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, baseY + 7, big ? 14 : 11, 4.5, 0, 0, Math.PI * 2); ctx.stroke();
    for (let k = 0; k < u.rank; k++) box(x - (u.rank * 4 - 1) / 2 + k * 4, baseY - (big ? 40 : 32), 3, 3, u.rank > 1 ? '#d9a0ff' : '#ffd05a');
  }
  if (G.time < (u.lustUntil || 0)) disc(ctx, x, baseY - 6, big ? 18 : 12, `rgba(255,60,40,${(.2 + .1 * Math.sin(animT * 12)).toFixed(2)})`);
  if (G.time < (u.poisonUntil || 0)){                         // poison: green bubbles
    for (let k = 0; k < 2; k++){ const ph = (animT * 1.2 + k * .5) % 1; disc(ctx, x - 4 + k * 8, baseY - 6 - ph * 16, 1.6, `rgba(130,220,70,${(1 - ph).toFixed(2)})`); }
  }
  if (G.time < (u.corrodeUntil || 0)) for (let k = 0; k < 3; k++) box(x - 5 + k * 4, baseY - 12 + (k % 2) * 4, 2, 2, '#8fbf3a');   // acid burns
  if (G.time < (u.webUntil || 0)){                            // webbed: sticky strands around the body
    ctx.strokeStyle = 'rgba(245,245,245,.85)'; ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++){ ctx.beginPath(); ctx.moveTo(x - 9 + k * 2, baseY + 8); ctx.lineTo(x + 7 - k * 3, baseY - 14 + k * 3); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(x, baseY - 3, 9, 11, 0, 0, Math.PI * 2); ctx.stroke();
  }
  if (G.time < (u.stunUntil || 0)) for (let k = 0; k < 3; k++){ // stunned: stars circling the head
    const a = animT * 5 + k * 2.1, sx = x + Math.cos(a) * 8, sy = baseY - (big ? 32 : 26) + Math.sin(a) * 3;
    box(sx - 1, sy, 3, 1, '#ffe45a'); box(sx, sy - 1, 1, 3, '#ffe45a');
  }
  if (G.time - (u.regenAt || -9) < .6){                       // being healed by a temple: a rising green plus
    const ph = ((animT * 1.5 + u.id * .3) % 1), yy = baseY - (big ? 28 : 22) - ph * 8;
    ctx.globalAlpha = 1 - ph; box(x - 1 + 6, yy - 2, 2, 5, '#8fe38a'); box(x - 3 + 6, yy, 6, 1.5, '#8fe38a'); ctx.globalAlpha = 1;
  }
  if (G.time < u.curseUntil){                                  // Curse: purple motes drifting down
    for (let k = 0; k < 3; k++){ const ph = (animT * .8 + k / 3) % 1; disc(ctx, x - 6 + k * 6, baseY - (big ? 30 : 24) + ph * 12, 1.6, `rgba(190,120,255,${(1 - ph).toFixed(2)})`); }
  }
  if (selection.includes(u) || u.hp < u.maxHp)
    hpBar(x - 10, baseY - (T.bar || (u.type === 'knight' || u.mounted ? 36 : T.hero ? 32 : 26)), 20, u.hp / u.maxHp);
  if (u.promoting){ const f = Math.min(1, (G.time - u.promoting.t0) / u.promoting.dur); box(x - 10, baseY + 10, 20, 3, '#1a120b'); box(x - 10, baseY + 10, 20 * f, 3, '#5aa8ff'); }
  if (u.mounted){ const by = baseY - 50; box(x + 8, by, 1, 12, '#4a3321'); box(x + 9, by, 7, 5, F.color); box(x + 9, by + 5, 7, 1, '#e8c547'); }   // the hero's pennant
  // Sleeping creeps: little z's drift up.
  if (u.owner === CREEPS && !u.order && u.hp >= u.maxHp){
    const ph = (animT * 0.5 + u.id * 0.37) % 1;
    ctx.globalAlpha = 1 - ph; ctx.font = '600 9px "Pixelify Sans", monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#efe6ff'; ctx.fillText('z', x + 7 + ph * 5, baseY - (T.bar || 26) - 4 - ph * 12);
    ctx.globalAlpha = 1;
  }
}

// LESSON: A corpse is a tiny timeline: a body lying in a spreading pool of
// blood for 20 seconds, then bones, then it fades away at 70 seconds.
// We store only WHEN it died and draw whatever stage that age calls for.
function drawCorpse(c){
  const age = c.keep ? 30 : G.time - c.t;                        // old remains (a mission's scenery) stay as bones
  const stone = c.type === 'golem', bug = c.type === 'spider' || c.type === 'spitter';
  const fade = age > 60 ? Math.max(0, (70 - age) / 10) : 1;
  ctx.globalAlpha = fade;
  if (!stone){                                                   // pool of blood (green ichor for spiders)
    const r = Math.min(1, age / 1.5) * (UNIT_TYPES[c.type].big ? 12 : 9);
    ctx.fillStyle = bug ? 'rgba(90,130,30,.55)' : 'rgba(110,14,14,.6)';
    ctx.beginPath(); ctx.ellipse(c.x + 2, c.y + 5, r, r * .5, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (stone){                                                    // a golem crumbles into rubble
    for (let k = 0; k < 6; k++) disc(ctx, c.x - 10 + hash(k, c.t | 0) * 20, c.y + hash(c.t | 0, k) * 8, 3 + k % 3, k % 2 ? '#77726a' : '#8f8a80');
  } else if (age < 20){                                          // the body, lying on its side
    const spr = unitSprite({ type:c.type, owner:c.owner, facing:c.facing, moving:false, anim:0, carry:null }, false);
    ctx.save(); ctx.translate(c.x, c.y + 6); ctx.rotate(-c.facing * Math.PI / 2 * .92);
    ctx.globalAlpha = fade * (age > 17 ? (20 - age) / 3 : 1);
    blit(spr, -SPR_OX, -SPR_OY);
    ctx.restore();
  }
  if (!stone && age > 17){                                       // bones
    ctx.globalAlpha = fade * Math.min(1, (age - 17) / 3);
    box(c.x - 7, c.y + 2, 11, 2, '#e6dcc4'); box(c.x - 2, c.y - 1, 2, 7, '#e6dcc4');
    box(c.x + 4, c.y - 2, 5, 4, '#efe6cf'); box(c.x + 5, c.y - 1, 1, 1, '#2a1d12'); box(c.x + 7, c.y - 1, 1, 1, '#2a1d12');

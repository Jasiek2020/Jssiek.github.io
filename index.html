// Shortest time between two plays of the same sound, so a big battle
// doesn't stack fifty identical clangs on top of each other.
const SFX_GAP = { sword:.06, axe:.06, club:.08, bite:.06, punch:.1, bow:.07, sling:.08, spit:.08, magic:.1, arrowHit:.05,
                  die:.08, chop:.12, hammer:.12, coin:.08, wood:.08, growl:.5 };

// Loudness balance, measured by rendering each sound offline and comparing
// peaks: quiet sounds get boosted so a sword clang is as present as an axe hit.
const SFX_LEVEL = { sword:1.8, bite:2, sling:2.5, hammer:1.8, chop:1.5, ready:2, error:1.5, defeat:1.6, die:1.5, arrowHit:1.3 };

// Play a sound that isn't tied to a place (interface sounds, alerts).
function sfx(name, v = 1){
  if (!Sound.ctx || !Sound.sfxOn || Sound.ctx.state !== 'running') return;
  const now = Sound.ctx.currentTime;
  if (now - (Sound.last[name] || 0) < (SFX_GAP[name] || .03)) return;
  if (Sound.voices >= 14) return;                          // hard cap on overlapping sounds
  Sound.last[name] = now; Sound.voices++;
  setTimeout(() => Sound.voices--, 400);
  SFX[name](v * (SFX_LEVEL[name] || 1));
}
// LESSON: Positional sound. Things on screen play at full volume, things just
// off screen play quieter, and far-away things are silent. It keeps the
// soundscape about what you're looking at.
function sfxAt(name, x, y, v = 1){
  if (!Sound.ctx) return;
  const vw = viewW / cam.zoom, vh = viewH / cam.zoom;
  const dx = Math.max(0, Math.abs(x - (cam.x + vw / 2)) - vw / 2), dy = Math.max(0, Math.abs(y - (cam.y + vh / 2)) - vh / 2);
  const off = Math.hypot(dx, dy) / Math.max(vw, vh);        // 0 = on screen
  if (off > 0.6) return;
  sfx(name, v * (1 - off / 0.6));
}
// Which sound a weapon makes, by unit type and faction.
function hitSound(u){
  if (u.kind !== 'unit') return 'bow';
  const t = u.type;
  if (t === 'wolf' || t === 'spider' || t === 'kobold') return 'bite';
  if (t === 'ogre') return 'club';
  if (t === 'golem') return 'punch';
  if (t === 'worker') return 'chop';
  return FACTIONS[u.owner] && FACTIONS[u.owner].horns ? 'axe' : 'sword';
}
function shootSound(u){
  return { kslinger:'sling', spitter:'spit', ogremage:'magic', priest:'magic', mage:'magic', javelin:'sling', cannon:'cannon', scorpion:'scorpion', healer:'magic' }[u.type] || 'bow';
}

// "Under attack!" warning when something of yours is hit off screen.
function underAttack(t){
  G.combatT = G.time;
  const c = centerOf(t), vw = viewW / cam.zoom, vh = viewH / cam.zoom;
  const onScreen = c.x > cam.x && c.x < cam.x + vw && c.y > cam.y && c.y < cam.y + vh;
  if (onScreen || G.time - (G.alertAt || -99) < 20) return;
  G.alertAt = G.time;
  G.ping = { x:c.x, y:c.y, t:G.time };
  G.lastAlert = { x:c.x, y:c.y, t:G.time };
  toast((t.kind === 'building' ? 'Your base is under attack!' : 'Your forces are under attack!') + ' (tap to look)', 4000);
  toastEl.classList.add('alert');
  sfx('alarm');
}

// ----- Music -----
// LESSON: A tiny "sequencer". Every 100 ms we schedule the notes of the next
// few eighth-notes slightly ahead of time using the audio clock, which is far
// more precise than timers. The tune is in D dorian over a four-chord loop,
// with a plucked lute melody, a soft pad, and war drums during fights.
const MUSIC_TEMPO = 84;
const CHORDS = [[50, 57, 62], [48, 55, 60], [46, 53, 58], [48, 55, 60]];      // Dm, C, Bb, C (MIDI note numbers)
const MELODY = [74, -1, 72, 69, 67, -1, 69, -1,  72, -1, 69, 67, 64, -1, 67, -1,
                65, -1, 67, 69, 70, -1, 69, 67,  64, -1, 62, -1, 64, 67, 69, -1];   // -1 = rest
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick(){
  const c = Sound.ctx;
  if (!c) return;
  const stepLen = 60 / MUSIC_TEMPO / 2;
  while (Sound.nextNote < c.currentTime + 0.35){
    if (Sound.musicOn) playStep(Sound.step, Sound.nextNote - c.currentTime, stepLen);
    Sound.nextNote += stepLen; Sound.step++;
  }
  Sound.timer = setTimeout(musicTick, 100);
}
function playStep(step, when, len){
  const M = Sound.music, bar = Math.floor(step / 8) % 4, beat = step % 8;
  const chord = CHORDS[bar];
  if (beat === 0) chord.forEach((m, i) => tone('triangle', hz(m), hz(m), len * 8, .05 - i * .01, when, M));   // pad
  if (beat % 2 === 0) tone('sine', hz(chord[0] - 12), hz(chord[0] - 12), len * 1.8, .09, when, M);            // bass
  const note = MELODY[step % 32];
  if (note > 0 && (step % 64 < 32 || beat % 2 === 0)){                                                          // lute
    tone('triangle', hz(note), hz(note), len * 1.6, .07, when, M);
    tone('sine', hz(note + 12), hz(note + 12), len * .6, .02, when, M);
  }
  const fighting = G && G.time - (G.combatT || -99) < 6;
  if (fighting){                                                                                                 // war drums
    if (beat === 0 || beat === 3 || beat === 4){ tone('sine', 110, 50, .25, .22, when, M); noise(.12, .15, 'lowpass', 400, 1, when, M); }
    if (beat === 6) noise(.08, .1, 'bandpass', 1800, 2, when, M);
  }
}


/* =============================================================================
   15. GAME LOOP & START-UP
   LESSON: The game loop runs ~60 times a second: update the world by "dt"
   (seconds since last frame), then draw it. Multiplying every speed and
   timer by dt makes the game run at the same pace on slow and fast phones.
   ========================================================================== */

function update(dt){
  if (G.camps) countCamps();
  G.time += dt;
  pathBudget = 6; pathMsUsed = 0;
  for (const u of G.units) updateUnit(u, dt);
  separate(dt);
  for (const b of G.buildings) updateBuilding(b, dt);
  updateProjectiles(dt);
  G.effects = G.effects.filter(fx => (fx.life -= dt) > 0);

  if (G.time >= G.fogAt){ G.fogAt = G.time + 0.15; updateFog(); }
  if (G.time >= (G.auraAt || 0)){ G.auraAt = G.time + 0.4; updateAuras(); }
  if (G.time >= (G.regenAt || 0)){ G.regenAt = G.time + 0.5; templeRegen(0.5); }
  if (G.time >= G.aiAt){ G.aiAt = G.time + 1; if (!G.mission || MISSIONS[G.mission.key].setup.enemyBase) for (const o of G.opponents) if (!G.out.includes(o)) aiThink(o); }
  if (G.mission && G.time >= (G.missionAt || 0)){ G.missionAt = G.time + 0.5; missionTick(); }

  // Remove dead things at the END of the frame, so no loop above breaks
  // because an array changed under it.
  G.units = G.units.filter(u => !u.dead);
  G.buildings = G.buildings.filter(b => !b.dead);
  G.mines = G.mines.filter(m => !m.dead);
  G.projectiles = G.projectiles.filter(p => !p.done);
  if (G.items.length) G.items = G.items.filter(it => !it.taken);
  if (selection.some(e => e.dead)) selectList(selection.filter(e => !e.dead));

  if (G.time >= G.endAt){ G.endAt = G.time + 1; checkEnd(); regrowTrees(); campGrowth(1); marketDrift(1); mercTick(); recruitTick();
    if (G.time >= (G.shopSpecialAt || 0)){                 // the Market's special offer changes every three minutes
      const ks = Object.keys(ITEM_TIERS); G.shopSpecialAt = G.time + 180;
      G.shopSpecial = ks[Math.floor(Math.random() * ks.length)] + (Math.random() < .15 ? '+2' : '+1'); }
    for (const u of G.units){
      if (u.expires && G.time > u.expires) u.dead = true;
      if (u.master && !u.order){ const m = G.units.find(x => x.id === u.master && !x.dead); if (m && Math.hypot(m.x - u.x, m.y - u.y) > 4 * TILE) orderMove([u], m.x + TILE, m.y + TILE); }   // dogs follow
    }   /* summoned wolves leave */ G.corpses = G.corpses.filter(c => c.keep || G.time - c.t < 70); }
}

function checkEnd(){
  const alive = o => G.buildings.some(b => b.owner === o) || G.units.some(u => u.owner === o);
  // Opponents drop out one by one; you win when every enemy side is gone.
  for (const o of G.opponents) if (!G.out.includes(o) && !alive(o) && (!G.mission || MISSIONS[G.mission.key].setup.enemyBase)){
    G.out.push(o);
    if (G.opponents.length > 1 && G.out.length < G.opponents.length) toast((allied(PLAYER, o) ? 'Your ally ' : '') + sideName(o) + ' have been eliminated!', 3500);
  }
  if (G.mission){ if (!alive(PLAYER)) endGame(false); return; }   // missions end through their objectives
  if (G.opponents.every(o => G.out.includes(o) || allied(PLAYER, o))) endGame(true);    // every enemy side is gone
  else if (!alive(PLAYER)) endGame(false);
}

let last = performance.now(), uiTimer = 0, miniTimer = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);   // cap dt so a lag spike can't teleport units
  last = now;
  if (G && running && !paused && !G.over && !G.editor) update(dt * gameSpeed);   // slow motion = smaller dt
  driftMenuCamera(dt);
  if (G){
    render();
    if ((uiTimer += dt) > 0.2){ uiTimer = 0; refreshUI(); }
    if ((miniTimer += dt) > 0.25){ miniTimer = 0; renderMinimap(); }
  }
  requestAnimationFrame(frame);
}

function resize(){
  // Tablet layouts: pick by screen shape, and move the minimap into the sidebar in landscape.
  const w = window.innerWidth, h = window.innerHeight;
  const tabLand = w >= 900 && h >= 600 && w > h, tabPort = !tabLand && w >= 700 && h > w;
  document.body.classList.toggle('tab-land', tabLand);
  document.body.classList.toggle('tab-port', tabPort);
  const panel = $('#panel'), viewEl = $('#view');
  if (tabLand && mini.parentElement !== panel) panel.prepend(mini);
  if (!tabLand && mini.parentElement !== viewEl) viewEl.insertBefore(mini, $('#toast'));
  // Sharpness, capped by the Graphics setting AND by a pixel budget, so a big
  // tablet screen doesn't cost several times more than a phone.
  DPR = Math.min(GFX[gfx].dpr, window.devicePixelRatio || 1);
  const r0 = view.getBoundingClientRect();                   // measured AFTER the layout switch
  viewW = Math.max(1, r0.width); viewH = Math.max(1, r0.height);
  if (GFX[gfx].pixels) DPR = Math.max(1, Math.min(DPR, Math.sqrt(GFX[gfx].pixels / Math.max(1, r0.width * r0.height))));
  canvas.width = Math.round(viewW * DPR); canvas.height = Math.round(viewH * DPR);
  if (G) clampCam();
}

}

// ----- Saving and loading -----
// LESSON: Saving a game means turning the whole game state into text
// (JSON) and storing it in the browser (localStorage). Two things need care:
//  1. Typed arrays (the terrain grids) become compact base64 text.
//  2. References: a unit's order may point at another unit, a creature
//     points at its camp. JSON can't store "that object over there", so
//     each reference becomes { $ref: id } (or { $camp: index }) when saving,
//     and is linked back to the real object after loading.
const SAVE_VERSION = 1;
const SAVE_SLOTS = ['1', '2', '3'];
const saveKey = slot => 'bov-save-' + slot;
const bytesOf = arr => new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);
function b64enc(arr){
  const u8 = bytesOf(arr); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64into(str, target){
  const bin = atob(str), u8 = bytesOf(target);
  for (let i = 0; i < bin.length && i < u8.length; i++) u8[i] = bin.charCodeAt(i);
}
const isEntity = v => v && typeof v.id === 'number' && (v.kind === 'unit' || v.kind === 'building' || v.kind === 'mine');
function pack(v){
  if (v === null || typeof v !== 'object') return v;
  if (isEntity(v)) return { $ref:v.id };
  const ci = G.camps.indexOf(v);
  if (ci >= 0) return { $camp:ci };
  if (ArrayBuffer.isView(v)) return null;
  if (Array.isArray(v)) return v.map(pack);
  const o = {}; for (const k in v) o[k] = pack(v[k]); return o;
}
// An entity or camp itself: copy its fields, packing whatever they point at.
const packFields = (obj, skip = []) => { const o = {}; for (const k in obj) if (!skip.includes(k)) o[k] = pack(obj[k]); return o; };

const TYPED = ['terrain', 'wood', 'stump', 'explored', 'height'];
const SPECIAL = ['units', 'buildings', 'mines', 'camps', 'projectiles', 'effects', 'blocked', 'visible', 'place', ...TYPED];
function saveGame(slot){
  if (!G || G.over) return false;
  const g = {};
  for (const k in G) if (!SPECIAL.includes(k)) g[k] = pack(G[k]);
  g.units = G.units.map(u => packFields(u, ['path', 'pathFor']));
  g.buildings = G.buildings.map(b => packFields(b));
  g.mines = G.mines.map(m => packFields(m));
  g.camps = G.camps.map(c => packFields(c, ['alive', 'awake']));
  g.effects = G.effects.filter(f => f.type === 'ruin');
  for (const k of TYPED) g[k] = b64enc(G[k]);
  const data = { v:SAVE_VERSION, meta:{ savedAt:Date.now(), faction:isOrc(PLAYER) ? 'orcs' : 'kingdom', difficulty:G.difficulty || settings.difficulty, map:G.map, size:G.size || 'normal', time:G.time, opponents:G.opponents.length, teams:settings.teams.slice(), aiDiff:settings.aiDiff.slice(),
                                      mission:G.mission ? MISSIONS[G.mission.key].name : null },
                 ai:{ ...AI }, g };
  try { localStorage.setItem(saveKey(slot), JSON.stringify(data)); return true; }
  catch (e) { toast('Could not save: storage is full or unavailable'); return false; }
}
function readSave(slot){
  try { const raw = localStorage.getItem(saveKey(slot)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function loadGame(slot){
  const data = readSave(slot);
  if (!data) return fail(PLAYER, 'That save slot is empty');
  if (data.v !== SAVE_VERSION) return fail(PLAYER, 'That save is from an older version of the game');
  const keep = { ...settings };
  settings.faction = data.meta.faction; settings.difficulty = data.meta.difficulty; settings.map = data.meta.map;
  settings.size = data.meta.size || 'normal';               // the size decides how big the arrays are
  settings.opponents = data.meta.opponents || 1;
  if (data.meta.teams) settings.teams = data.meta.teams.slice();
  if (data.meta.aiDiff) settings.aiDiff = data.meta.aiDiff.slice();
  newGame();
  Object.assign(settings, keep);                                              // a fresh state (factions seated, arrays sized), then overwrite it
  const g = data.g;
  for (const k in g) if (!SPECIAL.includes(k)) G[k] = g[k];
  for (const k of TYPED) if (g[k]) b64into(g[k], G[k]);           // (older saves have no heights)
  G.units = g.units; G.buildings = g.buildings; G.mines = g.mines; G.camps = g.camps;
  G.projectiles = []; G.effects = g.effects || []; G.place = null;
  // Link references back up: { $ref:id } -> the entity with that id, { $camp:i } -> that camp.
  const byId = new Map();
  for (const e of [...G.units, ...G.buildings, ...G.mines]) byId.set(e.id, e);
  const fix = v => {
    if (v === null || typeof v !== 'object') return v;
    if ('$ref' in v) return byId.get(v.$ref) || null;
    if ('$camp' in v) return G.camps[v.$camp] || null;
    if (Array.isArray(v)){ for (let i = 0; i < v.length; i++) v[i] = fix(v[i]); return v; }
    for (const k in v) v[k] = fix(v[k]);
    return v;
  };
  for (const e of [...G.units, ...G.buildings, ...G.mines]){ for (const k in e) e[k] = fix(e[k]); }
  for (const u of G.units){ u.path = []; u.pathFor = null; }   // paths are recalculated
  for (const c of G.camps) for (const k in c) c[k] = fix(c[k]);
  for (const k in g) if (!SPECIAL.includes(k)) G[k] = fix(G[k]);
  G.blocked.fill(0);
  for (const b of G.buildings) markBlocked(b, b.id);
  for (const m of G.mines) markBlocked(m, m.id);
  for (const m of G.mercs || []) markBlocked(m, m.id);
  if (!G.ai || !G.ai[ENEMY]) G.ai = { [ENEMY]:{ ...data.ai } };   // older saves kept one AI's plans outside G
  AI = G.ai[ENEMY];
  selection = [];
  resetTerrainCache(); updateFog();
  return true;
}
const hasSave = slot => { try { return !!localStorage.getItem(saveKey(slot)); } catch (e) { return false; } };
function saveLabel(data){
  const m = data.meta, when = new Date(m.savedAt);
  const F = BASE_FACTIONS.length ? BASE_FACTIONS[m.faction === 'orcs' ? 1 : 0].name : m.faction;
  if (m.mission) return `Campaign: ${m.mission}<br><small>Battle ${fmtTime(m.time)} · saved ${when.toLocaleDateString()} ${when.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}</small>`;
  return `${F}${(m.opponents || 1) > 1 ? ' vs ' + m.opponents : ''} · ${(MAPS[m.map] || MAPS.vale).name} (${(MAP_SIZES[m.size] || MAP_SIZES.normal).label}) · ${(DIFFICULTY[m.difficulty] || DIFFICULTY.normal).label}<br>
          <small>Battle ${fmtTime(m.time)} · saved ${when.toLocaleDateString()} ${when.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}</small>`;
}
// Autosave: every minute of play, and whenever you switch away from the app
// (Android may close apps in the background without warning).
setInterval(() => { if (G && running && !paused && !G.over) saveGame('auto'); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && G && running && !G.over) saveGame('auto'); });

function showSlots(mode, back){
  const slots = mode === 'load' ? ['auto', ...SAVE_SLOTS] : SAVE_SLOTS;
  screen(`<h1>${mode === 'save' ? 'Save game' : 'Load game'}</h1>
    <div class="menu-col slots">${slots.map(s => {
      const d = readSave(s);
      const title = s === 'auto' ? 'Autosave' : 'Slot ' + s;
      const off = mode === 'load' && !d;
      return `<button data-slot="${s}" ${off ? 'disabled class="off"' : ''}><b>${title}</b><br>${d ? saveLabel(d) : '<small>Empty</small>'}</button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="big" id="backBtn">Back</button></div>`, { menu:back === showMainMenu });
  $('#backBtn').onclick = back;
  overlay.querySelectorAll('[data-slot]').forEach(btn => btn.onclick = () => {
    const s = btn.dataset.slot;
    if (mode === 'save'){
      const doSave = () => { if (saveGame(s)){ toast('Game saved'); } back(); };
      if (readSave(s)) confirmScreen('Overwrite this save?', 'The old save in this slot will be replaced.', doSave, () => showSlots(mode, back));
      else doSave();
    } else {
      const doLoad = () => { if (loadGame(s)) startBattle(); else showSlots(mode, back); };
      if (back === showPause) confirmScreen('Load this save?', 'The current battle will be lost.', doLoad, () => showSlots(mode, back));
      else doLoad();
    }
  });
}

// ----- Missions and the campaign -----
// LESSON: A mission is a list of objectives, each with a way to measure it:
//   check()           -> done when it returns true
//   count() + need    -> "3/5" style progress, done when count reaches need
//   count(), countdown-> "3 left", done when it reaches zero
//   survive: seconds  -> a timer, done when it runs out
// Optional start() and tick() hooks let a step set things up (spawn raiders)
// or run scripted events (attack waves). Only the mission's name, step
// number and step start time live in the game state, so missions save and
// load like anything else.
const plural = w => /man$/.test(w) ? w.replace(/man$/, 'men') : /(ss|s|x|ch|sh)$/.test(w) ? w + 'es' : w + 's';
const countBuilt = (type, owner = PLAYER) => G.buildings.filter(b => b.owner === owner && b.type === type && b.built >= 1).length;
const raidersLeft = () => G.units.filter(u => u.owner === ENEMY).length;
const enemyBuildings = type => G.buildings.filter(b => b.owner === ENEMY && (!type || b.type === type)).length;
const playerHall = () => G.buildings.find(b => b.owner === PLAYER && b.type === 'townhall') || G.buildings.find(b => b.owner === PLAYER);

// LESSON: Every hero can ride. Mounted: +60% speed and +2 damage, but -2 armor;
// on foot: the normal stats. Switching takes a moment (3s cooldown), so it is a
// choice: ride to travel, chase or escape, get down to hold a line.
function toggleMount(h){
  if (!h || h.dead || !UNIT_TYPES[h.type].hero) return false;
  if (G.time < (h.mountReady || 0)) return fail(h.owner, 'Wait a moment before switching again');
  h.mounted = !h.mounted; h.mountReady = G.time + 3;
  G.effects.push({ type:'ring', x:h.x, y:h.y, color:'#e8c547', life:.4, max:.4, r:14 });
  if (h.owner === PLAYER){ sfx(h.mounted ? 'ack' : 'click'); }
  return true;
}
// ----- Hero training at the Barracks (your Kingdom) -----
// LESSON: Spending gold on heroes. A hero standing near a Barracks can be
// trained: bought a level, or given lasting upgrades (health, damage, armor,
// range, a bigger pack). Each hero keeps its own upgrades in h.upg.
const HERO_TRAINING = [
  { key:'hp',    label:'Toughness',      desc:'+80 health',            max:3, cost:{ gold:120, wood:0 } },
  { key:'dmg',   label:'Weapon drill',   desc:'+2 damage',             max:3, cost:{ gold:150, wood:50 } },
  { key:'armor', label:'Armor drill',    desc:'+1 armor',              max:2, cost:{ gold:140, wood:60 } },
  { key:'range', label:'Marksmanship',   desc:'+1 attack range',       max:2, cost:{ gold:160, wood:80 }, ranged:true },
  { key:'slots', label:'Pack mule',      desc:'+1 inventory slot',     max:2, cost:{ gold:200, wood:0 } },
];
const HERO_TRAIN_REACH = 6;
const heroUpg = (h, k) => (h && h.upg && h.upg[k]) || 0;
const levelUpCost = h => ({ gold:100 + 50 * h.level, wood:0 });
// The hero who trains at this Barracks: the selected/buyer hero if close enough, else any hero close enough.
function trainHero(b){
  const c = centerOf(b), near = h => h && !h.dead && Math.hypot(h.x - c.x, h.y - c.y) / TILE <= HERO_TRAIN_REACH;
  const bh = buyerHero(PLAYER); return near(bh) ? bh : heroesOf(PLAYER).find(near) || null;
}
function heroTrain(h, what){
  if (!h) return fail(PLAYER, 'Bring a hero to the Barracks');
  if (what === 'level'){
    if (h.level >= 10) return fail(PLAYER, 'Already at the highest level');
    const c = levelUpCost(h); if (!canAfford(PLAYER, c)) return fail(PLAYER, 'Not enough gold');
    pay(PLAYER, c); addXP(h, Math.max(1, xpNeeded(h.level) - h.xp));
  } else {
    const T = HERO_TRAINING.find(t => t.key === what);
    if (heroUpg(h, what) >= T.max) return fail(PLAYER, 'Fully trained');
    if (!canAfford(PLAYER, T.cost)) return fail(PLAYER, 'Not enough resources');
    pay(PLAYER, T.cost); h.upg = h.upg || {}; h.upg[what] = heroUpg(h, what) + 1;
    if (what === 'hp'){ const add = Math.round(50 * HP_SCALE); h.maxHp += add; h.hp += add; }
  }
  G.effects.push({ type:'ring', x:h.x, y:h.y, color:'#5aa8ff', life:.6, max:.6, r:18 }); sfx('levelup');
  return true;
}

// Place a finished building at the nearest spot where it fits.
function putNear(type, owner, tx, ty){
  for (let r = 0; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (Math.max(Math.abs(dx), Math.abs(dy)) === r && canPlace(type, tx + dx, ty + dy, owner, 1)) return placeBuilding(type, owner, tx + dx, ty + dy, true);
  return null;
}
// ----- Kingdom recruits and acolytes -----
// LESSON: Promotion instead of training. The Kingdom raises its soldiers from
// common folk: Barracks train Recruits and Temples train Acolytes, and you
// promote them into Footmen, Longbowmen, Knights, Priests or Sorceresses. A
// promotion costs the difference in price and takes a little time. (The
// Kingdom AI trains the finished units directly, at the same total cost.)
const PROMOTE = { recruit:['worker', 'footman', 'archer', 'knight'], acolyte:['priest', 'mage'] };
const PROMOTE_NEEDS = { worker:['townhall'], footman:['barracks'], archer:['barracks'], knight:['stable'], priest:['temple'], mage:['temple'] };
const VIA_PROMOTION = new Set(['worker', 'footman', 'archer', 'knight', 'priest', 'mage', 'recruit', 'acolyte']);
// LESSON: Larva, as in StarCraft. For the Kingdom you play, town halls and Barracks
// produce Recruits by themselves (and Temples produce Acolytes) until the population
// is full. Nothing is trained: every worker and soldier is a promoted Recruit.
// Kingdom farms hold only 2; upgrading one (which costs a Recruit, who goes to work
// it) brings it to 4. The orcs, and the Kingdom when the AI plays it, are unchanged.
const kingdomLarva = () => G && !isOrc(PLAYER) && !(G.mission && MISSIONS[G.mission.key].setup.roster);
const RECRUIT_FROM = { barracks:['recruit', 10], temple:['acolyte', 12] };
// (setupBase runs before the mission is known, so it asks the settings directly.)
const KINGDOM_START_GOLD = 200;
const kingdomLarvaStart = () => (FACTIONS[PLAYER] && !FACTIONS[PLAYER].horns) && !(PENDING_ROSTER);
let PENDING_ROSTER = false;
function recruitTick(){                                     // once a second
  if (!kingdomLarva()) return;
  const f = foodOf(PLAYER); let room = f.cap - f.used;
  for (const b of G.buildings){
    if (room <= 0) break;
    const R = RECRUIT_FROM[b.type];
    if (!R || b.owner !== PLAYER || b.built < 1 || !techAllows('unit', R[0])) continue;
    if (b.genAt == null){ b.genAt = G.time + R[1]; continue; }
    if (G.time < b.genAt) continue;
    b.genAt = G.time + R[1];
    const c = centerOf(b), sp = nearestFreeTile(tileOf(c.x), b.ty + b.size + 1);
    const u = spawnUnit(R[0], PLAYER, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
    if (b.rally) orderMove([u], b.rally.x, b.rally.y);
    room--;
  }
}
const KFARM_UP = { cost:{ gold:0, wood:0 }, time:10, recruit:true };     // a Kingdom farm upgrade: one Recruit
const promoteCost = (from, to) => { const a = UNIT_TYPES[from].cost, b = UNIT_TYPES[to].cost; return { gold:Math.max(0, b.gold - a.gold), wood:Math.max(0, b.wood - a.wood) }; };
function promoteMissing(owner, to){
  if (!techAllows('unit', to)) return 'not available yet';
  const miss = missingReq(owner, [...PROMOTE_NEEDS[to], ...(UNIT_TYPES[to].needs || [])]);
  return miss ? 'needs ' + reqName(owner, miss) : null;
}
function promote(u, to){
  const owner = u.owner, T = UNIT_TYPES[to], c = promoteCost(u.type, to), P = G.players[owner];
  if (u.promoting || u.dead) return false;
  const miss = promoteMissing(owner, to); if (miss) return fail(owner, miss[0].toUpperCase() + miss.slice(1));
  if (P.gold < c.gold) return fail(owner, 'Not enough gold');
  if (P.wood < c.wood) return fail(owner, 'Not enough lumber');
  const extra = T.food - UNIT_TYPES[u.type].food, f = foodOf(owner);
  if (extra > 0 && f.used + extra > f.cap) return fail(owner, 'Build more farms');
  pay(owner, c);
  u.promoting = { to, t0:G.time, dur:Math.max(4, Math.round(T.time * .6)) };
  setOrder(u, null);
  return true;
}
// Called every frame for a unit being promoted: it stands still until it's done.
function promoteTick(u){
  const pr = u.promoting;
  if (G.time - pr.t0 < pr.dur) return;
  const n = spawnUnit(pr.to, u.owner, u.x, u.y);
  n.stance = u.stance; u.promoting = null; u.dead = true;          // the recruit becomes the new soldier
  if (selection.includes(u)){ selection = selection.map(x => x === u ? n : x); refreshUI(); }
  if (u.owner === PLAYER){ toast(nameOf(n) + ' ready'); sfx('ack'); }
}

function sendRaiders(types){
  const hall = playerHall(), c = hall ? centerOf(hall) : { x:TILE * 12, y:TILE * 12 };
  let from = G.mission && G.mission.raidFrom ? nearestFreeTile(...G.mission.raidFrom) : nearestFreeTile(MAP_W - 16, MAP_H - 16);
  if (G.mission && G.mission.camps){                           // waves march out of a camp that still stands
    const alive = G.mission.camps.map(id => G.buildings.find(b => b.id === id && isAlive(b))).filter(Boolean);
    if (!alive.length) return [];
    const c = centerOf(alive[Math.floor(Math.random() * alive.length)]); from = nearestFreeTile(tileOf(c.x), tileOf(c.y) + 3);
  }
  const band = types.map((t, i) => { const s = nearestFreeTile(from.x + (i % 3), from.y + Math.floor(i / 3)); return spawnUnit(t, ENEMY, (s.x + .5) * TILE, (s.y + .5) * TILE); });
  orderMove(band, c.x, c.y, true);
  G.ping = { x:band[0].x, y:band[0].y, t:G.time };
  sfx('alarm');
  return band;
}
// Orc scouts (mission 2): a small party that wanders near its post in the
// far corner. "Minimal AI": every so often an idle scout strolls to a random
// spot near its post; the normal unit rules make it fight back if attacked
// and return afterwards. They never go looking for your base.
function spawnScouts(){
  const post = nearestFreeTile(...spotOf('scouts', [MAP_W - 16, MAP_H - 16]));
  ['knight', 'knight', rangedOf(ENEMY), 'footman'].forEach((t, i) => {
    const sp = nearestFreeTile(post.x + (i % 2) * 2, post.y + Math.floor(i / 2) * 2);
    const u = spawnUnit(t, ENEMY, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
    u.post = { x:u.x, y:u.y }; u.patrolAt = G.time + 4 + i * 3;
  });
}
function scoutTick(){
  for (const u of G.units){
    if (u.owner !== ENEMY || !u.post || u.dead) continue;
    if (!u.order && G.time >= u.patrolAt){
      u.patrolAt = G.time + 10 + Math.random() * 8;
      const tx = tileOf(u.post.x) + Math.round(Math.random() * 12 - 6), ty = tileOf(u.post.y) + Math.round(Math.random() * 12 - 6);
      if (isWalkable(tx, ty)) orderMove([u], (tx + .5) * TILE, (ty + .5) * TILE, true);
    }
    if (!G.mission.scoutsSeen && G.visible[idx(tileOf(u.x), tileOf(u.y))]){   // the first sighting
      G.mission.scoutsSeen = true;
      G.ping = { x:u.x, y:u.y, t:G.time }; sfx('alarm');
      toast(FACTIONS[ENEMY].name + ' scouts! They are watching the vale…', 4500);
    }
  }
}

// A small allied town (scenery): hall, farms, market, temple and barracks, with a
// few workers mining a gold mine that never runs out. Its owner has no AI, so the
// barracks never trains and nobody leaves town.
function buildAlliedTown(owner, [cx, cy], list, withMine = true){
  for (const b of G.buildings) if (b.owner === owner) markBlocked(b, 0);            // clear the ally's usual corner start
  G.buildings = G.buildings.filter(b => b.owner !== owner); G.units = G.units.filter(u => u.owner !== owner);
  const put = (type, tx, ty) => { for (let r = 0; r < 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
    if (canPlace(type, tx + dx, ty + dy, owner, 0)){ return placeBuilding(type, owner, tx + dx, ty + dy, true); } return null; };
  const hall = put('townhall', cx - 1, cy - 1);
  for (const [type, dx, dy] of list || [['farm', 4, -5], ['farm', 7, -2], ['farm', -4, 5], ['farm', 0, 6], ['market', -2, -7], ['temple', 6, 3], ['barracks', 3, 7]]) put(type, cx + dx, cy + dy);
  if (!withMine) return hall;
  placeMine(cx - 9, cy - 2); const mine = G.mines[G.mines.length - 1]; mine.gold = 1e9; mine.endless = true;   // never runs dry
  for (let k = 0; k < 4; k++){
    const sp = nearestFreeTile(cx - 4 + k, cy + 2), w = spawnUnit('worker', owner, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
    orderGather(w, mine);
  }
  return hall;
}

// Guards (mission 5): groups that hold a post like a creep camp. They attack
// anything that comes close (normal unit rules), and walk back to their post
// once the fight is over. The orcs here have no base and never reinforce.
function spawnGuards(tx, ty, types){
  return types.map((t, i) => {
    const sp = nearestFreeTile(tx + (i % 3) - 1, ty + Math.floor(i / 3));
    const u = spawnUnit(t, ENEMY, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
    u.post = { x:u.x, y:u.y }; u.guard = true;
    return u;
  });
}
function guardTick(){
  for (const u of G.units){
    if (u.owner !== ENEMY || !u.guard || u.dead || u.order) continue;
    if (Math.hypot(u.x - u.post.x, u.y - u.post.y) > 2 * TILE) orderMove([u], u.post.x, u.post.y);
  }
}
// A 2x2 open spot near (tx, ty), for placing a cage.
function openSpot(tx, ty){
  for (let r = 0; r < 12; r++)
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++){
      const x = tx + dx, y = ty + dy;
      if ([[0, 0], [1, 0], [0, 1], [1, 1]].every(([a, b]) => isWalkable(x + a, y + b))) return { x, y };
    }
  return { x:tx, y:ty };
}
function placeCage(tx, ty, prisoners){
  const sp = openSpot(tx, ty), b = placeBuilding('cage', ENEMY, sp.x, sp.y, true);
  b.prisoners = prisoners;
  return b;
}
function freePrisoners(cage){
  const c = centerOf(cage);
  for (const t of cage.prisoners){ const sp = nearestFreeTile(tileOf(c.x), tileOf(c.y) + 2); spawnUnit(t, PLAYER, (sp.x + .5) * TILE, (sp.y + .5) * TILE); }
  if (G.mission) G.mission.freed = (G.mission.freed || 0) + 1;
  toast('Prisoners freed! They join your squad.'); sfx('complete');
}

function giveHero(level, type = 'hero'){
  const hall = playerHall(), s = nearestFreeTile(hall.tx + 4, hall.ty + 5);
  const h = spawnUnit(type, PLAYER, (s.x + .5) * TILE, (s.y + .5) * TILE);
  while (h.level < level) addXP(h, xpNeeded(h.level));
  h.hp = h.maxHp;
  return h;
}

// ----- Campaign tech tree -----
// LESSON: Unlocking the tech tree step by step. Each campaign mission has a
// tech level; level N allows everything added in levels 1..N. Skirmishes have
// no level, so everything is allowed. The same limits apply to every side, so
// the enemy grows along with you. One function, techAllows(), is asked by the
// build menu, training, research, upgrades and the AI alike.
const TECH_UNLOCKS = [
  null,
  { units:['worker', 'footman', 'scout', 'recruit'], buildings:['townhall', 'farm', 'barracks'], research:[] },                               // 1
  { units:['archer', 'javelin', 'hero'], buildings:['lumbermill', 'tower'], research:['fletching', 'tools'] },           // 2
  { buildings:['blacksmith', 'market'], research:['weapons', 'armor', 'toughness', 'shields', 'pillage'] },             // 3
  { research:['longbows', 'masonry'], upgrades:['tower', 'farm'] },                                                      // 4
  {},                                                                                                                   // 5
  { units:['knight'], buildings:['stable'], hall:2,
    research:['tools2', 'weapons2', 'armor2', 'barding', 'masonry2', 'fletching2', 'veterans', 'thickhides', 'discipline', 'marksman', 'berserk', 'ballistics'] },   // 6
  { units:['scorpion', 'cannon'] },                                                                                     // 7
  {},                                                                                                                   // 8
  { units:['priest', 'mage', 'healer', 'acolyte'], buildings:['temple'], hall:3, all:true },                                      // 9: everything else
  { all:true },                                                                                                         // 10
];
function techSet(level){
  const set = { units:new Set(), buildings:new Set(), research:new Set(), upgrades:new Set(), hall:1, all:false };
  for (let i = 1; i <= level && i < TECH_UNLOCKS.length; i++){
    const T = TECH_UNLOCKS[i];
    for (const k of ['units', 'buildings', 'research', 'upgrades']) for (const x of T[k] || []) set[k].add(x);
    if (T.hall) set.hall = T.hall;
    if (T.all) set.all = true;
  }
  return set;
}
// kind: 'unit', 'building', 'research', 'upgrade' (of a building type), or 'hall' (a town hall level)
function techAllows(kind, key){
  if ((kind === 'unit' || kind === 'building') && G && G.banned && G.banned.includes(key)) return false;   // switched off by the map's rules
  if (kind === 'unit' && G && G.mission && Object.values(MISSIONS[G.mission.key].setup.roster || {}).some(l => l.includes(key))) return true;   // a mission's own units
  if (!G || !G.tech) return true;
  const T = techSet(G.tech);
  if (kind === 'hall') return T.all || key <= T.hall;
  if (T.all) return true;
  return T[kind === 'unit' ? 'units' : kind === 'building' ? 'buildings' : kind === 'research' ? 'research' : 'upgrades'].has(key);
}
// What a mission adds compared with the one before it, for its briefing.
function newTechText(level, side = 'kingdom', prev = level - 1){
  if (level <= 1) return '';
  const now = techSet(level), before = techSet(prev), N = BASE_FACTIONS.length ? BASE_FACTIONS[side === 'orcs' ? 1 : 0].names : FACTIONS[0].names;
  if (now.all && !before.all) return 'Everything is unlocked: temples, spellcasters, the healer hero and all research.';
  const items = [...[...now.units].filter(u => !before.units.has(u) && u !== (side === 'orcs' ? 'archer' : 'javelin') && u !== (side === 'orcs' ? 'scorpion' : 'cannon')).map(u => UNIT_TYPES[u].hero ? 'the ' + N[u] + ' (hero)' : plural(N[u] || u)),
                 ...[...now.buildings].filter(b => !before.buildings.has(b)).map(b => plural(N[b] || b)),
                 ...[...now.upgrades].filter(b => !before.upgrades.has(b)).map(b => b === 'tower' ? 'Tower upgrades' : 'Farm upgrades'),
                 ...(now.hall > before.hall ? ['the ' + (N['townhall' + now.hall] || 'hall upgrade')] : []),
                 ...[...now.research].filter(r => !before.research.has(r) && (!RESEARCH[r].faction || RESEARCH[r].faction === side)).map(r => RESEARCH[r].name)];
  return items.length ? 'New in this mission: ' + items.join(', ') + '.' : '';
}

// ----- Stars -----
// LESSON: Replay value from a tiny addition. Finishing a mission earns one
// star and each bonus objective met earns another, up to three. Only the best
// result is kept, so going back for a better score always feels worth it.
function missionStars(){ try { return JSON.parse(localStorage.getItem('bov-stars') || '{}'); } catch (e) { return {}; } }
function saveStars(key, n){ const s = missionStars(); if ((s[key] || 0) < n){ s[key] = n; try { localStorage.setItem('bov-stars', JSON.stringify(s)); } catch (e) {} } }
const starsText = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 3 - n));
function missionResultHTML(win){
  if (!G.mission) return '';
  const M = MISSIONS[G.mission.key], res = (M.bonus || []).map(b => ({ text:b.text, ok:win && b.ok() }));
  const stars = win ? 1 + res.filter(r => r.ok).length : 0;
  if (win) saveStars(starKey(G.mission.key, bonusDiff()), stars);
  return `${win ? `<p class="lede" style="font-size:30px; color:var(--brass); margin:0 0 6px">${starsText(stars)}</p>` : ''}
    <ul class="how">${res.map(r => `<li>${r.ok ? '✓' : '✗'} Bonus: ${r.text}</li>`).join('')}</ul>`;
}
function giveHeroAt(tx, ty, level, type = 'hero'){
  const s = nearestFreeTile(tx, ty), h = spawnUnit(type, PLAYER, (s.x + .5) * TILE, (s.y + .5) * TILE);
  while (h.level < level) addXP(h, xpNeeded(h.level));
  h.hp = h.maxHp; return h;
}

function trialRound(types){
  const h = heroesOf(PLAYER)[0]; if (!h) return;
  // They come from one side, spread in an arc, so the hero is not surrounded at once
  // and can choose to fight, fall back or pull them into a line.
  const side = Math.random() * Math.PI * 2;
  types.forEach((t, i) => {
    const a = side + (i / Math.max(1, types.length - 1) - .5) * 1.1, cx = MAP_PX_W / 2, cy = MAP_PX_H / 2;
    const sp = nearestFreeTile(tileOf(cx + Math.cos(a) * 11 * TILE), tileOf(cy + Math.sin(a) * 11 * TILE));   // from the edge of the ring
    const u = spawnUnit(t, ENEMY, (sp.x + .5) * TILE, (sp.y + .5) * TILE);
    orderMove([u], h.x, h.y, true);
  });
  sfx('growl');
}

    const u = spawnUnit(t, ENEMY, (sp.x + .5) * TILE, (sp.y + .5) * TILE); u.post = { x:u.x, y:u.y }; u.patrolAt = G.time + 3 + i * 2; return u; });

// A fortress: fortified towers in a ring around an enemy hall, and the hall at its top level.
function fortify(owner, towers){
  const hall = G.buildings.find(b => b.owner === owner && b.type === 'townhall'); if (!hall) return;
  for (const [key, lvl] of [['upgrade', 2], ['upgrade3', 3]]){ const U = BUILDING_TYPES.townhall[key]; hall.level = lvl; hall.maxHp += U.hp; hall.armor += U.armor || 0; }
  hall.hp = hall.maxHp;
  const c = centerOf(hall), UP = BUILDING_TYPES.tower.upgrade;
  for (let i = 0; i < towers; i++){
    const a = i / towers * Math.PI * 2 + .3;
    for (let r = 6; r <= 10; r++){
      const tx = tileOf(c.x + Math.cos(a) * r * TILE), ty = tileOf(c.y + Math.sin(a) * r * TILE);
      if (canPlace('tower', tx, ty, owner, 0)){
        const t = placeBuilding('tower', owner, tx, ty, true);
        if (isOrc(owner)){ t.level = 2; t.maxHp += UP.hp; }
        else { t.level = 3; t.maxHp += UP.hp + BUILDING_TYPES.tower.guardUp.hp; }        // Kingdom: watch -> guard -> fortified
        t.hp = t.maxHp; t.armor += UP.armor || 0;
        break;
      }
    }
  }
}

const BONUS_SCALE = { easy:{ time:1.3, lost:n => n + 2, money:.6, hp:.5 }, normal:{ time:1, lost:n => n, money:1, hp:1 }, hard:{ time:.8, lost:n => Math.floor(n / 2), money:1.5, hp:2 } };

  if ((m = b.text.match(/^Finish within (\d+):(\d\d)$/))){
    const base = +m[1] * 60 + +m[2], lim = () => Math.round(base * S().time / 30) * 30;
    return { get text(){ return 'Finish within ' + fmtTime(lim()); }, ok:() => G.time <= lim() };
  }
  if ((m = b.text.match(/^Lose at most (\d+) units$/))){
    const base = +m[1], lim = () => S().lost(base);
    return { get text(){ return lim() === 0 ? 'Lose no units' : 'Lose at most ' + lim() + (lim() === 1 ? ' unit' : ' units'); }, ok:() => G.stats.lost <= lim() };
  }
  if ((m = b.text.match(/^Win by at least (\d+) gold$/))){
    const base = +m[1], lim = () => Math.round(base * S().money / 100) * 100;
    return { get text(){ return 'Win by at least ' + lim() + ' gold'; }, ok:() => ((G.gathered || {})[PLAYER] || 0) - ((G.gathered || {})[ENEMY] || 0) >= lim() };
  }

// LESSON: An editor reuses the game. It is the same map, drawn by the same
// renderer, with the simulation switched off: touches paint tiles or place

// grids (as text) plus lists of mines, start points and camps, so a skirmish can
// rebuild it exactly, and a map can be shared as one long code.
let ED = null, USER_MAP = null;
const ED_SIZES = { small:{ label:'Small', n:64 }, normal:{ label:'Normal', n:96 }, large:{ label:'Large', n:128 } };
const ED_TOOLS = [['grass', 'Grass'], ['tree', 'Forest'], ['water', 'Water'], ['dirt', 'Road'], ['sand', 'Sand'], ['swamp', 'Swamp'], ['rocks', 'Rocks'], ['rock', 'Wall'],
                  ['high', 'High ground'], ['low', 'Low ground'], ['ramp', 'Ramp'], ['mine', 'Gold mine'], ['merc', 'Merc camp'], ['start', 'Start'], ['camp', 'Camp'], ['erase', 'Eraser'], ['pan', 'Move']];
const ED_PAINT = { grass:T_GRASS, tree:T_TREE, water:T_WATER, dirt:T_DIRT, rock:T_ROCK, sand:T_SAND, swamp:T_SWAMP, rocks:T_BOULDER };
function userMaps(){ try { return JSON.parse(localStorage.getItem('bov-maps') || '[]'); } catch (e){ return []; } }
function saveUserMaps(list){ try { localStorage.setItem('bov-maps', JSON.stringify(list)); return true; } catch (e){ toast('Could not save: storage is full'); return false; } }
const mapCode = data => btoa(unescape(encodeURIComponent(JSON.stringify(data))));
const readCode = code => JSON.parse(decodeURIComponent(escape(atob(code.trim()))));

function edMirrors(x, y){
  const out = [[x, y]];
  if (ED.mirror >= 2) out.push([MAP_W - 1 - x, MAP_H - 1 - y]);
  if (ED.mirror === 4) out.push([MAP_W - 1 - x, y], [x, MAP_H - 1 - y]);
  return out;
}
function edPaintAt(wx, wy){
  const cx = tileOf(wx), cy = tileOf(wy), r = ED.brush - 1;
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1, heights = false;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++){
    if (dx * dx + dy * dy > r * r + r) continue;
    for (const [x, y] of edMirrors(cx + dx, cy + dy)){
      if (!inBounds(x, y)) continue;
      const i = idx(x, y); if (G.blocked[i]) continue;               // never paint over a gold mine
      const tt = ED_PAINT[ED.tool];
      if (tt !== undefined){ if (G.terrain[i] === T_CLIFF) continue; G.terrain[i] = tt; G.wood[i] = tt === T_TREE ? TREE_WOOD : 0; G.stump[i] = 0; terrainChanged(x, y); }
      else if (ED.tool === 'high'){ G.height[i] = 1; heights = true; }
      else if (ED.tool === 'low'){ G.height[i] = 0; ED.ramp[i] = 0; heights = true; }
      else if (ED.tool === 'ramp' && G.height[i]){ ED.ramp[i] = 1; heights = true; }
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    }
  }
  if (heights) edCliffs(x0 - 2, y0 - 2, x1 + 2, y1 + 2);
}
// Cliffs follow the high ground: any high tile next to low ground is a cliff, unless it is a ramp.
function edCliffs(x0, y0, x1, y1){
  for (let y = Math.max(0, y0); y <= Math.min(MAP_H - 1, y1); y++) for (let x = Math.max(0, x0); x <= Math.min(MAP_W - 1, x1); x++){
    const i = idx(x, y);
    if (G.terrain[i] === T_CLIFF) G.terrain[i] = T_GRASS;
    if (G.height[i] && !ED.ramp[i] && DIRS.some(([dx, dy]) => inBounds(x + dx, y + dy) && !G.height[idx(x + dx, y + dy)])){ G.terrain[i] = T_CLIFF; G.wood[i] = 0; }
    terrainChanged(x, y);
  }
}
function edPlaceMine(x, y){
  for (let yy = y - 1; yy <= y + 3; yy++) for (let xx = x - 1; xx <= x + 3; xx++) if (!inBounds(xx, yy) || G.blocked[idx(xx, yy)]) return;
  placeMine(x, y);
  for (let yy = y; yy < y + 3; yy++) for (let xx = x; xx < x + 3; xx++) terrainChanged(xx, yy);
}
function edObjectAt(wx, wy){
  const tx = tileOf(wx), ty = tileOf(wy);
  if (ED.tool === 'mine'){ for (const [x, y] of edMirrors(tx, ty)) edPlaceMine(x - 1, y - 1); return; }
  if (ED.tool === 'merc'){ for (const [x, y] of edMirrors(tx, ty)){ let ok = true;
      for (let yy = y - 2; yy <= y + 2 && ok; yy++) for (let xx = x - 2; xx <= x + 2 && ok; xx++) ok = inBounds(xx, yy) && !G.blocked[idx(xx, yy)];
      if (ok){ placeMerc(x - 1, y - 1); for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) terrainChanged(xx, yy); } } return; }
  if (ED.tool === 'start'){ ED.starts[ED.startNo] = [tx - 1, ty - 1]; toast('Start ' + ED.startNo + ' placed'); ED.startNo = ED.startNo % 4 + 1; edPanel(); return; }
  if (ED.tool === 'camp'){ const units = CREEP_GROUPS[ED.campGroup][ED.campSize];
    for (const [x, y] of edMirrors(tx, ty)) if (inBounds(x, y) && isWalkable(x, y)) ED.camps.push({ x, y, tier:ED.campSize, units:units ? units.slice() : undefined, group:ED.campGroup }); return; }
  if (ED.tool === 'erase') for (const [x, y] of edMirrors(tx, ty)){
    const mc = (G.mercs || []).find(m => x >= m.tx - 1 && x <= m.tx + 3 && y >= m.ty - 1 && y <= m.ty + 3);
    if (mc){ markBlocked(mc, 0); G.mercs = G.mercs.filter(o => o !== mc); }
    const m = G.mines.find(m => x >= m.tx - 1 && x <= m.tx + 3 && y >= m.ty - 1 && y <= m.ty + 3);
    if (m){ markBlocked(m, 0); G.mines = G.mines.filter(o => o !== m); for (let yy = m.ty; yy < m.ty + 3; yy++) for (let xx = m.tx; xx < m.tx + 3; xx++) terrainChanged(xx, yy); }
    for (const k in ED.starts){ const s = ED.starts[k]; if (Math.hypot(s[0] + 1 - x, s[1] + 1 - y) < 2.5) delete ED.starts[k]; }
    ED.camps = ED.camps.filter(c => Math.hypot(c.x - x, c.y - y) >= 2.5);
  }
}
function drawEditorOverlay(){
  for (const [n, p] of Object.entries(ED.starts)){
    const col = TEAM_COLORS[n - 1].color, x = (p[0] + 1.5) * TILE, y = (p[1] + 1.5) * TILE;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(p[0] * TILE, p[1] * TILE, 3 * TILE, 3 * TILE);
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(p[0] * TILE, p[1] * TILE, 3 * TILE, 3 * TILE);
    box(x - 1, y - 30, 2, 30, '#4a3321'); box(x + 1, y - 30, 16, 11, col);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.fillText(n, x + 6, y - 21);
  }
  for (const c of ED.camps){
    const x = (c.x + .5) * TILE, y = (c.y + .5) * TILE;
    disc(ctx, x, y, 12, 'rgba(110,20,20,.7)'); ctx.fillStyle = '#ffe9c0'; ctx.font = 'bold 12px monospace';
    ctx.fillText({ small:'S', medium:'M', big:'L' }[c.tier], x - 4, y + 4);
    if (c.group && c.group !== 'standard'){ ctx.font = '9px monospace'; ctx.fillText(CREEP_GROUPS[c.group].label, x - 18, y + 22); }
  }
}
function edPanel(){
  if (!ED) return;
  const hint = { merc:'Tap to place a mercenary camp.', camp:'Tap to place a creature camp.', swamp:'Swamp slows everyone who wades through it.', rocks:'Boulders block movement, like a wall.', start:`Tap to place start ${ED.startNo} (1 is you; up to 4).`, mine:'Tap to place a gold mine.', erase:'Tap a mine, start or camp to remove it.', pan:'Drag to move around the map.',
                 high:'Paint plateaus; cliffs form around them.', ramp:'Paint over a cliff to make a ramp up.', low:'Paint to lower ground back down.' }[ED.tool] || (ED.tool.startsWith('camp_') ? 'Tap to place a creature camp.' : 'Drag to paint. Pinch to zoom.');
  infoEl.innerHTML = `<h2>Map editor</h2><div class="hint">${ED.name} · ${MAP_W}×${MAP_H}</div>
    ${ED.tool === 'camp'
      ? `<div class="edrow"><button id="edGroup" class="on">${CREEP_GROUPS[ED.campGroup].label} ▸</button><button id="edSize" class="on">Size ${{ small:'S', medium:'M', big:'L' }[ED.campSize]} ▸</button></div>`
      : `<div class="edrow">Brush ${[1, 2, 3].map(b => `<button data-brush="${b}" class="${ED.brush === b ? 'on' : ''}">${b}</button>`).join('')}</div>`}
    <div class="edrow">Mirror ${[[0, 'Off'], [2, '2'], [4, '4']].map(([m, l]) => `<button data-mirror="${m}" class="${ED.mirror === m ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${ED.tool === 'camp' ? '' : `<div class="hint">${hint}</div>`}`;
  const cycle = (list, cur) => list[(list.indexOf(cur) + 1) % list.length];   // tap to step through the choices
  if ($('#edGroup')) $('#edGroup').onclick = () => { ED.campGroup = cycle(Object.keys(CREEP_GROUPS), ED.campGroup); edPanel(); };
  if ($('#edSize')) $('#edSize').onclick = () => { ED.campSize = cycle(['small', 'medium', 'big'], ED.campSize); edPanel(); };
  cmdsEl.className = 'four';
  cmdsEl.innerHTML = ED_TOOLS.map(([k, l]) => `<button data-tool="${k}" class="${ED.tool === k ? 'on' : ''}">${l}</button>`).join('');
  infoEl.querySelectorAll('[data-brush]').forEach(b => b.onclick = () => { ED.brush = +b.dataset.brush; edPanel(); });
  infoEl.querySelectorAll('[data-mirror]').forEach(b => b.onclick = () => { ED.mirror = +b.dataset.mirror; edPanel(); });
  cmdsEl.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => { ED.tool = b.dataset.tool; sfx('click'); edPanel(); });
}
function edData(){
  return { v:1, id:ED.id, name:ED.name, n:MAP_W, biome:ED.biome, terrain:b64enc(G.terrain), height:b64enc(G.height), ramp:b64enc(ED.ramp),
           mines:G.mines.map(m => [m.tx, m.ty]), mercs:(G.mercs || []).map(m => [m.tx, m.ty]), starts:ED.starts, camps:ED.camps, rules:ED.rules };
}
function edSave(){
  const list = userMaps(); if (!ED.id) ED.id = 'm' + Date.now();
  const data = edData(), i = list.findIndex(m => m.id === ED.id);
  if (i >= 0) list[i] = data; else list.push(data);
  if (saveUserMaps(list)) toast('Map saved: ' + ED.name);
  return data;
}
function editorStart(data){
  const keep = { ...settings };
  MAP_SIZES.edit = { label:'Editor', n:data.n, hidden:true };
  MAPS.edit = { name:data.name, desc:'', biome:data.biome || 'green', blank:true, hidden:true, dirt:0, water:[0, 1, 1], trees:[0, 1, 1] };
  Object.assign(settings, { map:'edit', size:'edit', opponents:1, teams:[1, 2, 3, 4] });
  ED = { tool:'grass', brush:2, mirror:0, starts:data.starts || {}, camps:data.camps || [], name:data.name, id:data.id || null, startNo:1, biome:data.biome || 'green', ramp:new Uint8Array(data.n * data.n),
         campGroup:'standard', campSize:'small', rules:data.rules || { tech:0, off:[] } };
  newGame(); Object.assign(settings, keep);
  G.buildings = []; G.units = []; G.camps = []; G.corpses = []; G.mines = []; G.blocked.fill(0);   // a blank canvas
  if (data.terrain){
    b64into(data.terrain, G.terrain); b64into(data.height, G.height); if (data.ramp) b64into(data.ramp, ED.ramp);
    for (const [x, y] of data.mines || []) placeMine(x, y);
  }
  G.mercs = []; for (const [x, y] of data.mercs || []) placeMerc(x, y);
  for (let i = 0; i < G.terrain.length; i++) G.wood[i] = G.terrain[i] === T_TREE ? TREE_WOOD : 0;
  G.editor = true; G.revealAll = true; G.explored.fill(1); G.visible.fill(1);
  resetTerrainCache(); updateFogTexture();
  document.body.classList.add('editing'); document.body.classList.remove('in-menu');
  overlay.classList.add('hidden'); overlay.classList.remove('menu'); menuDrift = false;
  running = true; paused = false; selection = [];
  centerOn(MAP_PX_W / 2, MAP_PX_H / 2); edPanel();
}
function leaveEditor(){ ED = null; document.body.classList.remove('editing'); cmdsEl.className = ''; newGame(); refreshUI(); showMainMenu(); }
// Getting a saved map ready to play as a skirmish map.
function prepUserMap(id){
  USER_MAP = userMaps().find(m => m.id === id) || null;
  if (!USER_MAP) return false;
  MAPS.user = { name:USER_MAP.name, desc:'Your own map.', biome:USER_MAP.biome || 'green', user:true, hidden:true, dirt:0, water:[0, 1, 1], trees:[0, 1, 1] };
  MAP_SIZES.user = { label:'Custom', n:USER_MAP.n, hidden:true };
  return true;
}
const userStarts = m => Object.keys(m.starts || {}).length;

function showEditorHome(){
  const list = userMaps();
  screen(`<h1>Map editor</h1>
    <div class="menu-col slots">${list.length ? list.map(m => `<button data-edit="${m.id}"><b>${m.name}</b><br><small>${m.n}×${m.n} · ${userStarts(m)} start points · ${(m.mines || []).length} mines</small></button>`).join('') : '<p class="how">No maps yet.</p>'}</div>
    <div class="row" style="margin-top:12px"><button class="big" id="edNewBtn">New map</button><button id="edImportBtn">Import code</button><button id="backBtn">Back</button></div>`, { menu:true });
  $('#backBtn').onclick = showMainMenu;
  $('#edNewBtn').onclick = showEditorNew;
  $('#edImportBtn').onclick = showEditorImport;
  overlay.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const m = list.find(x => x.id === b.dataset.edit);
    screen(`<h1 style="font-size:30px">${m.name}</h1><p class="lede">${m.n}×${m.n}, ${userStarts(m)} start points, ${(m.mines || []).length} gold mines.</p>
      <div class="menu-col"><button class="big" id="edOpen">Edit</button><button id="edDelete">Delete</button><button id="backBtn">Back</button></div>`, { menu:true });
    $('#edOpen').onclick = () => editorStart(m);
    $('#edDelete').onclick = () => confirmScreen('Delete this map?', m.name + ' will be gone for good.', () => { saveUserMaps(userMaps().filter(x => x.id !== m.id)); showEditorHome(); }, showEditorHome);
    $('#backBtn').onclick = showEditorHome;
  });
}
function showEditorNew(){
  let size = 'normal', biome = 'green';
  const draw = () => {
    screen(`<h1>New map</h1>
      <p class="how" style="margin-bottom:6px">Name</p><input id="edName" maxlength="24" value="${(($('#edName') || {}).value) || 'My map'}" style="width:100%; max-width:18rem; font:inherit; padding:6px; margin-bottom:12px">
      <p class="how" style="margin-bottom:6px">Size</p><div class="row speed" style="margin-bottom:12px">${Object.entries(ED_SIZES).map(([k, z]) => `<button data-esize="${k}" aria-pressed="${size === k}">${z.label}</button>`).join('')}</div>
      <p class="how" style="margin-bottom:6px">Season</p><div class="row speed" style="margin-bottom:18px"><button data-ebiome="green" aria-pressed="${biome === 'green'}">Green</button><button data-ebiome="winter" aria-pressed="${biome === 'winter'}">Winter</button></div>
      <div class="row"><button class="big" id="edCreate">Create</button><button id="backBtn">Back</button></div>`, { menu:true });
    overlay.querySelectorAll('[data-esize]').forEach(b => b.onclick = () => { const nm = $('#edName').value; size = b.dataset.esize; draw(); $('#edName').value = nm; });
    overlay.querySelectorAll('[data-ebiome]').forEach(b => b.onclick = () => { const nm = $('#edName').value; biome = b.dataset.ebiome; draw(); $('#edName').value = nm; });
    $('#edCreate').onclick = () => editorStart({ name:($('#edName').value || 'My map').slice(0, 24), n:ED_SIZES[size].n, biome });
    $('#backBtn').onclick = showEditorHome;
  };
  draw();
}
function showEditorImport(){
  screen(`<h1>Import a map</h1><p class="how">Paste a map code someone shared with you.</p>
    <textarea id="edCode" rows="6" style="width:100%; font:12px monospace; margin:8px 0 14px"></textarea>
    <div class="row"><button class="big" id="edDoImport">Import</button><button id="backBtn">Back</button></div>`, { menu:true });
  $('#backBtn').onclick = showEditorHome;
  $('#edDoImport').onclick = () => {
    try { const m = readCode($('#edCode').value); if (!m.terrain || !m.n) throw 0; m.id = 'm' + Date.now(); const list = userMaps(); list.push(m); saveUserMaps(list); toast('Imported: ' + m.name); showEditorHome(); }
    catch (e){ toast('That code is not a valid map'); }
  };
}
function showEditorMenu(){
  paused = true;
  screen(`<h1>Map editor</h1><p class="lede">${ED.name} · start points: ${Object.keys(ED.starts).sort().join(', ') || 'none'}</p>
    <div class="menu-col">
      <button class="big" id="edResume">Keep editing</button>
      <button id="edSaveBtn">Save</button>
      <button id="edTestBtn">Save and play</button>
      <button id="edExportBtn">Share code</button>
      <button id="edRulesBtn">Rules: ${ED.rules.tech ? 'tech level ' + ED.rules.tech : 'all tech'}${ED.rules.off.length ? ', ' + ED.rules.off.length + ' switched off' : ''}</button>
      <button id="edRenameBtn">Rename</button>
      <button id="edExitBtn">Exit editor</button>
    </div>`);
  $('#edResume').onclick = () => { overlay.classList.add('hidden'); paused = false; edPanel(); };
  $('#edSaveBtn').onclick = () => { edSave(); showEditorMenu(); };
  $('#edTestBtn').onclick = () => {
    if (Object.keys(ED.starts).length < 2) return toast('Place at least start points 1 and 2 first');
    const data = edSave(); ED = null; document.body.classList.remove('editing'); cmdsEl.className = '';
    prepUserMap(data.id); const keep = { ...settings };
    Object.assign(settings, { map:'user', size:'user', userMap:data.id, opponents:1, teams:[1, 2, 3, 4] });
    newGame(); Object.assign(settings, keep); startBattle();
  };
  $('#edExportBtn').onclick = () => {
    const code = mapCode(edData());
    screen(`<h1>Share code</h1><p class="how">Send this code to a friend; they can paste it under Map editor → Import code.</p>
      <textarea id="edCode" rows="6" readonly style="width:100%; font:11px monospace; margin:8px 0 14px">${code}</textarea>
      <div class="row"><button class="big" id="edCopy">Copy</button><button id="backBtn">Back</button></div>`);
    $('#edCopy').onclick = () => { try { navigator.clipboard.writeText(code); toast('Copied'); } catch (e){ $('#edCode').select(); } };
    $('#backBtn').onclick = showEditorMenu;
  };
  $('#edRulesBtn').onclick = showEditorRules;
  $('#edRenameBtn').onclick = () => {
    screen(`<h1>Rename</h1><input id="edName" maxlength="24" value="${ED.name}" style="width:100%; max-width:18rem; font:inherit; padding:6px; margin:8px 0 14px">
      <div class="row"><button class="big" id="edOk">OK</button></div>`);
    $('#edOk').onclick = () => { ED.name = ($('#edName').value || ED.name).slice(0, 24); showEditorMenu(); };
  };
  $('#edExitBtn').onclick = () => confirmScreen('Exit the editor?', 'Unsaved changes will be lost.', leaveEditor, showEditorMenu);
}

// While a menu is open the camera drifts slowly across the map, bouncing
// off the edges: a living backdrop instead of a still picture.
function driftMenuCamera(dt){
  if (!menuDrift || !G) return;
  const vw = viewW / cam.zoom, vh = viewH / cam.zoom;
  cam.x += menuDir.x * 22 * dt; cam.y += menuDir.y * 22 * dt;
  if (cam.x < 0 || cam.x > MAP_PX_W - vw) menuDir.x *= -1;
  if (cam.y < 0 || cam.y > MAP_PX_H - vh) menuDir.y *= -1;
  clampCam();
}

function endGame(win){
  G.over = true;
  try { localStorage.removeItem(saveKey('auto')); } catch (e) {}    // nothing to continue after a finished battle
  sfx(win ? 'victory' : 'defeat');
  overlay.innerHTML = `
    <div class="card">
      <div class="banners"><span class="bn ${(win ? FACTIONS[PLAYER] : FACTIONS[ENEMY]).horns ? 'o' : 'k'}"></span></div>
      <h1>${win ? 'Victory' : 'Defeat'}</h1>
      <p class="lede">${G.mission ? (win ? MISSIONS[G.mission.key].done : (G.mission.failText || 'Your forces have fallen.') + ' Try the mission again!') : win ? 'The vale is yours. Not one enemy banner still stands.'
                            : 'Your ' + FACTIONS[PLAYER].names.townhall + ' has fallen and the vale belongs to your enemies.'}</p>
      ${missionResultHTML(win)}
      <ul class="how"><li>${FACTIONS[PLAYER].name} vs ${G.opponents.map(o => sideName(o) + ' (' + diffOf(o).label + ')').join(', ')}</li><li>Battle time ${fmtTime(G.time)}</li><li>Enemies destroyed: ${G.stats.killed}</li><li>Losses: ${G.stats.lost}</li></ul>
      <div class="row"><button class="big" id="againBtn">Play again</button><button id="menuBtn">Main menu</button></div>
    </div>`;
  overlay.classList.remove('hidden');
  const mission = G.mission && G.mission.key, list = mission && campaignOf(mission), next = mission && list[list.indexOf(mission) + 1];
  if (mission && win) markDone(mission);
  if (mission) $('#againBtn').textContent = !win ? 'Try again' : next ? 'Next mission' : 'Campaign';
  $('#againBtn').onclick = () => {
    if (!mission){ newGame(); startBattle(); return; }
    if (!win) startMission(mission);
    else { newGame(); refreshUI(); if (next) showBriefing(next); else showCampaign(ORC_CAMPAIGN.includes(mission) ? 'orcs' : 'kingdom'); }
  };
  $('#menuBtn').onclick = () => { newGame(); refreshUI(); showMainMenu(); };
}

// ----- Go! -----
resize();
new ResizeObserver(resize).observe(view);
newGame();          // build a map right away so it shows behind the title screen
refreshUI();
showTitle();
requestAnimationFrame(frame);
</script>

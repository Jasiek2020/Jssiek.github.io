function buyItem(owner, key){
  const I = ITEMS[key], h = buyerHero(owner);                  // (the selection can include the Market itself, which is not a unit)
  if (!h) return fail(owner, 'You need a hero to carry items');
  if (h.items.length >= slotsOf(h)) return fail(owner, 'Your hero\'s inventory is full');
  if (G.players[owner].gold < I.cost) return fail(owner, 'Not enough gold');
  G.players[owner].gold -= I.cost;
  giveItem(h, key);
  if (owner === PLAYER) toast('Bought ' + I.name + ': ' + I.desc);
  return true;
}
// The market also trades: sell 100 lumber for 70 gold, or buy 100 lumber for 120 gold.
// LESSON: A living market. Every sale of lumber lowers the price you get a
// little, every purchase raises the price you pay, and both drift back to
// normal over time. So the Market is a real tool, but it can't be flooded.
const MARKET = { sell:70, buy:120, sellMin:35, buyMax:240 };
const marketOf = owner => { G.market = G.market || {}; return G.market[owner] || (G.market[owner] = { sell:MARKET.sell, buy:MARKET.buy }); };
function marketDrift(dt){                                   // once a second: prices recover towards normal
  for (const k in G.market || {}){ const m = G.market[k];
    m.sell = Math.min(MARKET.sell, m.sell + .5 * dt); m.buy = Math.max(MARKET.buy, m.buy - .8 * dt); }
}
function trade(owner, sellWood){
  const P = G.players[owner], m = marketOf(owner);
  if (sellWood){
    if (P.wood < 100) return fail(owner, 'Not enough lumber');
    const g = Math.round(m.sell); P.wood -= 100; P.gold += g;
    m.sell = Math.max(MARKET.sellMin, m.sell * .93);
    if (G.mission && owner === PLAYER) G.mission.traded = (G.mission.traded || 0) + g;
  } else {
    const g = Math.round(m.buy); if (P.gold < g) return fail(owner, 'Not enough gold');
    P.gold -= g; P.wood += 100; m.buy = Math.min(MARKET.buyMax, m.buy * 1.07);
  }
  return true;
}


/* =============================================================================
   10. FOG OF WAR
   LESSON: Two layers. "explored" remembers terrain you've ever seen (shown
   dimmed). "visible" is what your units see right now (enemies only show
   up here). We rebuild "visible" a few times per second, not every frame.
   ========================================================================== */

function updateFog(){
  G.visible.fill(0);
  const mark = (cx, cy, r) => {
    const r2 = r * r, hv = G.height[idx(clamp(Math.floor(cx), 0, MAP_W - 1), clamp(Math.floor(cy), 0, MAP_H - 1))];   // the viewer's height
    for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
      for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++){
        if (!inBounds(x, y)) continue;
        const dx = x + .5 - cx, dy = y + .5 - cy;
        if (dx * dx + dy * dy <= r2){ const i = idx(x, y); if (G.height[i] > hv) continue;   // low ground can't see up onto a plateau
          G.visible[i] = 1; G.explored[i] = 1; }
      }
  };
  for (const u of G.units) if (allied(PLAYER, u.owner)) mark(u.x / TILE, u.y / TILE, UNIT_TYPES[u.type].sight);   // allies share vision
  for (const b of G.buildings) if (allied(PLAYER, b.owner))
    mark(b.tx + b.size / 2, b.ty + b.size / 2, BUILDING_TYPES[b.type].sight + b.size / 2 + (towerTier(b) >= 2 ? 2 : 0) + (b.type === 'tower' && !isOrc(b.owner) ? 4 : 0));   // Kingdom towers see far
  if (G.revealAll){ G.visible.fill(1); G.explored.fill(1); }   // the arena: everything is in plain sight
  updateFogTexture();      // copy the result into the small fog picture (section 12)
}
const isVisibleTile = (x, y) => inBounds(x, y) && G.visible[idx(x, y)] === 1;
const isExploredEntity = e => G.explored[idx(e.tx + (e.size >> 1), e.ty + (e.size >> 1))] === 1;

const settings = { faction:'kingdom', difficulty:'normal', map:'vale', size:'normal', opponents:1, teams:[1, 2, 3, 4], aiDiff:['normal', 'normal', 'normal'] };
try {
  settings.faction = localStorage.getItem('bov-faction') || 'kingdom';
  settings.difficulty = localStorage.getItem('bov-difficulty') || 'normal';
  settings.map = MAPS[localStorage.getItem('bov-map')] ? localStorage.getItem('bov-map') : 'vale';
  settings.size = MAP_SIZES[localStorage.getItem('bov-size')] ? localStorage.getItem('bov-size') : 'normal';
  settings.opponents = Math.min(3, Math.max(1, +localStorage.getItem('bov-opponents') || 1));
  const tm = JSON.parse(localStorage.getItem('bov-teams') || 'null'); if (Array.isArray(tm) && tm.length === 4) settings.teams = tm;

const diff = () => DIFFICULTY[(G && G.difficulty) || settings.difficulty] || DIFFICULTY.normal;
// Each AI can have its own level (G.aiDiff), falling back to the game's difficulty.
const diffOf = o => DIFFICULTY[(G && G.aiDiff && G.aiDiff[o]) || (G && G.difficulty) || settings.difficulty] || DIFFICULTY.normal;

// LESSON: One AI brain, many players. aiThink(me) plays for whichever side
// it is given: "me" replaces the old fixed me, and anything belonging to
// another side (player or AI, never creatures) counts as a foe. Each AI keeps
// its own plans in G.ai[me].
function aiThink(me = ENEMY){
  const A = G.ai[me] || (G.ai[me] = { waveSize:4, nextWave:240 });
  const D = diffOf(me);                                    // this AI's difficulty
  const P = G.players[me];
  const units = G.units.filter(u => u.owner === me);
  const workers = units.filter(u => u.type === 'worker');
  const army = units.filter(u => u.type !== 'worker');
  const blds = G.buildings.filter(b => b.owner === me);
  const hall = blds.find(b => b.type === 'townhall' && b.built >= 1);

  // Which player building to attack: the one closest to the enemy base.
  // Which side to attack: the nearest one, with a random nudge so equal
  // distances don't always go the same way, and a strong pull towards
  // whoever attacked us recently (a grudge).
  const pickFoe = () => {
    const ref = hall ? centerOf(hall) : { x:MAP_PX_W / 2, y:MAP_PX_H / 2 };
    let foe = null, bs = 1e18;
    for (const o of sidesOf()){
      if (!hostile(me, o) || G.out.includes(o)) continue;            // never our allies
      let d = 1e9;
      for (const b of G.buildings) if (b.owner === o){ const c = centerOf(b); d = Math.min(d, Math.hypot(c.x - ref.x, c.y - ref.y)); }
      if (d === 1e9) for (const u of G.units) if (u.owner === o) d = Math.min(d, Math.hypot(u.x - ref.x, u.y - ref.y));
      const grudge = A.grudge === o && G.time - (A.grudgeAt || -999) < 90 ? .5 : 1;
      const sc = d * (0.75 + Math.random() * 0.5) * grudge;
      if (sc < bs){ bs = sc; foe = o; }
    }
    return foe;
  };
  const pickTarget = () => {
    const ref = hall ? centerOf(hall) : { x:MAP_PX_W * .8, y:MAP_PX_H * .8 };
    const foe = pickFoe();
    let best = null, bd = 1e9;
    for (const e of [...G.buildings, ...G.units]){
      if (e.owner !== foe || e.hidden) continue;                                   // the side we chose to attack
      const c = centerOf(e), d = Math.hypot(c.x - ref.x, c.y - ref.y);
      if (d < bd){ bd = d; best = e; }
      if (best && best.kind === 'building' && e.kind === 'unit') break;
    }
    return best;
  };

  // No buildings left: everyone charges.
  if (!blds.length){
    const t = pickTarget();
    if (t) for (const u of units) if (!u.order){ const c = centerOf(t); orderAttackMove(u, c.x, c.y); }
    return;
  }

  // Rule 1: idle workers go to work (roughly 60% gold, 40% lumber).
  let onGold = 0, onWood = 0;
  for (const w of workers) if (w.order && w.order.type === 'gather') w.order.res === 'gold' ? onGold++ : onWood++;
  // Rebalance: if one resource piles up, move one worker to the other job.
  const free = w => !w.hidden && !w.carry && w.order && w.order.type === 'gather';
  if (P.gold > P.wood + 400 && onGold > 2){
    const w = workers.find(x => free(x) && x.order.res === 'gold');
    const t = w && nearestTree(tileOf(w.x), tileOf(w.y), 25);
    if (t){ orderGather(w, t); onGold--; onWood++; }
  } else if (P.wood > P.gold + 400 && onWood > 1){
    const w = workers.find(x => free(x) && x.order.res === 'wood');
    const m = w && nearestMine(w, 40);
    if (m){ orderGather(w, m); onWood--; onGold++; }
  }
  for (const w of workers){
    if (w.order || w.hidden) continue;
    // Usually lean toward gold, but follow whatever is running short.
    const goldFirst = P.wood > P.gold + 300 ? true : P.gold > P.wood + 300 ? false : onGold <= onWood * 1.5 + 1;
    if (goldFirst){
      const m = nearestMine(w, 40);
      if (m){ orderGather(w, m); onGold++; continue; }
    }
    const t = nearestTree(tileOf(w.x), tileOf(w.y), 25);
    if (t){ orderGather(w, t); onWood++; }
  }

  // Rule 2: keep training workers up to 10.
  if (hall && workers.length < 10 && hall.queue.length === 0) tryTrain(hall, 'worker');

  // Rule 3: build one thing at a time — farms when food is short, then barracks.
  const food = foodOf(me);
  const constructing = blds.some(b => b.built < 1);
  const barracks = blds.filter(b => b.type === 'barracks');
  // The tech path unlocks over time so the AI grows stronger gradually.
  const has = t => !techAllows('building', t) || blds.some(b => b.type === t);          // locked = skip that step
  const count_ = t => blds.filter(b => b.type === t).length;
  const count = t => techAllows('building', t) ? count_(t) : 99;
  // If a builder died, send another worker to finish the job. (Without this
  // the AI would wait forever for a building that never completes.)
  for (const b of blds){
    if (b.built >= 1) continue;
    // Safety net: a foundation nobody has worked on for a minute is scrapped (with a refund).
    if (b.built === 0 && G.time - b.placedAt > 60){ pay(me, BUILDING_TYPES[b.type].cost, -1); kill(b, null); G.stats.killed--; continue; }
    if (workers.some(w => w.order && w.order.building === b)) continue;
    const w = workers.find(x => !x.hidden && !x.carry) || workers.find(x => !x.hidden);
    if (w) orderBuild(w, b);
  }

  // Expansion: when no town hall has a well-stocked mine nearby, build a new
  // town hall next to the closest remaining mine.
  const halls = blds.filter(b => b.type === 'townhall');
  const dist = (a, b) => { const ca = centerOf(a), cb = centerOf(b); return Math.hypot(ca.x - cb.x, ca.y - cb.y) / TILE; };
  const needExpansion = halls.length > 0 && !G.mines.some(m => !m.dead && m.gold > 800 && halls.some(h => dist(m, h) < 12));
  let expandTo = null;
  if (needExpansion){
    let bd = 1e9;
    for (const m of G.mines){
      if (m.dead || m.gold < 800 || halls.some(h => dist(m, h) < 12)) continue;
      const mc = centerOf(m);
      if (G.camps.some(c => !c.cleared && Math.hypot(c.x - mc.x, c.y - mc.y) / TILE < 10)) continue;   // clear the camp first
      const d = dist(m, halls[0]);
      if (d < bd){ bd = d; expandTo = m; }
    }
  }

  if (!constructing){
    if (food.cap - food.used <= 2 && food.cap < 100) aiBuild(me, 'farm', workers);
    else if (barracks.length === 0 && workers.length >= 4) aiBuild(me, 'barracks', workers);
    else if (expandTo) aiBuild(me, 'townhall', workers, expandTo);
    else if (G.time > 150 && !has('lumbermill')) aiBuild(me, 'lumbermill', workers);
    else if (G.time > 210 && !has('blacksmith')) aiBuild(me, 'blacksmith', workers);
    else if (D.maxTier >= 2 && techAllows('hall', 2) && G.time > 240 && hall && hall.level < 2 && !hall.queue.some(q => q.upgrade)) tryUpgrade(hall);   // Castle/Fortress
    else if (G.time > 270 && !has('stable') && has('blacksmith') && meetsReq(me, 'townhall2')) aiBuild(me, 'stable', workers);
    else if (D.maxTier >= 3 && techAllows('hall', 3) && G.time > 480 && hall && hall.level === 2 && !hall.queue.some(q => q.upgrade) && P.gold > 500) tryUpgrade(hall);   // Citadel/Warhold
    else if (G.time > 540 && !has('temple') && meetsReq(me, 'townhall3')) aiBuild(me, 'temple', workers);
    else if (G.time > 300 && !has('market')) aiBuild(me, 'market', workers);
    else if (G.time > 390 && count('tower') < 2) aiBuild(me, 'tower', workers);
    else if (barracks.length === 1 && G.time > 480 && P.gold >= 500) aiBuild(me, 'barracks', workers);
  }

  // Upgrade farms one at a time once there's spare gold.
  // Heroes ride when travelling and get down when a fight is close.
  for (const h of heroesOf(me)){
    const o = h.order, near = enemiesNear(h, 6).length;
    let far = false;                                       // is the hero heading somewhere distant?
    if (o && o.target && isAlive(o.target)){ const c = o.target.kind === 'unit' ? o.target : centerOf(o.target); far = Math.hypot(c.x - h.x, c.y - h.y) / TILE > 8; }
    else if (o && o.nav && o.nav.rect) far = distToRect(h, o.nav.rect) > 8;
    if (!h.mounted && far && !enemiesNear(h, 7).length) toggleMount(h);
    else if (h.mounted && near >= 2) toggleMount(h);
  }
  // Short of gold but rich in lumber: sell lumber at the Market (one trade a second at most).
  if (P.gold < 200 && P.wood > 400 && blds.some(b => b.type === 'market' && b.built >= 1) && marketOf(me).sell > 45) trade(me, true);
  // Kingdom watch towers only shoot once upgraded to Guard towers.
  for (const t of blds) if (t.type === 'tower' && t.built >= 1 && towerTier(t) === 0 && !t.queue.length && P.gold > 120) tryUpgrade(t);
  // Orcs keep a goblin scout roaming the map.
  if (factionKey(me) === 'orcs' && G.time > 45 && hall && hall.built >= 1 && !hall.queue.length && !units.some(u => u.type === 'scout')) tryTrain(hall, 'scout');
  for (const sc of units) if (sc.type === 'scout' && !sc.order){ const t = nearestFreeTile(4 + Math.floor(Math.random() * (MAP_W - 8)), 4 + Math.floor(Math.random() * (MAP_H - 8))); orderMove([sc], (t.x + .5) * TILE, (t.y + .5) * TILE); }
  if (G.time > 300 && P.gold > 300 && !blds.some(b => b.queue.some(q => q.upgrade))){
    const f = blds.find(b => b.type === 'farm' && b.built >= 1 && b.level < 2 && !b.queue.length);
    if (f) tryUpgrade(f);
  }

  // Research upgrades when the building is free.
  // Without its hero, the AI saves up for a new one before spending on anything
  // else; otherwise cheaper units and research eat the gold first, every time.
  const savingForHero = techAllows('unit', 'hero') && G.time > D.heroAt && !hasHero(me) && P.gold < UNIT_TYPES.hero.cost.gold;
  for (const b of blds){
    if (savingForHero) break;
    const list = researchFor(me, b.type).filter(k => D.maxTier >= 2 || !(RESEARCH[k].needs || []).some(n => /townhall/.test(n)));   // Easy: basic research only
    if (!list.length || b.built < 1 || b.queue.length) continue;
    const next = list.find(k => !P.up[k] && !missingReq(me, RESEARCH[k].needs));
    if (next && canAfford(me, RESEARCH[next].cost)) tryResearch(b, next);
  }

  // Rule 4: keep the barracks busy, but cap the army size early on so the
  // player has time to get going. The cap grows by 2 every minute.
  const armyCap = 2 + Math.floor(Math.floor(G.time / 60) * D.cap);
  const priests = army.filter(a => a.type === 'priest').length;
  // Stables and temples get first pick of the gold, so the AI actually
  // fields wolf riders and shamans instead of spending everything on warriors.
  const trainers = [...blds].sort((a, b) => (a.type === 'barracks') - (b.type === 'barracks'));
  // The hero always comes first, even when the army is at its size cap.
  if (techAllows('unit', 'hero') && G.time > D.heroAt && !hasHero(me)){
    const b = barracks.find(x => x.built >= 1 && !x.queue.length);
    if (b) tryTrain(b, 'hero');
  }
  for (const b of trainers){
    if (savingForHero) break;
    if (b.built < 1 || b.queue.length || army.length >= armyCap) continue;
    if (b.type === 'barracks'){
      const type = techAllows('unit', 'hero') && G.time > Math.max(240, D.heroAt) && !hasHero(me) ? 'hero' : (Math.random() < 0.4 ? rangedOf(me) : 'footman');
      if (!tryTrain(b, type) && type === 'hero') tryTrain(b, 'footman');
    }
    if (b.type === 'stable') tryTrain(b, 'knight');
    // The healer hero only while the main hero is alive and gold is to spare, so a
    // fragile healer that keeps dying can't starve the AI of its main hero.
    if (b.type === 'barracks' && D.healer && G.time > D.healerAt && !hasHero(me, 'healer') && hasHero(me, 'hero') && P.gold > 450 && meetsReq(me, 'townhall2')) tryTrain(b, 'healer');
    if (b.type === 'blacksmith' && G.time > 420 && army.filter(a => UNIT_TYPES[a.type].siege).length < 2 && !b.queue.length) tryTrain(b, siegeOf(me));
    if (b.type === 'temple'){                                   // a couple of healers, then debuffers
      const mages = army.filter(a => a.type === 'mage').length;
      if (priests < 2) tryTrain(b, 'priest'); else if (mages < 3) tryTrain(b, 'mage');
    }
  }

  // Rule 5: defend if player units come near any enemy building.
  let threat = null;
  outer: for (const u of G.units){
    if (!hostile(me, u.owner) || !isSide(u.owner) || u.hidden) continue;
    for (const b of blds) if (distToRect(u, rectOf(b)) < 9){ threat = u; break outer; }
  }
  // The "leash" makes defenders return home instead of chasing a scout across the map.
  if (threat) for (const a of army) if (!a.order || a.order.type !== 'attack'){
    orderAttack(a, threat);
    a.order.leash = { x:a.x, y:a.y };
  }

  // Repair damaged buildings when the coast is clear (one at a time).
  if (!threat){
    const hurt = blds.find(b => b.built >= 1 && b.hp < b.maxHp * 0.8 &&
      !workers.some(w => w.order && w.order.type === 'repair' && w.order.building === b));
    if (hurt) sendRepairers(hurt, 1);
  }

  // Rule 5b: go "creeping": send idle soldiers to clear the nearest camp when
  // they clearly outmatch it. Gold, hero experience, and it opens expansions.
  const idleArmy = army.filter(a => !a.order);
  aiMicro(me, army, hall);                                 // Hard: focus fire and retreats

  // Only while waiting for the next attack wave, so waves still leave on time.
  if (D.creeping && !threat && G.time > 150 && G.time < A.nextWave - 20 && idleArmy.length >= 3 && blds.length){
    const home = centerOf(hall || blds[0]);
    let target = null, bd = 1e9;
    for (const c of G.camps){
      if (c.cleared) continue;
      const d = Math.hypot(c.x - home.x, c.y - home.y);
      if (d < bd){ bd = d; target = c; }
    }
    if (target){
      const strength = campMembers(target).reduce((sum, c) => sum + c.hp, 0);
      const ours = idleArmy.reduce((sum, a) => sum + a.hp, 0);
      if (ours > strength * 1.8) orderMove(idleArmy, target.x, target.y, true);   // only camps we can clearly beat
    }
  }

  // Rule 6: attack in waves that grow each time.
  const ready = army.filter(a => !a.order && !a.retreating);        // wounded units that pulled back stay home
  if (!threat && G.time >= A.nextWave && ready.length >= A.waveSize){
    const t = pickTarget();
    if (t){
      const c = centerOf(t);
      // Only send "waveSize" units; the rest stay home to defend.
      orderMove(ready.slice(0, A.waveSize), c.x, c.y, true);      // attack-move in formation
      A.waveSize = Math.min(16, A.waveSize + 2);
      A.nextWave = G.time + D.waveGap;
    }
  }

  // (Enemy abilities are handled by autocast, like the player's.)

  // Rule 8: equip the hero. Buy from the market, and walk over to loot nearby.
  const eh = playerHero(me);
  // Rule 8b: spend skill points: ultimate first when possible, then round-robin.
  for (const h of heroesOf(me)) while (h.skillPoints > 0){
    const list = skillsOf(h), ult = list[3];
    const pick = [ult, ...list].find(k => h.skills[k] < HERO_SKILLS[k].max && h.level >= skillReq(k, h.skills[k] + 1)
                   && (k === ult || h.skills[k] <= Math.min(...list.slice(0, 3).map(x => h.skills[x]))));
    if (!pick || !learnSkill(h, pick)) break;
  }
  if (eh && hasBuilding(me, 'market') && eh.items.length < slotsOf(eh) && P.gold > 350){
    const wish = ['claws', 'ring', 'amulet', 'boots', 'potion'].find(k => !eh.items.includes(k) || k === 'potion');
    if (wish && P.gold - ITEMS[wish].cost > 200) buyItem(me, wish);
  }
  if (eh && !eh.order && eh.items.length < slotsOf(eh)){
    const loot = G.items.find(it => !it.taken && Math.hypot(it.x - eh.x, it.y - eh.y) < (threat ? 10 : 40) * TILE);
    if (loot) orderMove([eh], loot.x, loot.y);
  }
  // Rule 9: fortify towers when rich.
  if (P.gold > 600) { const tw = blds.find(b => b.type === 'tower' && b.built >= 1 && b.level < 2 && !b.queue.length); if (tw) tryUpgrade(tw); }
}

// Can this unit walk up to the rectangle? We run A* and check where the path ends.
function reachable(u, rect){
  const path = findPath(tileOf(u.x), tileOf(u.y), rect, true);
  const end = path.length ? path[path.length - 1] : { x:tileOf(u.x), y:tileOf(u.y) };
  return Math.max(rect.x0 - end.x, 0, end.x - rect.x1) <= 1 && Math.max(rect.y0 - end.y, 0, end.y - rect.y1) <= 1;
}

// "near" is optional: build next to that entity (used for expansions) instead of the main base.
// Hard AIs fight smarter. LESSON: two classic RTS "micro" tricks:
//  - Focus fire: switch to a much weaker enemy that is already within reach
//    and finish it off. A dead enemy deals no more damage.
//  - Retreat: pull badly hurt units home to be healed instead of losing them.
function aiMicro(me, army, hall){
  const D = diffOf(me);
  if (!D.focus && !D.retreat) return;
  army = army || G.units.filter(u => u.owner === me && u.type !== 'worker' && !u.dead);
  hall = hall || G.buildings.find(b => b.owner === me && b.type === 'townhall');
  const home = hall ? centerOf(hall) : null;
  for (const a of army){
    const o = a.order;
    if (D.retreat && home && !a.retreating && a.hp < a.maxHp * .25 && o && o.type === 'attack'){
      a.retreating = true; orderMove([a], home.x, home.y + 2 * TILE); continue;
    }
    if (a.retreating && a.hp > a.maxHp * .7) a.retreating = false;           // healed: ready to fight again
    if (D.focus && o && o.type === 'attack' && o.target && o.target.kind === 'unit'){
      const reach = (UNIT_TYPES[a.type].ranged ? effRange(a) : 1) + .3;       // only enemies we can hit right now
      let weak = null;
      for (const e of enemiesNear(a, reach)) if (!weak || e.hp < weak.hp) weak = e;
      if (weak && weak !== o.target && weak.hp < o.target.hp * .6){ o.target = weak; o.nav = null; }
    }
  }
}

function aiBuild(me, type, workers, near){
  if (!techAllows('building', type)) return;
  if (G.mission && MISSIONS[G.mission.key].setup.noBuild) return;       // some missions forbid the enemy to build
  const BT = BUILDING_TYPES[type];
  if (!canAfford(me, BT.cost)) return;
  const anchor = near || G.buildings.find(b => b.owner === me && b.type === 'townhall') || G.buildings.find(b => b.owner === me);
  const builder = workers.find(w => !w.hidden && !w.carry) || workers.find(w => !w.hidden);
  if (!anchor || !builder) return;
  const c = centerOf(anchor), cx = tileOf(c.x), cy = tileOf(c.y), s = BT.size;
  // Search in growing square rings around the town hall for a free spot.
  for (let r = 3; r <= 14; r++){
    const ring = [];
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (Math.max(Math.abs(dx), Math.abs(dy)) === r) ring.push([cx + dx - (s >> 1), cy + dy - (s >> 1)]);
    const off = Math.floor(Math.random() * ring.length);
    for (let k = 0; k < ring.length; k++){
      const [tx, ty] = ring[(k + off) % ring.length];
      if (canPlace(type, tx, ty, me, 1) && reachable(builder, { x0:tx, y0:ty, x1:tx + s - 1, y1:ty + s - 1 })){
        pay(me, BT.cost);
        orderBuild(builder, placeBuilding(type, me, tx, ty, false));
        return;
      }
    }
  }
}


/* =============================================================================
   12. RENDERING
   LESSON: A "camera" is just an offset (and a zoom). We draw the world in
   world coordinates and let ctx.setTransform() shift and scale it onto the
   screen. Converting a touch back into the world is the reverse:
       worldX = cam.x + screenX / zoom
   LESSON: The map is too big to keep as one giant picture, so the terrain
   is split into "chunks" of 16x16 tiles. A chunk is only drawn when you
   first look at it, and only redrawn when something in it changes (a tree
   is cut or grows back). Chunks you haven't seen in a while get recycled.
   LESSON: Units and buildings are drawn ONCE into small off-screen canvases
   ("sprite caching"), given a dark outline, and then just copied each
   frame. Copying a picture is much cheaper than redrawing dozens of shapes.
   ========================================================================== */

const canvas = $('#world'), worldCtx = canvas.getContext('2d');
let ctx = worldCtx;      // the context every drawing helper uses; swapped while building caches
const mini = $('#minimap'), mctx = mini.getContext('2d');
const view = $('#view');
let viewW = 1, viewH = 1, DPR = 1;
// LESSON: On phones the slow part isn't our code, it's the browser filling
// pixels. Drawing at 2x the screen size (for sharpness) means 4x the pixels
// of 1x. These quality levels trade sharpness and cloud shadows for speed.
const GFX = {
  high:     { label:'High',     dpr:2,   clouds:true  },
  balanced: { label:'Balanced', dpr:1.5, clouds:true,  pixels:2.2e6 },   // pixels: a budget for big screens
  low:      { label:'Low',      dpr:1,   clouds:false, pixels:1.2e6 },
};
let gfx = 'balanced';
try { gfx = GFX[localStorage.getItem('bov-gfx')] ? localStorage.getItem('bov-gfx') : 'balanced'; } catch (e) { /* storage unavailable */ }
let animT = 0;           // real time in seconds, for ambient animation (water, windmills, smoke)

const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
// Run some drawing code on a different canvas, then switch back.
function withCtx(c, fn){ const prev = ctx; ctx = c; try { fn(); } finally { ctx = prev; } }

// Lighten (amt > 0) or darken (amt < 0) a "#rrggbb" colour.
// LESSON: "Hue shifting" is a classic pixel-art trick. Real shadows aren't
// just darker, they lean cool (blue/purple); highlights lean warm (yellow).
// Doing this in one helper gives the whole game a richer, painted feel.
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt < 0){ const k = 1 + amt; r = r * k + 10 * -amt; g = g * k; b = b * k + 34 * -amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt * 0.92; b += (255 - b) * amt * 0.65; }
  const c = v => Math.max(0, Math.min(255, Math.round(v)));
  return '#' + ((1 << 24) | (c(r) << 16) | (c(g) << 8) | c(b)).toString(16).slice(1);
}

function disc(c, x, y, r, color){ c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
// Pixel-art helpers: draw rectangles snapped to whole pixels.
function box(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function poly(pts, c){
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}


// ----------------------------------------------------------------------------
// Terrain
// ----------------------------------------------------------------------------
const CHUNK = 16;                       // tiles per chunk side
let CHUNKS_X = MAP_W / CHUNK;
const chunks = new Map();               // key -> { canvas, used }
let frameNo = 0, chunkCap = 48;

// Minimap: one pixel per tile, updated when a single tile changes.
const minimapBase = makeCanvas(MAP_W, MAP_H), mbctx = minimapBase.getContext('2d');
const TERRAIN_COLORS = ['#5a8538', '#2e5c88', '#2a5022', '#8a6a42', '#6f695f', '#4d4438', '#cdb27a', '#4d5a34', '#6a645a'];   // grass, water, tree, dirt, rock
const WINTER_COLORS  = ['#dfe6ee', '#a8cfe2', '#2f4a44', '#b9aa98', '#8f8b86', '#6e6a66', '#d9d2c4', '#7f8a80', '#7a7570'];
const isWinter = () => G && MAPS[G.map] && MAPS[G.map].biome === 'winter';
const terrainColor = t => (isWinter() ? WINTER_COLORS : TERRAIN_COLORS)[t];
// LESSON: A whole biome from one recolouring pass. Each terrain chunk is
// drawn normally, then (on winter maps) every pixel is remapped once:
// bright greens -> snow, dark greens -> snowy pines, water -> ice, and
// everything else gets a touch of frost. The result is cached, so it's free.
function winterize(cv){
  const c = cv.getContext('2d'), img = c.getImageData(0, 0, cv.width, cv.height), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    if (!d[i + 3]) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2], lum = .3 * r + .59 * g + .11 * b;
    if (g > r + 8 && g >= b){
      if (lum > 92){ const v = 200 + (lum - 92) * .45; d[i] = v - 8; d[i + 1] = v - 2; d[i + 2] = v + 8; }
      else { const k = lum / 92; d[i] = 28 + 46 * k; d[i + 1] = 50 + 58 * k; d[i + 2] = 56 + 60 * k; }
    } else if (b > r + 10 && b > g - 6){ const v = 150 + lum * .45; d[i] = v - 30; d[i + 1] = v + 6; d[i + 2] = v + 26; }
    else { d[i] = r * .6 + 86; d[i + 1] = g * .6 + 89; d[i + 2] = b * .6 + 93; }
  }
  c.putImageData(img, 0, 0);
}

// Fog of war texture: one pixel per tile. Drawn stretched with smoothing on,
// which blurs the pixels together into soft fog edges for free.
const fogCanvas = makeCanvas(MAP_W, MAP_H), fogCtx = fogCanvas.getContext('2d');
let fogImage = fogCtx.createImageData(MAP_W, MAP_H);
function updateFogTexture(){
  const d = fogImage.data;
  for (let i = 0; i < MAP_W * MAP_H; i++){
    d[i * 4] = 13; d[i * 4 + 1] = 10; d[i * 4 + 2] = 7;
    d[i * 4 + 3] = G.visible[i] ? 0 : G.explored[i] ? 120 : 255;
  }
  fogCtx.putImageData(fogImage, 0, 0);
}

function resetTerrainCache(){
  chunks.clear();
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++){ mbctx.fillStyle = terrainColor(G.terrain[idx(x, y)]); mbctx.fillRect(x, y, 1, 1); }
}

// Called whenever one tile's terrain changes.
function terrainChanged(x, y){
  mbctx.fillStyle = terrainColor(G.terrain[idx(x, y)]); mbctx.fillRect(x, y, 1, 1);
  const cx = Math.floor(x / CHUNK), cy = Math.floor(y / CHUNK);
  chunks.delete(cy * CHUNKS_X + cx);
  // Tree tops reach into the chunk above, and slightly sideways.
  if (y % CHUNK === 0 && cy > 0) chunks.delete((cy - 1) * CHUNKS_X + cx);
  if (x % CHUNK === 0 && cx > 0) chunks.delete(cy * CHUNKS_X + cx - 1);
  if (x % CHUNK === CHUNK - 1 && cx < CHUNKS_X - 1) chunks.delete(cy * CHUNKS_X + cx + 1);
  if (y % CHUNK === CHUNK - 1 && cy < MAP_H / CHUNK - 1) chunks.delete((cy + 1) * CHUNKS_X + cx);   // trunks and shadows reach down
}

// LESSON: Spread expensive work across frames. Drawing a chunk takes a few
// milliseconds, so we allow only a couple per frame ("budget"). Anything not
// ready yet shows a rough placeholder (the minimap stretched up) for a frame.
let chunkBudget = 2;
function getChunk(cx, cy){
  const key = cy * CHUNKS_X + cx;
  let c = chunks.get(key);
  if (!c){
    if (chunkBudget <= 0) return null;
    chunkBudget--;
    let recycled = null;
    if (chunks.size >= chunkCap){          // recycle the least recently used chunk
      let oldKey = null, oldUsed = Infinity;
      for (const [k, v] of chunks) if (v.used < oldUsed){ oldUsed = v.used; oldKey = k; }
      recycled = chunks.get(oldKey).canvas; chunks.delete(oldKey);
    }
    c = { canvas:recycled || makeCanvas(CHUNK * TILE, CHUNK * TILE), used:0 };
    const t0 = performance.now();
    drawChunk(c.canvas, cx, cy);
    if (performance.now() - t0 > 8) chunkBudget = 0;   // an expensive chunk (dense forest): no more this frame
    chunks.set(key, c);
  }
  c.used = frameNo;
  return c.canvas;
}

function drawChunk(cv, cx, cy){
  const c = cv.getContext('2d');
  const ox = cx * CHUNK * TILE, oy = cy * CHUNK * TILE;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  c.setTransform(1, 0, 0, 1, -ox, -oy);    // so we can draw using world coordinates
  const x0 = cx * CHUNK, y0 = cy * CHUNK;
  withCtx(c, () => {
    for (let y = y0; y < y0 + CHUNK; y++)
      for (let x = x0; x < x0 + CHUNK; x++) drawGround(x, y);
    drawTerrainShapes(x0 - 1, y0 - 1, x0 + CHUNK, y0 + CHUNK);   // dirt and water as smooth shapes (the tiles just around too)
    // Forests go on top. We include the tiles just around the chunk, because
    // canopies, trunks and shadows reach a little way into neighbouring tiles.
    drawForest(x0 - 1, y0 - 1, x0 + CHUNK, y0 + CHUNK);
  });
  if (isWinter()) winterize(cv);
}

const ARENA_R = 14.5, WALL_R = 16.5;               // arena floor radius, and where the stands begin (in tiles)
const arenaDist = (x, y) => Math.hypot(x + .5 - MAP_W / 2, y + .5 - MAP_H / 2);
function drawArenaStone(x, y){
  const px = x * TILE, py = y * TILE, r = arenaDist(x, y), h = hash(x * 13, y * 7);
  if (r < WALL_R || !(MAPS[G.map] && MAPS[G.map].arena)){   // a wall: big stone blocks, lighter on top (fortress walls too)
    box(px, py, TILE, TILE, '#8a847a');
    for (let k = 0; k < 4; k++){ box(px, py + k * 8, TILE, 1, '#6a655d'); box(px + ((k % 2) * 8 + 4) % 16 + 4, py + k * 8, 1, 8, '#6a655d'); box(px + ((k % 2) * 8 + 20) % 32, py + k * 8, 1, 8, '#6a655d'); }
    box(px, py, TILE, 2, '#a8a298');
    if (h > .93){                                    // a torch on the wall
      box(px + 14, py + 10, 4, 12, '#4a3321'); disc(ctx, px + 16, py + 8, 7, 'rgba(255,170,60,.3)');
      box(px + 13, py + 4, 6, 6, '#ff9a3a'); box(px + 14, py + 2, 4, 4, '#ffcf5a'); box(px + 15, py + 1, 2, 2, '#fff1a6');
    } else if (h > .86){                             // a hanging banner
      box(px + 10, py + 2, 12, 20, h > .895 ? '#3f6fb5' : '#b5452c'); box(px + 10, py + 22, 6, 4, h > .895 ? '#3f6fb5' : '#b5452c'); box(px + 16, py + 22, 6, 2, h > .895 ? '#3f6fb5' : '#b5452c');
      box(px + 14, py + 8, 4, 4, '#e8c547');
    }
    return;
  }
  // The stands: stone steps packed with spectators.
  box(px, py, TILE, TILE, '#5e574d');
  box(px, py + 15, TILE, 2, '#4a443c'); box(px, py + 31, TILE, 1, '#4a443c'); box(px, py, TILE, 1, '#746c60');
  const SKIN = ['#e0b089', '#c68e62', '#8fbf5a', '#9c6b48'], CLOTH = ['#b5452c', '#3f6fb5', '#e8c547', '#6a8a3a', '#7a4fb0', '#d8d0c0', '#8a5a33'];
  for (let row = 0; row < 2; row++) for (let k = 0; k < 4; k++){
    const hh = hash(x * 31 + k, y * 17 + row);
    if (hh < .18) continue;                           // an empty seat here and there
    const sx = px + 3 + k * 7 + hh * 2, sy = py + 5 + row * 16;
    box(sx, sy + 3, 5, 6, CLOTH[Math.floor(hh * 97) % CLOTH.length]);
    box(sx + 1, sy, 3, 3, SKIN[Math.floor(hh * 53) % SKIN.length]);
    if (hh > .9){ box(sx - 1, sy - 3, 1, 4, SKIN[0]); box(sx + 5, sy - 3, 1, 4, SKIN[0]); }   // cheering arms
  }
}

// ----- High ground -----
// LESSON: High ground, in the style of Warcraft 3 and StarCraft. Each tile has
// a height (0 = low, 1 = high). A plateau is a raised area ringed by cliffs
// (which nobody can walk through) and reached by ramps. Two rules make it
// matter: units on low ground can't see up onto a plateau, and arrows or
// bolts fired uphill miss a quarter of the time.
const heightAt = (x, y) => G.height ? G.height[idx(clamp(tileOf(x), 0, MAP_W - 1), clamp(tileOf(y), 0, MAP_H - 1))] : 0;
const heightOf = e => { const c = e.kind === 'unit' ? e : centerOf(e); return heightAt(c.x, c.y); };
function makePlateau(cx, cy, r, ramps){
  const t = G.terrain, toC = Math.atan2(MAP_H / 2 - cy, MAP_W / 2 - cx);
  const rampA = ramps || [toC, toC + Math.PI];                         // by default: one ramp facing the centre, one facing away
  const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
  for (let y = Math.floor(cy - r - 2); y <= cy + r + 2; y++) for (let x = Math.floor(cx - r - 2); x <= cx + r + 2; x++){
    if (!inBounds(x, y) || isBorderTile(x, y)) continue;
    const i = idx(x, y); if (G.blocked[i]) continue;                    // never bury a gold mine
    const a = Math.atan2(y + .5 - cy, x + .5 - cx), d = Math.hypot(x + .5 - cx, y + .5 - cy) + Math.sin(a * 3 + cx) * .5;
    if (d < r){ G.height[i] = 1; if (t[i] === T_WATER) t[i] = T_GRASS; }
    else if (d < r + 1.4){
      if (rampA.some(ra => angDiff(a, ra) < .24) || t[i] === T_DIRT){ G.height[i] = 1; if (t[i] !== T_DIRT) t[i] = T_GRASS; }   // ramps (and roads) stay passable
      else if (t[i] !== T_WATER) t[i] = T_CLIFF;
    }
  }
}
function addPlateaus(){
  const M = MAPS[G.map] || {}, L = MAP_LAYOUTS[G.map];
  if (L){ for (const [x, y, r, ramps] of L.plateaus || []) makePlateau(x, y, r, ramps); return; }
  if (M.arena || M.prison || M.chapel || M.valley || M.fords || M.fortress || M.blank || M.user) return;
  // Generated skirmish maps: plateaus between the bases, mirrored so both sides get the same.
  const r = 5.5 + MAP_W / 64, spots = quadMap() ? [[.5, .2], [.5, .8], [.2, .5], [.8, .5]] : [[.3, .68], [.7, .32]];
  for (const [fx, fy] of spots) makePlateau(fx * MAP_W, fy * MAP_H, r);
}

// ----- New terrain: sand, swamp and rocks -----
function drawSand(x, y){
  const px = x * TILE, py = y * TILE;
  box(px, py, TILE, TILE, '#d2b77f');
  for (let k = 0; k < 7; k++){ const h = hash(x * 5 + k, y * 9 - k); box(px + h * 30, py + hash(x - k, y + k * 2) * 30, 2, 1, h > .5 ? '#bf9f62' : '#e6cf98'); }
  if (hash(x * 3, y * 7) > .85) box(px + 10, py + 14, 9, 2, '#b8975a');   // a ripple in the sand
}
function drawSwamp(x, y){
  const px = x * TILE, py = y * TILE;
  box(px, py, TILE, TILE, '#4f5a36');
  for (let k = 0; k < 3; k++){ const h = hash(x * 7 + k, y * 3 - k); disc(ctx, px + 6 + h * 20, py + 6 + hash(x + k, y - k) * 20, 3 + h * 4, '#3a4a3a'); disc(ctx, px + 5 + h * 20, py + 5 + hash(x + k, y - k) * 20, 1.5, 'rgba(160,190,170,.35)'); }
  for (let k = 0; k < 4; k++){ const h = hash(x - k * 5, y * 11 + k); box(px + h * 28, py + hash(x * 2 + k, y) * 26, 1, 4, '#6d7a3e'); }   // reeds
}
function drawBoulders(x, y){
  const px = x * TILE, py = y * TILE;
  box(px, py, TILE, TILE, '#5a6a3a');                                // grass between the stones
  for (let k = 0; k < 4; k++){
    const h = hash(x * 13 + k, y * 7 - k), h2 = hash(x - k * 3, y + k * 5), r = 6 + h * 6, bx = px + 5 + h2 * 22, by = py + 5 + h * 22;
    disc(ctx, bx + 1, by + 2, r, '#3e3a33'); disc(ctx, bx, by, r, k % 2 ? '#8a8478' : '#7c766a'); disc(ctx, bx - r * .3, by - r * .3, r * .45, '#a39d90');
  }
}

// ----- Map rules: tech level and switched-off units and buildings -----

const RULE_BUILDINGS = ['farm', 'barracks', 'lumbermill', 'blacksmith', 'tower', 'stable', 'temple', 'market'];

// ----- Editing a beaten mission's map (as a copy) -----
function editorFromMission(key){
  startMission(key); running = false;
  const starts = {};
  sidesOf().forEach((o, k) => { const h = G.buildings.find(b => b.owner === o && b.type === 'townhall'), c = (G.corners || {})[o]; if (h) starts[k + 1] = [h.tx, h.ty]; else if (c) starts[k + 1] = c.slice(); });
  const camps = G.camps.filter(c => CAMP_TYPES[c.tier] && c.tier !== 'wild').map(c => ({ x:c.tx, y:c.ty, tier:c.tier, units:campMembers(c).map(u => u.type) }))
    .concat(G.camps.filter(c => c.tier === 'wild').map(c => ({ x:c.tx, y:c.ty, tier:'small', units:campMembers(c).map(u => u.type) })));
  const ramp = new Uint8Array(MAP_W * MAP_H);                // existing ramps: high, walkable tiles next to low ground
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++){ const i = idx(x, y);
    if (G.height[i] && isWalkable(x, y) && DIRS.some(([dx, dy]) => inBounds(x + dx, y + dy) && !G.height[idx(x + dx, y + dy)])) ramp[i] = 1; }
  const data = { name:(MISSIONS[key].name + ' (copy)').slice(0, 24), n:MAP_W, biome:(MAPS[G.map] && MAPS[G.map].biome) || 'green',
                 terrain:b64enc(G.terrain), height:b64enc(G.height), ramp:b64enc(ramp), mines:G.mines.map(m => [m.tx, m.ty]), starts, camps, rules:{ tech:0, off:[] } };
  G.mission = null; document.body.classList.remove('mission');
  editorStart(data);
  toast('A copy of this mission\'s map: save it to keep it');
}

function drawCliff(x, y){
  const px = x * TILE, py = y * TILE, T = TILE;
  box(px, py, T, T, '#5e564b');                                   // shadowed rock behind
  // A tumble of overlapping boulders, lit from the upper left, so the cliff isn't a flat square.
  for (let k = 0; k < 5; k++){
    const h = hash(x * 13 + k, y * 7 - k), h2 = hash(x - k * 3, y + k * 5), r = 7 + h * 6;
    const bx = px + 4 + h2 * 24, by = py + 4 + h * 24;
    disc(ctx, bx, by + 1, r, '#4a4239');                          // its shadow
    disc(ctx, bx, by, r, k % 2 ? '#857a6a' : '#7a6f60');
    disc(ctx, bx - r * .3, by - r * .3, r * .5, '#998d7b');       // highlight
  }
  for (const [dx, dy] of DIRS){
    const nx = x + dx, ny = y + dy; if (!inBounds(nx, ny)) continue;
    const n = idx(nx, ny); if (G.terrain[n] === T_CLIFF) continue;
    const high = G.height[n] === 1, c = high ? 'rgba(190,178,150,.85)' : 'rgba(40,34,28,.55)', w = high ? 3 : 7;
    if (dx === 1) box(px + T - w, py, w, T, c); if (dx === -1) box(px, py, w, T, c);
    if (dy === 1) box(px, py + T - w, T, w, c); if (dy === -1) box(px, py, T, w, c);
  }
}


function drawGround(x, y){
  if (G.terrain[idx(x, y)] === T_ROCK){ drawArenaStone(x, y); return; }
  if (G.terrain[idx(x, y)] === T_CLIFF){ drawCliff(x, y); return; }
  if (G.terrain[idx(x, y)] === T_SAND){ drawSand(x, y); return; }
  if (G.terrain[idx(x, y)] === T_SWAMP){ drawSwamp(x, y); return; }
  if (G.terrain[idx(x, y)] === T_BOULDER){ drawBoulders(x, y); return; }
  const i = idx(x, y), t = G.terrain[i], px = x * TILE, py = y * TILE, h = hash(x, y);
  const treeAt = (nx, ny) => inBounds(nx, ny) && G.terrain[idx(nx, ny)] === T_TREE;
  // One base colour for all grass (per-tile shades made a visible checkerboard);
  // scattered specks give texture instead.
  box(px, py, TILE, TILE, '#5a8436');
  for (let k = 0; k < 10; k++){
    const a = hash(x * 13 + k, y * 7 - k * 3), b = hash(k + x * 3, y * 11 + k);
    box(px + Math.floor(a * 30), py + Math.floor(b * 30), 2, 2, a < .5 ? '#547d32' : '#62903e');
  }
  for (let k = 0; k < 3; k++){                                 // grass tufts
    const a = hash(x * 7 + k, y * 13 - k), b = hash(y * 5 + k, x * 9);
    const tx = px + 2 + Math.floor(a * 26), ty = py + 4 + Math.floor(b * 24);
    box(tx, ty, 1, 3, '#78a84b'); box(tx + 2, ty - 1, 1, 4, '#6d9c45'); box(tx + 1, ty + 2, 1, 1, '#476a29');
  }
  // LESSON: "Dithering" = a checkerboard of two colours, the pixel artist's way
  // to fake a soft blend with very few colours.
  if (t !== T_DIRT && h < 0.3){
    const cx = px + 3 + Math.floor(hash(x * 5, y) * 14), cy = py + 3 + Math.floor(hash(x, y * 5) * 16);
    for (let yy = 0; yy < 7; yy++) for (let xx = 0; xx < 12; xx++)
      if ((xx + yy) % 2 === 0 && ((xx - 6) / 6) ** 2 + ((yy - 3) / 3.5) ** 2 < 1) box(cx + xx, cy + yy, 1, 1, '#4d742d');
  }
  if (t === T_TREE){                                             // forest floor: undergrowth and fallen leaves
    // Round patches instead of full squares, so neighbouring patches merge
    // into one soft-edged forest floor.
    disc(ctx, px + 16, py + 17, 18, '#4f7a31'); disc(ctx, px + 17, py + 18, 12, '#476f2c');
    for (let k = 0; k < 14; k++){
      const a = hash(x * 23 + k, y * 3 + k), b = hash(y * 29 + k, x * 5 - k);
      box(px + Math.floor(a * 30), py + Math.floor(b * 30), 2, 1, a < .3 ? '#8a7a2e' : a < .6 ? '#355a24' : '#5c8a38');
    }
  } else if (t === T_GRASS){
    // Soft shade on grass beside trees, so forests feel like they have depth.
    ctx.fillStyle = 'rgba(18,34,12,.2)';
    if (treeAt(x, y - 1)) ctx.fillRect(px, py, TILE, 6);
    if (treeAt(x - 1, y)) ctx.fillRect(px, py, 5, TILE);
    if (treeAt(x + 1, y)) ctx.fillRect(px + TILE - 7, py, 7, TILE);
    if (treeAt(x, y + 1)) ctx.fillRect(px, py + TILE - 4, TILE, 4);
    if (h > 0.8 && (treeAt(x - 1, y) || treeAt(x, y - 1))){      // mushrooms in the shade
      const mx = px + 6 + Math.floor(hash(x, y * 9) * 16), my = py + 10 + Math.floor(hash(x * 9, y) * 12);
      box(mx, my + 2, 1, 2, '#efe6cf'); box(mx - 1, my, 3, 2, '#c8384a'); box(mx, my, 1, 1, '#f4f1e8');
      box(mx + 4, my + 3, 1, 2, '#efe6cf'); box(mx + 3, my + 2, 3, 1, '#b8a070');
    }
  }
  if (t === T_GRASS && h >= 0.3 && h < 0.325 && !treeAt(x, y + 1)){   // a small berry bush
    disc(ctx, px + 16, py + 19, 6, '#2d5823'); disc(ctx, px + 15, py + 17, 5, '#3d742f'); disc(ctx, px + 13, py + 15, 2, '#5a9642');
    box(px + 18, py + 17, 2, 2, '#c8384a'); box(px + 13, py + 20, 2, 2, '#c8384a');
  }
  if (t === T_GRASS && h > 0.87){                              // wild flowers
    const col = ['#f4f1e8', '#f2cf4b', '#e89ab0', '#b9a7f0'][Math.floor(hash(y, x) * 4)];
    const fx = px + 5 + Math.floor(hash(x, y * 3) * 18), fy = py + 5 + Math.floor(hash(x * 3, y) * 18);
    box(fx, fy, 2, 2, col); box(fx + 6, fy + 3, 2, 2, col); box(fx + 2, fy + 7, 2, 2, col);
  } else if (t === T_GRASS && h < 0.05){                       // a pebble
    const fx = px + 8 + Math.floor(hash(x, y * 2) * 14);
    box(fx, py + 14, 5, 3, '#8f897d'); box(fx + 1, py + 14, 3, 1, '#bdb8ae');
  }
  if (G.stump[i]){
    box(px + 12, py + 17, 9, 7, '#5a3c22'); box(px + 13, py + 17, 7, 3, '#c79a62'); box(px + 15, py + 18, 3, 1, '#a0764a');
    box(px + 8, py + 24, 2, 1, '#c79a62'); box(px + 23, py + 22, 2, 1, '#c79a62');
  }
}

// LESSON: Smooth terrain edges. Dirt and water used to be drawn tile by tile,
// so their edges followed the square grid. Now each is drawn as ONE shape:
// every tile of that terrain adds a square whose outer corners are rounded
// (where both neighbours on that corner are different terrain), and whose
// exposed sides can be pulled in or pushed out ("inset"). Layering the same
// shape at different insets gives a sandy shore, wet sand and water; small
// bumps along exposed sides make the outline irregular and natural.
const terrainIs = t => (x, y) => G.terrain[idx(clamp(x, 0, MAP_W - 1), clamp(y, 0, MAP_H - 1))] === t;
function blobTile(g, x, y, isT, inset, r){
  const px = x * TILE, py = y * TILE, T = TILE;
  const n = isT(x, y - 1), s = isT(x, y + 1), w = isT(x - 1, y), e = isT(x + 1, y);
  const L = px + (w ? 0 : inset), R = px + T - (e ? 0 : inset), Tp = py + (n ? 0 : inset), B = py + T - (s ? 0 : inset);
  const tl = !n && !w ? r : 0, tr = !n && !e ? r : 0, br = !s && !e ? r : 0, bl = !s && !w ? r : 0;
  g.moveTo(L + tl, Tp); g.lineTo(R - tr, Tp); if (tr) g.arcTo(R, Tp, R, Tp + tr, tr);
  g.lineTo(R, B - br); if (br) g.arcTo(R, B, R - br, B, br);
  g.lineTo(L + bl, B); if (bl) g.arcTo(L, B, L, B - bl, bl);
  g.lineTo(L, Tp + tl); if (tl) g.arcTo(L, Tp, L + tl, Tp, tl);
  g.closePath();
}
function blobPath(xa, ya, xb, yb, isT, inset, r){
  ctx.beginPath();
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) if (inBounds(x, y) && isT(x, y)) blobTile(ctx, x, y, isT, inset, r);
}
// Little round bumps along the exposed sides, so an edge is never a ruler-straight line.
function blobBumps(xa, ya, xb, yb, isT, inset, color){
  ctx.fillStyle = color;
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++){
    if (!inBounds(x, y) || !isT(x, y)) continue;
    const px = x * TILE, py = y * TILE;
    for (const [dx, dy] of DIRS){
      if (isT(x + dx, y + dy)) continue;
      for (let k = 0; k < 3; k++){                              // small bumps, tucked into the edge
        const h = hash(x * 7 + dx * 3 + k, y * 5 + dy * 11 + k), along = 5 + k * 9 + h * 6, rad = 1.5 + h * 2;
        const ex = dx === 0 ? px + along : dx > 0 ? px + TILE - inset : px + inset;
        const ey = dy === 0 ? py + along : dy > 0 ? py + TILE - inset : py + inset;
        ctx.beginPath(); ctx.arc(ex, ey, rad, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}
function drawTerrainShapes(xa, ya, xb, yb){
  // Each shape is built from one square per tile, so outlining it would also
  // outline every tile inside. Instead the outline is drawn FIRST and the
  // shape is filled on top: the fill hides the inner lines and half of the
  // outer line, leaving a clean edge only around the outside.
  const D = terrainIs(T_DIRT);
  blobPath(xa, ya, xb, yb, D, 2, 11); ctx.strokeStyle = 'rgba(70,48,24,.45)'; ctx.lineWidth = 3; ctx.stroke();
  blobBumps(xa, ya, xb, yb, D, 3, '#8b6a42');
  const sand = MAPS[G.map] && MAPS[G.map].arena;
  blobPath(xa, ya, xb, yb, D, 2, 11); ctx.fillStyle = sand ? '#c9a86c' : '#8b6a42'; ctx.fill();
  // Inside corners: where a non-dirt tile has dirt on two sides of a corner, fill
  // a curved wedge of dirt there, so grass patches get rounded corners too.
  ctx.beginPath();
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++){
    if (!inBounds(x, y) || D(x, y)) continue;
    const px = x * TILE, py = y * TILE, r = 11;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]){
      if (!D(x + sx, y) || !D(x, y + sy) || !D(x + sx, y + sy)) continue;
      const cx = sx < 0 ? px : px + TILE, cy = sy < 0 ? py : py + TILE;      // the corner point
      ctx.moveTo(cx, cy); ctx.lineTo(cx - sx * r, cy);
      ctx.arc(cx - sx * r, cy - sy * r, r, sy > 0 ? Math.PI / 2 : -Math.PI / 2, sx > 0 ? 0 : Math.PI, sx * sy > 0);   // the short 90-degree curve
      ctx.closePath();
    }
  }
  ctx.fill();
  ctx.save(); blobPath(xa, ya, xb, yb, D, 2, 11); ctx.clip();
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) if (inBounds(x, y) && D(x, y)){
    if (!sand){ drawDirt(x, y, x * TILE, y * TILE); continue; }
    for (let k = 0; k < 6; k++){ const h = hash(x * 9 + k, y * 5 - k); box(x * TILE + h * 30, y * TILE + hash(x - k, y + k * 3) * 30, 2, 1, h > .5 ? '#b8955a' : '#dcc18a'); }   // raked sand
  }
  ctx.restore();
  if (!sand) for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++){   // grass tufts spilling over the edge (not in the arena)
    if (!inBounds(x, y) || !D(x, y)) continue;
    for (const [dx, dy] of DIRS){
      if (D(x + dx, y + dy) || G.terrain[idx(clamp(x + dx, 0, MAP_W - 1), clamp(y + dy, 0, MAP_H - 1))] === T_WATER) continue;
      const h = hash(x * 3 + dx, y * 3 + dy), px = x * TILE, py = y * TILE;
      const tx = dx === 0 ? px + 6 + h * 20 : dx > 0 ? px + TILE - 3 : px + 1, ty = dy === 0 ? py + 6 + h * 20 : dy > 0 ? py + TILE - 3 : py + 1;
      box(tx, ty, 1, 3, '#78a84b'); box(tx + 2, ty - 1, 1, 3, '#6d9c45');
    }
  }
  // Water: sandy shore, wet sand, a line of foam, then the water on top.
  const W = terrainIs(T_WATER);
  blobBumps(xa, ya, xb, yb, W, -3, '#c8b27a');
  blobPath(xa, ya, xb, yb, W, -5, 15); ctx.fillStyle = '#c8b27a'; ctx.fill();
  blobPath(xa, ya, xb, yb, W, -1, 12); ctx.fillStyle = '#a68f5c'; ctx.fill();
  blobPath(xa, ya, xb, yb, W, 2, 10); ctx.strokeStyle = 'rgba(217,235,241,.85)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.save(); blobPath(xa, ya, xb, yb, W, 2, 10); ctx.clip();
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) if (inBounds(x, y) && W(x, y)) drawWater(x, y, x * TILE, y * TILE);
  ctx.restore();
}


function drawDirt(x, y, px, py){
  box(px, py, TILE, TILE, '#8b6a42');
  for (let yy = 0; yy < TILE; yy += 2)                            // dithered darker patch
    for (let xx = (yy / 2) % 2; xx < TILE; xx += 2)
      if (hash(x * 3 + (xx >> 3), y * 3 + (yy >> 3)) < 0.35) box(px + xx, py + yy, 1, 1, '#7d5e3a');
  if (hash(x * 11, y * 13) < 0.25){                              // a stone
    const sx = px + 6 + Math.floor(hash(x, y * 13) * 18), sy = py + 8 + Math.floor(hash(x * 13, y) * 16);
    box(sx, sy, 5, 3, '#8f897d'); box(sx + 1, sy, 3, 1, '#c3beb3'); box(sx, sy + 3, 5, 1, '#5e5448');
  }
  for (let k = 0; k < 7; k++){
    const a = hash(x * 17 + k, y * 5 + k * 7), b = hash(y * 19 + k, x * 3);
    box(px + Math.floor(a * 29), py + Math.floor(b * 29), k % 2 ? 3 : 2, 2, k % 3 === 0 ? '#9e7c50' : '#76583a');
  }
}

function drawWater(x, y, px, py){
  const land = (nx, ny) => inBounds(nx, ny) && G.terrain[idx(nx, ny)] !== T_WATER;
  let near = 0;
  for (const [dx, dy] of DIRS) if (land(x + dx, y + dy)) near++;
  // Depth: for every 4x4-pixel block, measure the distance to the nearest
  // land and pick shallow, medium or deep colour. Near a colour boundary we
  // dither, so the depth changes in smooth, curvy bands instead of squares.
  let far = 0;
  const lands = [];
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++)
    if (land(x + dx, y + dy)){ lands.push([x + dx, y + dy]); if (Math.max(Math.abs(dx), Math.abs(dy)) === 2) far++; }
  const DEPTH = ['#35699b', '#2c5d8d', '#24507d'];
  for (let by = 0; by < TILE; by += 4)
    for (let bx = 0; bx < TILE; bx += 4){
      const cxp = x + (bx + 2) / TILE, cyp = y + (by + 2) / TILE;
      let d = 4;
      for (const [lx, ly] of lands){
        const ddx = Math.max(lx - cxp, 0, cxp - (lx + 1)), ddy = Math.max(ly - cyp, 0, cyp - (ly + 1));
        d = Math.min(d, Math.hypot(ddx, ddy));
      }
      const level = d < 1.1 ? 0 : d < 2.1 ? 1 : 2;
      box(px + bx, py + by, 4, 4, DEPTH[level]);
      const edge = level < 2 ? (level === 0 ? 1.1 : 2.1) - d : 0;       // how close to the next deeper band
      if (level < 2 && edge < 0.3)                                     // dither toward the deeper colour
        for (let k = 0; k < 4; k += 2) box(px + bx + k + ((by >> 2) % 2), py + by + k, 1, 1, DEPTH[level + 1]);
    }
  if (near === 0 && far > 0 && hash(x * 7, y * 3) > 0.82){      // lily pad
    const lx = px + 8 + Math.floor(hash(x, y) * 14), ly = py + 8 + Math.floor(hash(y, x) * 12);
    disc(ctx, lx, ly, 4, '#3f7a34'); box(lx, ly - 4, 1, 4, '#2c5d8d'); box(lx - 2, ly - 1, 2, 1, '#5a9a44');
    if (hash(x + 1, y) > .5){ box(lx + 1, ly + 1, 2, 2, '#f0a8c0'); box(lx + 1, ly + 1, 1, 1, '#fff'); }
  }
  for (let k = 0; k < 4; k++){
    const a = hash(x * 11 + k, y * 3 + k);
    box(px + Math.floor(a * 22), py + 4 + k * 7, 5 + Math.floor(a * 6), 1, '#3b75a8');
  }
}

// LESSON: Warcraft-2-style forests. Instead of drawing each tree on its own,
// the whole forest is painted as ONE canopy in layers, each layer over every
// tree tile before the next layer starts:
//   1. a shadow cast to the lower right,
//   2. trunks, but only on the southern edge (the only place you'd see them),
//   3. a dark rim, then the canopy body: overlapping circles merged into one
//      shape, which gives the scalloped, leafy outline,
//   4. clumps of leaves lit from the top-left, in three species of colour.
// Because each layer is one merged shape, neighbouring trees melt together.
const LEAF = {   // [shadow, body, highlight] colours per species
  pine:  ['#16351f', '#23492b', '#356a3c'],
  oak:   ['#1f4219', '#2f5d26', '#467f35'],
  birch: ['#35551c', '#557f2c', '#7aa845'],
};
// LESSON: A Warcraft-style pine forest. Every tree tile gets a pine built from
// stacked tiers of drooping branches; trees are drawn from the back row to
// the front, so each row overlaps the one behind it and the forest looks
// dense. Only the front edge shows trunks. The brightest needle tips are a
// light green that the winter recolouring turns into snow.
const PINE = { outline:'#0b170c', dark:'#1c3b1f', mid:'#2e5e32', light:'#448a46', tip:'#6fb45a', floor:'#1d361e', trunk:'#4a3120', trunkLit:'#65432a' };
function drawPine(g, cx, base, s, showTrunk){
  const P = (pts, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); };
  if (showTrunk){ g.fillStyle = PINE.trunk; g.fillRect(cx - 2.5 * s, base - 6 * s, 5 * s, 7 * s); g.fillStyle = PINE.trunkLit; g.fillRect(cx - 2.5 * s, base - 6 * s, 1.5 * s, 7 * s); }
  for (let i = 0; i < 4; i++){                                   // four tiers, widest at the bottom
    const w = (18 - i * 3.8) * s, yb = base - (6 + i * 8) * s, yt = yb - 13 * s;
    const teeth = [];                                            // a jagged, drooping lower edge
    for (let k = 0; k <= 6; k++) teeth.push([cx + w - (2 * w * k) / 6, yb + (k % 2 ? -2 : 1) * s]);
    P([[cx, yt - 1 * s], [cx + w + 1 * s, yb + 1.5 * s], ...teeth.map(([x, y]) => [x, y + 1 * s]), [cx - w - 1 * s, yb + 1.5 * s]], PINE.outline);
    P([[cx, yt], [cx + w, yb], ...teeth, [cx - w, yb]], PINE.dark);
    P([[cx, yt], [cx, yb - 1 * s], ...teeth.slice(3), [cx - w, yb]], PINE.mid);                 // the sunlit left side
    // Sunlit branch ends along the visible lower edge of the tier (the next tier up covers the rest).
    // They are a bright green that the winter recolouring turns into snow.
    P([[cx - w, yb], [cx - w * .1, yb - 1 * s], [cx - w * .1, yb - 5 * s], [cx - w * .75, yb - 3.5 * s]], PINE.light);
    P([[cx - w, yb + .5 * s], [cx - w * .15, yb - .5 * s], [cx - w * .15, yb - 2 * s], [cx - w * .9, yb - 1.2 * s]], PINE.tip);
    if (i === 3) P([[cx, yt], [cx - 3 * s, yt + 6 * s], [cx, yt + 5 * s]], PINE.tip);           // the very tip
  }
}
function drawForest(xa, ya, xb, yb){
  const isTree = (x, y) => inBounds(x, y) && G.terrain[idx(x, y)] === T_TREE;
  for (let y = ya; y <= yb; y++)                                 // back rows first, so front rows overlap them
    for (let x = xa; x <= xb; x++){
      if (!isTree(x, y)) continue;
      const jx = (hash(x, y * 7) - .5) * 6, jy = (hash(x * 7, y) - .5) * 4, s = .92 + hash(x * 3, y * 5) * .2;
      const front = !isTree(x, y + 1);
      if (!front && hash(x * 11, y * 13) > .55)                   // a smaller pine tucked in between, for density
        drawPine(ctx, x * TILE + 16 + jx + (hash(x, y) > .5 ? 9 : -9), y * TILE + 20, .72, false);
      drawPine(ctx, x * TILE + 16 + jx, y * TILE + 28 + jy, s, front);
    }
}

// Little glints that drift across visible water every frame.
function drawWaterShimmer(x0, y0, x1, y1){
  // Gentle ripples drifting across the water.
  ctx.strokeStyle = 'rgba(210,235,250,.22)'; ctx.lineWidth = 1;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++){
    if (G.terrain[idx(x, y)] !== T_WATER) continue;
    const h = hash(x * 5, y * 3), ph = (animT * .35 + h) % 1, rx = x * TILE + 4 + ph * 22, ry = y * TILE + 10 + h * 12;
    ctx.globalAlpha = Math.sin(ph * Math.PI);
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.quadraticCurveTo(rx + 3, ry - 2, rx + 7, ry); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(225,242,255,.28)';
  for (let y = y0; y <= y1; y++)
    for (let x = x0; x <= x1; x++){
      if (G.terrain[idx(x, y)] !== T_WATER) continue;
      const h = hash(x, y), t = animT * 0.7 + h * 10;
      if ((Math.floor(t) + x) % 3 === 0) continue;
      ctx.fillRect(x * TILE + 6 + Math.floor(h * 97 + t * 5) % 18, y * TILE + 8 + Math.floor(h * 131) % 14, 5, 1);
    }
}


// ----------------------------------------------------------------------------
// Sprite caching with outlines
// ----------------------------------------------------------------------------
// LESSON: Post-processing sprites pixel by pixel. After drawing a sprite we
// read its pixels back (getImageData) and apply two classic pixel-art tricks:
//  1. Rim lighting: light comes from the top-left, so pixels on a top/left
//     edge get a warm highlight and pixels on a bottom/right edge a cool shadow.
//     Every sprite ends up lit the same way, which makes the world feel solid.
//  2. "Selout" (selective outline): each empty pixel touching the sprite becomes
//     a very dark, cool version of the colour it touches, instead of flat black.
//     Outlines then read as part of the object, not a sticker border.
// This only runs once per sprite (results are cached), so it costs nothing per frame.
function outlined(w, h, draw){
  const base = makeCanvas(w, h), bc = base.getContext('2d', { willReadFrequently:true });
  withCtx(bc, draw);
  const d = bc.getImageData(0, 0, w, h).data;
  const out = bc.createImageData(w, h), o = out.data;
  const SOLID = 40;
  const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      if (d[i + 3] > SOLID){
        let r = d[i], g = d[i + 1], b = d[i + 2];
        const lit = A(x - 1, y) <= SOLID || A(x, y - 1) <= SOLID;
        const dark = A(x + 1, y) <= SOLID || A(x, y + 1) <= SOLID;
        if (lit && !dark){ r += (255 - r) * .3; g += (255 - g) * .25; b += (255 - b) * .1; }
        else if (dark && !lit){ r = r * .76 + 4; g *= .74; b = b * .8 + 12; }
        o[i] = r; o[i + 1] = g; o[i + 2] = b; o[i + 3] = d[i + 3];
      } else {
        let n = -1;
        if (A(x, y + 1) > SOLID) n = ((y + 1) * w + x) * 4;
        else if (A(x - 1, y) > SOLID) n = (y * w + x - 1) * 4;
        else if (A(x + 1, y) > SOLID) n = (y * w + x + 1) * 4;
        else if (A(x, y - 1) > SOLID) n = ((y - 1) * w + x) * 4;
        if (n >= 0){ o[i] = d[n] * .26 + 8; o[i + 1] = d[n + 1] * .22 + 5; o[i + 2] = d[n + 2] * .28 + 18; o[i + 3] = 255; }
        else { o[i] = d[i]; o[i + 1] = d[i + 1]; o[i + 2] = d[i + 2]; o[i + 3] = d[i + 3]; }
      }
    }
  bc.putImageData(out, 0, 0);
  return base;
}

const spriteCache = new Map();
const SPR_W = 64, SPR_H = 64, SPR_OX = 32, SPR_OY = 46;    // unit sprite canvas and its "feet" point

// One cached picture per combination of type, team, facing, leg pose,
// weapon swing and cargo. There are only a few hundred combinations.
// Classic-style sprites: one cached picture per type, team, direction, pose and frame.
function classicSprite(u, act, fr){
  const dir8 = u.dir ?? (u.facing > 0 ? 0 : 4), [view, mirror] = DIR_VIEW[dir8];
  const shield = u.type === 'footman' && !!G.players[u.owner].up.shields;
  const key = 'C' + u.type + u.owner + view + (mirror ? 'm' : '') + act + fr + (u.carry ? u.carry.res : '') + (shield ? 'S' : '') + (u.mounted ? 'M' : '');
  let c = spriteCache.get(key);
  if (!c){
    const pose = { carry:u.carry ? { res:u.carry.res } : null, shield };
    c = outlined(SPR_W, SPR_H, () => {
      ctx.save();
      if (mirror){ ctx.translate(SPR_W, 0); ctx.scale(-1, 1); }      // W, SW and NW are mirror images
      drawClassic(u.mounted ? 'knight' : u.type, SPR_OX, SPR_OY, dir8, act, fr, FACTIONS[u.owner], pose);   // mounted heroes ride
      ctx.restore();
    });
    spriteCache.set(key, c);
  }
  return c;
}

function unitSprite(u, swing){
  if (artStyle === 'classic') return classicSprite(u, swing ? 'attack' : 'idle', swing ? 2 : 0);
  const leg = u.moving && Math.sin(u.anim * 14) > 0 ? 1 : 0;
  // Footmen only show a shield once the Shields research is done, so that's part of the key too.
  const shield = u.type === 'footman' && !!G.players[u.owner].up.shields;
  const key = artStyle + u.type + u.owner + (u.facing > 0 ? 'R' : 'L') + leg + (swing ? 1 : 0) + (u.carry ? u.carry.res : '') + (shield ? 'S' : '') + (u.mounted ? 'M' : '');
  const art = u.mounted ? 'knight' : u.type;                       // mounted heroes ride
  let c = spriteCache.get(key);
  if (!c){
    const pose = { moving:!!leg, anim:leg ? 0.1 : 0, carry:u.carry ? { res:u.carry.res } : null, shield };
    const fc = u.facing > 0 ? 1 : -1, F = FACTIONS[u.owner];
    c = artStyle === 'painted'
      ? paintedCanvas(SPR_W, SPR_H, () => PAINTED[art](SPR_OX, SPR_OY, fc, F, pose, swing))
      : outlined(SPR_W, SPR_H, () => SPRITES[art](SPR_OX, SPR_OY, fc, F, pose, swing));
    spriteCache.set(key, c);
  }
  return c;
}

const BLD_PAD_X = 10, BLD_PAD_TOP = 34;    // room around a building for flags and outlines
// A watch tower's lit beacon on top.
function watchBeacon(px, py, s){
  const cx = px + s / 2, y = py - 6;
  disc(ctx, cx, y, 8, 'rgba(255,190,70,.3)');
  box(cx - 4, y + 2, 8, 3, '#5a3f29'); box(cx - 3, y - 2, 6, 4, '#ff9a3a'); box(cx - 2, y - 4, 4, 3, '#ffcf5a'); box(cx - 1, y - 5, 2, 2, '#fff1a6');
}
function buildingSprite(type, owner, level){
  const key = artStyle + 'b' + type + owner + level;
  let c = spriteCache.get(key);
  if (!c){
    const s = BUILDING_TYPES[type].size * TILE, w = s + BLD_PAD_X * 2, h = s + BLD_PAD_TOP + 4, F = FACTIONS[owner];
    c = artStyle === 'painted'
      ? paintedCanvas(w, h, () => { (PAINTED_BUILDINGS[type] || BUILDING_ART[type])(BLD_PAD_X, BLD_PAD_TOP, s, F, type === 'tower' && !F.horns ? Math.max(1, level - 1) : level);
          if (type === 'tower' && !F.horns && level === 1) watchBeacon(BLD_PAD_X, BLD_PAD_TOP, s); if (level > 2 && type === 'townhall') citadelArt(BLD_PAD_X, BLD_PAD_TOP, s, F); })
      : outlined(w, h, () => {
          BUILDING_ART[type](BLD_PAD_X, BLD_PAD_TOP, s, F, level);
          if (level > 1 && type === 'farm' && !F.horns) farmUpgradeArt(BLD_PAD_X, BLD_PAD_TOP, s);   // (the pig farm shows its upgrade with more pigs)
          if (level > 1 && type === 'townhall') townhallUpgradeArt(BLD_PAD_X, BLD_PAD_TOP, s, F);
          if (level > 2 && type === 'townhall') citadelArt(BLD_PAD_X, BLD_PAD_TOP, s, F);
          if (type === 'tower' && (F.horns ? level : level - 1) >= 2) towerUpgradeArt(BLD_PAD_X, BLD_PAD_TOP, s, F);
          if (type === 'tower' && !F.horns && level === 1) watchBeacon(BLD_PAD_X, BLD_PAD_TOP, s);
        });
    spriteCache.set(key, c);
  }
  return c;
}
// Draw a cached sprite at its normal size. Painted sprites are 3x bigger
// internally, so they're scaled down with smoothing switched on.
function blit(img, x, y){
  if (artStyle !== 'painted'){ ctx.drawImage(img, x, y); return; }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, x, y, img.width / RES, img.height / RES);
  ctx.imageSmoothingEnabled = false;
}
function mineSprite(busy){
  const key = artStyle + 'mine' + busy;
  let c = spriteCache.get(key);
  if (!c){
    const w = 96 + BLD_PAD_X * 2, h = 96 + BLD_PAD_TOP + 4;
    c = artStyle === 'painted' ? paintedCanvas(w, h, () => paintedMine(BLD_PAD_X, BLD_PAD_TOP, 96, busy))
                               : outlined(w, h, () => mineArt(BLD_PAD_X, BLD_PAD_TOP, 96, busy));
    spriteCache.set(key, c);
  }
  return c;
}


// ----------------------------------------------------------------------------
// Unit art. Sprites face right when fc = +1 and left when fc = -1.
// The two factions share body shapes but differ in gear: the Kingdom wears
// steel and blue, carries swords and bows; orcs have green skin, tusks,
// horns and bone, and carry axes and spears.
// ----------------------------------------------------------------------------
function legs(x, y, u, c){
  const s = u.moving && Math.sin(u.anim * 14) > 0 ? 1 : 0;   // alternate legs while walking
  box(x - 4, y + 3, 3, 5 - s, c); box(x + 1, y + 3, 3, 4 + s, c);
  box(x - 4, y + 7 - s, 3, 1, '#1b120b'); box(x + 1, y + 6 + s, 3, 1, '#1b120b');   // boots
}
const eye = (x, y, fc) => box(fc > 0 ? x + 1 : x - 3, y, 2, 2, '#1b120b');
const tusk = (x, y, fc) => box(fc > 0 ? x + 1 : x - 2, y, 1, 2, '#f4f1e8');
const BONE = '#e7dfc6', STEEL = '#b9bec3', STEEL_LIGHT = '#e3e6e9', WOOD = '#7a5530';

const SPRITES = {
  worker(x, y, fc, F, u, sw){

    box(x - 5, y - 5, 10, 9, F.color);
    box(x - 5, y - 5, 2, 9, shade(F.color, .25)); box(x + 3, y - 5, 2, 9, shade(F.color, -.3));

    box(fc > 0 ? x + 4 : x - 6, y - 4, 2, 4, F.skin);                                     // arm
    const hx = x + fc * 7, up = sw ? -6 : 0;                                               // pick-axe
    box(hx - 1, y - 8 + up, 2, 10, WOOD); box(hx - 5, y - 9 + up, 10, 2, STEEL); box(hx - 5, y - 9 + up, 3, 1, STEEL_LIGHT);
    if (u.carry){
      const cx = x - fc * 8 - 2;

      else { box(cx - 1, y - 9, 7, 3, '#8a5a2b'); box(cx - 1, y - 5, 7, 3, '#6f4522'); box(cx + 5, y - 9, 1, 3, '#c89a5a'); box(cx + 5, y - 5, 1, 3, '#c89a5a'); }

// ----------------------------------------------------------------------------
// Building art
// LESSON: Two helpers, wall() and roof(), give each faction its own
// material: the Kingdom builds with stone blocks and shingled roofs, the
// orcs with lashed planks, hide roofs and bone spikes. Every building uses
// them, so all buildings automatically look like they belong to their side.
// ----------------------------------------------------------------------------
function wall(x, y, w, h, F){
  box(x, y, w, h, F.wall);
  if (F.horns){
    for (let i = x + 4; i < x + w; i += 5) box(i, y, 1, h, shade(F.wall, -.3));        // planks
    box(x, y + 3, w, 2, '#3e2a18'); box(x, y + h - 7, w, 2, '#3e2a18');                // rope lashings
  } else {
    const dark = shade(F.wall, -.2);
    for (let r = 0, yy = y + 6; yy < y + h; yy += 6, r++){
      box(x, yy, w, 1, dark);
      for (let xx = x + (r % 2 ? 3 : 8); xx < x + w; xx += 10) box(xx, yy - 5, 1, 5, dark);   // staggered joints
    }
  }
  box(x, y, w, 1, shade(F.wall, .25));
  // Foundation: a darker base course of stone (kingdom) or stacked logs (orcs).
  box(x - 1, y + h - 5, w + 2, 5, F.horns ? '#4a3524' : '#77706a');
  box(x - 1, y + h - 5, w + 2, 1, F.horns ? '#6b4d33' : '#9a938b');
  for (let xx = x + 3; xx < x + w; xx += F.horns ? 7 : 9) box(xx, y + h - 4, 1, 4, F.horns ? '#2e2016' : '#5a544e');
  if (!F.horns && w > 20 && h > 22){                             // ivy climbing kingdom walls
    const ix = x + 2 + Math.floor(hash(x, y) * (w - 8));
    for (let k = 0; k < Math.min(9, (h - 10) >> 1); k++) box(ix + (k % 3) + (k > 5 ? 1 : 0), y + h - 6 - k * 2, 2, 2, k % 2 ? '#3f7a34' : '#5a9a44');
  }
}

// A window with a frame, a cross-shaped frame divider, warm light and a sill.
function win(x, y, w, h){
  box(x - 1, y - 1, w + 2, h + 2, '#2a1d12');
  box(x, y, w, h, '#f2c96a'); box(x, y, w, Math.ceil(h / 2), '#f8dd95');
  box(x + (w >> 1), y, 1, h, '#2a1d12'); box(x, y + (h >> 1), w, 1, '#2a1d12');
  box(x - 2, y + h + 1, w + 4, 1, '#c7bdaa');
}

function roof(pts, F){
  poly(pts, F.color);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), mid = (x0 + x1) / 2;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(mid, y0, x1 - mid, y1 - y0);          // shaded half
  if (F.horns){
    ctx.fillStyle = shade(F.color, -.3);
    for (let x = x0 + 2; x < x1; x += 4) ctx.fillRect(x, y0, 1, y1 - y0);             // hide / thatch strands
  } else {
    ctx.fillStyle = shade(F.color, -.3);
    for (let y = y0 + 4; y < y1; y += 4) ctx.fillRect(x0, y, x1 - x0, 1);             // shingle rows
    ctx.fillStyle = shade(F.color, .3);
    for (let y = y0 + 4, r = 0; y < y1; y += 4, r++)
      for (let x = x0 + (r % 2 ? 2 : 6); x < x1; x += 8) ctx.fillRect(x, y + 1, 1, 3);
  }
  ctx.restore();
  box(x0, y1 - 2, x1 - x0, 2, shade(F.color, -.45));                                  // eave
  box(x0, y1 - 3, x1 - x0, 1, shade(F.color, .35));                                   // trim above the eave
  const ridge = pts.filter(p => p[1] === y0).map(p => p[0]);
  if (Math.max(...ridge) - Math.min(...ridge) > 4) box(Math.min(...ridge), y0, Math.max(...ridge) - Math.min(...ridge), 2, shade(F.color, .4));
  if (F.horns){                                                                        // bone spikes on the ridge
    const top = pts.filter(p => p[1] === y0).map(p => p[0]);
    for (let x = Math.min(...top); x <= Math.max(...top); x += 8) poly([[x - 2, y0 + 1], [x, y0 - 6], [x + 2, y0 + 1]], BONE);
  }
}

// A small team flag on a pole.
function flag(x, y, F){ box(x, y, 2, 18, '#3a2a1a'); box(x + 2, y, 11, 7, F.color); box(x + 2, y + 6, 11, 1, F.dark); box(x + 2, y, 11, 1, F.light); }

// The orc farm: a big round hide hut in a log-fenced, muddy pen full of pigs.
function pigFarm(px, py, s, F, level = 1){
  const E = (x, y, rx, ry, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); };
  // trampled mud
  E(px + s / 2, py + s - 16, s / 2 - 2, 15, '#6b5234'); E(px + 14, py + s - 10, 9, 4, '#5a4128'); E(px + s - 16, py + s - 20, 7, 3, '#5a4128');
  // the hut: a big dome of stitched hides
  const hx = px + s / 2 + 4, hy = py + 30;
  E(hx + 2, hy + 14, 22, 6, 'rgba(0,0,0,.25)');
  E(hx, hy + 4, 21, 17, '#5e4630'); E(hx, hy + 2, 19, 16, '#8a6a44'); E(hx - 5, hy - 3, 10, 8, '#a07e54');
  for (const a of [-12, -4, 4, 12]){ ctx.strokeStyle = '#4a3522'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hx + a * .6, hy - 13); ctx.quadraticCurveTo(hx + a * 1.2, hy + 2, hx + a, hy + 16); ctx.stroke(); }
  box(hx - 3, hy - 17, 6, 3, '#2a1d12');                                                         // smoke hole
  E(hx + 3, hy - 21, 3, 2.5, 'rgba(150,145,140,.55)'); E(hx + 6, hy - 25, 2.5, 2, 'rgba(150,145,140,.4)');
  E(hx, hy + 12, 5.5, 6.5, '#1f140b'); box(hx - 6, hy + 12, 12, 7, '#1f140b');                  // doorway
  box(hx - 8, hy + 8, 2, 8, '#e6dcc4'); box(hx + 6, hy + 8, 2, 8, '#e6dcc4');                   // tusks by the door
  box(hx + 15, hy - 22, 1, 16, '#4a3321'); box(hx + 16, hy - 22, 6, 4, F.color);               // clan banner
  // log fence around the pen
  const fy0 = py + 34, fy1 = py + s - 3;
  for (let x = px + 2; x <= px + s - 3; x += 6){ box(x, fy1 - 5, 2, 6, '#6b4a2b'); }
  box(px + 2, fy1 - 4, s - 4, 1, '#8a6a48'); box(px + 2, fy1 - 2, s - 4, 1, '#6b4a2b');
  for (let y = fy0; y <= fy1 - 4; y += 6){ box(px + 1, y, 2, 5, '#6b4a2b'); box(px + s - 3, y, 2, 5, '#6b4a2b'); }
  box(px + 1, fy0, 1, fy1 - fy0, '#8a6a48'); box(px + s - 2, fy0, 1, fy1 - fy0, '#8a6a48');
  // trough
  box(px + 5, py + s - 17, 12, 4, '#5a3f29'); box(px + 6, py + s - 16, 10, 1, '#9db244');
  // pigs: pink bodies, dark spots, a snout and an ear
  const pig = (x, y, f, muddy) => {
    const c = muddy ? '#b98a78' : '#e7a8a0';
    E(x, y, 6, 3.6, '#000000'); E(x, y - .5, 5.5, 3.2, c);
    E(x + f * 5, y - 1.5, 3, 2.6, c); box(x + f * 7 - (f < 0 ? 1 : 0), y - 1.5, 2, 2, '#c07a7a');   // head and snout
    box(x + f * 4, y - 4, 2, 2, '#d88f88');                                                     // ear
    box(x - 3, y + 2, 1, 2, '#8a5a52'); box(x + 2, y + 2, 1, 2, '#8a5a52');                      // legs
    box(x - 1, y - 2, 2, 1, '#6b3a34'); box(x - 3, y, 1, 1, '#6b3a34');                          // spots
    box(x + f * 6, y - 2.5, 1, 1, '#1a0f07');                                                   // eye
  };
  pig(px + 13, py + s - 24, 1, false); pig(px + s - 14, py + s - 11, -1, false); pig(px + 28, py + s - 9, 1, true);
  if (level > 1){ pig(px + s - 20, py + s - 26, -1, false); pig(px + 10, py + s - 8, 1, true); }   // an upgraded farm has more pigs
}

// Pixel style: an upgraded town hall gets two corner towers.
// Creature lairs, one look per kind. Drawn with simple shapes so the same
// art works in every style.
function lairArt(px, py, s, F, kind){
  const cx = px + s / 2, by = py + s - 6;
  if (kind === 1){                                   // kobold warren: an earth mound with a candle-lit tunnel
    poly([[px + 4, by], [px + 14, py + 20], [cx, py + 12], [px + s - 14, py + 20], [px + s - 4, by]], '#7a5a3a');
    poly([[px + 10, by], [px + 18, py + 24], [cx, py + 18], [cx, by]], '#8f6c46');
    poly([[cx - 10, by], [cx - 10, py + 38], [cx, py + 30], [cx + 10, py + 38], [cx + 10, by]], '#1a120b');
    box(cx - 12, py + 34, 3, by - py - 34, '#6b4a2b'); box(cx + 9, py + 34, 3, by - py - 34, '#6b4a2b'); box(cx - 12, py + 33, 24, 3, '#6b4a2b');
    for (const [x, y] of [[px + 12, by - 6], [px + s - 14, by - 8], [cx + 2, py + 14]]){ box(x, y, 2, 4, '#f4efe2'); box(x, y - 3, 2, 2, '#ffd23a'); disc(ctx, x + 1, y - 2, 3, 'rgba(255,210,90,.3)'); }
    pline(px + s - 18, by, px + s - 10, by - 14, '#6b4a2b', 2); box(px + s - 13, by - 16, 7, 2, '#8e979f');
  } else if (kind === 2){                            // spider nest: rocks shrouded in webs, with egg sacs
    for (const [x, y, r] of [[px + 16, by - 8, 11], [cx + 6, by - 14, 15], [px + s - 12, by - 6, 9]]) { disc(ctx, x, y, r, '#5e5850'); disc(ctx, x - r * .3, y - r * .35, r * .45, '#7a746b'); }
    disc(ctx, cx + 2, by - 10, 6, '#120c08');
    ctx.strokeStyle = 'rgba(240,240,240,.75)'; ctx.lineWidth = 1;
    for (let k = 0; k < 7; k++){ const a = -Math.PI + k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(cx + 2, by - 16); ctx.lineTo(cx + 2 + Math.cos(a) * 28, by - 16 + Math.sin(a) * 22); ctx.stroke(); }
    for (const r of [8, 15, 22]){ ctx.beginPath(); ctx.arc(cx + 2, by - 16, r, Math.PI, Math.PI * 2); ctx.stroke(); }
    for (const [x, y] of [[px + 10, by - 2], [px + 16, by], [px + s - 10, by - 2], [px + s - 16, by]]){ disc(ctx, x, y, 3.2, '#efe8d0'); disc(ctx, x - 1, y - 1, 1.2, '#ffffff'); }
  } else if (kind === 3){                            // ogre hut: a hide dome with tusks and a skull pole
    poly([[px + 6, by], [px + 10, py + 22], [cx, py + 10], [px + s - 10, py + 22], [px + s - 6, by]], '#8a6a48');
    for (let k = 0; k < 4; k++) pline(px + 10 + k * 12, py + 20 - (k === 1 || k === 2 ? 8 : 0), px + 8 + k * 14, by, '#6b4a2b', 1);
    poly([[cx - 8, by], [cx - 8, py + 34], [cx + 8, py + 34], [cx + 8, by]], '#1a120b');
    pline(cx - 12, by, cx - 16, py + 28, '#e6dcc4', 3); pline(cx + 12, by, cx + 16, py + 28, '#e6dcc4', 3);
    box(px + s - 10, py + 8, 2, by - py - 8, '#5a3f29'); box(px + s - 13, py + 4, 8, 6, '#efe6cf'); box(px + s - 12, py + 6, 2, 2, '#1a0f07'); box(px + s - 9, py + 6, 2, 2, '#1a0f07');
  } else if (kind === 4){                            // golem stone circle: standing stones with glowing runes
    disc(ctx, cx, by - 12, 20, 'rgba(90,110,100,.35)');
    for (let k = 0; k < 6; k++){
      const a = k * Math.PI / 3 + .3, x = cx + Math.cos(a) * 22, y = by - 14 + Math.sin(a) * 12, hgt = 16 + (k % 2) * 6;
      box(x - 4, y - hgt, 8, hgt, '#8f8a80'); box(x - 4, y - hgt, 3, hgt, '#aca69b'); box(x - 1, y - hgt + 5, 2, 4, '#7ff0d0');
    }
    box(cx - 8, by - 16, 16, 7, '#77726a'); box(cx - 3, by - 14, 6, 2, '#7ff0d0'); disc(ctx, cx, by - 14, 8, 'rgba(127,240,208,.2)');
  } else {                                            // wolf den: a rocky cave mouth with bones
    poly([[px + 4, by], [px + 8, py + 24], [px + 22, py + 12], [cx + 8, py + 16], [px + s - 8, py + 24], [px + s - 4, by]], '#6e6860');
    poly([[px + 10, by], [px + 14, py + 26], [px + 24, py + 18], [cx, py + 22], [cx, by]], '#827b72');
    poly([[cx - 12, by], [cx - 8, py + 34], [cx + 6, py + 32], [cx + 12, by]], '#140e09');
    box(cx + 1, py + 40, 2, 2, '#ffcf3a'); box(cx + 5, py + 40, 2, 2, '#ffcf3a');                  // eyes in the dark
    for (const [x, y] of [[px + 10, by - 2], [px + s - 16, by - 1]]){ box(x, y, 8, 2, '#e6dcc4'); box(x - 1, y - 1, 2, 4, '#e6dcc4'); box(x + 7, y - 1, 2, 4, '#e6dcc4'); }
  }
}

// Third tier (Citadel / Warhold): a tall central spire with a great banner,
// drawn over the Castle / Fortress art. Works in every art style.
function citadelArt(px, py, s, F){
  const cx = px + s / 2;
  if (!F.horns){
    box(cx - 7, py - 12, 14, 22, '#b7ae9e'); box(cx - 7, py - 12, 3, 22, '#d3cbbb'); box(cx + 4, py - 12, 3, 22, '#948b7c');
    for (let k = 0; k < 4; k++) box(cx - 7 + k * 4, py - 15, 2, 3, '#b7ae9e');
    box(cx - 2, py - 5, 4, 6, '#2a1d12'); box(cx - 1, py - 4, 2, 4, '#ffd680');
    poly([[cx - 9, py - 15], [cx + 9, py - 15], [cx, py - 31]], F.color); poly([[cx - 9, py - 15], [cx, py - 15], [cx, py - 31]], shade(F.color, .2));
    box(cx - .5, py - 34, 1, 4, '#6b4a2b'); poly([[cx + .5, py - 34], [cx + 9, py - 32], [cx + .5, py - 30]], '#e0b84a');
    box(px + 4, py + s - 6, s - 8, 2, '#e0b84a');                                  // gold trim along the base
  } else {
    box(cx - 6, py - 14, 12, 24, '#5a3f29'); for (let k = 0; k < 6; k++) box(cx - 6 + k * 2, py - 14, 1, 24, '#4a3321');

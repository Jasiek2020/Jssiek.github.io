# Builds the Android app (APK) in the cloud.
# Runs whenever you upload changes, or by hand: Actions -> Build Android APK -> Run workflow.
# The finished APK is attached to the run under "Artifacts".
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project (first time) and copy the game in
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Use the game's own icon
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/icon-192.png $RES/mipmap-$d/ic_launcher.png
            cp assets/icon-192.png $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: banners-of-the-vale-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
